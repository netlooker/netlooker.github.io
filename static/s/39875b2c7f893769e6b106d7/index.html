 a contract or a framework contract is of interest to two or more Union institutions, executive agencies or Union bodies... and whenever there is a possibility for realising efficiency gains, the contracting authorities concerned may carry out the procedure and the management of the subsequent contract or framework contract on an interinstitutional basis\" (FR Art. 168(1)).<\/p><ul><li>This is the main legal basis for horizontal ICT framework contracts shared across institutions, which is why it fits duty 7 (\"ICT horizontal initiatives\").<\/li><\/ul>","why_wrong":{"A":"A and B add conditions that are not in the Regulation.","B":"A and B add conditions that are not in the Regulation.","C":"C confuses this with the crisis rule for adding new contracting authorities."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>\"Where a contract or a framework contract is of interest to two or more Union institutions, executive agencies or Union bodies... and whenever there is a possibility for realising efficiency gains, the contracting authorities concerned may carry out the procedure and the management of the subsequent contract or framework contract on an interinstitutional basis\" (FR Art. 168(1)).<\/p><ul><li>A and B add conditions that are not in the Regulation.<\/li><li>C confuses this with the crisis rule for adding new contracting authorities.<\/li><li>This is the main legal basis for horizontal ICT framework contracts shared across institutions, which is why it fits duty 7 (\"ICT horizontal initiatives\").<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-84","id":84,"topic":84,"type":"short","word_count":24,"batch":3,"duty":7,"duties":[7],"section":"Duty 7: interinstitutional and joint procurement","stem_html":"A Union institution and a Member State's contracting authority procure jointly under Article 168(2) of the Financial Regulation. By default, which procedural rules apply?","stem_text":"A Union institution and a Member State's contracting authority procure jointly under Article 168(2) of the Financial Regulation. By default, which procedural rules apply?","options":{"A":"The procedural provisions applicable to Union institutions","B":"The Member State's national procurement rules, always","C":"The rules of whichever party signs the contract first","D":"The rules chosen by the tenderers"},"answer":"A","why_right_html":"<p>\"The procedural provisions applicable to Union institutions shall apply to the joint procurement\" (FR Art. 168(2), third subparagraph). Only where the Member State's share is 50% or more, or in other duly justified cases, may the institution decide that the Member State's rules apply.<\/p>","why_wrong":{"B":"B turns that exception into the rule.","C":"C and D are invented.","D":"C and D are invented."},"why_wrong_shared":{"B":false,"C":true,"D":true},"full_html":"<p>\"The procedural provisions applicable to Union institutions shall apply to the joint procurement\" (FR Art. 168(2), third subparagraph). Only where the Member State's share is 50% or more, or in other duly justified cases, may the institution decide that the Member State's rules apply.<\/p><ul><li>B turns that exception into the rule.<\/li><li>C and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-85","id":85,"topic":85,"type":"short","word_count":18,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: security in projects","stem_html":"In the PM² Guide's IT security considerations, which three fundamental dimensions does IT security management aim to assure?","stem_text":"In the PM² Guide's IT security considerations, which three fundamental dimensions does IT security management aim to assure?","options":{"A":"Authentication, authorisation and accounting","B":"Prevention, detection and response","C":"Confidentiality, integrity and availability","D":"Identification, protection and recovery"},"answer":"C","why_right_html":"<p>IT security management centres on \"three fundamental dimensions: confidentiality... integrity... and availability\" (PM² 3.1 App. D.2.3, p. A-110 to A-111).<\/p>","why_wrong":{"A":"A is the AAA model used in access control. None of those is what PM² names.","B":"B and D are incident-handling or framework functions. None of those is what PM² names.","D":"B and D are incident-handling or framework functions. None of those is what PM² names."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>IT security management centres on \"three fundamental dimensions: confidentiality... integrity... and availability\" (PM² 3.1 App. D.2.3, p. A-110 to A-111).<\/p><ul><li>A is the AAA model used in access control.<\/li><li>B and D are incident-handling or framework functions.<\/li><li>None of those is what PM² names.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-86","id":86,"topic":86,"type":"short","word_count":17,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: security in projects","stem_html":"Which framework does the PM² Guide name as the European Commission's basis for IT security in projects?","stem_text":"Which framework does the PM² Guide name as the European Commission's basis for IT security in projects?","options":{"A":"ISO/IEC 27001 alone","B":"The Commission's IT Security Policy together with its IT Security Risk Management Methodology (ITSRM²)","C":"The NIST Cybersecurity Framework","D":"ITIL information security management"},"answer":"B","why_right_html":"<p>\"The European Commission's IT Security Policy, coupled with its IT Security Risk Management Methodology (ITSRM²), forms a robust framework\" (PM² 3.1 App. D.2.3, p. A-110). A, C and D are real frameworks, but PM² does not name them here.<\/p>","why_wrong":{"A":"A, C and D are real frameworks, but PM² does not name them here.","C":"A, C and D are real frameworks, but PM² does not name them here.","D":"A, C and D are real frameworks, but PM² does not name them here."},"why_wrong_shared":{"A":true,"C":true,"D":true},"full_html":"<p>\"The European Commission's IT Security Policy, coupled with its IT Security Risk Management Methodology (ITSRM²), forms a robust framework\" (PM² 3.1 App. D.2.3, p. A-110). A, C and D are real frameworks, but PM² does not name them here.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-87","id":87,"topic":87,"type":"short","word_count":23,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"Under Regulation (EU, Euratom) 2023/2841, a Union entity becomes aware of a significant incident. What must it submit to CERT-EU, and by when?","stem_text":"Under Regulation (EU, Euratom) 2023/2841, a Union entity becomes aware of a significant incident. What must it submit to CERT-EU, and by when?","options":{"A":"An early warning within 24 hours, an incident notification within 72 hours, and a final report no later than one month after the incident notification","B":"A single report within 30 days","C":"An incident notification within 24 hours and a final report within 72 hours","D":"An early warning within 72 hours and a final report within six months"},"answer":"A","why_right_html":"<p>Union entities submit to CERT-EU an early warning \"within 24 hours of becoming aware of the significant incident\" and an incident notification \"within 72 hours\". They then submit a final report \"not later than one month after the submission of the incident notification\" (Reg 2023/2841 Art. 21(2)(a), (b) and (d)). There is also an intermediate report on request, under point (c). The other options get the timings wrong.<\/p><ul><li>Since this is your EUFTE document, knowing Art. 21 well serves both tests.<\/li><\/ul>","why_wrong":{"B":"The other options get the timings wrong.","C":"The other options get the timings wrong.","D":"The other options get the timings wrong."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>Union entities submit to CERT-EU an early warning \"within 24 hours of becoming aware of the significant incident\" and an incident notification \"within 72 hours\". They then submit a final report \"not later than one month after the submission of the incident notification\" (Reg 2023/2841 Art. 21(2)(a), (b) and (d)). There is also an intermediate report on request, under point (c). The other options get the timings wrong.<\/p><ul><li>Since this is your EUFTE document, knowing Art. 21 well serves both tests.<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"bank":"v1","key":"v1-88","id":88,"topic":88,"type":"short","word_count":29,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"Under Regulation (EU, Euratom) 2023/2841, who is responsible for implementing the Regulation within each Union entity and for overseeing its compliance with the obligations related to the cybersecurity framework?","stem_text":"Under Regulation (EU, Euratom) 2023/2841, who is responsible for implementing the Regulation within each Union entity and for overseeing its compliance with the obligations related to the cybersecurity framework?","options":{"A":"CERT-EU","B":"The Interinstitutional Cybersecurity Board (IICB)","C":"The local cybersecurity officer","D":"The entity's highest level of management"},"answer":"D","why_right_html":"<p>\"The highest level of management of each Union entity shall be responsible for the implementation of this Regulation and shall oversee the compliance of its organisation with the obligations related to the Framework\" (Reg 2023/2841 Art. 6(5)).<\/p>","why_wrong":{"A":"A and B are interinstitutional bodies (Art. 10 and Art. 13).","B":"A and B are interinstitutional bodies (Art. 10 and Art. 13).","C":"C is the trap: the local cybersecurity officer is the entity's \"single point of contact regarding all aspects of cybersecurity\" (Art. 6(8)), but is not responsible for implementation."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>\"The highest level of management of each Union entity shall be responsible for the implementation of this Regulation and shall oversee the compliance of its organisation with the obligations related to the Framework\" (Reg 2023/2841 Art. 6(5)).<\/p><ul><li>C is the trap: the local cybersecurity officer is the entity's \"single point of contact regarding all aspects of cybersecurity\" (Art. 6(8)), but is not responsible for implementation.<\/li><li>A and B are interinstitutional bodies (Art. 10 and Art. 13).<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"bank":"v1","key":"v1-89","id":89,"topic":89,"type":"short","word_count":24,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"According to the PM² Code of Professional Conduct, the key principles of independence, impartiality, objectivity and loyalty can be summarised as which single principle?","stem_text":"According to the PM² Code of Professional Conduct, the key principles of independence, impartiality, objectivity and loyalty can be summarised as which single principle?","options":{"A":"Accountability","B":"Transparency","C":"Integrity","D":"Excellence"},"answer":"C","why_right_html":"<p>\"The key principles can be summarised as INTEGRITY, which means consistently adhering to ethical principles and making sound decisions based on them\" (PM² 3.1 App. F.1, p. A-118).<\/p>","why_wrong":{"A":"A: accountability appears among the values (\"lawfulness and accountability\"), not as the summary.","B":"B and D are not named.","D":"B and D are not named."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"The key principles can be summarised as INTEGRITY, which means consistently adhering to ethical principles and making sound decisions based on them\" (PM² 3.1 App. F.1, p. A-118).<\/p><ul><li>A: accountability appears among the values (\"lawfulness and accountability\"), not as the summary.<\/li><li>B and D are not named.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-90","id":90,"topic":90,"type":"short","word_count":31,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"A member of a tender evaluation committee realises that they know the director of one tenderer personally. Which principle of the PM² Code of Professional Conduct is most directly at stake?","stem_text":"A member of a tender evaluation committee realises that they know the director of one tenderer personally. Which principle of the PM² Code of Professional Conduct is most directly at stake?","options":{"A":"Loyalty","B":"Impartiality","C":"Circumspection","D":"Proportionality and consistency"},"answer":"B","why_right_html":"<p>\"IMPARTIALITY: staff members should be unbiased in any decisions they are called upon to make\" (PM² 3.1 App. F.1, p. A-118). A personal link to a tenderer threatens impartiality.<\/p><ul><li>In practice the member should declare the possible conflict of interest. That is my judgement of standard EU practice; the procedural rules are outside this guide.<\/li><\/ul>","why_wrong":{"A":"A: loyalty is towards the organisation.","C":"C: circumspection is about reflecting on consequences.","D":"D concerns proportional measures."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"IMPARTIALITY: staff members should be unbiased in any decisions they are called upon to make\" (PM² 3.1 App. F.1, p. A-118). A personal link to a tenderer threatens impartiality.<\/p><ul><li>A: loyalty is towards the organisation.<\/li><li>C: circumspection is about reflecting on consequences.<\/li><li>D concerns proportional measures.<\/li><li>In practice the member should declare the possible conflict of interest. That is my judgement of standard EU practice; the procedural rules are outside this guide.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-1","id":1,"topic":1,"type":"scenario","word_count":113,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>A Directorate-General has approved the Business Case and the Project Charter for a new document-management system, and the project has passed the RfP gate. At the Planning Kick-off Meeting, the Project Owner (PO) proposes that the Business Manager (BM) should coordinate the delivery of all the project plans, because the BM knows the business side best. The Project Manager (PM) would then only maintain the schedule. The Solution Provider is not sure that this matches PM², and a member of the Project Core Team (PCT) suggests that the team itself should lead the planning, since it will produce the deliverables.<\/p><p>According to the PM² Guide, which statement about the Planning Phase is correct?<\/p>","stem_text":"A Directorate-General has approved the Business Case and the Project Charter for a new document-management system, and the project has passed the RfP gate. At the Planning Kick-off Meeting, the Project Owner (PO) proposes that the Business Manager (BM) should coordinate the delivery of all the project plans, because the BM knows the business side best. The Project Manager (PM) would then only maintain the schedule. The Solution Provider is not sure that this matches PM², and a member of the Project Core Team (PCT) suggests that the team itself should lead the planning, since it will produce the deliverables. According to the PM² Guide, which statement about the Planning Phase is correct?","options":{"A":"The PO remains its main driver, because the PO is accountable for all the project documentation.","B":"The PM is its main driver, responsible for coordinating the delivery of all project plans.","C":"The PCT is its main driver, because the PCT will carry out the Project Work Plan.","D":"The BM is its main driver, because the plans must reflect the needs of the requestor side."},"answer":"B","why_right_html":"<p>PM² assigns a main driver to each phase: \"In the Planning Phase, the main driver is the Project Manager (PM), who is responsible for coordinating the delivery of all project plans\" (PM² 3.1 §3.3, p.17). The PM also oversees the creation of all management artefacts except the Project Initiation Request, Business Case and Business Implementation Plan (§4.8, p.26). The BM contributes to planning but does not coordinate it.<\/p>","why_wrong":{"A":"A: the PO is the main driver of the Initiating Phase, \"being accountable for all documentation\" there (§3.3, p.17). The PO does not stay the driver in Planning.","C":"C: the PCT drives the Executing Phase, where it carries out the Project Work Plan and creates the deliverables (§3.3, p.17). It is not the Planning driver.","D":"D: the BM is not a phase driver in PM². The BM represents the PO day to day and coordinates client-side activities (§4.7, p.26)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>PM² assigns a main driver to each phase: \"In the Planning Phase, the main driver is the Project Manager (PM), who is responsible for coordinating the delivery of all project plans\" (PM² 3.1 §3.3, p.17). The PM also oversees the creation of all management artefacts except the Project Initiation Request, Business Case and Business Implementation Plan (§4.8, p.26). The BM contributes to planning but does not coordinate it.<\/p><ul><li>A: the PO is the main driver of the Initiating Phase, \"being accountable for all documentation\" there (§3.3, p.17). The PO does not stay the driver in Planning.<\/li><li>C: the PCT drives the Executing Phase, where it carries out the Project Work Plan and creates the deliverables (§3.3, p.17). It is not the Planning driver.<\/li><li>D: the BM is not a phase driver in PM². The BM represents the PO day to day and coordinates client-side activities (§4.7, p.26).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-2","id":2,"topic":2,"type":"scenario","word_count":109,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>Unit B.3 of an EU agency is at the end of the Executing Phase of a project to replace its case-handling tool. The contractor has delivered all the outputs, and the Project Core Team confirms that all planned activities are complete and all requirements are met. However, the Project Owner (PO) has not yet accepted the deliverables, and the transition to the end-users is still in progress. The Contractor's Project Manager wants the project to move to the Closing Phase now, arguing that final acceptance takes place during Closing anyway.<\/p><p>According to PM², what must happen before the Project Steering Committee can authorise the move to the Closing Phase?<\/p>","stem_text":"Unit B.3 of an EU agency is at the end of the Executing Phase of a project to replace its case-handling tool. The contractor has delivered all the outputs, and the Project Core Team confirms that all planned activities are complete and all requirements are met. However, the Project Owner (PO) has not yet accepted the deliverables, and the transition to the end-users is still in progress. The Contractor's Project Manager wants the project to move to the Closing Phase now, arguing that final acceptance takes place during Closing anyway. According to PM², what must happen before the Project Steering Committee can authorise the move to the Closing Phase?","options":{"A":"The Appropriate Governance Body must approve the Project-End Report, confirming that all objectives were met.","B":"Nothing more is needed, because the PO accepts the deliverables only during the Closing Phase.","C":"The PO must accept the deliverables, at least provisionally, and the transition must be finalised.","D":"The Business Manager must sign the Business Implementation Checklist, which replaces the PO's acceptance."},"answer":"C","why_right_html":"<p>At the RfC gate, the PM \"is also responsible for ensuring that the Project Owner (PO) accepts the deliverables (at least provisionally), finalises the transition and makes the outputs available to the end-users\". Only \"Once all the above conditions have been met\" can the PSC authorise the move to Closing (PM² 3.1 §7.6, p.62). Here both conditions are still open.<\/p>","why_wrong":{"A":"A: the Project-End Report is produced in the Closing Phase (§8.3, p.66), so it cannot be a condition for entering it. The PSC, not the AGB, authorises this move.","B":"B: this is the trap in the stem. Final acceptance does take place in the Closing Phase (App. G, glossary entry \"Final Acceptance\", p. A-127), but the RfC gate still requires acceptance \"at least provisionally\" before Closing starts.","D":"D: the guide gives the Business Manager no power to replace the PO's acceptance. The Business Implementation Checklist is a Monitor &amp; Control checklist set up with the Business Implementation Plan (§6.8); it is not an acceptance document."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>At the RfC gate, the PM \"is also responsible for ensuring that the Project Owner (PO) accepts the deliverables (at least provisionally), finalises the transition and makes the outputs available to the end-users\". Only \"Once all the above conditions have been met\" can the PSC authorise the move to Closing (PM² 3.1 §7.6, p.62). Here both conditions are still open.<\/p><ul><li>A: the Project-End Report is produced in the Closing Phase (§8.3, p.66), so it cannot be a condition for entering it. The PSC, not the AGB, authorises this move.<\/li><li>B: this is the trap in the stem. Final acceptance does take place in the Closing Phase (App. G, glossary entry \"Final Acceptance\", p. A-127), but the RfC gate still requires acceptance \"at least provisionally\" before Closing starts.<\/li><li>D: the guide gives the Business Manager no power to replace the PO's acceptance. The Business Implementation Checklist is a Monitor &amp; Control checklist set up with the Business Implementation Plan (§6.8); it is not an acceptance document.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-3","id":3,"topic":3,"type":"long","word_count":174,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>A Directorate-General is in the Executing Phase of a PM² project to build an online portal for grant applicants. The escalation procedure in the Project Handbook states that the Project Steering Committee (PSC) decides on changes of up to 50 person-days of effort. Larger changes go to the Appropriate Governance Body (AGB).<\/p><p>Two change requests have been documented on Change Request Forms and in the Change Log. The Project Manager (PM) has assessed them with the Project Core Team:<\/p><ul><li>CR-14, from the Business Manager: a dashboard of application statistics; 30 person-days.<\/li><li>CR-15, from a User Representative: an export of the same statistics to a spreadsheet; 12 person-days on its own, or 5 extra person-days if built together with CR-14.<\/li><\/ul><p>At its monthly meeting, the PSC approves CR-14 and decides to merge CR-15 into it, for a combined effort of 35 person-days. The User Representative who raised CR-15 asks the PM what happens now. The Contractor's Project Manager wants to start the work the next morning.<\/p><p>According to PM², what should the PM do next?<\/p>","stem_text":"A Directorate-General is in the Executing Phase of a PM² project to build an online portal for grant applicants. The escalation procedure in the Project Handbook states that the Project Steering Committee (PSC) decides on changes of up to 50 person-days of effort. Larger changes go to the Appropriate Governance Body (AGB). Two change requests have been documented on Change Request Forms and in the Change Log. The Project Manager (PM) has assessed them with the Project Core Team: CR-14, from the Business Manager: a dashboard of application statistics; 30 person-days. CR-15, from a User Representative: an export of the same statistics to a spreadsheet; 12 person-days on its own, or 5 extra person-days if built together with CR-14. At its monthly meeting, the PSC approves CR-14 and decides to merge CR-15 into it, for a combined effort of 35 person-days. The User Representative who raised CR-15 asks the PM what happens now. The Contractor's Project Manager wants to start the work the next morning. According to PM², what should the PM do next?","options":{"A":"Let the contractor start at once, and record the merged change in the Project-End Report when the project is closed.","B":"Treat CR-15 as rejected, since a merged request is closed without being implemented, and ask for a new request.","C":"Send both requests to the AGB for approval, because a merged change always alters the Project Charter baseline.","D":"Log the decision in the Change Log, inform the requestor, and add the actions to the Project Work Plan and logs."},"answer":"D","why_right_html":"<p>After a decision, \"The decision details are documented in the Change Log and communicated to the requestor\". Then, \"For approved or merged changes, the Project Manager (PM) should incorporate all related actions into the Project Work Plan and update the related documentation and logs (i.e. Risk, Issue, Change and Decision Logs and other plans)\" (PM² 3.1 §9.6, steps 3–4, p.76).<\/p><ul><li>Tip: v1 tested the list of four decisions. Here you must know what follows one of them.<\/li><\/ul>","why_wrong":{"A":"A: work should not start before the actions are in the Project Work Plan, and the Change Log must be kept up to date during the project. Waiting for the Project-End Report breaks steps 3–5 of §9.6.","B":"B: a merged change is implemented, like an approved one (\"For approved or merged changes…\", §9.6 step 4). Merge is one of the four decisions; it is not a rejection.","C":"C: the change (35 person-days) is within the PSC's 50-person-day limit in the stem. The guide routes changes \"based on the project's escalation procedure\" (§9.6 step 3), and the PSC decides on \"significant change requests\" (§4.4, p.24). Nothing requires AGB approval here."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>After a decision, \"The decision details are documented in the Change Log and communicated to the requestor\". Then, \"For approved or merged changes, the Project Manager (PM) should incorporate all related actions into the Project Work Plan and update the related documentation and logs (i.e. Risk, Issue, Change and Decision Logs and other plans)\" (PM² 3.1 §9.6, steps 3–4, p.76).<\/p><ul><li>A: work should not start before the actions are in the Project Work Plan, and the Change Log must be kept up to date during the project. Waiting for the Project-End Report breaks steps 3–5 of §9.6.<\/li><li>B: a merged change is implemented, like an approved one (\"For approved or merged changes…\", §9.6 step 4). Merge is one of the four decisions; it is not a rejection.<\/li><li>C: the change (35 person-days) is within the PSC's 50-person-day limit in the stem. The guide routes changes \"based on the project's escalation procedure\" (§9.6 step 3), and the PSC decides on \"significant change requests\" (§4.4, p.24). Nothing requires AGB approval here.<\/li><li>Tip: v1 tested the list of four decisions. Here you must know what follows one of them.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-4","id":4,"topic":4,"type":"scenario","word_count":88,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>In a PM² project to digitise staff-recruitment files, a User Representative from the Business Implementation Group asks the Project Manager (PM) by e-mail to add a new search filter to the system. She is not a member of the Project Steering Committee. The Contractor's Project Manager tells the PM that the request is not valid, because only the Project Owner can request changes. A developer offers to add the filter quietly, since it would take only half a day.<\/p><p>According to PM², what should the PM do first?<\/p>","stem_text":"In a PM² project to digitise staff-recruitment files, a User Representative from the Business Implementation Group asks the Project Manager (PM) by e-mail to add a new search filter to the system. She is not a member of the Project Steering Committee. The Contractor's Project Manager tells the PM that the request is not valid, because only the Project Owner can request changes. A developer offers to add the filter quietly, since it would take only half a day. According to PM², what should the PM do first?","options":{"A":"Treat it as valid, since any stakeholder may raise a change, and have it recorded on a Change Request Form and in the Change Log.","B":"Ask the User Representative to have the Project Owner submit the request, since only Directing Layer roles may request changes.","C":"Let the developer add the filter now, because a half-day change is too small to need any formal change control at all.","D":"Send the e-mail straight to the Project Steering Committee for a decision, and record the request in the Change Log once approved."},"answer":"A","why_right_html":"<p>\"Changes can be requested (or identified and raised) throughout the project lifecycle by any project stakeholder\" (PM² 3.1 §9.6, p.76). The first step is to identify the change: \"The Project Manager (PM) ensures that a Change Request is appropriately documented (i.e. via a Change Request Form and in the Change Log)\" (§9.6, step 1, p.76).<\/p>","why_wrong":{"B":"B: the guide does not limit change requests to the Directing Layer; stakeholders \"May introduce new project changes\" (§9.6, key participants, p.76).","C":"C: skips the whole process. The PM \"Ensures the controlled evolution, of products delivered, through proper change management\" (§4.8, p.26), and the guide sets no size below which a change may bypass it.","D":"D: the wrong order. The request is documented first (step 1) and assessed (step 2) before a decision (step 3). Recording it only after approval loses the audit trail."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"Changes can be requested (or identified and raised) throughout the project lifecycle by any project stakeholder\" (PM² 3.1 §9.6, p.76). The first step is to identify the change: \"The Project Manager (PM) ensures that a Change Request is appropriately documented (i.e. via a Change Request Form and in the Change Log)\" (§9.6, step 1, p.76).<\/p><ul><li>B: the guide does not limit change requests to the Directing Layer; stakeholders \"May introduce new project changes\" (§9.6, key participants, p.76).<\/li><li>C: skips the whole process. The PM \"Ensures the controlled evolution, of products delivered, through proper change management\" (§4.8, p.26), and the guide sets no size below which a change may bypass it.<\/li><li>D: the wrong order. The request is documented first (step 1) and assessed (step 2) before a decision (step 3). Recording it only after approval loses the audit trail.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-5","id":5,"topic":5,"type":"scenario","word_count":104,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>The Project Manager of an EU agency's data-platform project uses the PM² Risk Likelihood/Impact Matrix with five bands for each dimension and the typical colour bands given in the guide. The Risk Management Plan has not customised these scales. Before the next Project Steering Committee meeting, the Risk Log shows four risks:<\/p><ul><li>R1: likelihood 2 (Low), impact 5 (Very high)<\/li><li>R2: likelihood 4 (High), impact 4 (High)<\/li><li>R3: likelihood 1 (Very low), impact 2 (Low)<\/li><li>R4: likelihood 5 (Very high), impact 5 (Very high)<\/li><\/ul><p>The Project Owner asks for a list of the high-level (red) risks only.<\/p><p>Which risks should the Project Manager list?<\/p>","stem_text":"The Project Manager of an EU agency's data-platform project uses the PM² Risk Likelihood/Impact Matrix with five bands for each dimension and the typical colour bands given in the guide. The Risk Management Plan has not customised these scales. Before the next Project Steering Committee meeting, the Risk Log shows four risks: R1: likelihood 2 (Low), impact 5 (Very high) R2: likelihood 4 (High), impact 4 (High) R3: likelihood 1 (Very low), impact 2 (Low) R4: likelihood 5 (Very high), impact 5 (Very high) The Project Owner asks for a list of the high-level (red) risks only. Which risks should the Project Manager list?","options":{"A":"R2 and R4, because both have a risk level of 16 or more.","B":"R1, R2 and R4, because each has an impact of High or above.","C":"R1 and R4, because both have the top impact band, Very high.","D":"Only R4, as R2's risk level of 16 is in the yellow band."},"answer":"D","why_right_html":"<p>PM² multiplies likelihood by impact: R1 = 2 × 5 = 10; R2 = 4 × 4 = 16; R3 = 1 × 2 = 2; R4 = 5 × 5 = 25. The typical bands are \"Green for low-level risks (risk level &lt;=2), Yellow for medium-level risks (risk level between 3 and 16), and Red for high-level risks (risk level &gt;=20)\" (PM² 3.1 App. C.4, p. A-101). So only R4 is red; R1 and R2 are yellow, R3 is green.<\/p><ul><li>Tip: the Risk Management Plan may customise these scales (App. B.3, step 5, p. A-91). The stem rules that out, so the default bands apply.<\/li><\/ul>","why_wrong":{"A":"A: 16 is the top of the yellow band, not red. Red starts at 20.","B":"B: classifies by impact alone. PM² combines the two factors \"by multiplying their values\" (App. C.4).","C":"C: same error as B. R1's high impact is offset by its low likelihood (level 10, yellow)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>PM² multiplies likelihood by impact: R1 = 2 × 5 = 10; R2 = 4 × 4 = 16; R3 = 1 × 2 = 2; R4 = 5 × 5 = 25. The typical bands are \"Green for low-level risks (risk level &lt;=2), Yellow for medium-level risks (risk level between 3 and 16), and Red for high-level risks (risk level &gt;=20)\" (PM² 3.1 App. C.4, p. A-101). So only R4 is red; R1 and R2 are yellow, R3 is green.<\/p><ul><li>A: 16 is the top of the yellow band, not red. Red starts at 20.<\/li><li>B: classifies by impact alone. PM² combines the two factors \"by multiplying their values\" (App. C.4).<\/li><li>C: same error as B. R1's high impact is offset by its low likelihood (level 10, yellow).<\/li><li>Tip: the Risk Management Plan may customise these scales (App. B.3, step 5, p. A-91). The stem rules that out, so the default bands apply.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-6","id":6,"topic":6,"type":"long","word_count":172,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"<p>An EU agency is building a new analytics platform under PM². At a risk review, the Project Manager (PM) discusses two entries in the Risk Log with the Head of Unit, who is the Project Owner.<\/p><p>The first is a threat: an outage of the hosting environment could stop the platform for several days. The agency has outsourced hosting to an external provider, under a contract with service levels and penalties. The Head of Unit says: \"The risk now belongs to the provider. Please close it in the Risk Log.\" The second is an opportunity: another agency has offered to co-develop a machine-learning module under a partnership agreement. Each agency would bear half of the cost and receive half of the savings the module brings. The PM must record a response strategy for it.<\/p><p>Other facts from the Risk Log:<\/p><ul><li>Hosting threat: likelihood 2 (Low), impact 5 (Very high); risk owner: Head of Sector, Infrastructure.<\/li><li>Co-development opportunity: likelihood 3 (Medium), impact 4 (High).<\/li><\/ul><p>Which assessment is correct according to the PM² Guide?<\/p>","stem_text":"An EU agency is building a new analytics platform under PM². At a risk review, the Project Manager (PM) discusses two entries in the Risk Log with the Head of Unit, who is the Project Owner. The first is a threat: an outage of the hosting environment could stop the platform for several days. The agency has outsourced hosting to an external provider, under a contract with service levels and penalties. The Head of Unit says: \"The risk now belongs to the provider. Please close it in the Risk Log.\" The second is an opportunity: another agency has offered to co-develop a machine-learning module under a partnership agreement. Each agency would bear half of the cost and receive half of the savings the module brings. The PM must record a response strategy for it. Other facts from the Risk Log: Hosting threat: likelihood 2 (Low), impact 5 (Very high); risk owner: Head of Sector, Infrastructure. Co-development opportunity: likelihood 3 (Medium), impact 4 (High). Which assessment is correct according to the PM² Guide?","options":{"A":"Record the offer as Exploit, because it raises the likelihood of the opportunity, and keep the hosting risk open in the Risk Log.","B":"Record the offer as Share, and close the hosting risk, because the contract has moved that risk to the provider.","C":"Record the offer as Enhance, and mark the hosting risk as avoided, because its likelihood for the agency is now zero.","D":"Record the offer as Share, and keep the hosting risk in the Risk Log with its owner, as residual risk stays with the agency."},"answer":"D","why_right_html":"<p>The partnership, with costs and gains split, is Share: a \"pain/gain\" formula where both parties share \"the gains, in the case of an opportunity (e.g. by partnering)\" (PM² 3.1 App. G, glossary entry \"Share\", p. A-138). Outsourcing hosting is Transfer, which \"does not relieve the organisation of a risk\"; \"There is always a level of secondary and/or residual risk since the ultimate responsibility for the project risks remains with the organisation\" (glossary entry \"Transfer\", p. A-140). So the risk stays in the Risk Log, which records each risk's \"risk-response strategies and risk owner\" (glossary entry \"Risk Log\", p. A-137).<\/p>","why_wrong":{"A":"A: Exploit means changing conditions \"to ensure that the positive risk (opportunity) will occur (likelihood=100%)\" (glossary entry \"Exploit\", p. A-127). A partnership that splits cost and gains is the guide's own example of Share.","B":"B: right strategy for the opportunity, but closing the hosting risk ignores the residual risk that stays with the agency.","C":"C: Enhance aims \"to increase the likelihood and/or impact\" of an opportunity (glossary entry \"Enhance\", p. A-127); the decisive feature here is the split of costs and gains, which is the guide's definition of Share. Avoid means making the risk irrelevant (Impact = 0 and/or Likelihood = 0%) (glossary entry \"Avoid\", p. A-123). A hosting contract does not do that."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The partnership, with costs and gains split, is Share: a \"pain/gain\" formula where both parties share \"the gains, in the case of an opportunity (e.g. by partnering)\" (PM² 3.1 App. G, glossary entry \"Share\", p. A-138). Outsourcing hosting is Transfer, which \"does not relieve the organisation of a risk\"; \"There is always a level of secondary and/or residual risk since the ultimate responsibility for the project risks remains with the organisation\" (glossary entry \"Transfer\", p. A-140). So the risk stays in the Risk Log, which records each risk's \"risk-response strategies and risk owner\" (glossary entry \"Risk Log\", p. A-137).<\/p><ul><li>A: Exploit means changing conditions \"to ensure that the positive risk (opportunity) will occur (likelihood=100%)\" (glossary entry \"Exploit\", p. A-127). A partnership that splits cost and gains is the guide's own example of Share.<\/li><li>B: right strategy for the opportunity, but closing the hosting risk ignores the residual risk that stays with the agency.<\/li><li>C: Enhance aims \"to increase the likelihood and/or impact\" of an opportunity (glossary entry \"Enhance\", p. A-127); the decisive feature here is the split of costs and gains, which is the guide's definition of Share. Avoid means making the risk irrelevant (Impact = 0 and/or Likelihood = 0%) (glossary entry \"Avoid\", p. A-123). A hosting contract does not do that.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-7","id":7,"topic":7,"type":"scenario","word_count":104,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"<p>A Directorate-General wants to replace its ageing grants-management tool. The Business Manager (BM) drafts the Business Case and sends it to the Project Manager (PM) for comments. The draft explains the problem, links the project to the DG's strategic objectives and sets out a budget of EUR 1.2 million. It describes only one solution, buying licences for a commercial product, because the BM has seen a demonstration and likes it. There is no comparison with other options, such as extending the current tool or reusing a system built by another DG.<\/p><p>According to the PM² Guide, what is the main gap in this draft?<\/p>","stem_text":"A Directorate-General wants to replace its ageing grants-management tool. The Business Manager (BM) drafts the Business Case and sends it to the Project Manager (PM) for comments. The draft explains the problem, links the project to the DG's strategic objectives and sets out a budget of EUR 1.2 million. It describes only one solution, buying licences for a commercial product, because the BM has seen a demonstration and likes it. There is no comparison with other options, such as extending the current tool or reusing a system built by another DG. According to the PM² Guide, what is the main gap in this draft?","options":{"A":"It sets out a budget, which belongs in the Project Charter rather than in the Business Case.","B":"It was drafted by the BM, whereas the PM should draft it and the BM should only support.","C":"It lacks the detailed functional requirements and the full project schedule that a Business Case must contain.","D":"It should consider several solutions, with a SWOT and cost-benefit analysis of each, and recommend one."},"answer":"D","why_right_html":"<p>The Business Case guidelines say: \"Consider several solutions that fulfil this business need and recommend one of these\". The steps require \"an assessment of Strengths, Weaknesses, Opportunities and Threats (SWOT Analysis) of several solutions, one of which is proposed for implementation\" and \"a cost benefit analysis, per identified solution\" (PM² 3.1 §5.3, p.34). The draft offers one option only.<\/p>","why_wrong":{"A":"A: the Business Case exists \"to set out the budgetary needs\" (§5.3, p.34), so including a budget is correct.","B":"B: the BM is right to draft it: the Business Manager \"Creates the Business Case, supported by the Solution Provider (SP) and the Project Manager (PM)\" (§5.3, p.34).","C":"C: the Business Case contains a \"high-level project roadmap, including major milestones\" (§5.3, step 1), not detailed requirements or a full schedule. Even the Project Charter avoids detailed requirements (§5.4, p.36)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The Business Case guidelines say: \"Consider several solutions that fulfil this business need and recommend one of these\". The steps require \"an assessment of Strengths, Weaknesses, Opportunities and Threats (SWOT Analysis) of several solutions, one of which is proposed for implementation\" and \"a cost benefit analysis, per identified solution\" (PM² 3.1 §5.3, p.34). The draft offers one option only.<\/p><ul><li>A: the Business Case exists \"to set out the budgetary needs\" (§5.3, p.34), so including a budget is correct.<\/li><li>B: the BM is right to draft it: the Business Manager \"Creates the Business Case, supported by the Solution Provider (SP) and the Project Manager (PM)\" (§5.3, p.34).<\/li><li>C: the Business Case contains a \"high-level project roadmap, including major milestones\" (§5.3, step 1), not detailed requirements or a full schedule. Even the Project Charter avoids detailed requirements (§5.4, p.36).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-8","id":8,"topic":8,"type":"scenario","word_count":88,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"<p>In an EU institution, the Business Manager (BM) has started a Project Charter for a new visitor-registration system. The draft is 70 pages long, and 55 of those pages list detailed functional requirements, field by field. Several stakeholders say that they cannot review it in the time available, and the Project Steering Committee meets in two weeks. The BM asks the Project Manager (PM) to take over the draft. The PM wants to follow the PM² guidelines for this artefact.<\/p><p>What should the PM do with the draft?<\/p>","stem_text":"In an EU institution, the Business Manager (BM) has started a Project Charter for a new visitor-registration system. The draft is 70 pages long, and 55 of those pages list detailed functional requirements, field by field. Several stakeholders say that they cannot review it in the time available, and the Project Steering Committee meets in two weeks. The BM asks the Project Manager (PM) to take over the draft. The PM wants to follow the PM² guidelines for this artefact. What should the PM do with the draft?","options":{"A":"Return it to the BM to complete, because the BM initiated the Project Charter and must therefore submit it for approval.","B":"Keep the high-level needs and features in the Charter, and move the detailed requirements to a separate document or an appendix.","C":"Keep all the detailed requirements in the Charter, because the Charter is the baseline against which project progress is measured.","D":"Remove all requirements from the Charter, and refer readers to the Business Case, which already describes the project scope."},"answer":"B","why_right_html":"<p>The Project Charter guidelines say: \"Avoid presenting detailed requirements. Instead present high-level needs and features\", and \"Detailed requirements may be captured in other artefacts (e.g. in a Requirements Document), or in an appendix to the Project Charter to be elaborated during the planning phase\". The Charter \"should be brief\" so that stakeholders can review it easily (PM² 3.1 §5.4, p.36).<\/p>","why_wrong":{"A":"A: \"Although the Project Charter can be initiated by the Business Manager (BM), it is ultimately the responsibility of the Project Manager (PM) to complete it and submit it for approval\" (§5.4, p.36).","C":"C: the Charter does provide \"a baseline against which progress can be measured\" (§5.4), but at the level of objectives and high-level requirements. Scope \"reaches its final form in the Project Work Plan\" (App. G, glossary entry \"Scope Statement\", p. A-138).","D":"D: the Charter must define \"high-level requirements\" (§5.4), and it builds on the Business Case rather than referring back to it."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>The Project Charter guidelines say: \"Avoid presenting detailed requirements. Instead present high-level needs and features\", and \"Detailed requirements may be captured in other artefacts (e.g. in a Requirements Document), or in an appendix to the Project Charter to be elaborated during the planning phase\". The Charter \"should be brief\" so that stakeholders can review it easily (PM² 3.1 §5.4, p.36).<\/p><ul><li>A: \"Although the Project Charter can be initiated by the Business Manager (BM), it is ultimately the responsibility of the Project Manager (PM) to complete it and submit it for approval\" (§5.4, p.36).<\/li><li>C: the Charter does provide \"a baseline against which progress can be measured\" (§5.4), but at the level of objectives and high-level requirements. Scope \"reaches its final form in the Project Work Plan\" (App. G, glossary entry \"Scope Statement\", p. A-138).<\/li><li>D: the Charter must define \"high-level requirements\" (§5.4), and it builds on the Business Case rather than referring back to it.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-9","id":9,"topic":9,"type":"long","word_count":192,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"<p>In 2025, a Directorate-General of an EU institution, buying on the institution's own account, awarded a contract for the development of a case-management system after an open procedure with a published contract notice. The procurement documents for this basic project stated the extent of possible new development services and the conditions under which they would be awarded. The contract notice disclosed that a negotiated procedure might be used for them, and the estimated amount of those later services was counted when the thresholds were applied.<\/p><p>The contract was concluded 14 months ago and is still being performed. The DG now needs new development services of the same kind from the same contractor, in line with the basic project, estimated at EUR 900 000, which is above the applicable threshold. In a planning meeting:<\/p><ul><li>the Head of Unit says that an open procedure is required because of the value;<\/li><li>the Project Manager proposes a negotiated procedure without prior publication of a contract notice;<\/li><li>a legal officer says that this route would only be possible on the ground of the contractor's exclusive rights.<\/li><\/ul><p>Which statement is correct under the Financial Regulation (EU, Euratom) 2024/2509?<\/p>","stem_text":"In 2025, a Directorate-General of an EU institution, buying on the institution's own account, awarded a contract for the development of a case-management system after an open procedure with a published contract notice. The procurement documents for this basic project stated the extent of possible new development services and the conditions under which they would be awarded. The contract notice disclosed that a negotiated procedure might be used for them, and the estimated amount of those later services was counted when the thresholds were applied. The contract was concluded 14 months ago and is still being performed. The DG now needs new development services of the same kind from the same contractor, in line with the basic project, estimated at EUR 900 000, which is above the applicable threshold. In a planning meeting: the Head of Unit says that an open procedure is required because of the value; the Project Manager proposes a negotiated procedure without prior publication of a contract notice; a legal officer says that this route would only be possible on the ground of the contractor's exclusive rights. Which statement is correct under the Financial Regulation (EU, Euratom) 2024/2509?","options":{"A":"The negotiated procedure without prior publication may be used for these repeated services, as Annex I's conditions are met.","B":"The negotiated procedure may be used only on the ground of exclusive rights, provided no reasonable alternative exists.","C":"An open procedure is required, because a negotiated procedure without prior publication is limited to low-value contracts.","D":"The negotiated procedure may be used, but only after the original contract has ended, and within five years of its conclusion."},"answer":"A","why_right_html":"<p>FR Annex I point 11.1, second subparagraph, (e) allows the negotiated procedure without prior publication, \"regardless of the estimated value of the contract\", for \"new services or works consisting in the repetition of similar services or works entrusted to the economic operator to which the same contracting authority awarded an original contract\", if they conform to a basic project awarded after a contract notice. Point 11.4 adds the conditions: the basic project indicated the extent of the new services and the award conditions; the possible use of the procedure was disclosed; the total estimated amount counted for the thresholds; and, for Union institutions on their own account, use only \"during the performance of the original contract and at the latest during the three years following its conclusion\". All are met: the contract is being performed and was concluded 14 months ago.<\/p><ul><li>Tip: v1 tested the exclusive-rights ground. Here the decisive facts are the disclosure in the original notice and the three-year limit.<\/li><\/ul>","why_wrong":{"B":"B: exclusive rights (point 11.1(b)(iii), with the condition in 11.3) is a separate ground. Point (e) is a ground of its own, and the stem gives no exclusive rights.","C":"C: point 11.1 applies \"regardless of the estimated value of the contract\", so a value above the threshold does not prevent it.","D":"D: wrong on both counts. The procedure is used during the performance of the original contract, and the limit is three years after its conclusion, not five."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>FR Annex I point 11.1, second subparagraph, (e) allows the negotiated procedure without prior publication, \"regardless of the estimated value of the contract\", for \"new services or works consisting in the repetition of similar services or works entrusted to the economic operator to which the same contracting authority awarded an original contract\", if they conform to a basic project awarded after a contract notice. Point 11.4 adds the conditions: the basic project indicated the extent of the new services and the award conditions; the possible use of the procedure was disclosed; the total estimated amount counted for the thresholds; and, for Union institutions on their own account, use only \"during the performance of the original contract and at the latest during the three years following its conclusion\". All are met: the contract is being performed and was concluded 14 months ago.<\/p><ul><li>B: exclusive rights (point 11.1(b)(iii), with the condition in 11.3) is a separate ground. Point (e) is a ground of its own, and the stem gives no exclusive rights.<\/li><li>C: point 11.1 applies \"regardless of the estimated value of the contract\", so a value above the threshold does not prevent it.<\/li><li>D: wrong on both counts. The procedure is used during the performance of the original contract, and the limit is three years after its conclusion, not five.<\/li><li>Tip: v1 tested the exclusive-rights ground. Here the decisive facts are the disclosure in the original notice and the three-year limit.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-10","id":10,"topic":10,"type":"scenario","word_count":95,"batch":1,"duty":3,"duties":[3],"section":"Duty 3: monitoring cost and schedule","stem_html":"<p>A Directorate-General is developing a new e-procurement module with a Budget at Completion (BAC) of EUR 1 200 000. At the end of month 6, the Project Manager prepares the Project Status Report for the Project Steering Committee. The Earned Value figures at that date are:<\/p><ul><li>Planned Value (PV): EUR 540 000<\/li><li>Earned Value (EV): EUR 480 000<\/li><li>Actual Cost (AC): EUR 600 000<\/li><\/ul><p>The Project Owner asks what the project will cost in total if the cost performance seen so far continues for all the remaining work.<\/p><p>Which forecast should the Project Manager report?<\/p>","stem_text":"A Directorate-General is developing a new e-procurement module with a Budget at Completion (BAC) of EUR 1 200 000. At the end of month 6, the Project Manager prepares the Project Status Report for the Project Steering Committee. The Earned Value figures at that date are: Planned Value (PV): EUR 540 000 Earned Value (EV): EUR 480 000 Actual Cost (AC): EUR 600 000 The Project Owner asks what the project will cost in total if the cost performance seen so far continues for all the remaining work. Which forecast should the Project Manager report?","options":{"A":"Estimate at Completion of EUR 960 000, an underrun of EUR 240 000","B":"Estimate at Completion of EUR 1 320 000, an overrun of EUR 120 000","C":"Estimate at Completion of EUR 1 350 000, an overrun of EUR 150 000","D":"Estimate at Completion of EUR 1 500 000, an overrun of EUR 300 000"},"answer":"D","why_right_html":"<p>CPI = EV / AC = 480 000 / 600 000 = 0.80. If that cost performance continues, EAC = BAC / CPI = 1 200 000 / 0.80 = EUR 1 500 000. The overrun (Variance at Completion) is BAC − EAC = 1 200 000 − 1 500 000 = −EUR 300 000. PM² names EAC among the EVM forecasting indicators (PM² 3.1 App. C.15, p. A-104); the formulas are standard EVM (knowledge).<\/p>","why_wrong":{"A":"A: multiplies instead of divides (BAC × CPI = 1 200 000 × 0.80 = 960 000). A CPI below 1 can never give a forecast below budget.","B":"B: AC + (BAC − EV) = 600 000 + 720 000 = 1 320 000. This assumes the remaining work will run at the budgeted rate, which is not what the PO asked (knowledge).","C":"C: divides by SPI instead of CPI: SPI = 480 000 / 540 000 = 0.888…, and 1 200 000 × 540 000 / 480 000 = 1 350 000. Schedule performance does not forecast cost."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>CPI = EV / AC = 480 000 / 600 000 = 0.80. If that cost performance continues, EAC = BAC / CPI = 1 200 000 / 0.80 = EUR 1 500 000. The overrun (Variance at Completion) is BAC − EAC = 1 200 000 − 1 500 000 = −EUR 300 000. PM² names EAC among the EVM forecasting indicators (PM² 3.1 App. C.15, p. A-104); the formulas are standard EVM (knowledge).<\/p><ul><li>A: multiplies instead of divides (BAC × CPI = 1 200 000 × 0.80 = 960 000). A CPI below 1 can never give a forecast below budget.<\/li><li>B: AC + (BAC − EV) = 600 000 + 720 000 = 1 320 000. This assumes the remaining work will run at the budgeted rate, which is not what the PO asked (knowledge).<\/li><li>C: divides by SPI instead of CPI: SPI = 480 000 / 540 000 = 0.888…, and 1 200 000 × 540 000 / 480 000 = 1 350 000. Schedule performance does not forecast cost.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v2","key":"v2-11","id":11,"topic":11,"type":"scenario","word_count":99,"batch":1,"duty":3,"duties":[3],"section":"Duty 3: monitoring cost and schedule","stem_html":"<p>An EU agency is migrating its case files to a new platform. One work package has a budget of 800 person-days. According to the baseline schedule, 50% of the work package should be complete by today's status date. The team lead reports that 40% of the work is actually complete, and the time-recording system shows that 360 person-days have been spent so far. The Project Manager must enter the Earned Value figures for this work package in the next Project Status Report.<\/p><p>What are the work package's Earned Value (EV), Cost Variance (CV) and Schedule Variance (SV), in person-days?<\/p>","stem_text":"An EU agency is migrating its case files to a new platform. One work package has a budget of 800 person-days. According to the baseline schedule, 50% of the work package should be complete by today's status date. The team lead reports that 40% of the work is actually complete, and the time-recording system shows that 360 person-days have been spent so far. The Project Manager must enter the Earned Value figures for this work package in the next Project Status Report. What are the work package's Earned Value (EV), Cost Variance (CV) and Schedule Variance (SV), in person-days?","options":{"A":"EV = 360; CV = 0; SV = −40","B":"EV = 320; CV = −40; SV = −80","C":"EV = 320; CV = +40; SV = +80","D":"EV = 400; CV = +40; SV = 0"},"answer":"B","why_right_html":"<p>PV = 50% × 800 = 400; EV = 40% × 800 = 320; AC = 360. CV = EV − AC = 320 − 360 = −40 (over budget). SV = EV − PV = 320 − 400 = −80 (behind schedule). The metrics are named in PM² 3.1 App. C.15 (p. A-104); the formulas are standard EVM (knowledge).<\/p><ul><li>Tip: EV is always the budget × the percentage actually complete, never the money spent or the percentage planned.<\/li><\/ul>","why_wrong":{"A":"A: takes the actual cost (360) as EV, so CV = 360 − 360 = 0 and SV = 360 − 400 = −40.","C":"C: right EV, but reverses both subtractions (AC − EV and PV − EV), which flips the signs.","D":"D: takes the planned value (400) as EV, so CV = 400 − 360 = +40 and SV = 400 − 400 = 0."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>PV = 50% × 800 = 400; EV = 40% × 800 = 320; AC = 360. CV = EV − AC = 320 − 360 = −40 (over budget). SV = EV − PV = 320 − 400 = −80 (behind schedule). The metrics are named in PM² 3.1 App. C.15 (p. A-104); the formulas are standard EVM (knowledge).<\/p><ul><li>A: takes the actual cost (360) as EV, so CV = 360 − 360 = 0 and SV = 360 − 400 = −40.<\/li><li>C: right EV, but reverses both subtractions (AC − EV and PV − EV), which flips the signs.<\/li><li>D: takes the planned value (400) as EV, so CV = 400 − 360 = +40 and SV = 400 − 400 = 0.<\/li><li>Tip: EV is always the budget × the percentage actually complete, never the money spent or the percentage planned.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v2","key":"v2-12","id":12,"topic":12,"type":"long","word_count":164,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"<p>Unit C.2 of a Directorate-General runs a large PM² project to replace its document-registration system. The Project Manager (PM), Marta, has been given a Project Management Assistant (PMA), Jonas, from the DG's Project Support Team. Marta asks Jonas to collect progress data from the team leads, draft the monthly Project Status Report and keep the Issue Log up to date.<\/p><p>Jonas prepares a draft RAM (RASCI) for these activities and shows it to the Project Support Office before it goes into the Project Handbook. The draft contains these rows:<\/p><ul><li>Project Status Report: Jonas R, Marta S, Project Owner I<\/li><li>Issue Log maintenance: Jonas R, Marta S, Project Core Team C<\/li><\/ul><p>Jonas explains that, since he now does most of this work, he should be shown as Responsible. The Project Support Office notes that the Accountable entries must still be completed from the PM² standard tables, but that this is a separate step.<\/p><p>Which revision of these two rows is consistent with the PM² Guide?<\/p>","stem_text":"Unit C.2 of a Directorate-General runs a large PM² project to replace its document-registration system. The Project Manager (PM), Marta, has been given a Project Management Assistant (PMA), Jonas, from the DG's Project Support Team. Marta asks Jonas to collect progress data from the team leads, draft the monthly Project Status Report and keep the Issue Log up to date. Jonas prepares a draft RAM (RASCI) for these activities and shows it to the Project Support Office before it goes into the Project Handbook. The draft contains these rows: Project Status Report: Jonas R, Marta S, Project Owner I Issue Log maintenance: Jonas R, Marta S, Project Core Team C Jonas explains that, since he now does most of this work, he should be shown as Responsible. The Project Support Office notes that the Accountable entries must still be completed from the PM² standard tables, but that this is a separate step. Which revision of these two rows is consistent with the PM² Guide?","options":{"A":"Show Marta as R and Jonas as S in both rows, since the PM stays responsible for all project management tasks.","B":"Keep Jonas as R and add Marta as a second R, so that both the assistant and the PM appear as responsible for each task.","C":"Show Jonas as A in both rows, because the person who carries out a task is ultimately answerable for it.","D":"Show Jonas as C in both rows, because Project Support Team members only give opinions and do no project work."},"answer":"A","why_right_html":"<p>On the Project Management Assistant, PM² says the PMA \"can work on a range of coordination and supportive tasks as assigned by the Project Manager (PM)… However, the Project Manager (PM) remains the person responsible for all project management tasks and deliverables\" (PM² 3.1 §4.10, p.28). In RASCI terms, roles with a support function \"work with the person responsible. The support role helps complete the task\" (§4.12, p.29). So Marta is R and Jonas is S.<\/p>","why_wrong":{"B":"B: PM² allows \"just one responsible person for any given task\" (§4.12, p.29).","C":"C: Accountable means \"Ultimately answerable for the correct and thorough completion of the work\" (§4.12). Doing the work does not make Jonas answerable, and there is just one A per task.","D":"D: a Consulted role \"does not help complete the task\" (§4.12). Jonas drafts the report and keeps the log, so he does help complete it."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>On the Project Management Assistant, PM² says the PMA \"can work on a range of coordination and supportive tasks as assigned by the Project Manager (PM)… However, the Project Manager (PM) remains the person responsible for all project management tasks and deliverables\" (PM² 3.1 §4.10, p.28). In RASCI terms, roles with a support function \"work with the person responsible. The support role helps complete the task\" (§4.12, p.29). So Marta is R and Jonas is S.<\/p><ul><li>B: PM² allows \"just one responsible person for any given task\" (§4.12, p.29).<\/li><li>C: Accountable means \"Ultimately answerable for the correct and thorough completion of the work\" (§4.12). Doing the work does not make Jonas answerable, and there is just one A per task.<\/li><li>D: a Consulted role \"does not help complete the task\" (§4.12). Jonas drafts the report and keeps the log, so he does help complete it.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-13","id":13,"topic":13,"type":"scenario","word_count":108,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"<p>The Project Manager of a PM² project to build a new case-tracking system is drafting the RAM (RASCI) for the activity \"Define the security architecture\". An architect in the Project Core Team will do the work. Two other roles still need a code:<\/p><ul><li>The Local Information Security Officer (LISO) will take part in two design workshops, give advice on security risks and discuss the options with the architect. The LISO will not write or build any part of the architecture.<\/li><li>The Head of the HR Unit, whose staff will use the system, only wants to receive short progress updates on this activity.<\/li><\/ul><p>Which coding fits the PM² definitions?<\/p>","stem_text":"The Project Manager of a PM² project to build a new case-tracking system is drafting the RAM (RASCI) for the activity \"Define the security architecture\". An architect in the Project Core Team will do the work. Two other roles still need a code: The Local Information Security Officer (LISO) will take part in two design workshops, give advice on security risks and discuss the options with the architect. The LISO will not write or build any part of the architecture. The Head of the HR Unit, whose staff will use the system, only wants to receive short progress updates on this activity. Which coding fits the PM² definitions?","options":{"A":"LISO: Supports (S); Head of the HR Unit: Informed (I)","B":"LISO: Informed (I); Head of the HR Unit: Consulted (C)","C":"LISO: Accountable (A); Head of the HR Unit: Informed (I)","D":"LISO: Consulted (C); Head of the HR Unit: Informed (I)"},"answer":"D","why_right_html":"<p>Consulted roles are \"Those whose opinions are requested and with whom there is two-way communication. The consulted role does not help complete the task\"; Informed roles are \"Those who are kept informed of progress\" (PM² 3.1 §4.12, p.29). The LISO gives advice in two-way workshops but builds nothing, so C. The PSC table also describes the LISO as a role that \"Consults and advises on security issues\" (§4.4, p.25). The Head of the HR Unit only receives progress updates, so I.<\/p>","why_wrong":{"A":"A: Supports \"helps complete the task\" (§4.12). The LISO writes or builds no part of the architecture.","B":"B: reverses the two codes. The LISO takes part in a two-way exchange; the Head of Unit only receives updates.","C":"C: Accountable is the one person \"Ultimately answerable\" for the work (§4.12). An advisory role is not that person."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Consulted roles are \"Those whose opinions are requested and with whom there is two-way communication. The consulted role does not help complete the task\"; Informed roles are \"Those who are kept informed of progress\" (PM² 3.1 §4.12, p.29). The LISO gives advice in two-way workshops but builds nothing, so C. The PSC table also describes the LISO as a role that \"Consults and advises on security issues\" (§4.4, p.25). The Head of the HR Unit only receives progress updates, so I.<\/p><ul><li>A: Supports \"helps complete the task\" (§4.12). The LISO writes or builds no part of the architecture.<\/li><li>B: reverses the two codes. The LISO takes part in a two-way exchange; the Head of Unit only receives updates.<\/li><li>C: Accountable is the one person \"Ultimately answerable\" for the work (§4.12). An advisory role is not that person.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-14","id":14,"topic":14,"type":"scenario","word_count":101,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"<p>An EU agency is developing a new licensing portal with Scrum, in two-week Sprints. On day 4 of a Sprint, the Head of Unit, a key stakeholder, goes directly to the Developers and asks them to add an urgent statistics report to the current Sprint. The report is not in the Product Backlog. The Developers estimate that adding it now would make the Sprint Goal impossible to reach. The Scrum Master is on leave, and the Head of Unit says that the request cannot wait for the next Sprint.<\/p><p>According to the Scrum Guide 2020, how should the request be handled?<\/p>","stem_text":"An EU agency is developing a new licensing portal with Scrum, in two-week Sprints. On day 4 of a Sprint, the Head of Unit, a key stakeholder, goes directly to the Developers and asks them to add an urgent statistics report to the current Sprint. The report is not in the Product Backlog. The Developers estimate that adding it now would make the Sprint Goal impossible to reach. The Scrum Master is on leave, and the Head of Unit says that the request cannot wait for the next Sprint. According to the Scrum Guide 2020, how should the request be handled?","options":{"A":"The Developers add the report to the Sprint Backlog at once, because they own the Sprint Backlog and may change it freely.","B":"The Head of Unit adds the report to the Product Backlog directly, and the Developers start it when the Scrum Master returns.","C":"The Product Owner cancels the Sprint, because a new stakeholder request means that the Sprint Goal has become obsolete.","D":"The request goes to the Product Owner, who orders the Product Backlog; no change may endanger the Sprint Goal."},"answer":"D","why_right_html":"<p>\"Those wanting to change the Product Backlog can do so by trying to convince the Product Owner\" (SG 2020, \"Product Owner\", p.6), who is accountable for \"Ordering Product Backlog items\". During the Sprint, \"No changes are made that would endanger the Sprint Goal\" and \"Scope may be clarified and renegotiated with the Product Owner as more is learned\" (SG 2020, \"The Sprint\", p.7). The Developers say the new work would make the Sprint Goal impossible, so it cannot simply be added.<\/p>","why_wrong":{"A":"A: the Developers do own the Sprint Backlog, but they may not make changes that endanger the Sprint Goal (p.7). Scope changes are renegotiated with the PO.","B":"B: the Product Owner is accountable for the Product Backlog and its order (p.6). A stakeholder does not add items directly, and the Scrum Master's absence changes nothing.","C":"C: \"A Sprint could be cancelled if the Sprint Goal becomes obsolete\" (SG 2020, \"The Sprint\", p.8). A new request does not make the current goal obsolete."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"Those wanting to change the Product Backlog can do so by trying to convince the Product Owner\" (SG 2020, \"Product Owner\", p.6), who is accountable for \"Ordering Product Backlog items\". During the Sprint, \"No changes are made that would endanger the Sprint Goal\" and \"Scope may be clarified and renegotiated with the Product Owner as more is learned\" (SG 2020, \"The Sprint\", p.7). The Developers say the new work would make the Sprint Goal impossible, so it cannot simply be added.<\/p><ul><li>A: the Developers do own the Sprint Backlog, but they may not make changes that endanger the Sprint Goal (p.7). Scope changes are renegotiated with the PO.<\/li><li>B: the Product Owner is accountable for the Product Backlog and its order (p.6). A stakeholder does not add items directly, and the Scrum Master's absence changes nothing.<\/li><li>C: \"A Sprint could be cancelled if the Sprint Goal becomes obsolete\" (SG 2020, \"The Sprint\", p.8). A new request does not make the current goal obsolete.<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"bank":"v2","key":"v2-15","id":15,"topic":15,"type":"long","word_count":153,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"<p>An EU agency has a Scrum Team of one Product Owner, one Scrum Master and six Developers, working in two-week Sprints. At the start of Sprint Planning, the Product Owner presents a Sprint Goal that she wrote alone the evening before, together with a fixed list of 14 Product Backlog items. She also gives each Developer a list of the tasks she expects them to do on each day. The Developers reply that, based on their past performance and upcoming capacity, they can complete only about 10 items that meet the Definition of Done.<\/p><p>The Scrum Master suggests ending Sprint Planning after one hour and leaving the Product Owner to finalise the Sprint Goal later in the week. The Head of Sector, who has been invited to give advice, proposes that the Scrum Master should decide how the work is split among the Developers.<\/p><p>Which approach is consistent with the Scrum Guide 2020?<\/p>","stem_text":"An EU agency has a Scrum Team of one Product Owner, one Scrum Master and six Developers, working in two-week Sprints. At the start of Sprint Planning, the Product Owner presents a Sprint Goal that she wrote alone the evening before, together with a fixed list of 14 Product Backlog items. She also gives each Developer a list of the tasks she expects them to do on each day. The Developers reply that, based on their past performance and upcoming capacity, they can complete only about 10 items that meet the Definition of Done. The Scrum Master suggests ending Sprint Planning after one hour and leaving the Product Owner to finalise the Sprint Goal later in the week. The Head of Sector, who has been invited to give advice, proposes that the Scrum Master should decide how the work is split among the Developers. Which approach is consistent with the Scrum Guide 2020?","options":{"A":"The PO proposes how the product can gain value, the whole Scrum Team defines the Sprint Goal, and the Developers select items and plan the work.","B":"The PO sets the Sprint Goal and selects the items, and the Developers decide only how the selected items become an Increment.","C":"The Scrum Master defines the Sprint Goal and splits the work, because the Scrum Master is accountable for the team's effectiveness.","D":"Sprint Planning ends after one hour, and the PO finalises the Sprint Goal later in the week, once the Developers have started work."},"answer":"A","why_right_html":"<p>Sprint Planning has three topics. \"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal\". \"Through discussion with the Product Owner, the Developers select items from the Product Backlog\". How the work gets done \"is at the sole discretion of the Developers. No one else tells them how\" (SG 2020, \"Sprint Planning\", p.8). Inviting the Head of Sector is allowed: the team \"may also invite other people to attend Sprint Planning to provide advice\" (p.8), but advice is not a decision.<\/p>","why_wrong":{"B":"B: the PO does not set the Sprint Goal alone or select the items. The whole team defines the goal and the Developers select the items.","C":"C: the Scrum Master is \"accountable for the Scrum Team's effectiveness\" (SG 2020, \"Scrum Master\", p.6), but does not set the Sprint Goal or tell Developers how to work.","D":"D: \"The Sprint Goal must be finalized prior to the end of Sprint Planning\" (p.8). Sprint Planning may be shorter than the eight-hour maximum for a one-month Sprint (p.9), but the goal cannot be left for later."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>Sprint Planning has three topics. \"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal\". \"Through discussion with the Product Owner, the Developers select items from the Product Backlog\". How the work gets done \"is at the sole discretion of the Developers. No one else tells them how\" (SG 2020, \"Sprint Planning\", p.8). Inviting the Head of Sector is allowed: the team \"may also invite other people to attend Sprint Planning to provide advice\" (p.8), but advice is not a decision.<\/p><ul><li>B: the PO does not set the Sprint Goal alone or select the items. The whole team defines the goal and the Developers select the items.<\/li><li>C: the Scrum Master is \"accountable for the Scrum Team's effectiveness\" (SG 2020, \"Scrum Master\", p.6), but does not set the Sprint Goal or tell Developers how to work.<\/li><li>D: \"The Sprint Goal must be finalized prior to the end of Sprint Planning\" (p.8). Sprint Planning may be shorter than the eight-hour maximum for a one-month Sprint (p.9), but the goal cannot be left for later.<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"bank":"v2","key":"v2-16","id":16,"topic":16,"type":"scenario","word_count":91,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"<p>A Directorate-General is setting up the governance of a new PM² project to modernise its HR system. The draft Project Handbook proposes a Project Steering Committee (PSC) made up of the Project Owner (PO) as chair, the Solution Provider (SP) and the Local Information Security Officer (LISO). To keep the committee small, the Business Manager (BM) and the Project Manager (PM) would attend only when invited. The Director, who is the PO, asks the Project Support Office to check the draft against PM².<\/p><p>Which comment on the proposed PSC is correct?<\/p>","stem_text":"A Directorate-General is setting up the governance of a new PM² project to modernise its HR system. The draft Project Handbook proposes a Project Steering Committee (PSC) made up of the Project Owner (PO) as chair, the Solution Provider (SP) and the Local Information Security Officer (LISO). To keep the committee small, the Business Manager (BM) and the Project Manager (PM) would attend only when invited. The Director, who is the PO, asks the Project Support Office to check the draft against PM². Which comment on the proposed PSC is correct?","options":{"A":"It is correct as proposed, since PM² lets each project choose any members, provided
