<title>Field MCQ mock — EPSO/AD/429/26 field 2 (unofficial practice tool)</title>
<style>
/* ===== Tokens ===== */
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eceff3;
  --text: #1a1e23;
  --muted: #4f5864;
  --border: #cdd3db;
  --border-strong: #7d8794;
  --accent: #1d4f9b;
  --accent-hover: #163e7a;
  --on-accent: #ffffff;
  --accent-soft: #e6edf9;
  --ok: #156134;
  --ok-bg: #e2f2e7;
  --ok-border: #2c8350;
  --bad: #a1221a;
  --bad-bg: #fbe7e5;
  --bad-border: #c0453b;
  --warn: #744300;
  --warn-bg: #fff0cc;
  --warn-border: #b07510;
  --crit: #8a1b00;
  --crit-bg: #ffdccc;
  --crit-border: #c24a17;
  --focus: #1d4f9b;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .08);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --surface: #171b21;
    --surface-2: #20262e;
    --text: #e6e9ed;
    --muted: #a6afbb;
    --border: #333a44;
    --border-strong: #77818f;
    --accent: #8db3ff;
    --accent-hover: #abc7ff;
    --on-accent: #0a1730;
    --accent-soft: #1b2740;
    --ok: #7fd79c;
    --ok-bg: #0f2a19;
    --ok-border: #46a46a;
    --bad: #ffa096;
    --bad-bg: #351410;
    --bad-border: #d0655a;
    --warn: #ffd27e;
    --warn-bg: #33260a;
    --warn-border: #c09228;
    --crit: #ffb093;
    --crit-bg: #42190b;
    --crit-border: #dc7348;
    --focus: #abc7ff;
    --shadow: none;
  }
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1.0625rem; line-height: 1.55;
  min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1 0 auto; outline: none; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; margin-top: 1.75rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-hover); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: var(--surface-2); padding: .05em .3em; border-radius: 4px; }
ul, ol { padding-left: 1.3rem; }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
.prose { max-width: 70ch; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.icon { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.22em; }
.stack > * + * { margin-top: 1rem; }

/* ===== Header / footer ===== */
.skip { position: absolute; left: .5rem; top: -4rem; z-index: 10; }
.skip:focus { top: .5rem; }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; min-height: 3.5rem; padding-top: .35rem; padding-bottom: .35rem; }
.brand { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; color: var(--text); text-decoration: none; font-weight: 700; }
.brand:hover { color: var(--text); }
.tag { font-size: .75rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: .1rem .55rem; }
.site-nav { display: flex; gap: .25rem; }
.site-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 .75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 600; }
.site-nav a:hover { background: var(--surface-2); }
.site-nav a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--accent); border-radius: 8px 8px 0 0; }
.site-footer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .85rem; padding: 1rem 0 1.25rem; margin-top: 3rem; }

/* ===== Buttons ===== */
.btn {
  font: inherit; font-weight: 600; font-size: 1rem; line-height: 1.2;
  min-height: 44px; padding: .6rem 1.05rem; border-radius: 8px;
  border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  text-decoration: none; text-align: center; transition: background-color .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn-danger { color: var(--bad); border-color: var(--bad-border); }
.btn-danger:hover { background: var(--bad-bg); color: var(--bad); }
.btn-small { min-height: 44px; padding: .4rem .8rem; font-size: .9rem; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover, .btn:disabled:hover { background: var(--surface); }
.btn-primary[aria-disabled="true"]:hover, .btn-primary:disabled:hover { background: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1rem; }
.btn[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 44px; }

/* ===== Cards, notes, badges ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.card h2, .card h3 { margin-top: 0; }
.card-accent { border: 2px solid var(--accent); }
.grid-2 { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.note { display: flex; gap: .7rem; align-items: flex-start; border-radius: var(--radius); padding: .85rem 1rem; border: 1.5px solid var(--border-strong); background: var(--surface); }
.note p:last-child { margin-bottom: 0; }
.note-warn { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn); }
.note-warn strong { color: inherit; }
.note-info { border-color: var(--accent); background: var(--accent-soft); }
.note-bad { border-color: var(--bad-border); background: var(--bad-bg); color: var(--bad); }
.disclaimer { font-size: 1.05rem; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; border: 1.5px solid var(--border-strong); color: var(--text); background: var(--surface); white-space: nowrap; }
.badge-ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.badge-bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.badge-flag { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.badge-debug { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-border); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; }
.eyebrow { font-size: .85rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
.banner { background: var(--warn-bg); color: var(--warn); border-bottom: 1.5px solid var(--warn-border); }
.banner .wrap { display: flex; align-items: center; gap: .75rem; justify-content: space-between; padding-top: .4rem; padding-bottom: .4rem; }
.banner p { margin: 0; font-weight: 600; }
.banner .btn { color: var(--warn); border-color: var(--warn-border); background: transparent; }

/* ===== Page layout ===== */
.page { padding-top: 1.5rem; padding-bottom: 1rem; }
.page-head { margin-bottom: 1.25rem; }
.facts { margin: 0; padding-left: 1.2rem; }
.facts li { margin-bottom: .35rem; }
.resume-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
.resume-card h2 { margin: 0 0 .2rem; font-size: 1.15rem; }
.resume-card p { margin: 0; }
.big-time { font-variant-numeric: tabular-nums; font-weight: 700; }

/* ===== Tables ===== */
.table-wrap { width: 100%; overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: .95rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.table caption { text-align: left; font-weight: 600; padding: .4rem 0; color: var(--muted); caption-side: top; }
.table th, .table td { padding: .55rem .7rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.table thead th { font-size: .85rem; color: var(--muted); background: var(--surface-2); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
.meter-cell { display: flex; align-items: center; gap: .5rem; min-width: 7.5rem; }
.meter { flex: 1; height: .6rem; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; min-width: 3rem; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.meter-val { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
@media (max-width: 520px) {
  .table { font-size: .88rem; }
  .table th, .table td { padding: .45rem .4rem; }
  .meter-cell { min-width: 0; gap: .3rem; }
  .meter { min-width: 1.5rem; }
  .table thead th { word-break: break-word; hyphens: auto; }
  .table tbody th { hyphens: manual; overflow-wrap: break-word; }
}

/* ===== Exam ===== */
.exam-bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.exam-bar-inner { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; padding-top: .5rem; padding-bottom: .5rem; }
.exam-title { font-size: 1.15rem; margin: 0; margin-right: auto; font-variant-numeric: tabular-nums; }
.timer {
  display: inline-flex; align-items: center; gap: .4rem; font-variant-numeric: tabular-nums;
  font-weight: 700; font-size: 1.15rem; padding: .35rem .7rem; min-height: 44px;
  border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
}
.timer-label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.timer.is-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.timer.is-warn .timer-label { color: var(--warn); }
.timer.is-crit { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-border); border-width: 2.5px; }
.timer.is-crit .timer-label { color: var(--crit); }
.only-narrow { display: none; }
@media (max-width: 520px) {
  .only-wide { display: none; }
  .only-narrow { display: inline; }
  .timer-label { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .exam-title { font-size: 1rem; }
  .exam-bar-inner { gap: .4rem; }
  .timer { padding: .3rem .55rem; font-size: 1.05rem; }
  .timer [data-timer-icon] { display: none; }
  .exam-bar .btn { padding: .5rem .75rem; }
  .exam-actions.exam-nav { display: grid; grid-template-columns: 1fr 1fr; }
  .exam-nav .spacer { display: none; }
  .exam-nav [data-action="exam-flag"] { grid-column: 1 / -1; }
}
.exam-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; padding-top: 1.25rem; }
@media (min-width: 900px) { .exam-layout { grid-template-columns: minmax(0, 1fr) 17.5rem; align-items: start; } }
.exam-main { min-width: 0; }
.stem { max-width: 70ch; font-size: 1.1rem; margin-bottom: 1rem; }
.stem p:last-child { margin-bottom: 0; }
.options { display: grid; gap: .6rem; max-width: 70ch; margin: 0; padding: 0; border: 0; }
.opt { display: block; position: relative; cursor: pointer; }
.opt-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; top: 1rem; left: 1rem; }
.opt-body {
  display: flex; gap: .85rem; align-items: flex-start; width: 100%; min-height: 44px;
  padding: .8rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); text-align: left; transition: border-color .12s, background-color .12s;
}
.opt:hover .opt-body { border-color: var(--border-strong); }
.opt-letter {
  flex: none; width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--border-strong);
  display: inline-grid; place-items: center; font-weight: 700; font-size: .95rem; margin-top: -.1rem;
}
.opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .3rem; }
.opt-status { display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; font-size: .9rem; }
.opt-status:empty { display: none; }
.opt-selected-tag { display: none; color: var(--accent); }
.opt-input:checked + .opt-body { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt-input:checked + .opt-body .opt-letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt-input:checked + .opt-body .opt-selected-tag { display: inline-flex; }
.opt-input:focus-visible + .opt-body { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt-btn { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; border-radius: var(--radius); }
.opt-btn:hover .opt-body { border-color: var(--border-strong); }
.opt-btn[aria-disabled="true"] { cursor: default; }
.opt-btn[aria-disabled="true"]:hover .opt-body { border-color: var(--border); }
.opt-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.is-correct .opt-body, .opt-btn.is-correct[aria-disabled="true"]:hover .opt-body { border-color: var(--ok-border); background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok-border); }
.is-correct .opt-letter { border-color: var(--ok-border); color: var(--ok); border-width: 2px; }
.is-correct .opt-status { color: var(--ok); }
.is-wrong .opt-body, .opt-btn.is-wrong[aria-disabled="true"]:hover .opt-body { border-color: var(--bad-border); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad-border); }
.is-wrong .opt-letter { border-color: var(--bad-border); color: var(--bad); border-width: 2px; }
.is-wrong .opt-status { color: var(--bad); }
.is-dim .opt-body { opacity: .78; }
.exam-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1.25rem; max-width: 70ch; }
.exam-actions .spacer { flex: 1; }
.kbd-hint { color: var(--muted); font-size: .85rem; margin-top: 1rem; max-width: 70ch; }
.kbd-hint kbd { font-family: inherit; font-weight: 600; }
@media (pointer: coarse) { .kbd-hint { display: none; } }

/* ===== Palette ===== */
.palette { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem 1rem; }
@media (min-width: 900px) { .palette { position: sticky; top: 5rem; } }
.palette-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.palette-head h2 { margin: 0; font-size: 1.05rem; }
.palette-counts { font-size: .9rem; color: var(--muted); margin: .35rem 0 .75rem; font-variant-numeric: tabular-nums; }
.palette-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(2.85rem, 1fr)); gap: .4rem; }
.pbtn {
  position: relative; width: 100%; min-width: 44px; height: 44px; border-radius: 8px;
  border: 1.5px dashed var(--border-strong); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0;
}
.pbtn:hover { background: var(--surface-2); }
.pbtn.is-answered { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.pbtn.is-answered:hover { background: var(--accent-hover); }
.pbtn .pflag { position: absolute; top: 1px; right: 2px; width: .85rem; height: .85rem; display: none; color: var(--warn); }
.pbtn.is-flagged .pflag { display: block; }
.pbtn.is-answered .pflag { color: var(--on-accent); }
.pbtn.is-current { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4.5px var(--text); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.legend { list-style: none; padding: 0; margin: .9rem 0 0; display: grid; gap: .35rem; font-size: .85rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: .5rem; }
.swatch { position: relative; width: 1.6rem; height: 1.3rem; border-radius: 5px; border: 1.5px dashed var(--border-strong); background: var(--surface); flex: none; }
.swatch.is-answered { border-style: solid; border-color: var(--accent); background: var(--accent); }
.swatch.is-current { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
.swatch .pflag { position: absolute; top: 1px; right: 1px; width: .75rem; height: .75rem; color: var(--warn); }
.palette-toggle { display: inline-flex; }
@media (max-width: 899px) {
  .palette-body[data-collapsed="true"] { display: none; }
}
@media (min-width: 900px) { .palette-toggle { display: none; } }

/* ===== Results & review ===== */
.score-card { display: grid; gap: 1rem; }
@media (min-width: 760px) { .score-card { grid-template-columns: auto 1fr; align-items: center; } }
.score-big { font-size: 3.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score-big .den { font-size: 1.6rem; font-weight: 600; color: var(--muted); }
.verdict { display: inline-flex; align-items: center; gap: .5rem; font-size: 1.15rem; font-weight: 800; padding: .35rem .8rem; border-radius: 8px; border: 2px solid; letter-spacing: .02em; }
.verdict-pass { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.verdict-fail { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.kv { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin: .6rem 0 0; padding: 0; list-style: none; }
.kv li { margin: 0; }
.kv strong { font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
.filters .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.review-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
.rev-item { background: var(--surface); border: 1px solid var(--border); border-left-width: 5px; border-radius: var(--radius); padding: 1rem 1.1rem; }
.rev-item[data-status="correct"] { border-left-color: var(--ok-border); }
.rev-item[data-status="wrong"] { border-left-color: var(--bad-border); }
.rev-item[data-status="unanswered"] { border-left-color: var(--border-strong); border-left-style: dashed; }
.rev-head { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; margin-bottom: .6rem; }
.rev-head h3 { margin: 0; font-size: 1.05rem; }
.rev-meta { font-size: .85rem; color: var(--muted); margin: 0 0 .6rem; }
.rev-opts { list-style: none; margin: 0 0 .8rem; padding: 0; display: grid; gap: .45rem; max-width: 70ch; }
.rev-opts .opt-body { padding: .6rem .8rem; }
.expl { max-width: 70ch; border-top: 1px solid var(--border); padding-top: .75rem; margin-top: .75rem; }
.expl h3, .expl h4 { font-size: 1rem; margin-bottom: .35rem; display: flex; align-items: center; gap: .4rem; }
.expl-wrong h3, .expl-wrong h4 { color: var(--bad); }
.expl-right h3, .expl-right h4 { color: var(--ok); }
.expl-body > :last-child { margin-bottom: 0; }
.expl-body ul { margin: .3rem 0 .6rem; }
.kb-note { display: inline-flex; gap: .4rem; align-items: flex-start; font-size: .85rem; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 6px; padding: .3rem .55rem; margin: .5rem 0 0; }
.shared-note { font-size: .85rem; color: var(--muted); margin-top: .3rem; }
details.more { margin-top: .75rem; max-width: 70ch; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 44px; display: flex; align-items: center; gap: .3rem; }
details.more[open] > summary { margin-bottom: .3rem; }

/* ===== Practice ===== */
.practice-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; }
.tally { font-weight: 700; font-variant-numeric: tabular-nums; }
.feedback { max-width: 70ch; margin-top: 1rem; }
.feedback:empty { display: none; }
.fb-head { display: flex; align-items: center; gap: .5rem; font-weight: 800; font-size: 1.1rem; margin: 0 0 .5rem; }
.fb-ok { color: var(--ok); }
.fb-bad { color: var(--bad); }
.fb-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem; }
.fb-panel .expl:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
form.setup fieldset { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: .9rem 1rem 1rem; margin: 0 0 1rem; }
form.setup legend { font-weight: 700; padding: 0 .3rem; }
.choice { display: flex; align-items: center; gap: .6rem; min-height: 44px; }
.choice input[type="radio"] { width: 1.2rem; height: 1.2rem; margin: 0; accent-color: var(--accent); flex: none; }
.choice label { cursor: pointer; }
.choice.is-disabled label { color: var(--muted); cursor: not-allowed; }
.choice-help { margin: -.2rem 0 .4rem 1.8rem; font-size: .85rem; color: var(--muted); }
select { font: inherit; font-size: 1rem; min-height: 44px; padding: .4rem .6rem; border-radius: 8px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); max-width: 100%; }
.duty-select { margin: .2rem 0 .3rem 1.8rem; display: block; width: calc(100% - 1.8rem); }
.missed-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.missed-list li { display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .9rem; }
.missed-list .stem-excerpt { min-width: 0; }

/* ===== Progress chart ===== */
.spark { width: 100%; max-width: 40rem; height: auto; display: block; }
.spark-fig { margin: 0 0 1rem; }
.spark .bar-pass { fill: var(--accent); }
.spark .bar-fail { fill: var(--surface); stroke: var(--bad-border); stroke-width: 1.5; }
.spark .passline { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 5 4; }
.spark .axis { stroke: var(--border-strong); stroke-width: 1; }
.spark text { fill: var(--muted); font-size: 12px; font-family: var(--font); }

dialog.modal { border: 1px solid var(--border-strong); border-radius: 12px; padding: 1.25rem 1.3rem 1.1rem; background: var(--surface); color: var(--text); max-width: min(32rem, calc(100vw - 2rem)); width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog.modal::backdrop { background: rgba(10, 14, 20, .55); }
dialog.modal h2 { margin-top: 0; font-size: 1.2rem; }
.dialog-actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: flex-end; margin-top: 1.25rem; }

<script id="question-data" type="application/json">{"schema":1,"generated":"2026-11-22T17:06:43Z","sources":["predictions/question-bank.md","predictions/answer-key.md"],"count":90,"duties":{"1":"Lifecycle management of projects, programmes and portfolios","2":"Analysis, design, estimation, acquisition, scheduling","3":"Monitoring costs, time, resources, risks, quality and security","4":"Leading the team","5":"Stakeholder relations","6":"Bridging business and IT","7":"Horizontal ICT initiatives","8":"Benefits realisation","9":"Defining and implementing PM frameworks","10":"Quality assurance and test management","11":"Contract management"},"batches":{"1":"Tier 1 topics","2":"Tier 2 topics","3":"Tier 3 topics"},"questions":[{"id":1,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"In PM², when does the RfE (Ready for Executing) phase gate take place?","stem_text":"In PM², when does the RfE (Ready for Executing) phase gate take place?","options":{"A":"At the end of the Initiating Phase","B":"At the end of the Planning Phase","C":"At the end of the Executing Phase","D":"At the end of Monitor &amp; Control, before the Closing Phase"},"answer":"B","why_right_html":"<p>PM² has three phase gates: RfP at the end of Initiating, RfE at the end of Planning, RfC at the end of Executing (PM² 3.1 §3.2.6, p.17).<\/p>","why_wrong":{"A":"A is RfP.","C":"C is RfC.","D":"D is wrong because Monitor &amp; Control is not a phase that ends: it runs across the whole lifecycle (§3.2.5, p.16)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>PM² has three phase gates: RfP at the end of Initiating, RfE at the end of Planning, RfC at the end of Executing (PM² 3.1 §3.2.6, p.17).<\/p><ul><li>A is RfP.<\/li><li>C is RfC.<\/li><li>D is wrong because Monitor &amp; Control is not a phase that ends: it runs across the whole lifecycle (§3.2.5, p.16).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":2,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"At the RfP (Ready for Planning) gate of a PM² project, the Project Steering Committee does not approve the Business Case. According to the PM² Guide, what happens next?","stem_text":"At the RfP (Ready for Planning) gate of a PM² project, the Project Steering Committee does not approve the Business Case. According to the PM² Guide, what happens next?","options":{"A":"The project returns to the start of the Initiating Phase and a new Project Initiation Request is drafted.","B":"The project enters the Planning Phase on condition that the Business Case is revised before the RfE gate.","C":"The project proceeds directly to the Closing Phase for Lessons Learned and archiving.","D":"The decision is escalated to the Appropriate Governance Body, which becomes the project's main driver."},"answer":"C","why_right_html":"<p>\"If the Business Case or Project Charter is not approved, the project proceeds directly to the Closing Phase for Lessons Learned and archiving\" (PM² 3.1 §5.5, p.37).<\/p>","why_wrong":{"A":"A and B invent a loop-back or conditional entry that the guide does not provide.","B":"A and B invent a loop-back or conditional entry that the guide does not provide.","D":"D misreads the AGB's role: it approves projects and releases funding (§4.3), but it is not a phase driver."},"why_wrong_shared":{"A":true,"B":true,"D":false},"full_html":"<p>\"If the Business Case or Project Charter is not approved, the project proceeds directly to the Closing Phase for Lessons Learned and archiving\" (PM² 3.1 §5.5, p.37).<\/p><ul><li>A and B invent a loop-back or conditional entry that the guide does not provide.<\/li><li>D misreads the AGB's role: it approves projects and releases funding (§4.3), but it is not a phase driver.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":3,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"A change request has been documented and assessed in a PM² project. Which list gives the possible decisions on it, according to the PM² Guide?","stem_text":"A change request has been documented and assessed in a PM² project. Which list gives the possible decisions on it, according to the PM² Guide?","options":{"A":"Approve, reject or escalate","B":"Accept, transfer, reduce or avoid","C":"Approve, approve with conditions, or reject","D":"Approve, reject, postpone or merge"},"answer":"D","why_right_html":"<p>The guide lists \"four possible decisions: approve, reject, postpone or merge the change request\" (PM² 3.1 §9.6, step 3, p.76).<\/p>","why_wrong":{"A":"A: escalation is the route a decision follows, not a decision.","B":"B lists risk-response strategies.","C":"C adds a decision that PM² does not list."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The guide lists \"four possible decisions: approve, reject, postpone or merge the change request\" (PM² 3.1 §9.6, step 3, p.76).<\/p><ul><li>A: escalation is the route a decision follows, not a decision.<\/li><li>B lists risk-response strategies.<\/li><li>C adds a decision that PM² does not list.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":4,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"In PM², which role or body approves or rejects project changes?","stem_text":"In PM², which role or body approves or rejects project changes?","options":{"A":"The Project Owner and/or the Project Steering Committee","B":"The Project Manager, who monitors and controls changes","C":"The Project Core Team, which estimates the effort required","D":"The Business Manager, on behalf of the users"},"answer":"A","why_right_html":"<p>In Manage Project Change, the Project Owner and/or Project Steering Committee \"approves or rejects the project changes\" (PM² 3.1 §9.6, key participants, p.76).<\/p>","why_wrong":{"B":"B: the PM \"monitors and controls the project changes\".","C":"C: the PCT is \"involved in analysing\" them by estimating effort.","D":"D: the BM is not the approver."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>In Manage Project Change, the Project Owner and/or Project Steering Committee \"approves or rejects the project changes\" (PM² 3.1 §9.6, key participants, p.76).<\/p><ul><li>B: the PM \"monitors and controls the project changes\".<\/li><li>C: the PCT is \"involved in analysing\" them by estimating effort.<\/li><li>D: the BM is not the approver.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":5,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"A risk in a PM² project is assessed with likelihood 4 (High) and impact 5 (Very high) on the PM² Risk Likelihood/Impact Matrix. What is its risk level, and how is it typically classified?","stem_text":"A risk in a PM² project is assessed with likelihood 4 (High) and impact 5 (Very high) on the PM² Risk Likelihood/Impact Matrix. What is its risk level, and how is it typically classified?","options":{"A":"9, medium-level (yellow)","B":"9, high-level (red)","C":"20, high-level (red)","D":"20, medium-level (yellow)"},"answer":"C","why_right_html":"<p>PM² multiplies likelihood by impact: 4 × 5 = 20, on a scale of 1–25. Levels of 20 and above are typically red, or high-level (PM² 3.1 App. C.4, p. A-101).<\/p>","why_wrong":{"A":"A and B add the two values (4 + 5 = 9) instead of multiplying them.","B":"A and B add the two values (4 + 5 = 9) instead of multiplying them.","D":"D gets the number right but the band wrong: yellow covers 3 to 16."},"why_wrong_shared":{"A":true,"B":true,"D":false},"full_html":"<p>PM² multiplies likelihood by impact: 4 × 5 = 20, on a scale of 1–25. Levels of 20 and above are typically red, or high-level (PM² 3.1 App. C.4, p. A-101).<\/p><ul><li>A and B add the two values (4 + 5 = 9) instead of multiplying them.<\/li><li>D gets the number right but the band wrong: yellow covers 3 to 16.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":6,"batch":1,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, change and risk","stem_html":"Which risk-response strategy does PM² describe as applicable to both threats and opportunities?","stem_text":"Which risk-response strategy does PM² describe as applicable to both threats and opportunities?","options":{"A":"Avoid","B":"Accept","C":"Exploit","D":"Reduce"},"answer":"B","why_right_html":"<p>The glossary defines Accept as \"applicable both for negative (threats) and positive (opportunities) risks\", with passive and active acceptance (PM² 3.1, App. G, glossary entry \"Accept\").<\/p><ul><li>Note that \"share\" also appears in both lists (App. B.3 step 9). That is why no option offers it.<\/li><\/ul>","why_wrong":{"A":"A and D are threat-only strategies.","C":"C is opportunity-only.","D":"A and D are threat-only strategies."},"why_wrong_shared":{"A":true,"C":false,"D":true},"full_html":"<p>The glossary defines Accept as \"applicable both for negative (threats) and positive (opportunities) risks\", with passive and active acceptance (PM² 3.1, App. G, glossary entry \"Accept\").<\/p><ul><li>A and D are threat-only strategies.<\/li><li>C is opportunity-only.<\/li><li>Note that \"share\" also appears in both lists (App. B.3 step 9). That is why no option offers it.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":7,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"In PM², who drafts the Business Case, and who is accountable for it?","stem_text":"In PM², who drafts the Business Case, and who is accountable for it?","options":{"A":"The Business Manager drafts it; the Project Owner is accountable.","B":"The Project Manager drafts it; the Project Owner is accountable.","C":"The Project Owner drafts it; the Appropriate Governance Body is accountable.","D":"The Solution Provider drafts it; the Project Steering Committee is accountable."},"answer":"A","why_right_html":"<p>For the Business Case, \"Project Owner (PO): Accountable\"; \"Business Manager (BM): Creates the Business Case, supported by the Solution Provider (SP) and the Project Manager (PM)\" (PM² 3.1 §5.3, p.34). The RASCI example on p.29 shows the same: PO = A, BM = R.<\/p>","why_wrong":{"B":"B: the PM supports but does not draft.","C":"C and D misassign the accountability.","D":"C and D misassign the accountability."},"why_wrong_shared":{"B":false,"C":true,"D":true},"full_html":"<p>For the Business Case, \"Project Owner (PO): Accountable\"; \"Business Manager (BM): Creates the Business Case, supported by the Solution Provider (SP) and the Project Manager (PM)\" (PM² 3.1 §5.3, p.34). The RASCI example on p.29 shows the same: PO = A, BM = R.<\/p><ul><li>B: the PM supports but does not draft.<\/li><li>C and D misassign the accountability.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":8,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"Which PM² artefact defines the project's scope, high-level requirements, risks, constraints, milestones and deliverables, and provides a baseline against which progress can be measured?","stem_text":"Which PM² artefact defines the project's scope, high-level requirements, risks, constraints, milestones and deliverables, and provides a baseline against which progress can be measured?","options":{"A":"The Project Initiation Request","B":"The Business Case","C":"The Project Handbook","D":"The Project Charter"},"answer":"D","why_right_html":"<p>The Project Charter \"defines the project's objectives (i.e. scope, time, cost, quality), high-level requirements, risks and constraints, as well as the project milestones and deliverable(s)\" and \"provides a baseline against which progress can be measured\" (PM² 3.1 §5.4, p.36).<\/p>","why_wrong":{"A":"A: the Project Initiation Request formalises the initiation and captures the context.","B":"B: the Business Case justifies the investment.","C":"C: the Handbook sets out the management approach and roles."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The Project Charter \"defines the project's objectives (i.e. scope, time, cost, quality), high-level requirements, risks and constraints, as well as the project milestones and deliverable(s)\" and \"provides a baseline against which progress can be measured\" (PM² 3.1 §5.4, p.36).<\/p><ul><li>A: the Project Initiation Request formalises the initiation and captures the context.<\/li><li>B: the Business Case justifies the investment.<\/li><li>C: the Handbook sets out the management approach and roles.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":9,"batch":1,"duty":2,"duties":[2],"section":"Duty 2: analysis, estimation and acquisition","stem_html":"An EU institution must buy additional services for a proprietary case-management system. Only the original vendor holds the intellectual property rights needed to do the work. Under the Financial Regulation (EU, Euratom) 2024/2509, which procedure may the institution use, provided the conditions in Annex I are met?","stem_text":"An EU institution must buy additional services for a proprietary case-management system. Only the original vendor holds the intellectual property rights needed to do the work. Under the Financial Regulation (EU, Euratom) 2024/2509, which procedure may the institution use, provided the conditions in Annex I are met?","options":{"A":"A design contest","B":"An innovation partnership","C":"A negotiated procedure without prior publication of a contract notice","D":"Only an open procedure, because the contract value is above the thresholds"},"answer":"C","why_right_html":"<p>FR Annex I point 11.1(b)(iii) allows the negotiated procedure without prior publication where the services \"can only be provided by a single economic operator\", including where \"the protection of exclusive rights, including intellectual property rights, must be ensured\". This is subject to the conditions in point 11.3.<\/p>","why_wrong":{"A":"A: a design contest is for acquiring a plan or design chosen by a jury (FR Art. 167).","B":"B: an innovation partnership is for developing an innovative product or service (Art. 167).","D":"D is wrong because the Regulation itself provides this exception."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>FR Annex I point 11.1(b)(iii) allows the negotiated procedure without prior publication where the services \"can only be provided by a single economic operator\", including where \"the protection of exclusive rights, including intellectual property rights, must be ensured\". This is subject to the conditions in point 11.3.<\/p><ul><li>A: a design contest is for acquiring a plan or design chosen by a jury (FR Art. 167).<\/li><li>B: an innovation partnership is for developing an innovative product or service (Art. 167).<\/li><li>D is wrong because the Regulation itself provides this exception.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"id":10,"batch":1,"duty":3,"duties":[3],"section":"Duty 3: monitoring cost and schedule","stem_html":"At a status review, a project shows Earned Value (EV) = EUR 400 000, Actual Cost (AC) = EUR 500 000 and Planned Value (PV) = EUR 450 000. What is the project's situation?","stem_text":"At a status review, a project shows Earned Value (EV) = EUR 400 000, Actual Cost (AC) = EUR 500 000 and Planned Value (PV) = EUR 450 000. What is the project's situation?","options":{"A":"Over budget and behind schedule","B":"Under budget and behind schedule","C":"Over budget and ahead of schedule","D":"Under budget and ahead of schedule"},"answer":"A","why_right_html":"<p>CPI = EV / AC = 400 / 500 = 0.80, which is below 1, so the project is over budget. SPI = EV / PV = 400 / 450 ≈ 0.89, which is below 1, so it is behind schedule. PM² names these metrics (PM² 3.1 App. C.15, p. A-104), but the formulas are standard EVM (knowledge). The other options misread one or both indices.<\/p>","why_wrong":{"B":"The other options misread one or both indices.","C":"The other options misread one or both indices.","D":"The other options misread one or both indices."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>CPI = EV / AC = 400 / 500 = 0.80, which is below 1, so the project is over budget. SPI = EV / PV = 400 / 450 ≈ 0.89, which is below 1, so it is behind schedule. PM² names these metrics (PM² 3.1 App. C.15, p. A-104), but the formulas are standard EVM (knowledge). The other options misread one or both indices.<\/p>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"id":11,"batch":1,"duty":3,"duties":[3],"section":"Duty 3: monitoring cost and schedule","stem_html":"A work package has EV = 300, AC = 250 and PV = 350 (in person-days). What are its Cost Variance (CV) and Schedule Variance (SV)?","stem_text":"A work package has EV = 300, AC = 250 and PV = 350 (in person-days). What are its Cost Variance (CV) and Schedule Variance (SV)?","options":{"A":"CV = −50; SV = +50","B":"CV = +50; SV = +50","C":"CV = −50; SV = −50","D":"CV = +50; SV = −50"},"answer":"D","why_right_html":"<p>CV = EV − AC = 300 − 250 = +50, positive, so under budget. SV = EV − PV = 300 − 350 = −50, negative, so behind schedule (standard EVM, knowledge; metrics named in PM² 3.1 App. C.15).<\/p>","why_wrong":{"A":"A reverses the subtraction.","B":"B and C get one sign wrong.","C":"B and C get one sign wrong."},"why_wrong_shared":{"A":false,"B":true,"C":true},"full_html":"<p>CV = EV − AC = 300 − 250 = +50, positive, so under budget. SV = EV − PV = 300 − 350 = −50, negative, so behind schedule (standard EVM, knowledge; metrics named in PM² 3.1 App. C.15).<\/p><ul><li>A reverses the subtraction.<\/li><li>B and C get one sign wrong.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"id":12,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"According to the PM² Guide 3.1, how many Responsible (R) and Accountable (A) persons may there be for a given task in a RASCI matrix?","stem_text":"According to the PM² Guide 3.1, how many Responsible (R) and Accountable (A) persons may there be for a given task in a RASCI matrix?","options":{"A":"Several R, but just one A","B":"Just one R and just one A","C":"One R, and as many A as there are approving bodies","D":"Any number of R and A, as long as they are documented in the Project Handbook"},"answer":"B","why_right_html":"<p>PM² says of R, \"There is just one responsible person for any given task\", and of A, \"There is just one accountable person for any given task\" (PM² 3.1 §4.12, p.29).<\/p>","why_wrong":{"A":"A describes looser RACI practice elsewhere: it is the trap for candidates who know RACI but not PM².","C":"C and D are invented.","D":"C and D are invented."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>PM² says of R, \"There is just one responsible person for any given task\", and of A, \"There is just one accountable person for any given task\" (PM² 3.1 §4.12, p.29).<\/p><ul><li>A describes looser RACI practice elsewhere: it is the trap for candidates who know RACI but not PM².<\/li><li>C and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":13,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"In the PM² RASCI matrix, what distinguishes a \"Supports\" (S) role from a \"Consulted\" (C) role?","stem_text":"In the PM² RASCI matrix, what distinguishes a \"Supports\" (S) role from a \"Consulted\" (C) role?","options":{"A":"S roles are informed after a decision; C roles are informed before it.","B":"S roles approve the work; C roles carry it out.","C":"S roles come from the provider side; C roles come from the requestor side.","D":"S roles help complete the task; C roles give opinions in two-way communication but do not help complete it."},"answer":"D","why_right_html":"<p>PM² 3.1 §4.12 (p.29) defines Supports as roles that \"work with the person responsible. The support role helps complete the task.\" Consulted roles are \"those whose opinions are requested and with whom there is two-way communication. The consulted role does not help complete the task.\"<\/p>","why_wrong":{"A":"A confuses C with I (Informed).","B":"B gives S the A role.","C":"C invents a requestor/provider split."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>PM² 3.1 §4.12 (p.29) defines Supports as roles that \"work with the person responsible. The support role helps complete the task.\" Consulted roles are \"those whose opinions are requested and with whom there is two-way communication. The consulted role does not help complete the task.\"<\/p><ul><li>A confuses C with I (Informed).<\/li><li>B gives S the A role.<\/li><li>C invents a requestor/provider split.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":14,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"According to the Scrum Guide 2020, who has the authority to cancel a Sprint?","stem_text":"According to the Scrum Guide 2020, who has the authority to cancel a Sprint?","options":{"A":"The Scrum Master","B":"The Developers, by consensus","C":"The Product Owner","D":"The stakeholders, at the Sprint Review"},"answer":"C","why_right_html":"<p>\"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint\" (SG 2020, \"The Sprint\"). The other options name people the guide does not give this authority.<\/p>","why_wrong":{"A":"The other options name people the guide does not give this authority.","B":"The other options name people the guide does not give this authority.","D":"The other options name people the guide does not give this authority."},"why_wrong_shared":{"A":true,"B":true,"D":true},"full_html":"<p>\"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint\" (SG 2020, \"The Sprint\"). The other options name people the guide does not give this authority.<\/p>","knowledge_based":false,"frameworks":["Scrum"]},{"id":15,"batch":1,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"According to the Scrum Guide 2020, who is accountable for creating the Sprint Backlog?","stem_text":"According to the Scrum Guide 2020, who is accountable for creating the Sprint Backlog?","options":{"A":"The Developers","B":"The Product Owner","C":"The Scrum Master","D":"The whole Scrum Team together with key stakeholders"},"answer":"A","why_right_html":"<p>\"The Developers are always accountable for: creating a plan for the Sprint, the Sprint Backlog\" (SG 2020, \"Developers\"). It is \"a plan by and for the Developers\" (\"Sprint Backlog\").<\/p>","why_wrong":{"B":"B: the PO is accountable for the Product Backlog, not the Sprint Backlog.","C":"C: the Scrum Master is accountable for the team's effectiveness.","D":"D adds stakeholders."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"The Developers are always accountable for: creating a plan for the Sprint, the Sprint Backlog\" (SG 2020, \"Developers\"). It is \"a plan by and for the Developers\" (\"Sprint Backlog\").<\/p><ul><li>B: the PO is accountable for the Product Backlog, not the Sprint Backlog.<\/li><li>C: the Scrum Master is accountable for the team's effectiveness.<\/li><li>D adds stakeholders.<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"id":16,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"In PM², who chairs the Project Steering Committee?","stem_text":"In PM², who chairs the Project Steering Committee?","options":{"A":"The Project Manager","B":"The Project Owner","C":"The Solution Provider","D":"A representative of the Appropriate Governance Body"},"answer":"B","why_right_html":"<p>The PSC \"is chaired by the Project Owner (PO)\" (PM² 3.1 §4.4, p.24); the PO's responsibilities include \"Chairs the Project Steering Committee\" (§4.5, p.25).<\/p>","why_wrong":{"A":"A: the PM sits on the PSC as one of the four permanent roles, but does not chair it.","C":"C and D are wrong: the guide gives the chair to the PO only.","D":"C and D are wrong: the guide gives the chair to the PO only."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>The PSC \"is chaired by the Project Owner (PO)\" (PM² 3.1 §4.4, p.24); the PO's responsibilities include \"Chairs the Project Steering Committee\" (§4.5, p.25).<\/p><ul><li>A: the PM sits on the PSC as one of the four permanent roles, but does not chair it.<\/li><li>C and D are wrong: the guide gives the chair to the PO only.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":17,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"In PM², which body has the authority to approve a project, agree its stated objective and release the funding required to implement it?","stem_text":"In PM², which body has the authority to approve a project, agree its stated objective and release the funding required to implement it?","options":{"A":"The Appropriate Governance Body (AGB)","B":"The Project Steering Committee (PSC)","C":"The Project Support Office (PSO)","D":"The Business Implementation Group (BIG)"},"answer":"A","why_right_html":"<p>The AGB \"is the body with the authority to approve a project, agree its stated objective and release the funding required to implement it\" (PM² 3.1 §4.3, p.24).<\/p>","why_wrong":{"B":"B: the PSC is the project's key decision-making and issue-resolution body, but it does not release funding.","C":"C: the PSO gives administrative support.","D":"D: the BIG implements business change."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The AGB \"is the body with the authority to approve a project, agree its stated objective and release the funding required to implement it\" (PM² 3.1 §4.3, p.24).<\/p><ul><li>B: the PSC is the project's key decision-making and issue-resolution body, but it does not release funding.<\/li><li>C: the PSO gives administrative support.<\/li><li>D: the BIG implements business change.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":18,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"In the PM² Stakeholder Interest/Influence Matrix (SIIM), how is a stakeholder's \"interest\" measured?","stem_text":"In the PM² Stakeholder Interest/Influence Matrix (SIIM), how is a stakeholder's \"interest\" measured?","options":{"A":"By the stakeholder's power to decide on project funding and resources","B":"By how often the stakeholder must receive project reports","C":"By the degree of enthusiasm the stakeholder displays in support of the project, which may be positive, neutral or negative","D":"By the stakeholder's position in the organisation's hierarchy"},"answer":"C","why_right_html":"<p>Interest \"is measured as the degree of enthusiasm displayed by the stakeholder in support of the project. Stakeholders can be positive, neutral or negative towards the project\" (PM² 3.1 App. C.3, p. A-101).<\/p><ul><li>This differs from the usual power/interest grid, where interest means how much the stakeholder is affected or concerned. That makes it a likely trap.<\/li><\/ul>","why_wrong":{"A":"A describes influence, the other axis of the matrix.","B":"B and D are not in the guide.","D":"B and D are not in the guide."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>Interest \"is measured as the degree of enthusiasm displayed by the stakeholder in support of the project. Stakeholders can be positive, neutral or negative towards the project\" (PM² 3.1 App. C.3, p. A-101).<\/p><ul><li>A describes influence, the other axis of the matrix.<\/li><li>B and D are not in the guide.<\/li><li>This differs from the usual power/interest grid, where interest means how much the stakeholder is affected or concerned. That makes it a likely trap.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":19,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"In PM², who prepares the Project Stakeholder Matrix, and who assists, particularly with identifying stakeholders on the client side?","stem_text":"In PM², who prepares the Project Stakeholder Matrix, and who assists, particularly with identifying stakeholders on the client side?","options":{"A":"The Business Manager prepares it; the Project Manager assists.","B":"The Project Manager prepares it; the Business Manager assists.","C":"The Project Owner prepares it; the Project Support Office assists.","D":"The Project Support Office prepares it; the Project Owner assists."},"answer":"B","why_right_html":"<p>For the Project Stakeholder Matrix, the \"Project Manager (PM): Prepares\", and the \"Business Manager (BM): Assists the Project Manager (PM), particularly with the identification of stakeholders on the client side\" (PM² 3.1 §6.3, p.44). The other options reverse or reassign the roles.<\/p>","why_wrong":{"A":"The other options reverse or reassign the roles.","C":"The other options reverse or reassign the roles.","D":"The other options reverse or reassign the roles."},"why_wrong_shared":{"A":true,"C":true,"D":true},"full_html":"<p>For the Project Stakeholder Matrix, the \"Project Manager (PM): Prepares\", and the \"Business Manager (BM): Assists the Project Manager (PM), particularly with the identification of stakeholders on the client side\" (PM² 3.1 §6.3, p.44). The other options reverse or reassign the roles.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"id":20,"batch":1,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"In PM², who appoints the Project Manager?","stem_text":"In PM², who appoints the Project Manager?","options":{"A":"The Project Owner","B":"The Business Manager","C":"The Project Steering Committee","D":"The Solution Provider"},"answer":"D","why_right_html":"<p>The Solution Provider \"mobilises the required resources from the provider side and appoints the Project Manager (PM)\" (PM² 3.1 §4.6, p.26).<\/p>","why_wrong":{"A":"A: the PO is the requestor-side Directing role and leads the BM and PM strategically, but does not appoint the PM.","B":"B and C are not given this power.","C":"B and C are not given this power."},"why_wrong_shared":{"A":false,"B":true,"C":true},"full_html":"<p>The Solution Provider \"mobilises the required resources from the provider side and appoints the Project Manager (PM)\" (PM² 3.1 §4.6, p.26).<\/p><ul><li>A: the PO is the requestor-side Directing role and leads the BM and PM strategically, but does not appoint the PM.<\/li><li>B and C are not given this power.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":21,"batch":1,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"In PM², which role coordinates the Business Implementation Group and acts as the liaison between the User Representatives and the provider organisation?","stem_text":"In PM², which role coordinates the Business Implementation Group and acts as the liaison between the User Representatives and the provider organisation?","options":{"A":"The Project Manager","B":"The Solution Provider","C":"The Business Manager","D":"The Contractor's Project Manager"},"answer":"C","why_right_html":"<p>The Business Manager \"coordinates the Business Implementation Group (BIG) and acts as a liaison between the User Representatives (URs) and the provider organisation\" (PM² 3.1 §4.7, p.26).<\/p>","why_wrong":{"A":"A: the PM liaises between the Directing and Performing Layers.","B":"B: the SP is the provider-side Directing role.","D":"D: the Contractor's Project Manager is responsible for the outsourced parts."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The Business Manager \"coordinates the Business Implementation Group (BIG) and acts as a liaison between the User Representatives (URs) and the provider organisation\" (PM² 3.1 §4.7, p.26).<\/p><ul><li>A: the PM liaises between the Directing and Performing Layers.<\/li><li>B: the SP is the provider-side Directing role.<\/li><li>D: the Contractor's Project Manager is responsible for the outsourced parts.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":22,"batch":1,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"A directorate-general rolls out a new electronic case-handling system (1). Staff then handle files online instead of on paper (2). As a result, the average handling time per file falls by 25% (3). In PM² terms, what are (1), (2) and (3)?","stem_text":"A directorate-general rolls out a new electronic case-handling system (1). Staff then handle files online instead of on paper (2). As a result, the average handling time per file falls by 25% (3). In PM² terms, what are (1), (2) and (3)?","options":{"A":"Output, outcome, benefit","B":"Outcome, output, benefit","C":"Output, benefit, outcome","D":"Benefit, outcome, output"},"answer":"A","why_right_html":"<p>\"Project outputs (deliverables) are products/services, which introduce something new (a change). The change results in an outcome. The benefits are the measurable improvements resulting from this outcome\" (PM² 3.1 §2.1.3, p.6). Here the system is the output, the new way of working is the outcome, and the 25% fall is the measurable benefit. The other options shuffle the order.<\/p>","why_wrong":{"B":"The other options shuffle the order.","C":"The other options shuffle the order.","D":"The other options shuffle the order."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>\"Project outputs (deliverables) are products/services, which introduce something new (a change). The change results in an outcome. The benefits are the measurable improvements resulting from this outcome\" (PM² 3.1 §2.1.3, p.6). Here the system is the output, the new way of working is the outcome, and the 25% fall is the measurable benefit. The other options shuffle the order.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"id":23,"batch":1,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"According to the PM² Guide, when are project outcomes and benefits often realised?","stem_text":"According to the PM² Guide, when are project outcomes and benefits often realised?","options":{"A":"At each deliverable acceptance during the Executing Phase","B":"Only after the project has closed","C":"At the RfC (Ready for Closing) phase gate","D":"Once the Project Work Plan has been baselined"},"answer":"B","why_right_html":"<p>\"Note that project outcomes and benefits are often realised only after the project has closed\" (PM² 3.1 §2.1.3, p.6).<\/p>","why_wrong":{"A":"A and C tie benefits to delivery milestones. None of those matches the guide.","C":"A and C tie benefits to delivery milestones. None of those matches the guide.","D":"D ties them to planning. None of those matches the guide."},"why_wrong_shared":{"A":true,"C":true,"D":false},"full_html":"<p>\"Note that project outcomes and benefits are often realised only after the project has closed\" (PM² 3.1 §2.1.3, p.6).<\/p><ul><li>A and C tie benefits to delivery milestones.<\/li><li>D ties them to planning.<\/li><li>None of those matches the guide.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":24,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"In PM², who is accountable for carrying out all Quality Assurance activities?","stem_text":"In PM², who is accountable for carrying out all Quality Assurance activities?","options":{"A":"The Project Quality Assurance (PQA) role","B":"The Project Core Team","C":"The Project Owner","D":"The Project Manager"},"answer":"D","why_right_html":"<p>For Quality Assurance, the \"Project Manager (PM): Accountable for carrying out all Quality Assurance activities\". The RASCI for this activity shows the PM as A and the PCT as R (PM² 3.1 §7.3, p.58).<\/p>","why_wrong":{"A":"A is the trap: the PQA \"establishes Quality Assurance standards and reviews project outputs and deliverables\", but it is not accountable.","B":"B: the PCT carries out the work and adheres to the standards.","C":"C: the PO is only Informed."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>For Quality Assurance, the \"Project Manager (PM): Accountable for carrying out all Quality Assurance activities\". The RASCI for this activity shows the PM as A and the PCT as R (PM² 3.1 §7.3, p.58).<\/p><ul><li>A is the trap: the PQA \"establishes Quality Assurance standards and reviews project outputs and deliverables\", but it is not accountable.<\/li><li>B: the PCT carries out the work and adheres to the standards.<\/li><li>C: the PO is only Informed.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":25,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"Which statement best describes Quality Assurance as defined in the PM² Guide?","stem_text":"Which statement best describes Quality Assurance as defined in the PM² Guide?","options":{"A":"Inspecting each deliverable against its acceptance criteria to accept or reject it","B":"Gathering evidence that the project work follows high-quality standards, methodologies and best practices, including whether appropriate project controls are in place and effective","C":"Correcting the defects found during testing before the RfC gate","D":"The Project Owner's formal acceptance of the project's deliverables"},"answer":"B","why_right_html":"<p>\"Quality Assurance is the activity of gathering evidence that proves the project work is following high-quality standards, methodologies and best practices\"; it includes \"determining whether appropriate project controls are in place, confirming that they are being implemented and assessing their effectiveness\" (PM² 3.1 §7.3, p.58).<\/p>","why_wrong":{"A":"A describes quality control and acceptance (§9.9–9.10).","C":"C is corrective action.","D":"D is formal acceptance by the PO (§9.10)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Quality Assurance is the activity of gathering evidence that proves the project work is following high-quality standards, methodologies and best practices\"; it includes \"determining whether appropriate project controls are in place, confirming that they are being implemented and assessing their effectiveness\" (PM² 3.1 §7.3, p.58).<\/p><ul><li>A describes quality control and acceptance (§9.9–9.10).<\/li><li>C is corrective action.<\/li><li>D is formal acceptance by the PO (§9.10).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":26,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"During acceptance testing in a PM² project, a deliverable shows a small set of known, non-critical defects. Can it be accepted?","stem_text":"During acceptance testing in a PM² project, a deliverable shows a small set of known, non-critical defects. Can it be accepted?","options":{"A":"No; under PM², a deliverable with known defects can never be accepted.","B":"Yes, if the Project Manager decides that the defects are minor.","C":"Yes, conditionally, if the defects are documented and there is a plan in place for addressing them.","D":"Only if the contract provides for financial penalties for the defects."},"answer":"C","why_right_html":"<p>\"Project deliverables can be conditionally accepted, even with a set of known defects or issues, if these are documented and if there is a plan in place for addressing them\" (PM² 3.1 §9.10, step 3, p.81).<\/p>","why_wrong":{"A":"A contradicts this.","B":"B: formal acceptance is the PO's, not the PM's.","D":"D is invented."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"Project deliverables can be conditionally accepted, even with a set of known defects or issues, if these are documented and if there is a plan in place for addressing them\" (PM² 3.1 §9.10, step 3, p.81).<\/p><ul><li>A contradicts this.<\/li><li>B: formal acceptance is the PO's, not the PM's.<\/li><li>D is invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":27,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"In PM², who approves the Deliverables Acceptance Plan, and who formally accepts the project's deliverables?","stem_text":"In PM², who approves the Deliverables Acceptance Plan, and who formally accepts the project's deliverables?","options":{"A":"The Project Steering Committee approves the plan; the Project Owner formally accepts the deliverables.","B":"The Project Owner approves the plan; the Project Steering Committee formally accepts the deliverables.","C":"The Business Manager approves the plan; the Project Manager formally accepts the deliverables.","D":"The Project Quality Assurance role approves the plan; the Business Manager formally accepts the deliverables."},"answer":"A","why_right_html":"<p>The PSC \"approves the Deliverables Acceptance Plan\" (PM² 3.1 §6.6, p.49). The PO \"provides final acceptance of the project's deliverables\" and \"formally accepts\" them (§9.10, p.81).<\/p>","why_wrong":{"B":"B reverses the two roles.","C":"C and D: the BM reviews and validates the acceptance requirements and provides resources for user acceptance, and the PQA performs most of the quality controls. Neither approves the plan or gives formal acceptance.","D":"C and D: the BM reviews and validates the acceptance requirements and provides resources for user acceptance, and the PQA performs most of the quality controls. Neither approves the plan or gives formal acceptance."},"why_wrong_shared":{"B":false,"C":true,"D":true},"full_html":"<p>The PSC \"approves the Deliverables Acceptance Plan\" (PM² 3.1 §6.6, p.49). The PO \"provides final acceptance of the project's deliverables\" and \"formally accepts\" them (§9.10, p.81).<\/p><ul><li>B reverses the two roles.<\/li><li>C and D: the BM reviews and validates the acceptance requirements and provides resources for user acceptance, and the PQA performs most of the quality controls. Neither approves the plan or gives formal acceptance.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":28,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"At the end of a Sprint, one Product Backlog item does not meet the Definition of Done. According to the Scrum Guide 2020, what happens to it?","stem_text":"At the end of a Sprint, one Product Backlog item does not meet the Definition of Done. According to the Scrum Guide 2020, what happens to it?","options":{"A":"It is presented at the Sprint Review and marked as incomplete.","B":"It may be released if the Product Owner accepts it.","C":"It is carried over automatically into the next Sprint Backlog.","D":"It cannot be released or even presented at the Sprint Review; it returns to the Product Backlog."},"answer":"D","why_right_html":"<p>\"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration\" (SG 2020, \"Commitment: Definition of Done\").<\/p>","why_wrong":{"A":"A and B contradict this directly.","B":"A and B contradict this directly.","C":"C: nothing is carried over automatically; the item goes back to the Product Backlog."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>\"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration\" (SG 2020, \"Commitment: Definition of Done\").<\/p><ul><li>A and B contradict this directly.<\/li><li>C: nothing is carried over automatically; the item goes back to the Product Backlog.<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"id":29,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"Which statement about the Daily Scrum is correct, according to the Scrum Guide 2020?","stem_text":"Which statement about the Daily Scrum is correct, according to the Scrum Guide 2020?","options":{"A":"It is a 15-minute event for the whole Scrum Team and its stakeholders.","B":"It is a 30-minute event facilitated by the Scrum Master for all team members.","C":"It is a 15-minute event for the Developers of the Scrum Team.","D":"It is timeboxed to one hour for a one-month Sprint, and shorter for shorter Sprints."},"answer":"C","why_right_html":"<p>\"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team.\" The PO and Scrum Master take part as Developers only if they are actively working on Sprint Backlog items (SG 2020, \"Daily Scrum\").<\/p>","why_wrong":{"A":"A adds stakeholders.","B":"B gets the timebox and the purpose wrong.","D":"D confuses it with the longer events, such as Sprint Planning (up to eight hours for a one-month Sprint)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team.\" The PO and Scrum Master take part as Developers only if they are actively working on Sprint Backlog items (SG 2020, \"Daily Scrum\").<\/p><ul><li>A adds stakeholders.<\/li><li>B gets the timebox and the purpose wrong.<\/li><li>D confuses it with the longer events, such as Sprint Planning (up to eight hours for a one-month Sprint).<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"id":30,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 170 of the Financial Regulation (EU, Euratom) 2024/2509, the most economically advantageous tender consists in one of three award methods. Which are they?","stem_text":"Under Article 170 of the Financial Regulation (EU, Euratom) 2024/2509, the most economically advantageous tender consists in one of three award methods. Which are they?","options":{"A":"Lowest price, highest technical score or best value for money","B":"Lowest price, lowest cost or best price-quality ratio","C":"Lowest cost, life-cycle cost or highest quality","D":"Lowest price, best quality or shortest delivery time"},"answer":"B","why_right_html":"<p>\"The most economically advantageous tender, which shall consist in one of three award methods: lowest price, lowest cost or best price-quality ratio\" (FR Art. 170(4)). Lowest cost uses a cost-effectiveness approach including life-cycle costing. The other options mix award methods with quality criteria (Annex I point 21.1) or with invented methods.<\/p>","why_wrong":{"A":"The other options mix award methods with quality criteria (Annex I point 21.1) or with invented methods.","C":"The other options mix award methods with quality criteria (Annex I point 21.1) or with invented methods.","D":"The other options mix award methods with quality criteria (Annex I point 21.1) or with invented methods."},"why_wrong_shared":{"A":true,"C":true,"D":true},"full_html":"<p>\"The most economically advantageous tender, which shall consist in one of three award methods: lowest price, lowest cost or best price-quality ratio\" (FR Art. 170(4)). Lowest cost uses a cost-effectiveness approach including life-cycle costing. The other options mix award methods with quality criteria (Annex I point 21.1) or with invented methods.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"id":31,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under the Financial Regulation, what is the maximum duration of a framework contract, save in exceptional cases duly justified in particular by its subject matter?","stem_text":"Under the Financial Regulation, what is the maximum duration of a framework contract, save in exceptional cases duly justified in particular by its subject matter?","options":{"A":"Two years","B":"Three years","C":"Seven years","D":"Four years"},"answer":"D","why_right_html":"<p>\"The duration of a framework contract shall not exceed four years, save in exceptional cases duly justified in particular by the subject matter of the framework contract\" (FR Annex I point 1.1). The other durations are not in the Regulation.<\/p>","why_wrong":{"A":"The other durations are not in the Regulation.","B":"The other durations are not in the Regulation.","C":"The other durations are not in the Regulation."},"why_wrong_shared":{"A":true,"B":true,"C":true},"full_html":"<p>\"The duration of a framework contract shall not exceed four years, save in exceptional cases duly justified in particular by the subject matter of the framework contract\" (FR Annex I point 1.1). The other durations are not in the Regulation.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"id":32,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"An institution concludes a framework contract without reopening of competition for ICT equipment, a sector subject to rapid price and technological evolution. What must that framework contract contain, under Annex I to the Financial Regulation?","stem_text":"An institution concludes a framework contract without reopening of competition for ICT equipment, a sector subject to rapid price and technological evolution. What must that framework contract contain, under Annex I to the Financial Regulation?","options":{"A":"A clause on either a mid-term review or a benchmarking system","B":"A clause allowing the contracting authority to terminate it after one year without notice","C":"A requirement to reopen competition every six months","D":"A price-indexation clause tied to the consumer price index"},"answer":"A","why_right_html":"<p>\"In sectors subject to a rapid price and technological evolution, framework contracts without reopening of competition shall contain a clause either on a mid-term review or on a benchmarking system\" (FR Annex I point 1.5). This rule is especially relevant to ICT. B, C and D are not in the Regulation.<\/p>","why_wrong":{"B":"B, C and D are not in the Regulation.","C":"B, C and D are not in the Regulation.","D":"B, C and D are not in the Regulation."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>\"In sectors subject to a rapid price and technological evolution, framework contracts without reopening of competition shall contain a clause either on a mid-term review or on a benchmarking system\" (FR Annex I point 1.5). This rule is especially relevant to ICT. B, C and D are not in the Regulation.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"id":33,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 170(2) of the Financial Regulation, what may selection criteria relate to?","stem_text":"Under Article 170(2) of the Financial Regulation, what may selection criteria relate to?","options":{"A":"Price, quality and delivery time","B":"Absence of exclusion situations, such as bankruptcy or grave professional misconduct","C":"Only legal and regulatory capacity to pursue the professional activity, economic and financial capacity, and technical and professional capacity","D":"The technical merit of the solution proposed in the tender"},"answer":"C","why_right_html":"<p>\"Selection criteria shall only relate to the legal and regulatory capacity to pursue the professional activity, the economic and financial capacity, and the technical and professional capacity\" (FR Art. 170(2)).<\/p><ul><li>This \"selection is about the tenderer, award is about the tender\" distinction is a classic exam point.<\/li><\/ul>","why_wrong":{"A":"A and D are award criteria, which evaluate the tender rather than the tenderer (Art. 170(3); Annex I point 21).","B":"B describes exclusion, which is a separate check under Art. 138.","D":"A and D are award criteria, which evaluate the tender rather than the tenderer (Art. 170(3); Annex I point 21)."},"why_wrong_shared":{"A":true,"B":false,"D":true},"full_html":"<p>\"Selection criteria shall only relate to the legal and regulatory capacity to pursue the professional activity, the economic and financial capacity, and the technical and professional capacity\" (FR Art. 170(2)).<\/p><ul><li>A and D are award criteria, which evaluate the tender rather than the tenderer (Art. 170(3); Annex I point 21).<\/li><li>B describes exclusion, which is a separate check under Art. 138.<\/li><li>This \"selection is about the tenderer, award is about the tender\" distinction is a classic exam point.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"id":34,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"In an open procedure, the tender with the best price-quality ratio comes from an economic operator found to be in an exclusion situation under Article 138 of the Financial Regulation. What follows?","stem_text":"In an open procedure, the tender with the best price-quality ratio comes from an economic operator found to be in an exclusion situation under Article 138 of the Financial Regulation. What follows?","options":{"A":"The contract is awarded to that tenderer, because award criteria prevail once tenders are ranked.","B":"The contract cannot be awarded to that tenderer: award criteria apply only once the authority has verified that the tenderer is not excluded and meets the selection criteria.","C":"The contract is awarded to that tenderer on condition that it lodges a performance guarantee.","D":"The procedure must be cancelled and relaunched."},"answer":"B","why_right_html":"<p>Contracts are awarded on the basis of award criteria \"provided that the contracting authority has verified\" that the tenderer \"is not excluded under Article 138\" and \"meets the selection criteria\" (FR Art. 170(1)(b)–(c)).<\/p>","why_wrong":{"A":"A reverses the logic.","C":"C: a performance guarantee (Art. 176) does not cure exclusion.","D":"D: there is no rule that the procedure must be cancelled. The authority can move to the next tender in the ranking. Annex I point 36.1 says that where a contract cannot be signed with the successful tenderer, it may be awarded \"to the following best tenderer\"."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Contracts are awarded on the basis of award criteria \"provided that the contracting authority has verified\" that the tenderer \"is not excluded under Article 138\" and \"meets the selection criteria\" (FR Art. 170(1)(b)–(c)).<\/p><ul><li>A reverses the logic.<\/li><li>C: a performance guarantee (Art. 176) does not cure exclusion.<\/li><li>D: there is no rule that the procedure must be cancelled. The authority can move to the next tender in the ranking. Annex I point 36.1 says that where a contract cannot be signed with the successful tenderer, it may be awarded \"to the following best tenderer\".<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"id":35,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"In PM², who prepares the Outsourcing Plan, and who reviews it?","stem_text":"In PM², who prepares the Outsourcing Plan, and who reviews it?","options":{"A":"The Business Manager prepares it; the Project Owner reviews it.","B":"The Solution Provider prepares it; the Project Steering Committee reviews it.","C":"The Contractor's Project Manager prepares it; the Project Manager reviews it.","D":"The Project Manager prepares it; the Solution Provider reviews it."},"answer":"D","why_right_html":"<p>For the Outsourcing Plan, the \"Project Manager (PM): Prepares the Outsourcing Plan\", and the \"Solution Provider (SP): Reviews the plan\" (PM² 3.1 §6.5, p.48).<\/p>","why_wrong":{"A":"A and B misassign the roles.","B":"A and B misassign
