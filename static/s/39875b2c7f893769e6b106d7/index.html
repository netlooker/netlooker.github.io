ervices in cloud computing environments or hosted by third parties\" (Art. 6(2)).<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"bank":"v2","key":"v2-89","id":89,"topic":89,"type":"scenario","word_count":108,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"<p>During the Closing Phase of a project in an EU agency, the Project Manager, Ana, drafts the Project-End Report. The project was six weeks late. One user told Ana informally that the contractor's developers were often unavailable, and Ana plans to write that the contractor alone caused the delay. She has not checked the Issue Log, the Change Log or the contractor's time records, which show that two approved change requests also added four weeks. No one has put pressure on her, and she has no personal link to the contractor.<\/p><p>Which element of the PM² Code of Professional Conduct does Ana's approach MOST directly fail to respect?<\/p>","stem_text":"During the Closing Phase of a project in an EU agency, the Project Manager, Ana, drafts the Project-End Report. The project was six weeks late. One user told Ana informally that the contractor's developers were often unavailable, and Ana plans to write that the contractor alone caused the delay. She has not checked the Issue Log, the Change Log or the contractor's time records, which show that two approved change requests also added four weeks. No one has put pressure on her, and she has no personal link to the contractor. Which element of the PM² Code of Professional Conduct does Ana's approach MOST directly fail to respect?","options":{"A":"Independence, because her decisions must serve the public interest and not private or political interests","B":"Objectivity, because her conclusions must be balanced and based on a thorough analysis of the facts","C":"Loyalty, because her report must protect the organisation's reputation in its relations with contractors","D":"Honesty and openness, because she must declare any private interest before drafting the report"},"answer":"B","why_right_html":"<p>\"OBJECTIVITY: any conclusions drawn by staff as part of the project work should be balanced and based on a thorough analysis of the facts and legal background\" (PM² 3.1 App. F.1, p. A-118). Ana draws a conclusion from one informal remark without checking the logs, which point to another cause.<\/p>","why_wrong":{"A":"A: independence concerns decisions driven by other interests, \"whether private or as a result of, for example, political pressure\" (App. F.1). The stem rules out both.","C":"C: PM² describes loyalty towards the organisation as essential \"for maintaining its independence and achieving its objectives\" (App. F.1). It is not about protecting reputation, and the report's reliability is not a loyalty question.","D":"D: the value \"HONESTY and OPENESS\" is about declaring private interests and giving reasons for decisions (App. F.1; spelling as in the guide). Ana has no private interest to declare."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"OBJECTIVITY: any conclusions drawn by staff as part of the project work should be balanced and based on a thorough analysis of the facts and legal background\" (PM² 3.1 App. F.1, p. A-118). Ana draws a conclusion from one informal remark without checking the logs, which point to another cause.<\/p><ul><li>A: independence concerns decisions driven by other interests, \"whether private or as a result of, for example, political pressure\" (App. F.1). The stem rules out both.<\/li><li>C: PM² describes loyalty towards the organisation as essential \"for maintaining its independence and achieving its objectives\" (App. F.1). It is not about protecting reputation, and the report's reliability is not a loyalty question.<\/li><li>D: the value \"HONESTY and OPENESS\" is about declaring private interests and giving reasons for decisions (App. F.1; spelling as in the guide). Ana has no private interest to declare.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-90","id":90,"topic":90,"type":"long","word_count":164,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"<p>Marta, a project manager in a Directorate-General and an official covered by the Staff Regulations, is appointed to the evaluation committee for an open procedure for ICT development services. During the evaluation, she reads the CVs proposed by one tenderer and finds that its lead architect is her brother-in-law. She has had no contact with him about the tender, and she is sure that she can judge the tender fairly.<\/p><p>Two colleagues on the committee give her advice. The first suggests that she simply gives that tender average scores on every criterion, so that her family link cannot affect the ranking. The second suggests that she mentions the link informally to her Head of Unit and continues if he agrees. Marta wants to act in line with the ethical principles of PM² and with the rules that apply to evaluation committee members.<\/p><p>Which course of action is in line with both the PM² Code of Professional Conduct and Article 61 of the Financial Regulation?<\/p>","stem_text":"Marta, a project manager in a Directorate-General and an official covered by the Staff Regulations, is appointed to the evaluation committee for an open procedure for ICT development services. During the evaluation, she reads the CVs proposed by one tenderer and finds that its lead architect is her brother-in-law. She has had no contact with him about the tender, and she is sure that she can judge the tender fairly. Two colleagues on the committee give her advice. The first suggests that she simply gives that tender average scores on every criterion, so that her family link cannot affect the ranking. The second suggests that she mentions the link informally to her Head of Unit and continues if he agrees. Marta wants to act in line with the ethical principles of PM² and with the rules that apply to evaluation committee members. Which course of action is in line with both the PM² Code of Professional Conduct and Article 61 of the Financial Regulation?","options":{"A":"Stay on the committee and give that tender average scores, so that her family link cannot affect the ranking","B":"Tell her Head of Unit as hierarchical superior, and continue evaluating if he agrees orally that there is no problem","C":"Declare the interest and refer it to the authorising officer by delegation for a decision in writing","D":"Ask the tenderer to replace the lead architect with another expert, so that the conflict disappears before the ranking"},"answer":"C","why_right_html":"<p>FR Art. 61(2): where there is a risk of a conflict of interests for staff covered by the Staff Regulations, \"the person in question shall refer the matter to the relevant authorising officer by delegation\", who \"shall confirm in writing whether a conflict of interests is found to exist\". A family link is one of the listed reasons (Art. 61(3)), and evaluation committee members \"shall comply with Article 61\" (Art. 153(5)). PM² asks the same in its values: \"declare any private interests\" (PM² 3.1 App. F.1, p. A-118), and its principle of impartiality requires staff to be \"unbiased in any decisions they are called upon to make\" (App. F.1).<\/p><ul><li>Tip: being sure that you can judge fairly does not remove the duty. Art. 61(3) covers situations where impartial and objective work \"is compromised\", and Art. 61(1) also covers situations that \"may objectively be perceived as a conflict of interests\".<\/li><\/ul>","why_wrong":{"A":"A: average scores are still a decision shaped by the family link, so they breach impartiality. They also distort the evaluation, and the risk is never referred as Art. 61(2) requires.","B":"B: the agreement is oral and informal, but Art. 61(2) requires a written confirmation of whether a conflict of interests exists. Referral to the hierarchical superior is the route for staff of a national authority; for staff covered by the Staff Regulations the matter goes to the authorising officer by delegation (Art. 61(2)).","D":"D: an evaluator should not contact a tenderer to change its tender. Nothing in Art. 61 allows this, and it would break equal treatment of tenderers (my judgement of standard procurement practice)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>FR Art. 61(2): where there is a risk of a conflict of interests for staff covered by the Staff Regulations, \"the person in question shall refer the matter to the relevant authorising officer by delegation\", who \"shall confirm in writing whether a conflict of interests is found to exist\". A family link is one of the listed reasons (Art. 61(3)), and evaluation committee members \"shall comply with Article 61\" (Art. 153(5)). PM² asks the same in its values: \"declare any private interests\" (PM² 3.1 App. F.1, p. A-118), and its principle of impartiality requires staff to be \"unbiased in any decisions they are called upon to make\" (App. F.1).<\/p><ul><li>A: average scores are still a decision shaped by the family link, so they breach impartiality. They also distort the evaluation, and the risk is never referred as Art. 61(2) requires.<\/li><li>B: the agreement is oral and informal, but Art. 61(2) requires a written confirmation of whether a conflict of interests exists. Referral to the hierarchical superior is the route for staff of a national authority; for staff covered by the Staff Regulations the matter goes to the authorising officer by delegation (Art. 61(2)).<\/li><li>D: an evaluator should not contact a tenderer to change its tender. Nothing in Art. 61 allows this, and it would break equal treatment of tenderers (my judgement of standard procurement practice).<\/li><li>Tip: being sure that you can judge fairly does not remove the duty. Art. 61(3) covers situations where impartial and objective work \"is compromised\", and Art. 61(1) also covers situations that \"may objectively be perceived as a conflict of interests\".<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²","FR"]}]}</script>
<script id="eufte-data" type="application/json">{"schema":2,"model":{"source":"eufte/model-essay.md","title":"Annotated model essay – assignment M","intro":"**Written by your trainer on 2026-11-23 for practice. Assignment M is not a real or past EPSO task, and the answer is not an EPSO model answer.** It shows one way to meet EPSO's five anchors (https://eu-careers.europa.eu/en/help/what-written-test, retrieved 2026-11-22). The notes on why each part is there are my judgement. Assignment M deliberately uses a topic that none of the practice assignments A–H covers, so reading it spoils none of them. About 400 words, which is realistic for 40 minutes in my judgement; no word limit has been published.","assignment":[{"type":"p","text":"You are the local cybersecurity officer of a fictional EU agency with about 250 staff."},{"type":"p","text":"Since last month, all staff must use multifactor authentication (MFA) to log in to the agency's systems. The ICT unit has also blocked a free online file-sharing service that the Grants Unit used to exchange documents with external experts."},{"type":"p","text":"The Head of the Grants Unit, Anna Ferreira, has e-mailed you: \"My unit is evaluating 300 grant applications with a legal deadline at the end of next month. The new login procedure and the blocked file-sharing tool are slowing us down badly. Who decided this, and on what basis? Can my unit be exempted?\""},{"type":"p","text":"Write a reply to Ms Ferreira."}],"plan":"Reader: Head of Grants Unit, non-specialist, annoyed, under deadline pressure\nPurpose: explain + say no to exemption + keep her on side (solve her problem)\nFormat: e-mail reply\nAsked for: 1) who decided  2) on what basis  3) exemption?  [implied: 4) her deadline]\n\n1 Bottom line: rules come from EU regulation; no exemption; we can remove most of the delay this week\n2 Who + basis: Reg 2023/2841; Framework under top mgmt (Art 6(1), 6(5)); MFA as a norm (8(3)(c)); cloud + suppliers (8(2)(c), (m)); contracts (8(3)(k))\n3 Why it matters for grants: rec. 4 attractive targets; rec. 3 cascade; applicants' data\n4 Exemption: no - \"as a norm\" across systems; management accountable (6(5)); fits her risk too\n5 Offer: MFA set-up help; approved sharing tool for experts; priority if deadline at risk\n6 Close: me = single point of contact (6(8)); contact details","planWhy":"The first four lines are the method's \"read the task\" step (eufte/method.md): reader, purpose, format and a checklist of what is asked. \"Implied: her deadline\" matters: she did not ask for help in words, but her real problem is the deadline, and a reply that ignores it fails on audience and purpose. The numbered lines are the skeleton: each became the first sentence of a paragraph. This block was typed into the answer box and deleted in the last five minutes.","segments":[{"label":"Subject line","blocks":[{"type":"p","text":"Subject: MFA and the file-sharing tool – why they apply, and how we can protect your deadline"}],"why":"The subject line names both of her concerns and promises a solution. She knows before opening it that the reply is about her problem, not a policy lecture.","anchors":[3,4],"weaker":"Subject: RE: Complaint"},{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Ferreira,"},{"type":"p","text":"Thank you for raising this before it affects your evaluations. In short: both measures follow from an EU regulation that binds the agency, so I cannot exempt your unit. However, we can remove most of the delay this week, and I set out below how."}],"why":"The answer to her direct question (\"Can my unit be exempted?\") comes in the first paragraph, together with the help on offer. A busy, annoyed reader needs the bottom line first. If she reads only this, she knows where she stands. The first sentence acknowledges her concern without apologising for the rules.","anchors":[1,4],"weaker":"I refer to your e-mail of yesterday concerning the recently introduced security measures. Cybersecurity has become a major challenge for all organisations, and the EU institutions are no exception."},{"label":"Who decided, and on what basis","blocks":[{"type":"p","text":"The measures implement Regulation (EU, Euratom) 2023/2841, which requires every EU institution, body and agency to manage its cybersecurity risks through an internal framework, established under the responsibility of its highest level of management (Article 6(1) and (5)) – in our case, the Executive Director. Among the measures the Regulation lists is \"the use of multifactor authentication as a norm across network and information systems\" (Article 8(3)(c)). It also requires a policy on the use of cloud services and attention to the security of external service providers (Article 8(2)(c) and (m)), including contracts that oblige providers to report incidents (Article 8(3)(k)). As a free service, the blocked tool gives us no such contract."}],"why":"This answers \"who decided\" (the Executive Director, under the Regulation) and \"on what basis\" (the articles) in one paragraph, in her order. Only one phrase is quoted word for word, the one that settles the MFA question; the rest is applied, not copied. The last sentence links the general rule to her specific tool. That link is a logical assumption (we are not told the free tool has no contract), which EPSO allows; it is short and plausible.","anchors":[3,5],"weaker":"Article 8(2) lists sixteen domains: (a) cybersecurity policy; (b) policies on cybersecurity risk analysis; (c) policy objectives regarding the use of cloud computing services; (d) cybersecurity audit … [and so on through (p)]"},{"label":"Why it matters for her unit","blocks":[{"type":"p","text":"This matters for grants in particular. The Regulation notes that EU bodies \"are attractive targets that face highly skilled and well-resourced threat actors\", and that an incident in one body can spread to others (recitals 3 and 4). Your unit holds applicants' personal and commercial data. A stolen password, or a leak through an uncontrolled service, would cost far more time than MFA does."}],"why":"Rules land better when the reader sees her own interest in them. The paragraph uses the source (recitals 3 and 4) and then turns to her unit's data and her own concern, time. It persuades without lecturing, in four sentences.","anchors":[4,5],"weaker":null},{"label":"The exemption","blocks":[{"type":"p","text":"An exemption is not possible. The Regulation makes MFA the norm for all systems, and the agency's management is accountable for applying it consistently."}],"why":"Two sentences, a clear \"no\" and the reason. Repeating the \"no\" here, after the reasons, closes her question for good. Hedging (\"it may be difficult to consider…\") would invite a second e-mail.","anchors":[2,3],"weaker":"Regarding the possibility of an exemption, I would like to point out that, as explained above, the Regulation, which applies to all Union entities, provides that multifactor authentication should be used as a norm, and therefore, taking into account the responsibility of the highest level of management, it would in principle be difficult to envisage an exemption, although the matter could perhaps be discussed further."},{"label":"What we will do","blocks":[{"type":"p","text":"What I can do is make the measures much less costly for your team:"},{"type":"ul","items":["Tomorrow, a colleague from the IT helpdesk will come to your unit to help staff set up MFA on their phones, which should cut login delays to a few seconds.","By Friday, we will open a workspace for your external experts on the agency's approved file-sharing service. Experts will receive an invitation and a short guide.","If your deadline is still at risk after that, please tell me the critical dates and we will give your requests priority."]}],"why":"This is the part she cares about most, so it gets concrete dates and owners. A list suits three parallel actions; the reasoning stays in prose elsewhere. The actions themselves are logical assumptions (the Regulation says nothing about helpdesks), which is fine as long as they are plausible and serve the task. The last point answers the implied question about her deadline.","anchors":[1,4,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"As the agency's local cybersecurity officer, I am its single point of contact for all cybersecurity matters (Article 6(8)), so please contact me directly on extension 4417 if anything blocks your work."},{"type":"p","text":"Kind regards,\n[Name]\nLocal Cybersecurity Officer"}],"why":"The close turns \"who decided\" into \"who helps\": she now has one named person to call. It uses a final detail from the source (Article 6(8)) that fits naturally, and it ends with an action, not a courtesy formula alone.","anchors":[1,4,5],"weaker":null}],"takeaways":["Answer the reader's direct question in the first paragraph, then explain.","Make a checklist of everything asked, plus the reader's implied need, and answer each in its own paragraph, in the reader's order.","Quote the source only where the exact words settle the point; otherwise apply it in your own words, with the article number.","Saying no politely: give the answer clearly, give the reason once, and offer something real.","Use logical assumptions to make advice concrete (dates, owners), and keep them short and plausible.","Delete the plan before the time runs out; it should already have become your structure."],"words":394},"probable":[{"source":"eufte/probable/P01.md","title":"P1 · Summary for the senior management team","intro":"","assignment":[{"type":"p","text":"You work in the ICT unit of a fictional EU agency (about 400 staff). The Executive Director has asked you to brief the senior management team, none of whom are IT specialists, at their next meeting."},{"type":"p","text":"Write a summary of Regulation (EU, Euratom) 2023/2841 for the senior management team. Explain what the Regulation requires of the agency, who is responsible, and what is coming up in 2027. Maximum 400 words."}],"plan":"Reader: senior managers, non-IT, busy, will ask \"what do I have to do?\"\nPurpose: inform; 400 words max -> only what they need\nAsked: 1) what it requires  2) who is responsible  3) what's coming in 2027\n\n1 Bottom line: one rulebook for all EU bodies; 4 building blocks; top mgmt answers for it\n2 Requirements: Framework 6, maturity 7, measures 8, plan 9; officer 6(8); incidents 21\n3 Responsible: top mgmt 6(5), delegation but still liable 6(6); every manager: training 6(9)\n4 2027: maturity assessment July 2027; plan revision after it; Commission report Jan 2027\n5 What we ask of you: training, support, data owners","planWhy":"Three asked items, so three middle paragraphs, plus a bottom line and a request. The word limit is in the plan: with 400 words, each paragraph gets about 70.","segments":[{"label":"Title and bottom line","blocks":[{"type":"p","text":"EU cybersecurity rules: what they mean for the agency"},{"type":"p","text":"Since January 2024, all EU institutions and agencies follow one set of cybersecurity rules, Regulation (EU, Euratom) 2023/2841. It asks each body to manage its cyber risks in a structured way, and it makes senior management answerable for doing so."}],"why":"The title says what the summary is for, not just what it is about. The opening gives the whole message in two sentences: one rulebook, and top management answers for it. A manager who reads only this knows why the item is on the agenda.","anchors":[1,3,4],"weaker":"Regulation (EU, Euratom) 2023/2841 of the European Parliament and of the Council of 13 December 2023 laying down measures for a high common level of cybersecurity at the institutions, bodies, offices and agencies of the Union was published in the Official Journal on 18 December 2023."},{"label":"What the Regulation requires","blocks":[{"type":"p","text":"The agency must have four things in place:"},{"type":"ul","items":["a Framework: our internal cybersecurity policies, roles and controls, covering all our systems, including cloud services (Article 6);","a maturity assessment of our whole ICT environment, every two years (Article 7);","risk-management measures such as multifactor authentication, encryption and staff training (Article 8);","a cybersecurity plan approved by the Executive Director and sent to the Interinstitutional Cybersecurity Board (IICB), which oversees all EU bodies (Article 9)."]},{"type":"p","text":"We must also have a local cybersecurity officer as single point of contact (Article 6(8)) and report significant incidents to CERT-EU, the EU bodies' cybersecurity service, within 24 hours (Article 21)."}],"why":"Four parallel obligations make a natural list; each item explains the term in plain words before giving the article. The two acronyms (IICB, CERT-EU) are explained in five words each, because this reader will hear them again.","anchors":[1,3,5],"weaker":null},{"label":"Who is responsible","blocks":[{"type":"p","text":"Responsibility sits with the highest level of management, in our case the Executive Director (Article 6(5)). Tasks can be delegated to senior managers, but \"Regardless of any such delegation, the highest level of management may be held liable\" (Article 6(6)). Senior managers must also follow cybersecurity training regularly (Article 6(9))."}],"why":"This is the paragraph this reader cares about most, because it concerns them personally. One short quotation, because the exact words settle the delegation question; the rest is paraphrase.","anchors":[2,4,5],"weaker":null},{"label":"What is coming in 2027","blocks":[{"type":"p","text":"Our next maturity assessment is due by July 2027, and the cybersecurity plan must then be revised. In January 2027, the Commission also reports to the European Parliament and the Council on how EU bodies are implementing the rules."}],"why":"The dates are calculated from the two-year cycles in Articles 7(1) and 9(1) and the date in Article 25(2). Saying \"by July 2027\" is more useful than \"every two years\", because the reader can put it in a diary.","anchors":[3,5],"weaker":null},{"label":"What we ask of you","blocks":[{"type":"p","text":"We ask each of you to book the management training, to name a contact in your unit for the maturity assessment by the end of January, and to raise any concerns with our local cybersecurity officer."}],"why":"A summary for managers should end with what they need to do. The deadline and the contact person are logical assumptions, which EPSO allows. Total about 280 words, well under the limit: under a limit, shorter and complete beats long.","anchors":[1,4],"weaker":"In conclusion, cybersecurity is everybody's responsibility and we should all remain vigilant."}],"takeaways":["A summary is selective: choose what this reader needs, not everything the document says.","Explain each technical term in a few words the first time you use it.","Turn cycles (\"every two years\") into dates the reader can plan for.","End a briefing for managers with what you need from them."],"words":279,"whyLikely":[{"type":"p","text":"A plain summary of what the document requires, for senior non-specialists, is the most generic task EPSO could set on this source: every candidate in all four ICT fields can do it from the PDF alone, and it tests all five anchors at once. My judgement, not EPSO information. Same ground as practice assignment A: write A first, then open this model."}],"overlap":"A","id":"p1","rank":1},{"source":"eufte/probable/P02.md","title":"P2 · Intranet article for all staff","intro":"","assignment":[{"type":"p","text":"You work for the communication team of a fictional EU agency. Many staff have complained about new security measures (multifactor authentication, blocked websites, compulsory training) and do not understand why they were introduced."},{"type":"p","text":"Write a short article for the staff intranet explaining why EU bodies have new cybersecurity rules and what they mean for staff in their daily work."}],"plan":"Reader: all staff, any grade, mildly annoyed, not technical\nPurpose: explain why + what it means for me; win acceptance, not compliance by fear\nFormat: intranet article: headline, short paras, maybe subheads/list\n\n1 Hook: you've noticed changes; here's why\n2 Why: EU bodies attractive targets; one incident spreads (rec 3, 4); law since 2024\n3 What it means for you: MFA, training, approved tools, report suspicious things\n4 Why your report matters: fast reporting, 24h, no blame\n5 Where to get help","planWhy":"The article has to answer the complaints, so the reader's question (\"why are you doing this to me?\") drives the order: why first, then what, then help.","segments":[{"label":"Headline and hook","blocks":[{"type":"p","text":"Why logging in takes two steps now, and why it protects your work"},{"type":"p","text":"If you have noticed new login steps, blocked websites or a training invitation in your inbox, you are not alone. These changes are not a local whim: they follow EU rules that apply to every EU institution and agency."}],"why":"A headline that names the change staff noticed, and promises a reason. The hook speaks to the reader's experience (\"you have noticed\") and answers the unspoken suspicion that the measures are arbitrary.","anchors":[3,4],"weaker":"**Regulation (EU, Euratom) 2023/2841: implementation update**"},{"label":"Why the rules exist","blocks":[{"type":"p","text":"EU bodies hold sensitive data and are connected to each other and to national administrations. That makes them, in the words of the EU rules, \"attractive targets that face highly skilled and well-resourced threat actors\". An attack on one body can spread to others. Since 2024, a Regulation therefore requires every EU body to protect its systems to a common standard, and makes senior management responsible for it."}],"why":"One short quotation gives authority; the rest is in everyday words. No article numbers: an intranet reader does not need them, and they would make the text look like a legal notice. \"Regulation\" is mentioned once, so readers know it is law, not preference.","anchors":[3,4,5],"weaker":null},{"label":"What it means for you","blocks":[{"type":"p","text":"In practice, four things change:"},{"type":"ul","items":["Two-step login. Multifactor authentication is now the norm on all our systems. It blocks most attacks that use stolen passwords.","Training. All staff follow short cybersecurity training regularly. Managers have their own sessions.","Approved tools only. Some free online services are blocked because we cannot check how they protect our data. The IT helpdesk can tell you what to use instead.","Report anything suspicious. If an e-mail or a link looks wrong, report it at once to the IT helpdesk."]}],"why":"A list, because the four changes are parallel and readers will scan for the one that annoys them. Each item gives the change and the reason in one or two sentences. The details (helpdesk, blocked services) are logical assumptions; the measures themselves come from Article 8(3)(c), (h) and (i) and the supplier rules in Article 8(2)(m).","anchors":[1,2,3,5],"weaker":null},{"label":"Why reporting fast matters","blocks":[{"type":"p","text":"Speed matters. When something serious happens, the agency must warn CERT-EU, the EU bodies' cybersecurity service, within 24 hours. Your report may be the first sign we get. Nobody will be blamed for reporting a mistake, such as clicking a bad link: the earlier we know, the less damage it does."}],"why":"This turns a legal deadline (Article 21(2)(a)) into a reason for the reader to act. The no-blame promise is an assumption, but it answers what stops people from reporting. A good staff text anticipates the reader's fear.","anchors":[3,4,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"Questions? The local cybersecurity officer, Maria Kowalska (ext. 2301), and the IT helpdesk are there to help."}],"why":"Ends with a named person and a way to reach them. Short. About 270 words in all.","anchors":[1,4],"weaker":null}],"takeaways":["For a general reader, drop article numbers; one short quotation can still give authority.","Answer the reader's real question (why me, why now) before telling them what to do.","Give each rule its reason in the same sentence: people accept what they understand.","Remove the fear that stops people acting (here, fear of blame)."],"words":273,"whyLikely":[{"type":"p","text":"A text for all staff, explaining what the rules mean for daily work, tests audience and clarity hard: the reader is anyone, so jargon and article numbers have to go. The Regulation gives enough material (MFA, training, reporting, cloud tools, culture in recital 15). My judgement, not EPSO information. No practice assignment covers it: you can read this model now, or write it first as extra practice."}],"overlap":null,"id":"p2","rank":2},{"source":"eufte/probable/P03.md","title":"P3 · First hours of a significant incident: e-mail to the Director","intro":"","assignment":[{"type":"p","text":"You are the local cybersecurity officer of a fictional EU agency based in Lisbon. At 9:00 this morning, the IT team found that an attacker had accessed the agency's grant-management system. Applicants' bank details and personal data may have been copied. The system has been taken offline."},{"type":"p","text":"The Executive Director, who is travelling, asks you by e-mail: \"What do we have to do now under the EU rules, and by when? What do you need from me?\""},{"type":"p","text":"Write your reply."}],"plan":"Reader: Exec Director, travelling, reading on phone, worried\nPurpose: tell her what must happen + by when + what I need from her\nAsked: 1) what to do  2) by when  3) what do you need from me\n\n1 Bottom line: significant incident; clock started 9:00; I'll send early warning by 9:00 tomorrow; I need 2 decisions\n2 Why significant: personal data, financial loss, others affected (21(1))\n3 Timeline: 24h CERT-EU + Portugal; 72h notification; 1 month final (21(2),(3))\n4 Users: tell applicants what to do (21(5)); EDPS/data protection (13(11))\n5 What I need: approve message to applicants; one spokesperson\n6 Reassure: notification doesn't add liability (21(4)); next update time","planWhy":"The Director asked three questions and is reading on a phone, so the reply answers all three in the first paragraph and then gives detail she can scroll to. \"What do you need from me\" becomes a numbered request at the end.","segments":[{"label":"Subject and bottom line","blocks":[{"type":"p","text":"Subject: Grants system incident – reporting deadlines and two decisions I need from you"},{"type":"p","text":"Dear Executive Director,"},{"type":"p","text":"In short: this is a significant incident under the EU cybersecurity rules, so the reporting clock started at 9:00 today. I will send the first report to CERT-EU before 9:00 tomorrow. I need two decisions from you today, set out at the end."}],"why":"She is travelling and reading on a phone. The first paragraph answers all three questions: what (report), by when (9:00 tomorrow), what I need (two decisions). The subject line says the same.","anchors":[1,2,4],"weaker":"Subject: Incident"},{"label":"Why it counts as significant","blocks":[{"type":"p","text":"The Regulation defines a significant incident as one that causes, or could cause, severe disruption or financial loss to the agency, or \"considerable material or non-material damage\" to other people (Article 21(1)). The theft of applicants' bank and personal data meets that test."}],"why":"Two sentences justify the label, because everything else follows from it. The quotation is short and is the deciding phrase. Applying the definition to the facts is what anchor 5 rewards.","anchors":[3,5],"weaker":null},{"label":"What must happen, and by when","blocks":[{"type":"ul","items":["By 9:00 tomorrow: early warning to CERT-EU, the EU bodies' cybersecurity service, flagging that the attack appears malicious (Article 21(2)(a)). Within the same 24 hours we must also inform the Portuguese national authorities, because the agency is located in Portugal (Article 21(3)).","By 9:00 on Thursday (72 hours): incident notification to CERT-EU, with our first assessment of severity and impact (Article 21(2)(b)).","Within one month after that: a final report with the root cause and the measures taken (Article 21(2)(d))."]}],"why":"Three deadlines, so a dated list. Converting \"24 hours\" into \"9:00 tomorrow\" saves her the arithmetic. The Portugal step is easy to miss, and including it shows careful use of the source. \"Thursday\" assumes today is Monday, a harmless assumption.","anchors":[1,3,5],"weaker":null},{"label":"The applicants","blocks":[{"type":"p","text":"We must also tell affected applicants, without undue delay, what they can do to protect themselves, such as alerting their bank (Article 21(5)). CERT-EU can support us on the personal data breach together with the EDPS (Article 13(11))."}],"why":"The people harmed are not only the agency. This paragraph uses two articles that a weaker answer would miss, and links them to a concrete action.","anchors":[4,5],"weaker":null},{"label":"What I need from you","blocks":[{"type":"ol","items":["Approval, by 16:00 today, of the message to applicants, which I will send you by 14:00.","One spokesperson for any press questions, so that the agency speaks with one voice."]}],"why":"Her third question gets a numbered answer with times. The requests are specific enough that she can reply \"yes\" from her phone.","anchors":[1,2,4],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"Reporting the incident does not in itself increase the agency's liability (Article 21(4)). I will update you at 18:00 today."},{"type":"p","text":"Best regards,\n[Name]\nLocal Cybersecurity Officer"}],"why":"The last reassurance answers a fear she has not voiced: will reporting make things worse for us? A fixed time for the next update closes the loop. About 280 words.","anchors":[4,5],"weaker":null}],"takeaways":["When the reader asks several questions, answer all of them in the first paragraph, then give detail.","Convert legal deadlines into clock times and days.","Look for the step a hurried reader would miss (here, the Member State counterparts and the affected users).","End a request with decisions the reader can approve in one word."],"words":283,"whyLikely":[{"type":"p","text":"Article 21 is the most concrete, time-bound part of the Regulation, and an incident scenario gives EPSO a clear reader, a clear purpose and a deadline. My judgement, not EPSO information. Same ground as practice assignment B (B writes to all staff; this one writes to the Director): write B first, then open this model."}],"overlap":"B","id":"p3","rank":3},{"source":"eufte/probable/P04.md","title":"P4 · Who does what: explaining the system to a national official","intro":"","assignment":[{"type":"p","text":"You work in the cybersecurity team of a fictional EU agency located in Vienna. An official from the Austrian national cybersecurity authority, who is new in her post, has written to you:"},{"type":"p","text":"\"I understand that EU bodies have their own cybersecurity rules. Who is in charge of what on the EU side? And if something happens at your agency, how and when will we hear about it?\""},{"type":"p","text":"Write your reply."}],"plan":"Reader: national cyber official: expert in cyber, novice in EU structures\nPurpose: inform; build a working relationship\nAsked: 1) who's in charge of what  2) how/when will we hear\n\n1 Bottom line: 3 levels (each body / IICB / CERT-EU); you'll hear within 24h of a significant incident\n2 Each body: top mgmt responsible 6(5); local officer single contact 6(8)\n3 IICB: monitors + compliance 10, 11, 12; members incl. ENISA\n4 CERT-EU: hub, advice, incident coordination 13(1); counterpart of national CSIRTs 17\n5 How you hear: we inform you within 24h (21(3)); CERT-EU exchanges info (17)\n6 Offer: contact details; meeting","planWhy":"The reader is an expert in cybersecurity but not in EU structures, so the plan explains the structure and skips basic cyber concepts. Her two questions become two blocks.","segments":[{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Huber,"},{"type":"p","text":"Thank you for your message, and welcome to your new role. In short, responsibility on the EU side sits at three levels: each EU body manages its own security, a joint board supervises all of them, and a shared service, CERT-EU, coordinates the technical response. If we have a significant incident, you will hear from us directly within 24 hours."}],"why":"The first paragraph answers both questions in two sentences. \"Three levels\" gives the reader a mental map before the detail. One sentence of welcome is enough.","anchors":[1,3,4],"weaker":null},{"label":"Who is in charge of what","blocks":[{"type":"p","text":"Under Regulation (EU, Euratom) 2023/2841:"},{"type":"ul","items":["Each EU body is responsible for its own cybersecurity. Its highest level of management, here our Executive Director, answers for compliance (Article 6(5)). Each body has a local cybersecurity officer as single point of contact; in our agency, that is me (Article 6(8)).","The Interinstitutional Cybersecurity Board (IICB), made up of representatives of EU institutions, agencies and ENISA, monitors how EU bodies apply the rules and can take measures against those that do not (Articles 10 to 12).","CERT-EU, the Cybersecurity Service for the EU institutions, bodies, offices and agencies, advises EU bodies, coordinates their response to incidents and acts as their \"cybersecurity information exchange and incident response coordination hub\" (Article 13(1)). It is the natural counterpart of your national CSIRT and cooperates with Member State authorities (Article 17)."]}],"why":"Three parallel actors, so three bullets, each with what it is and what it does. The reader is an expert, so \"CSIRT\" needs no explanation, while EU-specific bodies do. The officer reveals that she is the contact, which matters to this reader.","anchors":[1,3,5],"weaker":null},{"label":"How you will hear about an incident","blocks":[{"type":"p","text":"If a significant incident affects our agency, we must inform the relevant authorities of the Member State where we are located, so Austria, within 24 hours of becoming aware of it (Article 21(3)). In parallel, we report to CERT-EU in stages: early warning within 24 hours, notification within 72 hours and a final report within a month (Article 21(2)). CERT-EU may also share information with national counterparts; information that identifies an affected EU body requires that body's consent, with some exceptions (Article 17(3))."}],"why":"This is the answer she needs most, so it is precise: who informs her, when, and through which second channel. The consent rule is included because a national authority will want to know the limits of what it will receive.","anchors":[3,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"It would help us both to agree now on how we reach each other in an emergency. Could we have a short call next week? I am at your disposal on +43 1 000 0000."},{"type":"p","text":"Kind regards,\n[Name]\nLocal Cybersecurity Officer"}],"why":"Ends with a practical next step that serves both sides, which fits the purpose of building a working relationship. About 320 words.","anchors":[1,4],"weaker":"Should you have any further questions, please do not hesitate to contact me."}],"takeaways":["Judge what the reader already knows: explain EU structures to a national expert, not cybersecurity basics.","Give a mental map (\"three levels\") before the detail.","For a system of actors, one bullet per actor: what it is, what it does.","Close with a concrete next step, not a courtesy formula."],"words":321,"whyLikely":[{"type":"p","text":"The Regulation creates a whole governance system (IICB, CERT-EU, each body's top management, Member State counterparts). Explaining it to an outsider is a natural EUFTE task, because the reader knows nothing of EU internal arrangements. My judgement, not EPSO information. Close to practice assignment E (a journalist's questions): write E first, then open this model."}],"overlap":"E","id":"p4","rank":4},{"source":"eufte/probable/P05.md","title":"P5 · What happens if we do not comply","intro":"","assignment":[{"type":"p","text":"You are the local cybersecurity officer of a fictional EU agency. The agency's cybersecurity plan, due by 8 January 2026, is still not finished because of staff shortages. The Executive Director asks you:"},{"type":"p","text":"\"Realistically, what happens if we stay late on this? Could I personally be in trouble? What do you recommend?\""},{"type":"p","text":"Write a note to the Executive Director."}],"plan":"Reader: Exec Director; direct questions; wants honesty, not alarm\nPurpose: inform about risk + recommend action\nAsked: 1) what happens  2) me personally?  3) recommendation\n\n1 Bottom line: escalating steps, not immediate sanctions; yes, you're accountable; recommend finishing plan by March + telling IICB now\n2 What happens: IICB ladder, progressive (12(2), rec 24) -> reasoned opinion ... suspend data flows (exceptional)\n3 You personally: responsible 6(5); liable even if delegated 6(6); warnings go to top mgmt 12(2); disciplinary request if persistent 12(4)\n4 Note: no extension for plan deadline (12(5) only 6(1), 8(1))\n5 Recommendation: 3 steps with dates","planWhy":"Three questions, three blocks, in her order, with the recommendation flagged in the first paragraph. The plan notes a subtle point (extensions do not cover the plan), which a careful reader of Article 12(5) will find.","segments":[{"label":"Heading and bottom line","blocks":[{"type":"p","text":"Note to the Executive Director: risks of a late cybersecurity plan, and next steps"},{"type":"p","text":"In short: being late will not lead to immediate sanctions, but it exposes the agency to escalating measures by the Interinstitutional Cybersecurity Board (IICB), and you are personally accountable. I recommend that we finish the plan by the end of March and tell the IICB now."}],"why":"All three answers in two sentences, in the order she asked. The tone is calm and honest: \"not immediate\" and \"personally accountable\" are both true, and she needs both.","anchors":[1,2,4],"weaker":null},{"label":"What can happen","blocks":[{"type":"p","text":"The IICB, which monitors how EU bodies apply the rules, can take measures against a body that does not comply (Article 12(2)). It must first let us present our observations, and it applies the measures \"progressively\" (recital 24). They range from a reasoned opinion on the gaps, through guidelines, a warning and an audit, to informing the Court of Auditors. The most severe step, a recommendation to suspend data flows to the agency, is reserved for \"exceptional cases of long-term, deliberate, repetitive or serious infringements\" (recital 24)."}],"why":"Seven rungs would make a long list; the paragraph names the ends and the middle in one sentence instead. The two short quotations come from the recital, because it is the recital that says the ladder is progressive and that the top step is exceptional, which is the reassurance she needs.","anchors":[2,3,5],"weaker":"Article 12(2) provides for the following measures: (a) a reasoned opinion; (b) guidelines; (c) a warning; (d) a reasoned notification; (e) a recommendation for an audit; (f) informing the Court of Auditors; (g) a recommendation to suspend data flows."},{"label":"Your personal position","blocks":[{"type":"p","text":"Yes, the risk is personal. The highest level of management is responsible for implementing the Regulation (Article 6(5)) and must approve the plan (Article 9(1)). Even if you delegate tasks, you \"may be held liable\" (Article 6(6)). IICB warnings are addressed to top management (Article 12(2)), and for persistent infringements the IICB can ask the agency to consider disciplinary action, \"including at the highest level of management\" (Article 12(4))."}],"why":"She asked a direct question, so the paragraph starts with a direct answer: \"Yes\". Then the evidence, from the least to the most serious. Not softening this serves her better than reassurance would.","anchors":[3,4,5],"weaker":null},{"label":"Recommendation","blocks":[{"type":"p","text":"The IICB can extend deadlines only for the Framework and the risk-management measures (Article 12(5)), not for the plan, so asking for more time is not an option. I recommend instead:"},{"type":"ol","items":["By 15 December: inform the IICB that the plan is late, why, and our new date. Showing that we are acting puts us in a better position if the IICB asks for our observations.","By 31 January: assign two staff from the ICT unit to the plan, or contract a specialised firm.","By 31 March: you approve the plan and we submit it to the IICB (Article 9(3))."]}],"why":"The recommendation starts by ruling out the obvious alternative (an extension), using a detail many candidates would miss. Each step has a date and an owner. The dates and the staffing option are logical assumptions; the \"better position\" point is my judgement, stated as reasoning, not as a rule. About 320 words.","anchors":[1,4,5],"weaker":null}],"takeaways":["When a senior reader asks \"could I be in trouble?\", answer yes or no first, then give the evidence.","Summarise a long list in one sentence (\"from … to …\") when the reader does not need every item.","Rule out the tempting alternative before recommending yours.","Calm and honest beats both alarm and false comfort."],"words":315,"whyLikely":[{"type":"p","text":"Article 12's compliance ladder and the personal accountability of top management are the parts of the Regulation that give it teeth. A task asking you to explain the risk of non-compliance to a senior reader is a natural fit for the anchors. My judgement, not EPSO information. Same ground as practice assignment F (F responds to a reasoned opinion already received): write F first, then open this model."}],"overlap":"F","id":"p5","rank":5},{"source":"eufte/probable/P06.md","title":"P6 · How much should we spend on cybersecurity?","intro":"","assignment":[{"type":"p","text":"You work in the ICT unit of a fictional EU agency. The Head of the Budget Unit is preparing next year's budget and writes to you:"},{"type":"p","text":"\"I've heard that EU rules now oblige us to spend 10% of the ICT budget on cybersecurity. We spend about 5%. Is 10% mandatory? What should I put in the draft budget?\""},{"type":"p","text":"Write your reply to the Head of the Budget Unit."}],"plan":"Reader: Head of Budget: numbers person, not cyber; wants a figure + justification\nPurpose: correct a misunderstanding + give usable advice\nAsked: 1) is 10% mandatory?  2) what to put in the budget\n\n1 Bottom line: no, 10% isn't a legal obligation; but \"adequate\" share is, based on risk; propose 7% next year, path to 10%\n2 What the law says: 6(7) adequate %, set with Framework; rec 14: indicative 10% \"in the longer term\"\n3 How to set the figure: maturity assessment evaluates if spending fits risks (rec 14); proportionate 8(1)\n4 Proposal: 7% next year (+ items), review after July 2027 assessment\n5 Offer: help with justification","planWhy":"The reader asks a yes/no question built on a misunderstanding, so the reply corrects it at once and then gives what she really needs: a figure she can defend.","segments":[{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Novak,"},{"type":"p","text":"Thank you for checking before the draft goes out. In short: 10% is not a legal obligation, but the rules do require an \"adequate\" share based on our risks, and 5% is probably too low. I suggest 7% next year, with a path towards 10%."}],"why":"The yes/no answer comes first, then the nuance, then the figure. A numbers person gets a number in the first paragraph.","anchors":[1,2,4],"weaker":null},{"label":"What the rules say","blocks":[{"type":"p","text":"Regulation (EU, Euratom) 2023/2841 requires each EU body to \"have effective mechanisms in place to ensure that an adequate percentage of the ICT budget is spent on cybersecurity\" (Article 6(7)). It sets no figure. The 10% comes from the recitals, the explanatory part of the Regulation: \"In the longer term an indicative target in the order of at least 10 % should be pursued\" (recital 14). It is a target to work towards, not a rule for next year."}],"why":"The difference between an article (binding) and a recital (explanatory) is the heart of the answer, and the paragraph explains it in five words for a non-lawyer. Two quotations, because the exact words (\"adequate\", \"indicative\", \"in the longer term\") are the evidence.","anchors":[3,5],"weaker":"Yes, the Regulation provides for a 10% target, so we should budget 10%."},{"label":"How to set the figure","blocks":[{"type":"p","text":"The share must be set taking account of our Framework, our internal risk analysis (Article 6(7)). The same recital says the maturity assessment \"should evaluate whether the Union entity’s cybersecurity spending is proportionate to the cybersecurity risks that it faces\". Our last assessment found gaps in monitoring and staff training, which 5% does not cover."}],"why":"Moves from \"what the law says\" to \"how this applies to us\". The finding of the last assessment is a logical assumption that links the rule to the figure. The reasoning makes the 7% defensible if the budget is challenged.","anchors":[3,4,5],"weaker":null},{"label":"Proposal","blocks":[{"type":"p","text":"For next year, I propose 7% of the ICT budget, covering:"},{"type":"ul","items":["24/7 monitoring of our systems, bought as a service from CERT-EU, the EU bodies' cybersecurity service;","the training that management and staff must follow regularly (Article 6(9));","one additional security specialist."]},{"type":"p","text":"We would then review the share after the next maturity assessment, due by July 2027, and aim for 10% over three years."}],"why":"The figure is broken down into items the Budget Unit can cost and defend. Each item is either in the Regulation (training; CERT-EU's chargeable 24/7 monitoring under Article 13(6)) or a plausible assumption. The review date ties the path to the two-year cycle.","anchors":[1,4,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"I can send you a one-page justification for the budget file by Friday."},{"type":"p","text":"Kind regards,\n[Name]\nICT Unit"}],"why":"Offers the next thing she will need. About 260 words.","anchors":[1,4],"weaker":null}],"takeaways":["Correct a reader's misunderstanding in the first sentence, politely and without making them feel wrong.","Distinguish binding articles from explanatory recitals; explain the difference in plain words.","Give a numbers person a number, broken down so it can be defended.","Tie future steps to the dates in the source (the next maturity assessment)."],"words":263,"whyLikely":[{"type":"p","text":"The budget point (Article 6(7) and the \"at least 10 %\" in recital 14) is easy to misread, and a task built on it tests whether a candidate uses the source precisely: a recital is not an obligation. My judgement, not EPSO information. Same ground as practice assignment C: write C first, then open this model."}],"overlap":"C","id":"p6","rank":6},{"source":"eufte/probable/P07.md","title":"P7 · Security requirements for a cloud procurement","intro":"","assignment":[{"type":"p","text":"You are a cybersecurity adviser in a fictional EU agency. A project manager is preparing the tender for a new cloud-based HR system and writes to you:"},{"type":"p","text":"\"Procurement wants the technical specifications next week. Does the EU cybersecurity Regulation affect what I must ask from the supplier? Please give me a short list I can use.\""},{"type":"p","text":"Write your reply to the project manager."}],"plan":"Reader: ICT project manager: knows tenders + IT, not the Regulation; wants a usable list\nPurpose: practical advice for specs, next week\nAsked: 1) does Reg affect it?  2) short list\n\n1 Bottom line: yes; cloud in scope; 5 requirements; incident reporting is the critical one\n2 Why in scope: Framework covers cloud/third parties 6(2); supplier risk 8(2)(m)\n3 List: incident reporting to us fast (8(3)(k) + 21(2)(a) 24h); no barriers to CERT-EU info sharing (8(3)(k)); MFA 8(3)(c); encryption 8(3)(d); secure development 8(3)(g)/8(2)(m)\n4 Tip: CERT-EU guidance on common procurement (14(2)(e)); check with legal\n5 Offer: review draft specs","planWhy":"The reader wants a list she can paste into the specifications, so the list is the centre of the answer. The 24-hour link between the supplier's reporting and the agency's own deadline is the insight worth planning in.","segments":[{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Laine,"},{"type":"p","text":"Yes, the Regulation affects your tender. Cloud services are within the scope of the agency's cybersecurity obligations, so the specifications need five security requirements, listed below. The most important is fast incident reporting by the supplier."}],"why":"The yes/no question gets \"Yes\" as the first word. The number of requirements tells her what to expect, and the priority tells her where to push if procurement resists.","anchors":[1,2,4],"weaker":null},{"label":"Why it applies","blocks":[{"type":"p","text":"Regulation (EU, Euratom) 2023/2841 requires the agency's cybersecurity framework to cover \"outsourced assets and services in cloud computing environments or hosted by third parties\" (Article 6(2)). It also requires us to manage the security of our supply chain, including each supplier's \"secure development procedures\" (Article 8(2), point (m) and the subparagraph that follows it)."}],"why":"Two articles establish that the rules reach a cloud supplier. Two short quotations, chosen because they name exactly the situation she is in.","anchors":[3,5],"weaker":null},{"label":"The requirements","blocks":[{"type":"p","text":"Please include:"},{"type":"ol","items":["Incident reporting. The supplier must report incidents, vulnerabilities and threats to us (Article 8(3)(k)), within a fixed time such as 12 hours. We must warn CERT-EU, the EU bodies' cybersecurity service, within 24 hours of becoming aware of a significant incident (Article 21(2)(a)), so the supplier's deadline must be shorter than ours.","Information sharing. The contract must not prevent the supplier from sharing information on incidents, vulnerabilities and threats with CERT-EU (Article 8(3)(k)).","Multifactor authentication for all access to the system (Article 8(3)(c)).","Encryption of data in transit and at rest (Article 8(3)(d)).","Secure development. The supplier must show how it develops and tests its software securely (Article 8(3)(g))."]}],"why":"A numbered list the reader can reuse, each item one requirement with its basis. Item 1 turns two separate articles into a practical rule (the supplier's deadline must be shorter than the agency's), which is the best use of the source in the answer. \"12 hours\" is a logical assumption, offered as an example.","anchors":[1,3,5],"weaker":"The supplier should comply with all relevant cybersecurity requirements and ensure a high level of security in line with the Regulation."},{"label":"Practical tips","blocks":[{"type":"p","text":"Guidelines under the Regulation may include information on common procurement instruments for cybersecurity services and products (Article 14(2)(e)); it is worth asking CERT-EU whether any apply before you finalise. Please also check the contract clauses with the Legal Service."}],"why":"Two short practical tips, one from the source and one from common sense. It stays short because the list is the answer.","anchors":[4,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"I am happy to review the draft specifications before they go to Procurement. If you send them by Wednesday, you will have my comments on Thursday."},{"type":"p","text":"Best regards,\n[Name]\nCybersecurity Adviser"}],"why":"An offer with dates that fits her deadline (\"next week\"). About 270 words.","anchors":[1,4],"weaker":null}],"takeaways":["When the reader asks for a list they can reuse, make the list the core of the answer.","Connect two articles to produce a rule the reader can apply (supplier deadline shorter than ours).","Give the priority, not just the items: what to defend if there is pushback.","Match your offer to the reader's own deadline."],"words":274,"whyLikely":[{"type":"p","text":"Suppliers and cloud services (Articles 6(2), 8(2)(c), 8(2)(m), 8(3)(g) and 8(3)(k)) are the part of the Regulation that touches ICT projects directly, and the source document is the same for all four ICT fields, so a project-delivery scenario is plausible. My judgement, not EPSO information. Same ground as practice assignment D: write D first, then open this model."}],"overlap":"D","id":"p7","rank":7},{"source":"eufte/probable/P08.md","title":"P8 · Argued piece: one set of rules for very different EU bodies?","intro":"","assignment":[{"type":"p","text":"The EU Agencies Network is collecting views from agency staff for its input to the Commission's next report on how Regulation (EU, Euratom) 2023/2841 is working."},{"type":"p","text":"Write a short contribution answering this question: \"Does it make sense to apply the same cybersecurity rules to EU bodies as different as a large institution and a small agency?\""}],"plan":"Reader: EUAN colleagues + eventually Commission report authors; informed, policy-minded\nPurpose: argue a view, balanced, with a constructive proposal\nFormat: short argued piece: thesis, for, against/limits, conclusion + proposal\n\nThesis: yes - common level is right because risks are shared; but it works only if flexibility is used\n1 Why common: interconnected (rec 3), weakest link; attractive targets, uneven maturity (rec 4)\n2 Flexibility already built in: proportionate 8(1); own Framework, autonomy (rec 12, 2(2)); pooling 7(3), officer shared/CERT-EU 6(8)\n3 The real difficulty for small bodies: fixed tasks + cycles regardless of size; budget; chargeable services 13(6)\n4 Proposal: shared services as default for small agencies; common templates (14(2)(a))\nConclusion: same level, not same means","planWhy":"An argued piece needs a thesis stated at the start and answered at the end. The plan gives one paragraph to each side and a concrete proposal, which suits the reader (input to a report).","segments":[{"label":"Title and thesis","blocks":[{"type":"p","text":"Same level, not the same means"},{"type":"p","text":"Yes, it makes sense to apply common cybersecurity rules to all EU bodies, large and small. But the rules will only work for small agencies if the flexibility they already contain is used to the full."}],"why":"The title states the conclusion. The first two sentences answer the question and announce the condition, so the reader knows the argument before reading it.","anchors":[1,3],"weaker":null},{"label":"Why common rules are right","blocks":[{"type":"p","text":"EU bodies do not work in isolation. Their systems are interconnected, so a disruption confined at first to one body \"can have cascading effects more broadly\" (recital 3 of the Regulation). An attacker looks for the weakest entry point, and a small agency connected to larger institutions can be that point. The Regulation also notes that EU bodies' level of cyber resilience varies \"significantly\" (recital 4). A common minimum is therefore in everyone's interest, including that of the small agencies themselves."}],"why":"The argument for the thesis rests on two recitals and one logical step (the weakest link), which the source supports without saying in so many words. Short quotations, reasoning in the writer's own words.","anchors":[3,5],"weaker":null},{"label":"The flexibility already in the rules","blocks":[{"type":"p","text":"The Regulation does not ask every body to do the same things in the same way. Measures must be \"appropriate and proportionate\" to each body's exposure and size (Article 8(1)). Each body designs its own Framework and plan, which respects its institutional autonomy (Article 2(2); recital 12). Similar bodies may carry out maturity assessments together (Article 7(3)), and tasks of the local cybersecurity officer can be shared between bodies or delegated to CERT-EU (Article 6(8))."}],"why":"Here the writer engages with the other side of the question (differences between bodies) by showing what the source already offers. Four provisions in one paragraph, each in a single clause: the opposite of copying the articles out.","anchors":[2,3,5],"weaker":null},{"label":"Where it still pinches","blocks":[{"type":"p","text":"Some burdens do not shrink with size. A 60-person agency must produce the same Framework, a maturity assessment every two years and a cybersecurity plan, and services such as 24/7 monitoring by CERT-EU are chargeable (Article 13(6)). For a small agency with a frozen budget, the fixed cost of compliance is proportionally much higher."}],"why":"A credible argued piece concedes the strongest counter-point. The example of a 60-person agency is a logical assumption that makes the point concrete.","anchors":[3,4,5],"weaker":null},{"label":"Proposal and conclusion","blocks":[{"type":"p","text":"The answer is not different rules but shared means. Shared services from CERT-EU or between agencies should become the normal route for small agencies, and common methodologies and a common maturity model, which IICB guidelines may provide (Article 14(2)(a)), would cut the fixed cost. The goal should be the same level of security everywhere, not the same effort in every body."}],"why":"The conclusion returns to the title, turns the concession into a proposal and grounds it in the source. About 310 words. The piece persuades without claiming more than the Regulation supports.","anchors":[1,4,5],"weaker":"In conclusion, there are advantages and disadvantages, and it depends on the situation of each body."}],"takeaways":["In an argued piece, state your answer in the first two sentences and come back to it in the last.","Concede the strongest counter-argument; it makes your conclusion credible.","A memorable title that states the thesis helps the reader and the structure.","Avoid \"advantages and disadvantages\" endings: take a position."],"words":313,"whyLikely":[{"type":"p","text":"The EUFTE is described as a \"free-text essay on EU matters\" (EPSO AD6–AD9 page, retrieved 2026-11-22), so a discursive question asking for a reasoned view is possible, not only e-mails and notes. The Regulation's tension between common rules and institutional autonomy (recitals 4, 12–14; Arts 2(2), 6(8), 7(3), 8(1)) is its most obvious debating point. My judgement, not EPSO information. It touches the ground of practice assignment G (a small agency): write G first, then open this model."}],"overlap":"G","id":"p8","rank":8},{"source":"eufte/probable/P09.md","title":"P9 · Two-year roadmap for the steering committee","intro":"","assignment":[{"type":"p","text":"You are the project manager for cybersecurity compliance in a fictional EU agency. It is December 2026. The agency met all the first deadlines of Regulation (EU, Euratom) 2023/2841, but the steering committee has asked: \"What do we have to deliver in 2027 and 2028, in what order, and what are the main risks?\""},{"type":"p","text":"Write a note to the steering committee."}],"plan":"Reader: steering committee: senior sponsors, decide on resources\nPurpose: inform + secure decisions/resources\nAsked: 1) what to deliver 27-28  2) in what order  3) main risks\n\n1 Bottom line: 3 deliverables + 2 ongoing; sequence; 2 risks; decision needed: start assessment in Feb\n2 Deliverables in order: maturity assessment by 8 Jul 2027 (7(1)) -> revised plan ~early 2028 (9(1)) -> prepare Framework review (by Apr 2029, 6(4))\n3 Ongoing: incident reporting 21; expert list yearly 23(4); training 6(9)\n4 Context: Commission report Jan 2027 (25(2)) could bring guidance changes\n5 Risks + responses: specialist capacity -> third party 7(2) or joint with similar bodies 7(3); supplier contracts not updated -> 8(3)(k) review\n6 Decision requested","planWhy":"The steering committee asked three questions; the answer adds a fourth element they need: the decision they must take. Dates come from the cycles in the source; where the source gives only a cycle, the plan computes a date.","segments":[{"label":"Heading and bottom line","blocks":[{"type":"p","text":"Note to the Steering Committee: cybersecurity compliance roadmap 2027–2028"},{"type":"p","text":"In 2027–2028 the agency must deliver three things in sequence: a new maturity assessment, a revised cybersecurity plan and the preparation of the Framework review, alongside our ongoing duties. Two risks could delay them. I ask the committee to approve the start of the maturity assessment in February 2027."}],"why":"The bottom line gives the content, the risk count and the decision requested, so the committee knows from the first paragraph what it is being asked to do.","anchors":[1,2,4],"weaker":null},{"label":"What we must deliver, in order","blocks":[{"type":"ul","items":["February–July 2027: the second cybersecurity maturity assessment of our whole ICT environment, due by 8 July 2027 (Article 7(1)).","Autumn 2027 to early 2028: the revised cybersecurity plan, approved by the Executive Director and sent to the IICB (Article 9(1) and (3)).","2028: preparation of the Framework review, due by April 2029 at the latest (Article 6(4))."]},{"type":"p","text":"The order is set by the Regulation: the plan is revised \"following the cybersecurity maturity assessments\" (Article 9(1)), so a late assessment delays the plan."}],"why":"A dated list, one deliverable per line with its basis. A table would also work, but the answer box may not allow tables (the TAO guide only says you \"may be allowed to format\", §6.3.4), so practise lists. The sentence under it answers \"in what order\" with the source's own logic, so the sequence is not just the writer's opinion. The dates where the source gives only a cycle are calculated and shown as such (\"by April 2029 at the latest\").","anchors":[1,3,5],"weaker":null},{"label":"Ongoing duties","blocks":[{"type":"p","text":"Throughout the period we must also report significant incidents to CERT-EU (Article 21), update our list of technical experts every year (Article 23(4)) and keep management and staff training regular (Article 6(9))."}],"why":"Recurring duties do not belong in the sequence, so they get one sentence. Leaving them out would understate the workload; listing them at length would bury the roadmap.","anchors":[2,5],"weaker":null},{"label":"Main risks and responses","blocks":[{"type":"ol","items":["Not enough specialist capacity for the assessment. Response: use a specialised third party (Article 7(2)) or carry out the assessment jointly with agencies of similar structure (Article 7(3)). Decision needed by February.","Supplier contracts not yet updated. Several contracts predate the Regulation and lack incident-reporting clauses (Article 8(3)(k)). Response: review them by June 2027, before the assessment closes."]}],"why":"Each risk is paired with a response from the source and a date. The second risk is a logical assumption (contracts predating the rules), chosen because it fits the source and a project manager would expect it.","anchors":[1,3,4,5],"weaker":"Risks include lack of resources, delays and other unforeseen events."},{"label":"Context and close","blocks":[{"type":"p","text":"In January 2027, the Commission will also report on how the Regulation is being implemented (Article 25(2)); I will inform the committee if it leads to new guidance that affects this roadmap."}],"why":"A one-sentence note on an outside event that could change the plan. It shows judgement about the environment, then stops. About 260 words.","anchors":[4,5],"weaker":null}],"takeaways":["For a decision-making body, put the decision requested in the first paragraph.","Give dated deliverables as a list that starts with the date; use the source's own logic to justify the order.","Pair every risk with a response and a date.","Separate one-off deliverables from ongoing duties."],"words":265,"whyLikely":[{"type":"p","text":"The Regulation is full of deadlines and cycles (Arts 6–9, 25), and it is being assessed by ICT project managers among others, so a task asking you to turn the cycles into a plan for senior sponsors is plausible. My judgement, not EPSO information. Same ground as part 1 of practice assignment H: write H first, then open this model."}],"overlap":"H","id":"p9","rank":9},{"source":"eufte/probable/P10.md","title":"P10 · Reply to the Data Protection Officer on sharing data with CERT-EU","intro":"","assignment":[{"type":"p","text":"You are the local cybersecurity officer of a fictional EU agency. The agency's Data Protection Officer (DPO) has written to you:"},{"type":"p","text":"\"I understand that under the new cybersecurity rules we send information about incidents and our systems to CERT-EU. Staff representatives are worried that this includes personal data about staff and that CERT-EU may pass it on to national authorities. What exactly do we share, on what legal basis, and what safeguards apply?\""},{"type":"p","text":"Write your reply to the DPO."}],"plan":"Reader: DPO: expert in data protection, precise, wants legal bases; relays to staff reps\nPurpose: inform + reassure with facts; give her something to pass on\nAsked: 1) what we share  2) legal basis  3) safeguards (+ implied: national authorities)\n\n1 Bottom line: we share incident + system info; personal data only where necessary; 2018/1725 applies; identity shared only with consent (exceptions)\n2 What: incident reports 21; voluntary info 20(1); inventory info on request 20(2)\n3 Legal basis: 2018/1725 applies 4(1); necessity + purpose limitation 4(2); rec 40 legal basis\n4 Safeguards: professional secrecy 19(1); identity only with consent 20(3), 17(3); EDPS role 13(11)\n5 Offer: joint note to staff reps","planWhy":"This reader is an expert in data protection, so the reply can name Regulation 2018/1725 without explaining it, and it must be precise. The implied worry (national authorities) is answered explicitly, because it is what the staff representatives fear.","segments":[{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Rossi,"},{"type":"p","text":"Thank you for raising this. In short: we share information about incidents and our systems with CERT-EU, the EU bodies' cybersecurity service, and personal data only where they are necessary for that purpose. Regulation (EU) 2018/1725 applies in full. CERT-EU may pass incident details to national authorities, but details that identify our agency only with our consent, with limited exceptions."}],"why":"The three asked questions and the implied one are all answered in the first paragraph. The DPO can stop reading here and still brief the staff representatives correctly.","anchors":[1,2,4],"weaker":null},{"label":"What we share","blocks":[{"type":"p","text":"Under Regulation (EU, Euratom) 2023/2841, we must report significant incidents to CERT-EU (Article 21). We may also report other incidents, threats and vulnerabilities voluntarily (Article 20(1)), and CERT-EU may ask for information from our ICT system inventories (Article 20(2)). In practice, an incident report may contain personal data such as the e-mail addresses of staff whose accounts were attacked."}],"why":"Three channels in three sentences, each with its article, then a concrete example that shows the writer understands the worry. The example is a logical assumption.","anchors":[3,5],"weaker":null},{"label":"Legal basis","blocks":[{"type":"p","text":"The processing of personal data under the Regulation must comply with Regulation (EU) 2018/1725 (Article 4(1)). The Regulation itself provides the legal basis for that processing (recital 40). Personal data may be processed and exchanged \"only to the extent necessary and for the sole purpose of performing those tasks or fulfilling those obligations\" (Article 4(2))."}],"why":"For a DPO, the exact necessity and purpose-limitation wording matters, so it is quoted. The rest is paraphrase.","anchors":[3,5],"weaker":null},{"label":"Safeguards","blocks":[{"type":"ul","items":["CERT-EU and the agency are bound by professional secrecy (Article 19(1)).","CERT-EU may share information that reveals our agency's identity with other EU bodies only with our consent (Article 20(3)).","With national authorities, CERT-EU may exchange incident details without our authorisation, but only if personal data are protected under EU data protection law. Details that reveal our identity need our consent, unless disclosure would help avoid or mitigate incidents elsewhere, or we have already made the incident public (Article 17(3)).","If an incident involves a personal data breach, CERT-EU supports us in cooperation with the EDPS (Article 13(11))."]}],"why":"A list, because the safeguards are parallel. The third item answers the staff representatives' main fear directly and honestly: CERT-EU can share incident details with national authorities without asking us, personal data stay protected, and the identity rule has named exceptions. Hiding that would mislead an expert reader.","anchors":[1,3,5],"weaker":"Rest assured that all appropriate safeguards are in place and that data protection is fully respected."},{"label":"Close","blocks":[{"type":"p","text":"I would be glad to prepare with you a short joint note for the staff representatives, and to review our incident-reporting templates so that they contain only the personal data that are strictly necessary."},{"type":"p","text":"Kind regards,\n[Name]\nLocal Cybersecurity Officer"}],"why":"Offers two concrete actions: one for the relay to staff, one that turns the necessity principle into practice. About 320 words.","anchors":[1,4],"weaker":null}],"takeaways":["With an expert reader, use their vocabulary and give precise legal bases.","Answer the fear behind the question, even if it was relayed second-hand.","Be honest about exceptions; vague reassurance destroys trust.","Turn a principle (necessity) into a concrete action."],"words":315,"whyLikely":[{"type":"p","text":"Information sharing, confidentiality and personal data (Arts 4, 17, 19, 20; recitals 39–45) are a distinct block of the Regulation, and a concerned reader with legal instincts makes a good EUFTE scenario. It is lower on my list because the passages are scattered. My judgement, not EPSO information. No practice assignment covers it: you can read this model now, or write it first as extra practice."}],"overlap":null,"id":"p10","rank":10}],"summary":{"source":"eufte/regulation-summary.md","title":"Executive summary of Regulation (EU, Euratom) 2023/2841","intro":"**Written by your trainer on 2026-11-23 to make drafting easier. It is a summary, not the source:** on test day you have only the PDF (TAO instructions §6.4.1), and wording you quote must come from it. Source: EPSO's EN source document, `source/eufte-source/EN_source_document_AD-429.pdf`, retrieved 2026-11-22 from https://selection.eu-careers.europa.eu/en/documents/written-test/20947. Quotations are checked against the PDF; \"p.\" is the PDF page. What a passage means for a drafter is my judgement and is marked as such.","blocks":[{"type":"h2","text":"The bottom line"},{"type":"p","text":"Since January 2024, every EU institution, body, office and agency has had to manage its own cybersecurity under one common set of rules. Each one sets up an internal **Frame
