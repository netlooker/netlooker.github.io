 that the PO chairs the PSC.","B":"It should be chaired by the SP instead of the PO, because the SP is accountable for the project deliverables.","C":"It must include at least the PO, SP, BM and PM, and the LISO may also take part as an optional member.","D":"It should replace the LISO with the AGB, because the AGB is a permanent member of every PSC in PM²."},"answer":"C","why_right_html":"<p>\"The Project Steering Committee (PSC) comprises at least the four roles in the Managing and Directing Layers\". These are the PO and SP (Directing Layer) and the BM and PM (Managing Layer) (PM² 3.1 §4.2 and §4.4, pp.23–24). \"Other roles can also participate as per the project's needs\", and the LISO is listed among the optional members (§4.4, pp.24–25).<\/p>","why_wrong":{"A":"A: PM² does not let a project drop the four permanent roles. The PO does chair the PSC (§4.4, p.24), but that alone is not enough.","B":"B: the PSC \"is chaired by the Project Owner (PO)\" (§4.4, p.24). The SP is accountable for deliverables (§4.6, p.25) but does not chair.","D":"D: the AGB is not a PSC member. The Steering Layer \"reports to the Appropriate Governance Body (AGB)\" (§4.2, p.23)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"The Project Steering Committee (PSC) comprises at least the four roles in the Managing and Directing Layers\". These are the PO and SP (Directing Layer) and the BM and PM (Managing Layer) (PM² 3.1 §4.2 and §4.4, pp.23–24). \"Other roles can also participate as per the project's needs\", and the LISO is listed among the optional members (§4.4, pp.24–25).<\/p><ul><li>A: PM² does not let a project drop the four permanent roles. The PO does chair the PSC (§4.4, p.24), but that alone is not enough.<\/li><li>B: the PSC \"is chaired by the Project Owner (PO)\" (§4.4, p.24). The SP is accountable for deliverables (§4.6, p.25) but does not chair.<\/li><li>D: the AGB is not a PSC member. The Steering Layer \"reports to the Appropriate Governance Body (AGB)\" (§4.2, p.23).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-17","id":17,"topic":17,"type":"scenario","word_count":112,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"<p>An EU agency's PM² project to build a new grants database is at the end of the Planning Phase. The approved Business Case foresaw a budget of EUR 2 million and a go-live in 12 months. The detailed Project Work Plan now shows a cost of EUR 2.7 million and a go-live in 18 months. The Project Manager (PM) and the Project Steering Committee (PSC) agree that these are major deviations from the approved Business Case. The Project Owner wants the PSC to approve the move at its next meeting, so that work can start at once.<\/p><p>According to PM², what is required before the project can move to the Executing Phase?<\/p>","stem_text":"An EU agency's PM² project to build a new grants database is at the end of the Planning Phase. The approved Business Case foresaw a budget of EUR 2 million and a go-live in 12 months. The detailed Project Work Plan now shows a cost of EUR 2.7 million and a go-live in 18 months. The Project Manager (PM) and the Project Steering Committee (PSC) agree that these are major deviations from the approved Business Case. The Project Owner wants the PSC to approve the move at its next meeting, so that work can start at once. According to PM², what is required before the project can move to the Executing Phase?","options":{"A":"Only the Project Owner's signature on the Project Work Plan, after which the PM may move the project on.","B":"An additional approval from the Appropriate Governance Body (AGB), obtained by the PSC.","C":"A return to the Initiating Phase, with a new Project Initiation Request and Business Case.","D":"Only the PSC's own approval, since the PSC always authorises the transition between phases."},"answer":"B","why_right_html":"<p>At the RfE gate, \"If major deviations from the approved Business Case and/or Project Charter are identified, then the Project Steering Committee (PSC) must receive an additional approval from the Appropriate Governance Body (AGB) before the project can move on to the Executing Phase\" (PM² 3.1 §6.9, p.53). The stem states that the deviations (+35% cost, +6 months) are major.<\/p><ul><li>Tip: v1 tested what the AGB is. Here you must know when it steps back in during the lifecycle.<\/li><\/ul>","why_wrong":{"A":"A: the PM \"requests approval from the Project Steering Committee (PSC)\" at RfE (§6.9). A PO signature alone does not open the gate.","C":"C: PM² provides no return to Initiating at this gate. Deviations are dealt with by AGB approval.","D":"D: the PSC normally authorises phase transitions (§4.4, p.25), but not alone when there are major deviations from the Business Case."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>At the RfE gate, \"If major deviations from the approved Business Case and/or Project Charter are identified, then the Project Steering Committee (PSC) must receive an additional approval from the Appropriate Governance Body (AGB) before the project can move on to the Executing Phase\" (PM² 3.1 §6.9, p.53). The stem states that the deviations (+35% cost, +6 months) are major.<\/p><ul><li>A: the PM \"requests approval from the Project Steering Committee (PSC)\" at RfE (§6.9). A PO signature alone does not open the gate.<\/li><li>C: PM² provides no return to Initiating at this gate. Deviations are dealt with by AGB approval.<\/li><li>D: the PSC normally authorises phase transitions (§4.4, p.25), but not alone when there are major deviations from the Business Case.<\/li><li>Tip: v1 tested what the AGB is. Here you must know when it steps back in during the lifecycle.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-18","id":18,"topic":18,"type":"long","word_count":170,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"<p>During the Planning Phase of a PM² project to introduce electronic signatures in a Directorate-General, the Project Manager (PM) prepares a Stakeholder Interest/Influence Matrix (SIIM) with help from the Business Manager. The PM plans to publish it on the DG's open intranet wiki, so that everyone can see how they have been rated. Some entries:<\/p><ul><li>Director of Resources: decides on the project's funding and staff; neutral towards the project; rarely attends meetings.<\/li><li>Head of Unit A.1: strongly in favour of the project and speaks for it at every meeting; has no say over the budget or the plan.<\/li><li>Staff representative: openly negative about the project.<\/li><\/ul><p>The PM rates the Head of Unit A.1 as high influence \"because of the energy she brings\", and the Director as low influence, because he is rarely seen. The PM also intends to drop the staff representative from the matrix because he is negative, and to treat the analysis as final once it has been approved.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"During the Planning Phase of a PM² project to introduce electronic signatures in a Directorate-General, the Project Manager (PM) prepares a Stakeholder Interest/Influence Matrix (SIIM) with help from the Business Manager. The PM plans to publish it on the DG's open intranet wiki, so that everyone can see how they have been rated. Some entries: Director of Resources: decides on the project's funding and staff; neutral towards the project; rarely attends meetings. Head of Unit A.1: strongly in favour of the project and speaks for it at every meeting; has no say over the budget or the plan. Staff representative: openly negative about the project. The PM rates the Head of Unit A.1 as high influence \"because of the energy she brings\", and the Director as low influence, because he is rarely seen. The PM also intends to drop the staff representative from the matrix because he is negative, and to treat the analysis as final once it has been approved. Which statement is correct according to the PM² Guide?","options":{"A":"The Head of Unit A.1 is rightly rated high influence, since in the SIIM influence reflects the enthusiasm a stakeholder shows.","B":"The Director should be rated high influence, as the person who decides on funding and resources usually has high influence.","C":"The staff representative should be removed from the matrix, since the SIIM is used only to identify the project's champions.","D":"The SIIM should go on the open wiki, and the analysis need not be repeated once the Project Owner has approved it."},"answer":"B","why_right_html":"<p>\"Influence indicates the power the stakeholder has over the planning and implementation of activities. The higher a stakeholder's power of decision, the higher their influence. Most often the person(s) who can make decisions on project funding and/or resources has a high influence\" (PM² 3.1 App. C.3, p. A-101). How often someone attends meetings is not the measure.<\/p>","why_wrong":{"A":"A: enthusiasm measures interest, not influence: \"Interest is measured as the degree of enthusiasm displayed by the stakeholder in support of the project\" (App. C.3). The Head of Unit A.1 has high interest but low influence.","C":"C: the SIIM helps \"identify project champions and possible detractors\" (App. C.3). The PM should \"Beware of stakeholders who are less than enthusiastic or opposed to the project\" (§9.4, step 1, p.73), not drop them.","D":"D: wrong on both counts. Because the SIIM refers to people, \"care should be used to keep the information confidential\" (App. C.3). Also, \"A one-off analysis exercise is not enough\"; stakeholder reactions must be monitored continually (§9.4, step 3, p.73)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Influence indicates the power the stakeholder has over the planning and implementation of activities. The higher a stakeholder's power of decision, the higher their influence. Most often the person(s) who can make decisions on project funding and/or resources has a high influence\" (PM² 3.1 App. C.3, p. A-101). How often someone attends meetings is not the measure.<\/p><ul><li>A: enthusiasm measures interest, not influence: \"Interest is measured as the degree of enthusiasm displayed by the stakeholder in support of the project\" (App. C.3). The Head of Unit A.1 has high interest but low influence.<\/li><li>C: the SIIM helps \"identify project champions and possible detractors\" (App. C.3). The PM should \"Beware of stakeholders who are less than enthusiastic or opposed to the project\" (§9.4, step 1, p.73), not drop them.<\/li><li>D: wrong on both counts. Because the SIIM refers to people, \"care should be used to keep the information confidential\" (App. C.3). Also, \"A one-off analysis exercise is not enough\"; stakeholder reactions must be monitored continually (§9.4, step 3, p.73).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-19","id":19,"topic":19,"type":"scenario","word_count":114,"batch":1,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and governance","stem_html":"<p>Unit B.3 of an EU agency is running a PM² project to replace its grant-reporting tool. In the Planning Phase, the Project Manager prepared the Project Stakeholder Matrix with the help of the Business Manager. The Head of the Finance Unit was recorded as positive towards the project.<\/p><p>Five months into the Executing Phase, the situation has changed. The Head of Finance, who decides how many finance staff will take part in user testing, now openly questions the project in meetings. The Project Manager also learns that a new Data Protection Coordinator has joined the agency and has asked to be kept informed.<\/p><p>What should the Project Manager do, according to the PM² Guide?<\/p>","stem_text":"Unit B.3 of an EU agency is running a PM² project to replace its grant-reporting tool. In the Planning Phase, the Project Manager prepared the Project Stakeholder Matrix with the help of the Business Manager. The Head of the Finance Unit was recorded as positive towards the project. Five months into the Executing Phase, the situation has changed. The Head of Finance, who decides how many finance staff will take part in user testing, now openly questions the project in meetings. The Project Manager also learns that a new Data Protection Coordinator has joined the agency and has asked to be kept informed. What should the Project Manager do, according to the PM² Guide?","options":{"A":"Keep the Stakeholder Matrix unchanged, since stakeholder analysis is a Planning activity and the matrix was accepted at the RfE gate.","B":"Hand the management of the Head of Finance over to the Business Manager, since the Head of Finance is a requestor-side stakeholder.","C":"Record the Head of Finance as low influence, since in the PM² matrix influence reflects how much enthusiasm a stakeholder shows.","D":"Analyse again the interest and influence of the stakeholders concerned, update the Stakeholder Matrix and adapt communication."},"answer":"D","why_right_html":"<p>Stakeholder management runs through the whole project, not only Planning. Step 1 is to \"Analyse the expectations, attitudes, level of interest and influence of key project stakeholders\", and step 3 warns that \"A one-off analysis exercise is not enough\". The outputs include the \"Project Stakeholder Matrix (updated)\", and step 5 is to \"Align the Communications Management Plan with Stakeholder Management needs\" (PM² 3.1 §9.4, p.73). The change of attitude and the new Data Protection Coordinator both call for this.<\/p><ul><li>Tip: a stakeholder whose attitude turns negative is one to watch more closely, not to downgrade.<\/li><\/ul>","why_wrong":{"A":"A: the activity \"begins in the Initiating Phase\" and \"ends in the Closing Phase\" (§9.4, p.73). The matrix is a living document, whatever was accepted at the RfE gate.","B":"B: \"Responsibility for this activity belongs to the Project Manager (PM)\". The Business Manager should \"help manage stakeholders on the requestor side\", but does not take it over (§9.4, p.73).","C":"C: this confuses the two axes of the matrix. Enthusiasm measures interest. Influence is \"the power the stakeholder has over the planning and implementation of activities\" (App. C.3, p. A-101). Someone who decides on staff for testing has high influence."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Stakeholder management runs through the whole project, not only Planning. Step 1 is to \"Analyse the expectations, attitudes, level of interest and influence of key project stakeholders\", and step 3 warns that \"A one-off analysis exercise is not enough\". The outputs include the \"Project Stakeholder Matrix (updated)\", and step 5 is to \"Align the Communications Management Plan with Stakeholder Management needs\" (PM² 3.1 §9.4, p.73). The change of attitude and the new Data Protection Coordinator both call for this.<\/p><ul><li>A: the activity \"begins in the Initiating Phase\" and \"ends in the Closing Phase\" (§9.4, p.73). The matrix is a living document, whatever was accepted at the RfE gate.<\/li><li>B: \"Responsibility for this activity belongs to the Project Manager (PM)\". The Business Manager should \"help manage stakeholders on the requestor side\", but does not take it over (§9.4, p.73).<\/li><li>C: this confuses the two axes of the matrix. Enthusiasm measures interest. Influence is \"the power the stakeholder has over the planning and implementation of activities\" (App. C.3, p. A-101). Someone who decides on staff for testing has high influence.<\/li><li>Tip: a stakeholder whose attitude turns negative is one to watch more closely, not to downgrade.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-20","id":20,"topic":20,"type":"scenario","word_count":107,"batch":1,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"<p>A Directorate-General launches a PM² project to build a new case-tracking system. A policy unit is the requestor and the DG's IT unit is the provider.<\/p><p>The draft Project Handbook proposes the following Project Steering Committee: the Director of the policy unit as Project Owner and chair, a Head of Sector from the policy unit as Business Manager, and two User Representatives. The Head of the IT unit, who will act as Solution Provider, would be \"invited when needed\". The Project Manager, who comes from the IT unit, would attend only to present the status reports.<\/p><p>Which comment on this draft is consistent with the PM² Guide?<\/p>","stem_text":"A Directorate-General launches a PM² project to build a new case-tracking system. A policy unit is the requestor and the DG's IT unit is the provider. The draft Project Handbook proposes the following Project Steering Committee: the Director of the policy unit as Project Owner and chair, a Head of Sector from the policy unit as Business Manager, and two User Representatives. The Head of the IT unit, who will act as Solution Provider, would be \"invited when needed\". The Project Manager, who comes from the IT unit, would attend only to present the status reports. Which comment on this draft is consistent with the PM² Guide?","options":{"A":"The committee should include at least the Project Owner, Solution Provider, Business Manager and Project Manager.","B":"The draft is acceptable, because the committee represents the requestor side and the provider side simply reports to it.","C":"The Solution Provider should chair the committee instead, because the provider side is the one that delivers the system.","D":"The two User Representatives should be removed, because only roles from the Directing Layer may sit on the committee."},"answer":"A","why_right_html":"<p>The PSC \"comprises at least the four roles in the Managing and Directing Layers, providing a balanced mix of requestor- and provider-side representatives\" (PM² 3.1 §4.4, p.24). Those four roles are the PO and SP (Directing Layer) and the BM and PM (Managing Layer) (§4.2, p.23–24). The draft leaves out the whole provider side as members.<\/p>","why_wrong":{"B":"B: the PSC is not a requestor-side body. It needs both sides (§4.4, p.24).","C":"C: the PSC \"is chaired by the Project Owner (PO)\" (§4.4, p.24; §4.5, p.25).","D":"D: User Representatives are among the optional members: \"Other roles can also participate as per the project's needs\" (§4.4, p.24–25). The PSC is also not limited to the Directing Layer, because the Managing Layer roles are permanent members."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The PSC \"comprises at least the four roles in the Managing and Directing Layers, providing a balanced mix of requestor- and provider-side representatives\" (PM² 3.1 §4.4, p.24). Those four roles are the PO and SP (Directing Layer) and the BM and PM (Managing Layer) (§4.2, p.23–24). The draft leaves out the whole provider side as members.<\/p><ul><li>B: the PSC is not a requestor-side body. It needs both sides (§4.4, p.24).<\/li><li>C: the PSC \"is chaired by the Project Owner (PO)\" (§4.4, p.24; §4.5, p.25).<\/li><li>D: User Representatives are among the optional members: \"Other roles can also participate as per the project's needs\" (§4.4, p.24–25). The PSC is also not limited to the Directing Layer, because the Managing Layer roles are permanent members.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-21","id":21,"topic":21,"type":"long","word_count":193,"batch":1,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"<p>A Directorate-General is introducing an electronic signature workflow for all its units. The IT unit, as provider, will deliver the software in month 9. On the requestor side, the Director of Resources is the Project Owner and a Head of Sector is the Business Manager. A Business Implementation Group (BIG) of six unit representatives has been set up; two of them are also User Representatives.<\/p><p>At the Planning kick-off meeting, participants disagree about who should do what for the Business Implementation Plan:<\/p><ul><li>The Project Manager says he will prepare it, as he prepares most other Planning artefacts.<\/li><li>One BIG member says the BIG should approve the plan, because the BIG will carry out the business changes.<\/li><li>The Project Owner says she expects to approve it herself.<\/li><li>The Business Manager says she will need the BIG's input on how the new workflow affects processes, staff and culture in each unit.<\/li><\/ul><p>The Project Manager also reminds everyone that the plan must cover process redesign, communication, change-management activities and training needs, and that these activities will have to be scheduled.<\/p><p>According to the PM² Guide, which allocation of responsibilities for the Business Implementation Plan is correct?<\/p>","stem_text":"A Directorate-General is introducing an electronic signature workflow for all its units. The IT unit, as provider, will deliver the software in month 9. On the requestor side, the Director of Resources is the Project Owner and a Head of Sector is the Business Manager. A Business Implementation Group (BIG) of six unit representatives has been set up; two of them are also User Representatives. At the Planning kick-off meeting, participants disagree about who should do what for the Business Implementation Plan: The Project Manager says he will prepare it, as he prepares most other Planning artefacts. One BIG member says the BIG should approve the plan, because the BIG will carry out the business changes. The Project Owner says she expects to approve it herself. The Business Manager says she will need the BIG's input on how the new workflow affects processes, staff and culture in each unit. The Project Manager also reminds everyone that the plan must cover process redesign, communication, change-management activities and training needs, and that these activities will have to be scheduled. According to the PM² Guide, which allocation of responsibilities for the Business Implementation Plan is correct?","options":{"A":"The Business Manager prepares it, the Project Manager assists and adds its activities to the Work Plan, the BIG is consulted, and the Project Owner approves it.","B":"The Project Manager prepares it as for other Planning artefacts, the Business Manager reviews it, the BIG is informed, and the Project Steering Committee approves it.","C":"The BIG prepares it because it carries out the business changes, the Business Manager approves it, and the Project Manager is only informed of the result.","D":"The Project Manager prepares it with the Business Manager's support, the BIG is consulted on the impact analysis, and the Project Owner approves it."},"answer":"A","why_right_html":"<p>For the Business Implementation Plan, the Business Manager \"Prepares the Business Implementation Plan\". The Project Manager \"Assists the Business Manager (BM)\" and \"Updates the Project Work Plan to include all business implementation activities\". The BIG is \"Consulted during the impact analysis\", and the Project Owner \"Reviews and approves\" the plan (PM² 3.1 §6.8, p.52). The RASCI agrees: PO A, BM R, PM S, BIG C.<\/p>","why_wrong":{"B":"B: this is the pattern for most Planning artefacts, which is why it is tempting. The Business Implementation Plan is one of the exceptions: the PM oversees all management artefacts \"except the Project Initiation Request, Business Case and Business Implementation Plan\" (§4.8, p.26). The BIG is consulted, not only informed, and the approver is the PO, not the PSC.","C":"C: the BIG is coordinated by the BM and plans and implements the business changes (§4.9, p.27), but it does not prepare this plan, and the BM does not approve it.","D":"D: this swaps the preparer and the assistant. The BM prepares the plan and the PM assists, not the other way round (§6.8, p.52)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>For the Business Implementation Plan, the Business Manager \"Prepares the Business Implementation Plan\". The Project Manager \"Assists the Business Manager (BM)\" and \"Updates the Project Work Plan to include all business implementation activities\". The BIG is \"Consulted during the impact analysis\", and the Project Owner \"Reviews and approves\" the plan (PM² 3.1 §6.8, p.52). The RASCI agrees: PO A, BM R, PM S, BIG C.<\/p><ul><li>B: this is the pattern for most Planning artefacts, which is why it is tempting. The Business Implementation Plan is one of the exceptions: the PM oversees all management artefacts \"except the Project Initiation Request, Business Case and Business Implementation Plan\" (§4.8, p.26). The BIG is consulted, not only informed, and the approver is the PO, not the PSC.<\/li><li>C: the BIG is coordinated by the BM and plans and implements the business changes (§4.9, p.27), but it does not prepare this plan, and the BM does not approve it.<\/li><li>D: this swaps the preparer and the assistant. The BM prepares the plan and the PM assists, not the other way round (§6.8, p.52).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-22","id":22,"topic":22,"type":"scenario","word_count":103,"batch":1,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"<p>The Business Manager of a PM² project in a Directorate-General is drafting the Business Case for a new e-procurement platform. Under the heading \"Expected benefits\" she lists three items:<\/p><ul><li>Item 1: the new e-procurement platform, delivered and in use by all units.<\/li><li>Item 2: better visibility of the status of each tender for staff and managers.<\/li><li>Item 3: average time to publish a call for tenders reduced from 15 to 9 working days.<\/li><\/ul><p>Before the Business Case goes to the Project Owner, she asks the Project Manager to check that the list uses PM² terms correctly.<\/p><p>Which comment should the Project Manager make?<\/p>","stem_text":"The Business Manager of a PM² project in a Directorate-General is drafting the Business Case for a new e-procurement platform. Under the heading \"Expected benefits\" she lists three items: Item 1: the new e-procurement platform, delivered and in use by all units. Item 2: better visibility of the status of each tender for staff and managers. Item 3: average time to publish a call for tenders reduced from 15 to 9 working days. Before the Business Case goes to the Project Owner, she asks the Project Manager to check that the list uses PM² terms correctly. Which comment should the Project Manager make?","options":{"A":"All three items are benefits, because each of them brings value to the organisation.","B":"Items 2 and 3 are benefits; only item 1 should be moved, because it is an output.","C":"Item 1 is the main benefit, because the deliverables are the real purpose of a project.","D":"Only item 3 is a benefit; item 1 is an output and item 2 is an outcome."},"answer":"D","why_right_html":"<p>\"Project outputs (deliverables) are products/services, which introduce something new (a change). The change results in an outcome. The benefits are the measurable improvements resulting from this outcome\" (PM² 3.1 §2.1.3, p.6). The guide's own example lists \"Improved visibility of project objectives, status and forecasts\" as an outcome, and \"Project cost overruns decreased by 30%\" as a benefit (§2.1.3, p.6). The glossary adds: \"Benefits should be measurable\" (App. G, p. A-123). Item 1 is the output, item 2 is an outcome (better visibility, not measured), and item 3 is the only measurable improvement.<\/p>","why_wrong":{"A":"A: adding value is not the test. A benefit must be a measurable improvement that results from an outcome.","B":"B: this is the most tempting distractor. Better visibility sounds like a benefit, but it has no measure, and the guide classifies visibility as an outcome.","C":"C: the guide says the opposite: \"project deliverables are merely a means to an end. The real purpose of a project is to achieve given outcomes that will yield measurable benefits\" (§2.1.3, p.6)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"Project outputs (deliverables) are products/services, which introduce something new (a change). The change results in an outcome. The benefits are the measurable improvements resulting from this outcome\" (PM² 3.1 §2.1.3, p.6). The guide's own example lists \"Improved visibility of project objectives, status and forecasts\" as an outcome, and \"Project cost overruns decreased by 30%\" as a benefit (§2.1.3, p.6). The glossary adds: \"Benefits should be measurable\" (App. G, p. A-123). Item 1 is the output, item 2 is an outcome (better visibility, not measured), and item 3 is the only measurable improvement.<\/p><ul><li>A: adding value is not the test. A benefit must be a measurable improvement that results from an outcome.<\/li><li>B: this is the most tempting distractor. Better visibility sounds like a benefit, but it has no measure, and the guide classifies visibility as an outcome.<\/li><li>C: the guide says the opposite: \"project deliverables are merely a means to an end. The real purpose of a project is to achieve given outcomes that will yield measurable benefits\" (§2.1.3, p.6).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-23","id":23,"topic":23,"type":"scenario","word_count":118,"batch":1,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"<p>An EU agency is closing a PM² project that delivered a new online helpdesk. The Business Case set two success criteria: the helpdesk goes live by 30 June, and 90% of helpdesk staff are trained by that date. Both were met, and the Project Owner has formally accepted the deliverables. The Business Case also describes an expected benefit: the average time to resolve a request should fall by 30% within 12 months of go-live.<\/p><p>At the Project-End Review Meeting, a member of the Project Steering Committee argues that the project cannot be judged a success until the 30% reduction has been measured, and that it should stay open until then.<\/p><p>Which response is consistent with the PM² Guide?<\/p>","stem_text":"An EU agency is closing a PM² project that delivered a new online helpdesk. The Business Case set two success criteria: the helpdesk goes live by 30 June, and 90% of helpdesk staff are trained by that date. Both were met, and the Project Owner has formally accepted the deliverables. The Business Case also describes an expected benefit: the average time to resolve a request should fall by 30% within 12 months of go-live. At the Project-End Review Meeting, a member of the Project Steering Committee argues that the project cannot be judged a success until the 30% reduction has been measured, and that it should stay open until then. Which response is consistent with the PM² Guide?","options":{"A":"Keep the project open until the reduction is measured, because PM² judges project success on benefits rather than on success criteria.","B":"Judge the project at closure against its success criteria, and recommend in the Project-End Report how the benefit will be followed up after closure.","C":"Close the project only once the RfC phase gate has confirmed that the 30% reduction in resolution time has been achieved.","D":"Close the project and treat the benefit as achieved, because the Project Owner has formally accepted all the deliverables."},"answer":"B","why_right_html":"<p>Success criteria and benefits are different measures. The glossary says: \"Do not confuse success criteria with benefits: While success criteria can be measured at project closure, benefits are often achieved long after project closure\" (PM² 3.1 App. G, p. A-139). The project has met its success criteria, so it can close. Outcomes and benefits \"are often realised only after the project has closed\" (§2.1.3, p.6). Benefits Management continues into the Project-End Report at Closing (§5.3, Related Artefacts, p.35), and post-project activities \"are the responsibility of the permanent organisation\" and are \"recommended in the Project-End Report\" (App. G, glossary entry \"Post-project\", p. A-131). So the report recommends how the benefit is followed up.<\/p>","why_wrong":{"A":"A: this reverses the guide. Success criteria are what the project is judged on at closure. A project that stays open until a benefit 12 months away is measured would never close on time.","C":"C: the RfC (Ready for Closing) gate sits between the Executing and Closing Phases (§3.2.6). It does not check benefits, which usually arrive later.","D":"D: acceptance of deliverables shows that the outputs are fit. It does not show that the measurable benefit has been realised."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Success criteria and benefits are different measures. The glossary says: \"Do not confuse success criteria with benefits: While success criteria can be measured at project closure, benefits are often achieved long after project closure\" (PM² 3.1 App. G, p. A-139). The project has met its success criteria, so it can close. Outcomes and benefits \"are often realised only after the project has closed\" (§2.1.3, p.6). Benefits Management continues into the Project-End Report at Closing (§5.3, Related Artefacts, p.35), and post-project activities \"are the responsibility of the permanent organisation\" and are \"recommended in the Project-End Report\" (App. G, glossary entry \"Post-project\", p. A-131). So the report recommends how the benefit is followed up.<\/p><ul><li>A: this reverses the guide. Success criteria are what the project is judged on at closure. A project that stays open until a benefit 12 months away is measured would never close on time.<\/li><li>C: the RfC (Ready for Closing) gate sits between the Executing and Closing Phases (§3.2.6). It does not check benefits, which usually arrive later.<\/li><li>D: acceptance of deliverables shows that the outputs are fit. It does not show that the measurable benefit has been realised.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-24","id":24,"topic":24,"type":"long","word_count":183,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>An EU agency is building a new case-management system in a PM² project, with development outsourced to a contractor. The Project Steering Committee has assigned a Project Quality Assurance (PQA) role, filled by a member of the agency's internal quality team. The Quality Management Plan requires a code review for every module before it is released for testing.<\/p><p>Halfway through the Executing Phase, the PQA carries out an audit and finds the following:<\/p><ul><li>3 of the 8 modules delivered so far were released without the required code review.<\/li><li>The contractor's team has kept no evidence of the reviews it says it did on the other modules.<\/li><li>The project is two weeks behind schedule.<\/li><\/ul><p>When he hears of the findings, the Project Manager asks the PQA to send the audit report to him first, so that he can decide whether the Project Steering Committee needs to see it. At the same time, the Contractor's Project Manager proposes to skip the code reviews for the remaining five modules in order to recover the delay.<\/p><p>Which course of action is MOST consistent with the PM² Guide?<\/p>","stem_text":"An EU agency is building a new case-management system in a PM² project, with development outsourced to a contractor. The Project Steering Committee has assigned a Project Quality Assurance (PQA) role, filled by a member of the agency's internal quality team. The Quality Management Plan requires a code review for every module before it is released for testing. Halfway through the Executing Phase, the PQA carries out an audit and finds the following: 3 of the 8 modules delivered so far were released without the required code review. The contractor's team has kept no evidence of the reviews it says it did on the other modules. The project is two weeks behind schedule. When he hears of the findings, the Project Manager asks the PQA to send the audit report to him first, so that he can decide whether the Project Steering Committee needs to see it. At the same time, the Contractor's Project Manager proposes to skip the code reviews for the remaining five modules in order to recover the delay. Which course of action is MOST consistent with the PM² Guide?","options":{"A":"The PQA reports its findings directly to the Steering Committee; the Project Manager has the root cause analysed and corrective actions applied, and the code reviews continue.","B":"The PQA sends the report to the Project Manager first, as he is accountable for all quality assurance; the code reviews may be skipped if the Steering Committee is told about it later.","C":"The PQA corrects the three modules itself, as it is responsible for quality assurance and auditing; the Project Manager informs the Steering Committee at its next meeting.","D":"The code reviews may be skipped if the Contractor's Project Manager agrees, as the contractor's team is responsible for the quality of the outsourced deliverables."},"answer":"A","why_right_html":"<p>The PQA is \"Assigned by the Project Steering Committee (PSC) and working independently of the Project Manager (PM)\", and reports \"directly to the Project Steering Committee (PSC)\" (PM² 3.1 §4.11, p.28). So the PM cannot filter its findings. For non-conformities, Manage Quality says: \"Identify any non-conformity, analyse the root cause, and implement corrective actions\" (§9.9, step 5, p.80). The code reviews are required by the Quality Management Plan, and the team \"must provide evidence of adherence to the quality assurance standards and procedures\" (§7.3, p.58). The Contractor's PM is a Project Core Team role (§4.10, p.27), so this applies to the contractor's team too.<\/p><ul><li>Tip: when PM² says a role works \"independently\" and reports \"directly\" to a body, a distractor that routes its output through someone else is wrong.<\/li><\/ul>","why_wrong":{"B":"B: the PM is indeed \"Accountable for carrying out all Quality Assurance activities\" (§7.3, p.58). That does not make the PQA report to him, and it gives no basis for dropping a control that the Quality Management Plan requires.","C":"C: the PQA reviews processes and artefacts, identifies non-conformities and recommends \"corrective actions\" (§4.11, p.28). It does not rework the deliverables itself; the Project Core Team produces them (§4.10, p.27).","D":"D: the Contractor's PM must ensure that work is done \"to the agreed standards\" (§4.10, p.27). He cannot waive those standards on his own."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The PQA is \"Assigned by the Project Steering Committee (PSC) and working independently of the Project Manager (PM)\", and reports \"directly to the Project Steering Committee (PSC)\" (PM² 3.1 §4.11, p.28). So the PM cannot filter its findings. For non-conformities, Manage Quality says: \"Identify any non-conformity, analyse the root cause, and implement corrective actions\" (§9.9, step 5, p.80). The code reviews are required by the Quality Management Plan, and the team \"must provide evidence of adherence to the quality assurance standards and procedures\" (§7.3, p.58). The Contractor's PM is a Project Core Team role (§4.10, p.27), so this applies to the contractor's team too.<\/p><ul><li>B: the PM is indeed \"Accountable for carrying out all Quality Assurance activities\" (§7.3, p.58). That does not make the PQA report to him, and it gives no basis for dropping a control that the Quality Management Plan requires.<\/li><li>C: the PQA reviews processes and artefacts, identifies non-conformities and recommends \"corrective actions\" (§4.11, p.28). It does not rework the deliverables itself; the Project Core Team produces them (§4.10, p.27).<\/li><li>D: the Contractor's PM must ensure that work is done \"to the agreed standards\" (§4.10, p.27). He cannot waive those standards on his own.<\/li><li>Tip: when PM² says a role works \"independently\" and reports \"directly\" to a body, a distractor that routes its output through someone else is wrong.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-25","id":25,"topic":25,"type":"scenario","word_count":91,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>Unit D.1 of a small EU agency is running a six-month PM² project to upgrade its intranet. There is no budget for a Project Quality Assurance (PQA) role, and the Quality Management Plan is still being drafted.<\/p><p>At the Planning kick-off meeting, the Head of Unit says: \"Without a PQA, we simply cannot do quality assurance on this project. We will rely on the Project Owner's final acceptance of the deliverables instead.\" The Project Manager has to respond before the plan is finalised.<\/p><p>Which response is consistent with the PM² Guide?<\/p>","stem_text":"Unit D.1 of a small EU agency is running a six-month PM² project to upgrade its intranet. There is no budget for a Project Quality Assurance (PQA) role, and the Quality Management Plan is still being drafted. At the Planning kick-off meeting, the Head of Unit says: \"Without a PQA, we simply cannot do quality assurance on this project. We will rely on the Project Owner's final acceptance of the deliverables instead.\" The Project Manager has to respond before the plan is finalised. Which response is consistent with the PM² Guide?","options":{"A":"The project must ask the Project Steering Committee to assign a PQA before the RfE gate, because PM² makes this role compulsory.","B":"Quality assurance can still be done by the Project Manager or other project roles, as documented in the Quality Management Plan.","C":"The Project Owner's final acceptance can replace quality assurance, because both confirm that the deliverables meet the agreed criteria.","D":"Quality assurance can then be carried out only by the Project Core Team, because the team must adhere to the quality assurance standards."},"answer":"B","why_right_html":"<p>\"Quality Assurance activities are documented in the Quality Management Plan. These can be performed by the Project Manager (PM), the Project Quality Assurance (PQA) role, or other project roles such as the Project Core Team (PCT), the Business Manager (BM) or the Solution Provider (SP). External audits undertaken by entities outside the project can also be defined\" (PM² 3.1 §7.3, p.58). Having no PQA does not remove quality assurance.<\/p>","why_wrong":{"A":"A: the PQA \"is an optional role in an organisation\" (§4.11, p.28).","C":"C: acceptance and quality assurance are different activities. Quality assurance is \"gathering evidence that proves the project work is following high-quality standards, methodologies and best practices\" during the project (§7.3, p.58). Acceptance checks deliverables against criteria at the end (§9.10, p.81).","D":"D: the Project Core Team \"Adheres to the project's Quality Assurance standards\" (§7.3, p.58), but the guide names several other roles that can carry out quality assurance. \"Only\" is wrong."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Quality Assurance activities are documented in the Quality Management Plan. These can be performed by the Project Manager (PM), the Project Quality Assurance (PQA) role, or other project roles such as the Project Core Team (PCT), the Business Manager (BM) or the Solution Provider (SP). External audits undertaken by entities outside the project can also be defined\" (PM² 3.1 §7.3, p.58). Having no PQA does not remove quality assurance.<\/p><ul><li>A: the PQA \"is an optional role in an organisation\" (§4.11, p.28).<\/li><li>C: acceptance and quality assurance are different activities. Quality assurance is \"gathering evidence that proves the project work is following high-quality standards, methodologies and best practices\" during the project (§7.3, p.58). Acceptance checks deliverables against criteria at the end (§9.10, p.81).<\/li><li>D: the Project Core Team \"Adheres to the project's Quality Assurance standards\" (§7.3, p.58), but the guide names several other roles that can carry out quality assurance. \"Only\" is wrong.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-26","id":26,"topic":26,"type":"scenario","word_count":95,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>A contractor has delivered a new leave-management system to a Directorate-General. With the software come four supporting deliverables: a User Manual, an Operations Manual, training materials and release notes.<\/p><p>To save time, the Project Manager plans to ask the Business Manager to review all four documents alone, and to put only the software itself through the formal acceptance process. The Business Manager has no experience of IT operations or training. The Project Owner will formally accept the deliverables at the end, on the basis of the Deliverables Acceptance Plan.<\/p><p>Which arrangement follows the PM² Guide?<\/p>","stem_text":"A contractor has delivered a new leave-management system to a Directorate-General. With the software come four supporting deliverables: a User Manual, an Operations Manual, training materials and release notes. To save time, the Project Manager plans to ask the Business Manager to review all four documents alone, and to put only the software itself through the formal acceptance process. The Business Manager has no experience of IT operations or training. The Project Owner will formally accept the deliverables at the end, on the basis of the Deliverables Acceptance Plan. Which arrangement follows the PM² Guide?","options":{"A":"The Project Owner reviews all four documents personally, since the Project Owner formally accepts the project's deliverables.","B":"The PQA reviews all four documents, since the PQA performs most of the quality controls during deliverables acceptance.","C":"Only the software goes through acceptance, since supporting documents are not deliverables that need to be accepted.","D":"Each document is reviewed by a subject-matter representative, e.g. the User Manual by a User Representative."},"answer":"D","why_right_html":"<p>\"When domain-specific (e.g. technical) documentation is delivered for acceptance, it needs to be reviewed by a subject matter expert/representative.\" The examples given are a User Representative for a User Manual, \"a stakeholder from the support and maintenance organisation\" for an Operations Manual, the training organisation for training materials, and service operations for release notes (PM² 3.1 §9.10, Note, p.81).<\/p>","why_wrong":{"A":"A: the Project Owner \"formally accepts the project's deliverables\" (§9.10, step 6, p.81), but formal acceptance is not the same as reviewing each document as an expert.","B":"B: the PQA \"performs most of the quality controls\" (§9.10, p.81). The guide still requires domain-specific documents to be reviewed by subject-matter representatives.","C":"C: the PM ensures that supporting deliverables \"are supplied in addition to the main deliverables\" (§9.10, step 5, p.81), and the Deliverables Acceptance Plan must cover \"all project deliverables ... including any support material (user manuals, etc.)\" (§6.6, p.49)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"When domain-specific (e.g. technical) documentation is delivered for acceptance, it needs to be reviewed by a subject matter expert/representative.\" The examples given are a User Representative for a User Manual, \"a stakeholder from the support and maintenance organisation\" for an Operations Manual, the training organisation for training materials, and service operations for release notes (PM² 3.1 §9.10, Note, p.81).<\/p><ul><li>A: the Project Owner \"formally accepts the project's deliverables\" (§9.10, step 6, p.81), but formal acceptance is not the same as reviewing each document as an expert.<\/li><li>B: the PQA \"performs most of the quality controls\" (§9.10, p.81). The guide still requires domain-specific documents to be reviewed by subject-matter representatives.<\/li><li>C: the PM ensures that supporting deliverables \"are supplied in addition to the main deliverables\" (§9.10, step 5, p.81), and the Deliverables Acceptance Plan must cover \"all project deliverables ... including any support material (user manuals, etc.)\" (§6.6, p.49).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-27","id":27,"topic":27,"type":"long","word_count":154,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>Unit A.2 of a Directorate-General runs a PM² project to replace its grant-management system. Development will be outsourced through a specific contract under an existing framework contract; the specific contract is still being drafted. The software will be delivered in three releases, in months 6, 10 and 14. The Project Manager is now preparing the Deliverables Acceptance Plan.<\/p><p>The Project Manager has collected the following points:<\/p><ul><li>The Quality Management Plan already defines the code-review and test-coverage metrics.<\/li><li>The Requirements Management Plan defines how requirements will be validated.<\/li><li>The Business Manager wants users to test each release as soon as it is delivered.<\/li><li>The Head of the IT unit proposes a single acceptance campaign at the end of the Executing Phase, \"to save the users' time\".<\/li><li>The contractor has asked to agree the acceptance rules \"later, once the work has started\".<\/li><\/ul><p>Which approach to the Deliverables Acceptance Plan is MOST consistent with the PM² Guide?<\/p>","stem_text":"Unit A.2 of a Directorate-General runs a PM² project to replace its grant-management system. Development will be outsourced through a specific contract under an existing framework contract; the specific contract is still being drafted. The software will be delivered in three releases, in months 6, 10 and 14. The Project Manager is now preparing the Deliverables Acceptance Plan. The Project Manager has collected the following points: The Quality Management Plan already defines the code-review and test-coverage metrics. The Requirements Management Plan defines how requirements will be validated. The Business Manager wants users to test each release as soon as it is delivered. The Head of the IT unit proposes a single acceptance campaign at the end of the Executing Phase, \"to save the users' time\". The contractor has asked to agree the acceptance rules \"later, once the work has started\". Which approach to the Deliverables Acceptance Plan is MOST consistent with the PM² Guide?","options":{"A":"Plan one acceptance campaign at the end of the Executing Phase, and copy the quality metrics into the plan so that it is complete on its own.","B":"Plan acceptance for each release in line with the delivery schedule, define how non-acceptance is handled, and set the process in the contract.","C":"Plan acceptance for each release, but leave the acceptance process out of the specific contract, because the framework contract already sets the terms.","D":"Plan acceptance for each release, and let the contractor set the acceptance criteria and tolerances after signature, because it knows the software best."},"answer":"B","why_right_html":"<p>Three guidelines and steps of §6.6 decide this. First, \"deliverables acceptance activities may not happen (only) at the end of the Executing Phase, but can follow the project's delivery schedule\". Second, step 3 is to \"Define the process and timeline for dealing with non-acceptance (or partial acceptance)\". Third, step 7 says: \"In the case of outsourced work, the Deliverable Acceptance Process should be documented in the contract\" (PM² 3.1 §6.6, p.49). The specific contract is still being drafted, so this is the moment to put the process in it. Under a framework contract, the specific contract is awarded \"in accordance with the terms of the framework contract\" (FR Annex I point 1.1), so the acceptance rules must fit those terms.<\/p>","why_wrong":{"A":"A: a single end-of-Executing campaign ignores the release schedule. Copying the quality metrics breaks the guideline to \"Ensure that there is no duplication of information contained in other plans (the Requirements Management Plan, Quality Management Plan, etc.)\" (§6.6, p.49).","C":"C: step 7 asks for the acceptance process to be documented in the contract. General framework terms do not replace a project-specific acceptance process.","D":"D: defining \"the acceptance criteria and tolerances\" is a step in preparing the plan (§6.6, step 2, p.49), which the PM prepares. Leaving it to the contractor after signature removes the \"objective criteria and predefined timelines\" the plan exists to set."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Three guidelines and steps of §6.6 decide this. First, \"deliverables acceptance activities may not happen (only) at the end of the Executing Phase, but can follow the project's delivery schedule\". Second, step 3 is to \"Define the process and timeline for dealing with non-acceptance (or partial acceptance)\". Third, step 7 says: \"In the case of outsourced work, the Deliverable Acceptance Process should be documented in the contract\" (PM² 3.1 §6.6, p.49). The specific contract is still being drafted, so this is the moment to put the process in it. Under a framework contract, the specific contract is awarded \"in accordance with the terms of the framework contract\" (FR Annex I point 1.1), so the acceptance rules must fit those terms.<\/p><ul><li>A: a single end-of-Executing campaign ignores the release schedule. Copying the quality metrics breaks the guideline to \"Ensure that there is no duplication of information contained in other plans (the Requirements Management Plan, Quality Management Plan, etc.)\" (§6.6, p.49).<\/li><li>C: step 7 asks for the acceptance process to be documented in the contract. General framework terms do not replace a project-specific acceptance process.<\/li><li>D: defining \"the acceptance criteria and tolerances\" is a step in preparing the plan (§6.6, step 2, p.49), which the PM prepares. Leaving it to the contractor after signature removes the \"objective criteria and predefined timelines\" the plan exists to set.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²","FR"]},{"bank":"v2","key":"v2-28","id":28,"topic":28,"type":"scenario","word_count":99,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>Three Scrum Teams in an EU agency work on the same product, a new online filing portal. The agency's IT standards define a Definition of Done for all Increments, which includes an automated security scan and an accessibility check.<\/p><p>Team 1 has added a performance test to its own Definition of Done. Team 3 works only on back-end services and, to meet a deadline, wants to drop the accessibility check from its Definition of Done. One of the Scrum Masters suggests that each team simply keeps its own version.<\/p><p>According to the Scrum Guide 2020, which statement is correct?<\/p>","stem_text":"Three Scrum Teams in an EU agency work on the same product, a new online filing portal. The agency's IT standards define a Definition of Done for all Increments, which includes an automated security scan and an accessibility check. Team 1 has added a performance test to its own Definition of Done. Team 3 works only on back-end services and, to meet a deadline, wants to drop the accessibility check from its Definition of Done. One of the Scrum Masters suggests that each team simply keeps its own version. According to the Scrum Guide 2020, which statement is correct?","options":{"A":"Each team may keep its own Definition of Done, provided that each version is at least as strict as the agency's standard.","B":"Team 3 may drop the accessibility check, because the Developers decide how Product Backlog items become Increments.","C":"All three teams must follow the agency's standard as a minimum and mutually define and comply with one Definition of Done.","D":"The Product Owner sets the Definition of Done for each team, because the Product Owner is accountable for the product's value."},"answer":"C","why_right_html":"<p>\"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum.\" And: \"If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done\" (SG 2020, \"Commitment: Definition of Done\"). The teams may agree a stricter shared definition, for example by adding Team 1's performance test, but it must be one definition.<\/p>","why_wrong":{"A":"A: requiring each version to be at least as strict covers the first rule but breaks the second. Teams on the same product share one Definition of Done.","B":"B: \"The Developers are required to conform to the Definition of Done\" (SG 2020, same section). They cannot go below the organisational standard.","D":"D: the Definition of Done is not the Product Owner's decision. Teams on one product share one Product Owner anyway: \"they should share the same Product Goal, Product Backlog, and Product Owner\" (SG 2020, \"Scrum Team\")."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum.\" And: \"If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done\" (SG 2020, \"Commitment: Definition of Done\"). The teams may agree a stricter shared definition, for example by adding Team 1's performance test, but it must be one definition.<\/p><ul><li>A: requiring each version to be at least as strict covers the first rule but breaks the second. Teams on the same product share one Definition of Done.<\/li><li>B: \"The Developers are required to conform to the Definition of Done\" (SG 2020, same section). They cannot go below the organisational standard.<\/li><li>D: the Definition of Done is not the Product Owner's decision. Teams on one product share one Product Owner anyway: \"they should share the same Product Goal, Product Backlog, and Product Owner\" (SG 2020, \"Scrum Team\").<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"bank":"v2","key":"v2-29","id":29,"topic":29,"type":"scenario","word_count":82,"batch":1,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and acceptance","stem_html":"<p>In Unit C.2 of a Directorate-General, a Scrum Team works in two-week Sprints. Its Daily Scrum has grown into a 40-minute meeting in which each Developer reports status to the Product Owner, who then assigns the next tasks. When the Developers discover a problem in the afternoon, they wait until the next morning's Daily Scrum before they change their plan.<\/p><p>The Scrum Master wants to bring the event back in line with Scrum.<\/p><p>Which change is consistent with the Scrum Guide 2020?<\/p>","stem_text":"In Unit C.2 of a Directorate-General, a Scrum Team works in two-week Sprints. Its Daily Scrum has grown into a 40-minute meeting in which each Developer reports status to the Product Owner, who then assigns the next tasks. When the Developers discover a problem in the afternoon, they wait until the next morning's Daily Scrum before they change their plan. The Scrum Master wants to bring the event back in line with Scrum. Which change is consistent with the Scrum Guide 2020?","options":{"A":"Extend the timebox to 45 minutes and invite stakeholders, so that the Product Owner can assign the work more efficiently.","B":"Let the Developers use the event to inspect progress towards the Sprint Goal, and let them adjust their plan during the day as needed.","C":"Keep the status reports but have the Scrum Master record them, because the Scrum Master is accountable for the Sprint Backlog.","D":"Replace the Daily Scrum with two meetings a week, because the Developers are allowed to adjust their plan at any time anyway."},"answer":"B","why_right_html":"<p>\"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary.\" And: \"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions\" (SG 2020, \"Daily Scrum\").<\/p>","why_wrong":{"A":"A: the event is a 15-minute event \"for the Developers of the Scrum Team\" (SG 2020, \"Daily Scrum\"). It is not a stakeholder meeting, and the Product Owner does not assign work in it.","C":"C: the Developers are accountable for \"Creating a plan for the Sprint, the Sprint Backlog\" (SG 2020, \"Developers\"), not the Scrum Master. Status reporting is not the purpose of the event.","D":"D: the Daily Scrum \"is held at the same time and place every working day of the Sprint\" (SG 2020, \"Daily Scrum\"). Being free to re-plan during the day does not replace it."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary.\" And: \"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions\" (SG 2020, \"Daily Scrum\").<\/p><ul><li>A: the event is a 15-minute event \"for the Developers of the Scrum Team\" (SG 2020, \"Daily Scrum\"). It is not a stakeholder meeting, and the Product Owner does not assign work in it.<\/li><li>C: the Developers are accountable for \"Creating a plan for the Sprint, the Sprint Backlog\" (SG 2020, \"Developers\"), not the Scrum Master. Status reporting is not the purpose of the event.<\/li><li>D: the Daily Scrum \"is held at the same time and place every working day of the Sprint\" (SG 2020, \"Daily Scrum\"). Being free to re-plan during the day does not replace it.<\/li><\/ul>","knowledge_based":false,"frameworks":["Scrum"]},{"bank":"v2","key":"v2-30","id":30,"topic":30,"type":"long","word_count":170,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A Directorate-General runs an open procedure for a four-year ICT helpdesk service contract. The procurement documents state that the award method is best price-quality ratio, with quality weighted at 60% and price at 40%. They also state that tenders scoring below 60% of the available quality points will be rejected.<\/p><p>Three tenders are received:<\/p><ul><li>Tender X: 55% of the quality points and the lowest price.<\/li><li>Tender Y: 82% of the quality points and a price 45% below the average of the other two tenders, well below the estimated contract value.<\/li><li>Tender Z: 75% of the quality points and a price close to the estimated contract value.<\/li><\/ul><p>At the evaluation meeting, one committee member proposes awarding the contract to X, \"because price matters most when the budget is tight\". A second member proposes rejecting Y at once as abnormally low and awarding the contract to Z. A third suggests changing the weighting to 70% quality and 30% price, which would make Z the clear winner.<\/p><p>What should the contracting authority do?<\/p>","stem_text":"A Directorate-General runs an open procedure for a four-year ICT helpdesk service contract. The procurement documents state that the award method is best price-quality ratio, with quality weighted at 60% and price at 40%. They also state that tenders scoring below 60% of the available quality points will be rejected. Three tenders are received: Tender X: 55% of the quality points and the lowest price. Tender Y: 82% of the quality points and a price 45% below the average of the other two tenders, well below the estimated contract value. Tender Z: 75% of the quality points and a price close to the estimated contract value. At the evaluation meeting, one committee member proposes awarding the contract to X, \"because price matters most when the budget is tight\". A second member proposes rejecting Y at once as abnormally low and awarding the contract to Z. A third suggests changing the weighting to 70% quality and 30% price, which would make Z the clear winner. What should the contracting authority do?","options":{"A":"Reject X as below the minimum level of quality, and ask Y in writing for details of the elements of its price before deciding.","B":"Award the contract to X, since its price is the lowest and price is one of the two criteria stated in the procurement documents.","C":"Reject Y as abnormally low without further steps, since its price is far below the estimated contract value, and award the contract to Z.","D":"Change the weighting to 70/30 before ranking the tenders, since the committee may adapt the weightings to the tenders it receives."},"answer":"A","why_right_html":"<p>Two rules apply. First, \"The contracting authority may lay down minimum levels of quality. Tenders below those levels of quality shall be rejected\" (FR Annex I point 21.3). X scores 55% against a 60% threshold, so it is out, whatever its price. Second, where a price \"appears to be abnormally low, the contracting authority shall request in writing details of the constituent elements of the price or costs ... and shall give the tenderer the opportunity to present its observations\" (Annex I point 23.1). It \"shall only reject the tender where the evidence supplied does not satisfactorily account for the low price\" (point 23.2).<\/p>","why_wrong":{"B":"B: the award method is best price-quality ratio (Art. 170(4)), and X has already failed the minimum quality level. Under this method, price does not decide on its own.","C":"C: rejecting Y at once skips the written request and the tenderer's right to explain that points 23.1 and 23.2 require.","D":"D: the weightings must be specified in the procurement documents (Annex I point 21.2). Changing them after the tenders are opened, to produce a chosen winner, breaks the principles of \"transparency, proportionality, equal treatment and non-discrimination\" (Art. 163(1)). (Knowledge: that changing published weightings after opening breaches these principles is my reading, not an express sentence in the Regulation.)"},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>Two rules apply. First, \"The contracting authority may lay down minimum levels of quality. Tenders below those levels of quality shall be rejected\" (FR Annex I point 21.3). X scores 55% against a 60% threshold, so it is out, whatever its price. Second, where a price \"appears to be abnormally low, the contracting authority shall request in writing details of the constituent elements of the price or costs ... and shall give the tenderer the opportunity to present its observations\" (Annex I point 23.1). It \"shall only reject the tender where the evidence supplied does not satisfactorily account for the low price\" (point 23.2).<\/p><ul><li>B: the award method is best price-quality ratio (Art. 170(4)), and X has already failed the minimum quality level. Under this method, price does not decide on its own.<\/li><li>C: rejecting Y at once skips the written request and the tenderer's right to explain that points 23.1 and 23.2 require.<\/li><li>D: the weightings must be specified in the procurement documents (Annex I point 21.2). Changing them after the tenders are opened, to produce a chosen winner, breaks the principles of \"transparency, proportionality, equal treatment and non-discrimination\" (Art. 163(1)). (Knowledge: that changing published weightings after opening breaches these principles is my reading, not an express sentence in the Regulation.)<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-31","id":31,"topic":31,"type":"scenario","word_count":96,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>In 2024, an EU agency signed a four-year framework contract for IT consultancy with a single economic operator, at fixed daily rates. In 2026, Unit B.2 needs a new specific contract under it.<\/p><p>The contractor proposes to raise the daily rates by 20% for this specific contract and to add a type of service that the framework contract does not cover. Because the work is urgent, the Head of Unit is ready to sign at once and plans to make the budgetary commitment after signature.<\/p><p>Which statement is correct under Annex I to the Financial Regulation?<\/p>","stem_text":"In 2024, an EU agency signed a four-year framework contract for IT consultancy with a single economic operator, at fixed daily rates. In 2026, Unit B.2 needs a new specific contract under it. The contractor proposes to raise the daily rates by 20% for this specific contract and to add a type of service that the framework contract does not cover. Because the work is urgent, the Head of Unit is ready to sign at once and plans to make the budgetary commitment after signature. Which statement is correct under Annex I to the Financial Regulation?","options":{"A":"The specific contract must follow the framework contract's terms without substantial deviation and be preceded by a budgetary commitment.","B":"The new rates and the new service can be agreed, because a specific contract is a separate contract that the parties may negotiate freely between themselves.","C":"The framework contract can be extended to cover the new service, because the four-year limit does not apply to IT consultancy services.","D":"The budgetary commitment can follow signature, because only the framework contract itself must be preceded by a budgetary commitment."},"answer":"A","why_right_html":"<p>\"Specific contracts based on framework contracts shall be awarded in accordance with the terms of the framework contract. When concluding specific contracts, the parties shall not substantially deviate from the framework contract\" (FR Annex I point 1.1). For a single-operator framework contract, specific contracts \"shall be awarded or modified within the limits of the terms laid down in the framework contract\" (point 1.2). And \"Specific contracts based on framework contracts shall be preceded by a budgetary commitment\" (point 1.6). A 20% rate rise and a service the framework contract does not cover go beyond its terms.<\/p>","why_wrong":{"B":"B: a specific contract is not negotiated freely. It is bound by the framework contract's terms (points 1.1 and 1.2).","C":"C: the four-year limit applies \"save in exceptional cases duly justified in particular by the subject matter\" (point 1.1). There is no general exception for IT consultancy, and extending the framework contract would not make the new service part of it.","D":"D: point 1.6 requires the commitment before each specific contract, not only before the framework contract."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"Specific contracts based on framework contracts shall be awarded in accordance with the terms of the framework contract. When concluding specific contracts, the parties shall not substantially deviate from the framework contract\" (FR Annex I point 1.1). For a single-operator framework contract, specific contracts \"shall be awarded or modified within the limits of the terms laid down in the framework contract\" (point 1.2). And \"Specific contracts based on framework contracts shall be preceded by a budgetary commitment\" (point 1.6). A 20% rate rise and a service the framework contract does not cover go beyond its terms.<\/p><ul><li>B: a specific contract is not negotiated freely. It is bound by the framework contract's terms (points 1.1 and 1.2).<\/li><li>C: the four-year limit applies \"save in exceptional cases duly justified in particular by the subject matter\" (point 1.1). There is no general exception for IT consultancy, and extending the framework contract would not make the new service part of it.<\/li><li>D: point 1.6 requires the commitment before each specific contract, not only before the framework contract.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-32","id":32,"topic":32,"type":"scenario","word_count":88,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A Directorate-General has a multiple framework contract with reopening of competition for software development, signed with four contractors. The framework contract does not set all the terms for each assignment. Unit C.3 now needs a specific contract for a new mobile app.<\/p><p>To save time, the Head of Unit suggests phoning the contractor that performed best on the previous specific contract and asking it for a quote by the next day. The Project Manager checks the rules before replying.<\/p><p>What does Annex I to the Financial Regulation require?<\/p>","stem_text":"A Directorate-General has a multiple framework contract with reopening of competition for software development, signed with four contractors. The framework contract does not set all the terms for each assignment. Unit C.3 now needs a specific contract for a new mobile app. To save time, the Head of Unit suggests phoning the contractor that performed best on the previous specific contract and asking it for a quote by the next day. The Project Manager checks the rules before replying. What does Annex I to the Financial Regulation require?","options":{"A":"The Unit may award the specific contract directly to the contractor ranked first in the framework procedure, without consulting the others.","B":"The Unit may consult only the contractor that performed best, provided that the request and the quote are confirmed later by e-mail.","C":"The Unit must consult the contractors in writing, with a time limit long enough for tenders, and award on the framework's award criteria.","D":"The Unit must launch a new open procedure, because a specific contract for a new mobile app counts as a new purchase."},"answer":"C","why_right_html":"<p>Where the framework contract does not lay down all the terms, specific contracts are awarded \"through reopening of competition among the contractors\" (FR Annex I point 1.3(b)). Then \"the contracting authority shall consult them in writing and fix a time limit which is sufficiently long to allow specific tenders to be submitted. Specific tenders shall be submitted in writing\", and the authority awards each specific contract to the most economically advantageous specific tender \"on the basis of the award criteria set out in the procurement documents relating to the framework contract\" (point 1.4).<\/p>","why_wrong":{"A":"A: direct award without reopening is allowed only where the framework contract \"sets out all the terms\" and \"the objective conditions for determining which of the contractors shall perform them\" (point 1.3(a)). That is not the case here.","B":"B: a phone call to one contractor is not a reopening of competition, and specific tenders must be submitted in writing (point 1.4). Confirming by e-mail afterwards does not cure this.","D":"D: the framework contract exists to cover such needs. A new procedure is not required for a purchase within its scope (point 1.3)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Where the framework contract does not lay down all the terms, specific contracts are awarded \"through reopening of competition among the contractors\" (FR Annex I point 1.3(b)). Then \"the contracting authority shall consult them in writing and fix a time limit which is sufficiently long to allow specific tenders to be submitted. Specific tenders shall be submitted in writing\", and the authority awards each specific contract to the most economically advantageous specific tender \"on the basis of the award criteria set out in the procurement documents relating to the framework contract\" (point 1.4).<\/p><ul><li>A: direct award without reopening is allowed only where the framework contract \"sets out all the terms\" and \"the objective conditions for determining which of the contractors shall perform them\" (point 1.3(a)). That is not the case here.<\/li><li>B: a phone call to one contractor is not a reopening of competition, and specific tenders must be submitted in writing (point 1.4). Confirming by e-mail afterwards does not cure this.<\/li><li>D: the framework contract exists to cover such needs. A new procedure is not required for a purchase within its scope (point 1.3).<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-33","id":33,"topic":33,"type":"long","word_count":179,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>Unit A.4 of an EU agency is drafting the procurement documents for an open procedure for a framework contract for data-analytics services. The estimated contract value is EUR 800 000 per year. The draft contains the following criteria:<\/p><ul><li>Selection criterion: a minimum yearly turnover of EUR 2 400 000 in each of the last three years. The documents give no reason for this level.<\/li><li>Award criterion 1 (30%): the tenderer has completed at least three similar projects in the past three years.<\/li><li>Award criterion 2 (30%): the qualifications and experience of the team proposed to perform the contract. The agency considers that the quality of this team will strongly affect how well the contract is performed.<\/li><li>Award criterion 3 (40%): price.<\/li><\/ul><p>The Head of Unit asks the Project Manager, who will manage the future contract, to check the draft before it goes to the procurement team. The Project Manager wants to make sure that each criterion is placed correctly and that the requirements are proportionate to the contract.<\/p><p>Which comment on the draft is correct under the Financial Regulation?<\/p>","stem_text":"Unit A.4 of an EU agency is drafting the procurement documents for an open procedure for a framework contract for data-analytics services. The estimated contract value is EUR 800 000 per year. The draft contains the following criteria: Selection criterion: a minimum yearly turnover of EUR 2 400 000 in each of the last three years. The documents give no reason for this level. Award criterion 1 (30%): the tenderer has completed at least three similar projects in the past three years. Award criterion 2 (30%): the qualifications and experience of the team proposed to perform the contract. The agency considers that the quality of this team will strongly affect how well the contract is performed. Award criterion 3 (40%): price. The Head of Unit asks the Project Manager, who will manage the future contract, to check the draft before it goes to the procurement team. The Project Manager wants to make sure that each criterion is placed correctly and that the requirements are proportionate to the contract. Which comment on the draft is correct under the Financial Regulation?","options":{"A":"The draft is correct: turnover is a valid selection criterion, and award criteria 1 and 2 are both acceptable quality criteria.","B":"The turnover requirement must be removed, because the financial standing of tenderers is checked through the exclusion criteria.","C":"The turnover level exceeds twice the annual value withou
