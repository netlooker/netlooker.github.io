t a stated reason, and criterion 1 concerns the tenderer's capacity, so it belongs in selection.","D":"Award criterion 2 must move to selection, because staff experience can never be an award criterion; the rest of the draft is correct."},"answer":"C","why_right_html":"<p>Two problems. First, \"the minimum yearly turnover shall not exceed two times the estimated annual contract value, except in duly justified cases linked to the nature of the purchase, which the contracting authority shall explain in the procurement documents\" (FR Annex I point 19.1). EUR 2 400 000 / EUR 800 000 = 3 times the annual value, with no reason given. Second, \"Selection criteria shall only relate to the legal and regulatory capacity to pursue the professional activity, the economic and financial capacity, and the technical and professional capacity\" (Art. 170(2)), while \"award criteria\" evaluate \"the tender\" (Art. 170(3)). The tenderer's past similar projects show its technical and professional capacity: \"the principal services provided ... in the past three years\" are listed as evidence of that capacity (Annex I point 20.2(b)(i)). So criterion 1 belongs in selection.<\/p><ul><li>Tip: experience of the company is selection; experience of the team assigned to the contract can be award.<\/li><\/ul>","why_wrong":{"A":"A: it misses both problems, the turnover level and the misplaced references.","B":"B: financial standing is a selection criterion (\"economic and financial capacity\", Art. 170(2); Annex I point 19.1). Exclusion (Art. 138) is a separate check.","D":"D: staff qualification can be an award criterion: quality criteria may include \"organisation, qualification and experience of the staff assigned to performing the contract, where the quality of the staff assigned can have a significant impact on the level of the performance of the contract\" (Annex I point 21.1). The draft states that condition."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Two problems. First, \"the minimum yearly turnover shall not exceed two times the estimated annual contract value, except in duly justified cases linked to the nature of the purchase, which the contracting authority shall explain in the procurement documents\" (FR Annex I point 19.1). EUR 2 400 000 / EUR 800 000 = 3 times the annual value, with no reason given. Second, \"Selection criteria shall only relate to the legal and regulatory capacity to pursue the professional activity, the economic and financial capacity, and the technical and professional capacity\" (Art. 170(2)), while \"award criteria\" evaluate \"the tender\" (Art. 170(3)). The tenderer's past similar projects show its technical and professional capacity: \"the principal services provided ... in the past three years\" are listed as evidence of that capacity (Annex I point 20.2(b)(i)). So criterion 1 belongs in selection.<\/p><ul><li>A: it misses both problems, the turnover level and the misplaced references.<\/li><li>B: financial standing is a selection criterion (\"economic and financial capacity\", Art. 170(2); Annex I point 19.1). Exclusion (Art. 138) is a separate check.<\/li><li>D: staff qualification can be an award criterion: quality criteria may include \"organisation, qualification and experience of the staff assigned to performing the contract, where the quality of the staff assigned can have a significant impact on the level of the performance of the contract\" (Annex I point 21.1). The draft states that condition.<\/li><li>Tip: experience of the company is selection; experience of the team assigned to the contract can be award.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-34","id":34,"topic":34,"type":"scenario","word_count":83,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A Directorate-General runs an open procedure for ICT infrastructure services, using the best price-quality ratio. Tenderer Delta submits the best-ranked tender. To meet the technical and professional capacity criterion, Delta relies on the capacity of a subcontractor, Sigma.<\/p><p>When the authorising officer checks the evidence, Delta itself is found not to be in any exclusion situation. However, Sigma turns out to be bankrupt and subject to winding-up proceedings. Delta's tender is otherwise compliant.<\/p><p>What should the authorising officer do under the Financial Regulation?<\/p>","stem_text":"A Directorate-General runs an open procedure for ICT infrastructure services, using the best price-quality ratio. Tenderer Delta submits the best-ranked tender. To meet the technical and professional capacity criterion, Delta relies on the capacity of a subcontractor, Sigma. When the authorising officer checks the evidence, Delta itself is found not to be in any exclusion situation. However, Sigma turns out to be bankrupt and subject to winding-up proceedings. Delta's tender is otherwise compliant. What should the authorising officer do under the Financial Regulation?","options":{"A":"Require Delta to replace Sigma, because an entity on whose capacity a tenderer relies must not itself be in an exclusion situation.","B":"Exclude Delta from the procedure and award the contract to the second-ranked tenderer, because Delta's tender depends on Sigma.","C":"Disregard Sigma's situation, because the exclusion criteria apply only to the tenderer itself and not to its subcontractors.","D":"Cancel the procedure and launch it again, because the ranking of the tenders is no longer valid once Sigma is found bankrupt."},"answer":"A","why_right_html":"<p>\"In the case referred to in Article 137(2), point (b), the authorising officer responsible shall require that the candidate or tenderer replaces an entity or a subcontractor on whose capacity it intends to rely, which is in an exclusion situation referred to in paragraph 1\" (FR Art. 138(12)). Article 137(2)(b) covers \"entities on whose capacity the candidate or tenderer intends to rely or subcontractors of a contractor\". Bankruptcy and winding-up procedures are an exclusion situation (Art. 138(1)(a)).<\/p>","why_wrong":{"B":"B: Delta itself is not excluded. The Regulation's answer for an excluded entity whose capacity is relied on is replacement, not exclusion of the tenderer (Art. 138(12)).","C":"C: the exclusion system expressly applies to entities whose capacity is relied on and to subcontractors (Art. 137(2)(b)). The tenderer may also have to provide their declarations (Art. 139(1)).","D":"D: nothing requires cancelling the procedure. Art. 138(12) provides the remedy within it."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"In the case referred to in Article 137(2), point (b), the authorising officer responsible shall require that the candidate or tenderer replaces an entity or a subcontractor on whose capacity it intends to rely, which is in an exclusion situation referred to in paragraph 1\" (FR Art. 138(12)). Article 137(2)(b) covers \"entities on whose capacity the candidate or tenderer intends to rely or subcontractors of a contractor\". Bankruptcy and winding-up procedures are an exclusion situation (Art. 138(1)(a)).<\/p><ul><li>B: Delta itself is not excluded. The Regulation's answer for an excluded entity whose capacity is relied on is replacement, not exclusion of the tenderer (Art. 138(12)).<\/li><li>C: the exclusion system expressly applies to entities whose capacity is relied on and to subcontractors (Art. 137(2)(b)). The tenderer may also have to provide their declarations (Art. 139(1)).<\/li><li>D: nothing requires cancelling the procedure. Art. 138(12) provides the remedy within it.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-35","id":35,"topic":35,"type":"scenario","word_count":105,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>Unit B.1 of a Directorate-General has outsourced the development of a document-management module through a specific contract. The Outsourcing Plan has been approved, and the project is in the Executing Phase.<\/p><p>The Contractor's Project Manager e-mails the Project Owner directly. He proposes to replace two agreed features with a new one at the same price. He has also started sending his weekly progress reports to the Project Owner instead of the Project Manager. The Project Owner forwards the e-mail to the Project Manager and asks who should deal with it.<\/p><p>According to the PM² Guide, who should manage this change and receive the contractor's reports?<\/p>","stem_text":"Unit B.1 of a Directorate-General has outsourced the development of a document-management module through a specific contract. The Outsourcing Plan has been approved, and the project is in the Executing Phase. The Contractor's Project Manager e-mails the Project Owner directly. He proposes to replace two agreed features with a new one at the same price. He has also started sending his weekly progress reports to the Project Owner instead of the Project Manager. The Project Owner forwards the e-mail to the Project Manager and asks who should deal with it. According to the PM² Guide, who should manage this change and receive the contractor's reports?","options":{"A":"The Project Manager manages changes to the outsourced work; the contractor reports to him and, if needed, to the Steering Committee.","B":"The Project Owner manages the change with the contractor, as the client; the contractor reports to the Project Owner, who accepts deliverables.","C":"The Contractor's Project Manager manages the change, as he plans and controls the outsourced work; he reports to the Steering Committee only.","D":"The Solution Provider manages the change, as it is accountable for the contractor's performance; the contractor reports to the Solution Provider."},"answer":"A","why_right_html":"<p>In Manage Outsourcing, \"The Contractor's Project Manager (CPM) reports on the project's status and progress to the Project Manager (PM) and, if necessary, the Project Steering Committee (PSC)\", and \"The Project Manager (PM) manages changes to the outsourced work\" (PM² 3.1 §9.13, steps 5 and 6, p.85). If the change is significant, the normal change process applies, and the PSC decides on significant change requests (§4.4, p.24).<\/p>","why_wrong":{"B":"B: the Project Owner formally accepts deliverables (§9.10, p.81), but managing the contractor and changes to its work is the PM's job: \"The Project Manager (PM) manages the delivery of all products and/or services that have been outsourced\" (§9.13, p.85).","C":"C: the Contractor's PM leads the contractor's staff, \"planning controlling and reporting on the production of outsourced deliverables\" (§4.10, p.27), but does not manage changes to the scope of the outsourced work. He reports to the PM first, and to the PSC only if necessary.","D":"D: the Solution Provider \"becomes accountable for the contractor's performance\" (§4.6, p.26). Being accountable does not mean managing changes day to day, which step 6 gives to the PM."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>In Manage Outsourcing, \"The Contractor's Project Manager (CPM) reports on the project's status and progress to the Project Manager (PM) and, if necessary, the Project Steering Committee (PSC)\", and \"The Project Manager (PM) manages changes to the outsourced work\" (PM² 3.1 §9.13, steps 5 and 6, p.85). If the change is significant, the normal change process applies, and the PSC decides on significant change requests (§4.4, p.24).<\/p><ul><li>B: the Project Owner formally accepts deliverables (§9.10, p.81), but managing the contractor and changes to its work is the PM's job: \"The Project Manager (PM) manages the delivery of all products and/or services that have been outsourced\" (§9.13, p.85).<\/li><li>C: the Contractor's PM leads the contractor's staff, \"planning controlling and reporting on the production of outsourced deliverables\" (§4.10, p.27), but does not manage changes to the scope of the outsourced work. He reports to the PM first, and to the PSC only if necessary.<\/li><li>D: the Solution Provider \"becomes accountable for the contractor's performance\" (§4.6, p.26). Being accountable does not mean managing changes day to day, which step 6 gives to the PM.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-36","id":36,"topic":36,"type":"long","word_count":159,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>Unit C.4 of an EU agency must deliver a new data-analytics platform within 18 months. Before the Outsourcing Plan is drafted, the Solution Provider asks the Project Manager to carry out a Make or Buy Analysis. The Project Manager collects these facts:<\/p><ul><li>No one in the in-house team has experience with the required analytics technology.<\/li><li>Several suppliers have already delivered similar platforms to public bodies.<\/li><li>The agency's risk-scoring algorithms are sensitive, and it wants to keep full control of the intellectual property.<\/li><li>The contractor used for a similar tool two years ago missed three delivery dates.<\/li><li>The in-house team is fully booked on another project until next year.<\/li><\/ul><p>On this basis, the Solution Provider decides to buy the platform and to develop the algorithms in-house. While the Project Manager is drafting the Outsourcing Plan, a Head of Unit with long procurement experience offers to choose the contractor himself, \"to save time\".<\/p><p>Which statement is consistent with the PM² Guide?<\/p>","stem_text":"Unit C.4 of an EU agency must deliver a new data-analytics platform within 18 months. Before the Outsourcing Plan is drafted, the Solution Provider asks the Project Manager to carry out a Make or Buy Analysis. The Project Manager collects these facts: No one in the in-house team has experience with the required analytics technology. Several suppliers have already delivered similar platforms to public bodies. The agency's risk-scoring algorithms are sensitive, and it wants to keep full control of the intellectual property. The contractor used for a similar tool two years ago missed three delivery dates. The in-house team is fully booked on another project until next year. On this basis, the Solution Provider decides to buy the platform and to develop the algorithms in-house. While the Project Manager is drafting the Outsourcing Plan, a Head of Unit with long procurement experience offers to choose the contractor himself, \"to save time\". Which statement is consistent with the PM² Guide?","options":{"A":"The intellectual property concern points to a buy decision, and the Outsourcing Plan should list pre-set evaluation criteria for choosing the contractor.","B":"The missed delivery dates point to a make decision, and the Outsourcing Plan should list pre-set evaluation criteria for choosing the contractor.","C":"The fully booked in-house team points to a make decision, and the Head of Unit may choose the contractor alone if the Solution Provider agrees.","D":"The suppliers' experience points to a make decision, and the Contractor's Project Manager should define the evaluation criteria for the contractor."},"answer":"B","why_right_html":"<p>\"Potential reasons for a make decision include cost effectiveness, intellectual property concerns, quality control issues or supplier unreliability issues. Potential reasons for buy decision include cost considerations, lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101). The missed delivery dates are a supplier-unreliability issue, so they point to make. In the Outsourcing Plan, step 3 is to \"List the evaluation criteria for contractors. This ensures that a contractor is selected on the basis of pre-set criteria and that no single person or group influences the decision\" (§6.5, p.48). That rules out the Head of Unit's offer.<\/p>","why_wrong":{"A":"A: the second half is right, but intellectual property concerns are a reason to make, not to buy. Here they explain why the algorithms stay in-house.","C":"C: insufficient in-house resources are a reason to buy. A single person choosing the contractor is what step 3 is designed to prevent, whoever agrees to it.","D":"D: the suppliers' technical experience is a reason to buy. The criteria are part of the Outsourcing Plan, which the Project Manager prepares (§6.5, p.48). The Contractor's PM belongs to a contractor not yet chosen, and could not set the criteria used to choose it."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Potential reasons for a make decision include cost effectiveness, intellectual property concerns, quality control issues or supplier unreliability issues. Potential reasons for buy decision include cost considerations, lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101). The missed delivery dates are a supplier-unreliability issue, so they point to make. In the Outsourcing Plan, step 3 is to \"List the evaluation criteria for contractors. This ensures that a contractor is selected on the basis of pre-set criteria and that no single person or group influences the decision\" (§6.5, p.48). That rules out the Head of Unit's offer.<\/p><ul><li>A: the second half is right, but intellectual property concerns are a reason to make, not to buy. Here they explain why the algorithms stay in-house.<\/li><li>C: insufficient in-house resources are a reason to buy. A single person choosing the contractor is what step 3 is designed to prevent, whoever agrees to it.<\/li><li>D: the suppliers' technical experience is a reason to buy. The criteria are part of the Outsourcing Plan, which the Project Manager prepares (§6.5, p.48). The Contractor's PM belongs to a contractor not yet chosen, and could not set the criteria used to choose it.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-37","id":37,"topic":37,"type":"scenario","word_count":105,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>Ana is the Project Manager of a small PM² project in an EU agency: six months, a team of four and a budget of EUR 150 000. While she drafts the Project Handbook, she reads that PM² suggests six Project Management Plans, from the Requirements Management Plan to the Communications Management Plan. She thinks that six separate documents would be too heavy for a project of this size. A colleague offers three ideas: drop the plans that seem least useful, describe the processes in the Project Charter, or simply produce all six plans anyway.<\/p><p>According to the PM² Guide, what is the MOST appropriate approach?<\/p>","stem_text":"Ana is the Project Manager of a small PM² project in an EU agency: six months, a team of four and a budget of EUR 150 000. While she drafts the Project Handbook, she reads that PM² suggests six Project Management Plans, from the Requirements Management Plan to the Communications Management Plan. She thinks that six separate documents would be too heavy for a project of this size. A colleague offers three ideas: drop the plans that seem least useful, describe the processes in the Project Charter, or simply produce all six plans anyway. According to the PM² Guide, what is the MOST appropriate approach?","options":{"A":"Define each management process briefly in the Project Handbook, and use separate plans only where more detail is needed.","B":"Drop the change and issue management processes, since a small project can handle changes and issues informally.","C":"Describe the management processes in the Project Charter instead, so that they are approved together with the project scope.","D":"Prepare all six plans as separate documents from the PM² templates, because PM² requires them for every project."},"answer":"A","why_right_html":"<p>PM² lets the level of documentation fit the project: \"When sufficient, a brief definition of each management process or plan can be provided in the Project Handbook. When a more extensive and detailed description is needed, separate management plans can be instituted\" (PM² 3.1 §6.2.2, p.43).<\/p>","why_wrong":{"B":"B: dropping whole processes breaks the tailoring guidance: \"Avoid simplifying the methodology by eliminating whole chunks (e.g. a phase, a role, an activity or an artefact), but rather scale down (or up) the scope of that element\" (PM² 3.1 §3.6, p.20).","C":"C: the management approach and the plans belong to the Project Handbook, a Planning Phase artefact prepared by the PM (PM² 3.1 §6.2, p.42). The Project Charter is an Initiating Phase artefact.","D":"D: PM² does not require six separate documents: \"Depending on the organisation and the project, different levels of documentation detail may be required\" (PM² 3.1 §6.2.2, p.43)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>PM² lets the level of documentation fit the project: \"When sufficient, a brief definition of each management process or plan can be provided in the Project Handbook. When a more extensive and detailed description is needed, separate management plans can be instituted\" (PM² 3.1 §6.2.2, p.43).<\/p><ul><li>B: dropping whole processes breaks the tailoring guidance: \"Avoid simplifying the methodology by eliminating whole chunks (e.g. a phase, a role, an activity or an artefact), but rather scale down (or up) the scope of that element\" (PM² 3.1 §3.6, p.20).<\/li><li>C: the management approach and the plans belong to the Project Handbook, a Planning Phase artefact prepared by the PM (PM² 3.1 §6.2, p.42). The Project Charter is an Initiating Phase artefact.<\/li><li>D: PM² does not require six separate documents: \"Depending on the organisation and the project, different levels of documentation detail may be required\" (PM² 3.1 §6.2.2, p.43).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-38","id":38,"topic":38,"type":"scenario","word_count":101,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>Unit C.2 of a Directorate-General runs a PM² project in which an external contractor develops most of the software. Each month the contractor sends a Contractor Status Report to the Project Manager, as agreed. The reports are long and detailed: they list every task, several new risks and two open disputes about delivery dates. The Project Manager must now prepare the monthly Project Status Report for the Project Steering Committee (PSC). One PSC member has said that the committee has little time and wants a short, clear overview of the project.<\/p><p>What should the Project Manager do with the contractor's reports?<\/p>","stem_text":"Unit C.2 of a Directorate-General runs a PM² project in which an external contractor develops most of the software. Each month the contractor sends a Contractor Status Report to the Project Manager, as agreed. The reports are long and detailed: they list every task, several new risks and two open disputes about delivery dates. The Project Manager must now prepare the monthly Project Status Report for the Project Steering Committee (PSC). One PSC member has said that the committee has little time and wants a short, clear overview of the project. What should the Project Manager do with the contractor's reports?","options":{"A":"Forward the Contractor Status Reports to the PSC in place of the Project Status Report, as they are the most complete source.","B":"Ask the contractor to write this month's Project Status Report, since its staff carry out most of the project work.","C":"Copy the task-level detail from the contractor's reports into the Project Status Report, so the PSC can check each task.","D":"Include a summary of the contractor's reports, with the new risks and disputes, in the Project Status Report."},"answer":"D","why_right_html":"<p>\"The Project Manager (PM) should include a summary of the Contractor Status Reports in the Project Status Report\" (PM² 3.1 §7.4, p.60). The new risks and disputes are part of what the Status Report tracks (risks and issues).<\/p>","why_wrong":{"A":"A: the Contractor Status Report is submitted to the PM; the Project Status Report is \"produced by the Project Manager (PM) and is regularly submitted to the Project Steering Committee (PSC)\" (PM² 3.1 §7.4, p.60).","B":"B: the PM is \"Responsible for all Project Reports (except external audit reports)\" (PM² 3.1 §7.4, p.59).","C":"C: the Status Report \"should provide a summary of the project's performance (rather than detailed task-level information)\" (PM² 3.1 §7.4, p.60)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"The Project Manager (PM) should include a summary of the Contractor Status Reports in the Project Status Report\" (PM² 3.1 §7.4, p.60). The new risks and disputes are part of what the Status Report tracks (risks and issues).<\/p><ul><li>A: the Contractor Status Report is submitted to the PM; the Project Status Report is \"produced by the Project Manager (PM) and is regularly submitted to the Project Steering Committee (PSC)\" (PM² 3.1 §7.4, p.60).<\/li><li>B: the PM is \"Responsible for all Project Reports (except external audit reports)\" (PM² 3.1 §7.4, p.59).<\/li><li>C: the Status Report \"should provide a summary of the project's performance (rather than detailed task-level information)\" (PM² 3.1 §7.4, p.60).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-39","id":39,"topic":39,"type":"long","word_count":170,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>An EU agency is closing a PM² project that replaced its document management system. The project passed the RfC (Ready for Closing) phase gate last month, and the Project Owner (PO) has provisionally accepted all deliverables. The Project Manager, Marta, is now planning the Closing Phase. The team is already busy with other work, so the Head of Unit makes three suggestions to save time:<\/p><ul><li>skip the Project-End Review Meeting and let the Project Support Office (PSO) write the Project-End Report from the project logs;<\/li><li>release the contractor's team now, and check the remaining contractual obligations (source code handover and warranty terms) after the project is closed;<\/li><li>close the project as soon as all project documentation has been archived.<\/li><\/ul><p>Marta wants to follow the PM² Guide, but she also wants to keep the Closing Phase short and avoid extra meetings where she can. The PO has asked to receive her proposal for the Closing Phase by the end of the week.<\/p><p>Which plan is MOST consistent with the PM² Guide?<\/p>","stem_text":"An EU agency is closing a PM² project that replaced its document management system. The project passed the RfC (Ready for Closing) phase gate last month, and the Project Owner (PO) has provisionally accepted all deliverables. The Project Manager, Marta, is now planning the Closing Phase. The team is already busy with other work, so the Head of Unit makes three suggestions to save time: skip the Project-End Review Meeting and let the Project Support Office (PSO) write the Project-End Report from the project logs; release the contractor's team now, and check the remaining contractual obligations (source code handover and warranty terms) after the project is closed; close the project as soon as all project documentation has been archived. Marta wants to follow the PM² Guide, but she also wants to keep the Closing Phase short and avoid extra meetings where she can. The PO has asked to receive her proposal for the Closing Phase by the end of the week. Which plan is MOST consistent with the PM² Guide?","options":{"A":"Hold the Project-End Review Meeting, write the Project-End Report with team input, and verify the contractual obligations as part of Administrative Closure.","B":"Let the PSO write the Project-End Report from the logs, and close the project once all documentation has been archived.","C":"Hold the Project-End Review Meeting, and leave the open contract points to operations, since formal closure starts operations mode.","D":"Ask the PO to write the Project-End Report, and close the project now, since the RfC phase gate has already been passed."},"answer":"A","why_right_html":"<p>Each of the Head of Unit's shortcuts skips a Closing Phase step. \"The Closing Phase starts with an official Project-End Review Meeting\" (PM² 3.1 §8, p.63). The Project-End Report is written by the PM, with the Project Quality Assurance and the Project Core Team providing \"input and assistance\" (§8.3, p.66). Administrative Closure includes the step \"Verify that all contractual obligations have been fulfilled\", and the PO \"Has final approval of the project\" (§8.4, p.67).<\/p>","why_wrong":{"B":"B: the PSO \"Assists in reviewing, organising and archiving all project documentation\"; it does not write the report. Archiving alone does not close the project: it is closed \"once all Closing Phase activities are completed and the Project Owner (PO) has approved the project\" (PM² 3.1 §8.4, p.67).","C":"C: checking the contract is an Administrative Closure step, so it comes before closure. \"Formal project closure brings project mode to an end and allows operations mode to commence\" (§8.4, p.67). The sentence is true, but it does not move closure steps into operations.","D":"D: RfC is the gate into the Closing Phase: after it, the PSC \"can authorise the Project Manager (PM) to move the project to the Closing Phase\" (PM² 3.1 §7.6, p.62). The PM writes the Project-End Report, not the PO (§8.3)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>Each of the Head of Unit's shortcuts skips a Closing Phase step. \"The Closing Phase starts with an official Project-End Review Meeting\" (PM² 3.1 §8, p.63). The Project-End Report is written by the PM, with the Project Quality Assurance and the Project Core Team providing \"input and assistance\" (§8.3, p.66). Administrative Closure includes the step \"Verify that all contractual obligations have been fulfilled\", and the PO \"Has final approval of the project\" (§8.4, p.67).<\/p><ul><li>B: the PSO \"Assists in reviewing, organising and archiving all project documentation\"; it does not write the report. Archiving alone does not close the project: it is closed \"once all Closing Phase activities are completed and the Project Owner (PO) has approved the project\" (PM² 3.1 §8.4, p.67).<\/li><li>C: checking the contract is an Administrative Closure step, so it comes before closure. \"Formal project closure brings project mode to an end and allows operations mode to commence\" (§8.4, p.67). The sentence is true, but it does not move closure steps into operations.<\/li><li>D: RfC is the gate into the Closing Phase: after it, the PSC \"can authorise the Project Manager (PM) to move the project to the Closing Phase\" (PM² 3.1 §7.6, p.62). The PM writes the Project-End Report, not the PO (§8.3).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-40","id":40,"topic":40,"type":"scenario","word_count":94,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>Tomasz manages a three-year PM² project to build a case management system for a Directorate-General. During the project he took several unpopular decisions on scope and staffing, and some team members disagreed with him openly. The Project-End Review Meeting is planned for next month and will include the Lessons Learned session. Tomasz wants the team to speak honestly about what went wrong, including his own decisions. He also wants to give his own view of the project.<\/p><p>According to the PM² Guide, what is the MOST appropriate way to organise the Lessons Learned session?<\/p>","stem_text":"Tomasz manages a three-year PM² project to build a case management system for a Directorate-General. During the project he took several unpopular decisions on scope and staffing, and some team members disagreed with him openly. The Project-End Review Meeting is planned for next month and will include the Lessons Learned session. Tomasz wants the team to speak honestly about what went wrong, including his own decisions. He also wants to give his own view of the project. According to the PM² Guide, what is the MOST appropriate way to organise the Lessons Learned session?","options":{"A":"Tomasz facilitates the session himself, but does not invite the Project Steering Committee, so that the team feels free to speak.","B":"Someone who was not closely involved in the project facilitates the session, so that Tomasz can contribute as a participant.","C":"The session is replaced by an anonymous questionnaire, sent to the team after the administrative closure of the project.","D":"The Project Owner chairs the session and decides alone which lessons are recorded in the Project-End Report."},"answer":"B","why_right_html":"<p>\"It may be preferable to have the Lessons Learned session facilitated by someone who has not been intimately involved in the project, allowing the Project Manager (PM) to contribute as a participant\" (PM² 3.1 §8.2, p.65). This meets both of Tomasz's aims.<\/p>","why_wrong":{"A":"A: \"The Project Steering Committee (PSC) should be invited to the Lessons Learned session(s) as this will allow its members to transfer the Lessons Learned to other projects\" (PM² 3.1 §8.2, p.65).","C":"C: \"The Lessons Learned session should be a part of the Project-End Review Meeting\" (§8.2, p.65). Questionnaires are an extra way to reach a broader group, not a replacement. After administrative closure the team is \"officially dissolved\" (§8.4, p.67).","D":"D: the PM \"Organises the gathering of Lessons Learned\" (§8.2) and writes the Project-End Report (§8.3, p.66). The PO has no role deciding alone which lessons are kept."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"It may be preferable to have the Lessons Learned session facilitated by someone who has not been intimately involved in the project, allowing the Project Manager (PM) to contribute as a participant\" (PM² 3.1 §8.2, p.65). This meets both of Tomasz's aims.<\/p><ul><li>A: \"The Project Steering Committee (PSC) should be invited to the Lessons Learned session(s) as this will allow its members to transfer the Lessons Learned to other projects\" (PM² 3.1 §8.2, p.65).<\/li><li>C: \"The Lessons Learned session should be a part of the Project-End Review Meeting\" (§8.2, p.65). Questionnaires are an extra way to reach a broader group, not a replacement. After administrative closure the team is \"officially dissolved\" (§8.4, p.67).<\/li><li>D: the PM \"Organises the gathering of Lessons Learned\" (§8.2) and writes the Project-End Report (§8.3, p.66). The PO has no role deciding alone which lessons are kept.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-41","id":41,"topic":41,"type":"scenario","word_count":95,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>An EU agency runs an IT project with PRINCE2. For the current stage, the Project Board has set a cost tolerance of plus or minus 10% around a stage budget of EUR 200 000. Halfway through the stage, actual costs are EUR 95 000, in line with the plan. However, a supplier has just announced a price increase, and the Project Manager's new forecast shows that the stage will cost EUR 226 000 in total. The tolerance set for the whole project by corporate management is not yet affected.<\/p><p>What should the Project Manager do?<\/p>","stem_text":"An EU agency runs an IT project with PRINCE2. For the current stage, the Project Board has set a cost tolerance of plus or minus 10% around a stage budget of EUR 200 000. Halfway through the stage, actual costs are EUR 95 000, in line with the plan. However, a supplier has just announced a price increase, and the Project Manager's new forecast shows that the stage will cost EUR 226 000 in total. The tolerance set for the whole project by corporate management is not yet affected. What should the Project Manager do?","options":{"A":"Take corrective action within the Project Manager's own authority, and report the forecast in the next Highlight Report.","B":"Ask corporate management directly for extra budget, since the Project Board cannot change the stage budget.","C":"Raise an Exception Report to the Project Board, because the stage is forecast to exceed its cost tolerance.","D":"Continue the work and escalate only when actual costs pass EUR 220 000, since the overrun is only a forecast."},"answer":"C","why_right_html":"<p>The upper limit of the stage tolerance is EUR 200 000 + 10% = EUR 220 000. The forecast of EUR 226 000 is EUR 26 000 (13%) over budget, so it is beyond tolerance. In PRINCE2, when a stage is forecast to exceed its tolerances, the Project Manager escalates to the Project Board with an Exception Report, and the Board decides what to do (knowledge: PRINCE2 7, principle \"manage by exception\").<\/p>","why_wrong":{"A":"A: corrective action within the PM's own authority, reported in the regular Highlight Report, applies only while the forecast stays within tolerance (knowledge: PRINCE2 7).","B":"B: stage tolerances are set by the Project Board, so the Board is the next level up. Corporate management becomes involved only if the project tolerance is forecast to be exceeded (knowledge: PRINCE2 7).","D":"D: escalation is triggered by the forecast, not by the actual overrun. Waiting removes the Board's chance to act in time (knowledge: PRINCE2 7)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The upper limit of the stage tolerance is EUR 200 000 + 10% = EUR 220 000. The forecast of EUR 226 000 is EUR 26 000 (13%) over budget, so it is beyond tolerance. In PRINCE2, when a stage is forecast to exceed its tolerances, the Project Manager escalates to the Project Board with an Exception Report, and the Board decides what to do (knowledge: PRINCE2 7, principle \"manage by exception\").<\/p><ul><li>A: corrective action within the PM's own authority, reported in the regular Highlight Report, applies only while the forecast stays within tolerance (knowledge: PRINCE2 7).<\/li><li>B: stage tolerances are set by the Project Board, so the Board is the next level up. Corporate management becomes involved only if the project tolerance is forecast to be exceeded (knowledge: PRINCE2 7).<\/li><li>D: escalation is triggered by the forecast, not by the actual overrun. Waiting removes the Board's chance to act in time (knowledge: PRINCE2 7).<\/li><\/ul>","knowledge_based":true,"frameworks":["PRINCE2","Knowledge"]},{"bank":"v2","key":"v2-42","id":42,"topic":42,"type":"long","word_count":163,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"<p>An EU agency is procuring a new human resources system. The contractor works with PRINCE2, and the agency agrees to set up a PRINCE2 Project Board for the project. The agency's Project Manager, Lena, receives the following proposals for the Board and its support roles:<\/p><ul><li>the Director of Human Resources, who funds the project and owns the business case, as Executive;<\/li><li>the Head of the Payroll Unit, whose staff will use the system every day, as Senior User;<\/li><li>the contractor's delivery director as Senior Supplier;<\/li><li>the Head of the agency's IT Unit, who wants an equal say on budget decisions, as a second Executive;<\/li><li>Lena herself, to carry out Project Assurance on behalf of the Board, to save time and staff.<\/li><\/ul><p>The agency has not used PRINCE2 before. The Director of Human Resources therefore asks Lena to check the proposals against PRINCE2 before the first Board meeting, and to report which of them can be kept.<\/p><p>Which statement is correct according to PRINCE2?<\/p>","stem_text":"An EU agency is procuring a new human resources system. The contractor works with PRINCE2, and the agency agrees to set up a PRINCE2 Project Board for the project. The agency's Project Manager, Lena, receives the following proposals for the Board and its support roles: the Director of Human Resources, who funds the project and owns the business case, as Executive; the Head of the Payroll Unit, whose staff will use the system every day, as Senior User; the contractor's delivery director as Senior Supplier; the Head of the agency's IT Unit, who wants an equal say on budget decisions, as a second Executive; Lena herself, to carry out Project Assurance on behalf of the Board, to save time and staff. The agency has not used PRINCE2 before. The Director of Human Resources therefore asks Lena to check the proposals against PRINCE2 before the first Board meeting, and to report which of them can be kept. Which statement is correct according to PRINCE2?","options":{"A":"The Board is valid as proposed, because PRINCE2 allows two Executives when two units fund a project, and lets the Project Manager do assurance.","B":"The first three roles fit the Board, but there can be only one Executive, and Project Assurance must be independent of the Project Manager.","C":"The contractor cannot sit on the Board, so the Head of the IT Unit should be Senior Supplier and Lena should carry out Project Assurance.","D":"Lena should chair the Board as Executive, because she owns the plans, and the Director of Human Resources should become Senior User."},"answer":"B","why_right_html":"<p>In PRINCE2 the Project Board has one Executive, who is ultimately accountable for the project and owns the business case, supported by the Senior User (user side) and the Senior Supplier (supplier side). The first three proposals fit these roles. Project Assurance is a Board responsibility and must be independent of the Project Manager, so it cannot be given to the PM (knowledge: PRINCE2 7). The Head of the IT Unit could instead join the Board in a supplier or user role, depending on what the IT Unit contributes (knowledge).<\/p>","why_wrong":{"A":"A: PRINCE2 does not allow joint Executives, and the PM cannot provide assurance on their own work (knowledge: PRINCE2 7).","C":"C: the Senior Supplier is often from an external supplier, so the contractor's delivery director can sit on the Board. Assurance by Lena is still not independent (knowledge: PRINCE2 7).","D":"D: the Project Manager is not a member of the Project Board; the Executive chairs it (knowledge: PRINCE2 7)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>In PRINCE2 the Project Board has one Executive, who is ultimately accountable for the project and owns the business case, supported by the Senior User (user side) and the Senior Supplier (supplier side). The first three proposals fit these roles. Project Assurance is a Board responsibility and must be independent of the Project Manager, so it cannot be given to the PM (knowledge: PRINCE2 7). The Head of the IT Unit could instead join the Board in a supplier or user role, depending on what the IT Unit contributes (knowledge).<\/p><ul><li>A: PRINCE2 does not allow joint Executives, and the PM cannot provide assurance on their own work (knowledge: PRINCE2 7).<\/li><li>C: the Senior Supplier is often from an external supplier, so the contractor's delivery director can sit on the Board. Assurance by Lena is still not independent (knowledge: PRINCE2 7).<\/li><li>D: the Project Manager is not a member of the Project Board; the Executive chairs it (knowledge: PRINCE2 7).<\/li><\/ul>","knowledge_based":true,"frameworks":["PRINCE2","Knowledge"]},{"bank":"v2","key":"v2-43","id":43,"topic":43,"type":"scenario","word_count":111,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>In a PM² project in an EU agency, the Project Manager is planning two activities that must run one after the other: data migration, then acceptance testing. Both activities are uncertain, so the Project Manager collects three-point estimates from the experts in the Project Core Team:<\/p><ul><li>Data migration: optimistic 3 days, most likely 5 days, pessimistic 13 days<\/li><li>Acceptance testing: optimistic 6 days, most likely 8 days, pessimistic 16 days<\/li><\/ul><p>A colleague proposes to plan with the sum of the most likely estimates. The Project Manager prefers to use the weighted (Beta-PERT) average of each activity.<\/p><p>Using the weighted (Beta-PERT) average, what is the expected duration of the two activities together?<\/p>","stem_text":"In a PM² project in an EU agency, the Project Manager is planning two activities that must run one after the other: data migration, then acceptance testing. Both activities are uncertain, so the Project Manager collects three-point estimates from the experts in the Project Core Team: Data migration: optimistic 3 days, most likely 5 days, pessimistic 13 days Acceptance testing: optimistic 6 days, most likely 8 days, pessimistic 16 days A colleague proposes to plan with the sum of the most likely estimates. The Project Manager prefers to use the weighted (Beta-PERT) average of each activity. Using the weighted (Beta-PERT) average, what is the expected duration of the two activities together?","options":{"A":"13 days","B":"15 days","C":"17 days","D":"29 days"},"answer":"B","why_right_html":"<p>Weighted (Beta-PERT) mean = (O + 4M + P) / 6. Data migration: (3 + 4×5 + 13) / 6 = 36 / 6 = 6 days. Acceptance testing: (6 + 4×8 + 16) / 6 = 54 / 6 = 9 days. In sequence: 6 + 9 = <strong>15 days<\/strong>. PM² describes the three-point estimate as \"a weighted average of activity duration or cost\" and mentions Beta-PERT (PM² 3.1 App. C.8, p. A-102). The formula itself is standard (knowledge).<\/p>","why_wrong":{"A":"A: 13 days is the colleague's sum of the most likely values (5 + 8), which ignores the uncertainty.","C":"C: 17 days is the sum of simple averages: (3 + 5 + 13) / 3 = 7 and (6 + 8 + 16) / 3 = 10.","D":"D: 29 days is the sum of the pessimistic values (13 + 16), a worst case, not an expected duration."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Weighted (Beta-PERT) mean = (O + 4M + P) / 6. Data migration: (3 + 4×5 + 13) / 6 = 36 / 6 = 6 days. Acceptance testing: (6 + 4×8 + 16) / 6 = 54 / 6 = 9 days. In sequence: 6 + 9 = <strong>15 days<\/strong>. PM² describes the three-point estimate as \"a weighted average of activity duration or cost\" and mentions Beta-PERT (PM² 3.1 App. C.8, p. A-102). The formula itself is standard (knowledge).<\/p><ul><li>A: 13 days is the colleague's sum of the most likely values (5 + 8), which ignores the uncertainty.<\/li><li>C: 17 days is the sum of simple averages: (3 + 5 + 13) / 3 = 7 and (6 + 8 + 16) / 3 = 10.<\/li><li>D: 29 days is the sum of the pessimistic values (13 + 16), a worst case, not an expected duration.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v2","key":"v2-44","id":44,"topic":44,"type":"scenario","word_count":95,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>The Project Manager of a PM² project has collected optimistic, most likely and pessimistic estimates for each of the 40 tasks in the Work Breakdown Structure, working closely with the task owners. The Project Steering Committee now asks two questions: how confident can it be in the planned end date, and how much contingency should be kept for the riskiest tasks? The Head of Unit prefers a simpler approach and asks the Project Manager to keep only one figure per task.<\/p><p>According to the PM² Guide, how should the Project Manager use the three-point estimates?<\/p>","stem_text":"The Project Manager of a PM² project has collected optimistic, most likely and pessimistic estimates for each of the 40 tasks in the Work Breakdown Structure, working closely with the task owners. The Project Steering Committee now asks two questions: how confident can it be in the planned end date, and how much contingency should be kept for the riskiest tasks? The Head of Unit prefers a simpler approach and asks the Project Manager to keep only one figure per task. According to the PM² Guide, how should the Project Manager use the three-point estimates?","options":{"A":"Report only the optimistic estimates to the committee, and keep the gap to the pessimistic ones as a hidden reserve.","B":"Replace them with one most likely figure per task, since PM² recommends single-point estimates for the baseline.","C":"Average the three figures with equal weights for each task, since PM² gives each of the estimates the same importance.","D":"Calculate weighted averages and standard deviations, to judge confidence levels and set buffers for the riskiest tasks."},"answer":"D","why_right_html":"<p>\"These estimates can be used to calculate a standard deviation, to estimate confidence levels of the weighted average per activity, and to build simple statistical models of a task's time and cost. This method can be applied to forecast and mitigate risk and to assign buffers/contingencies to tasks\" (PM² 3.1 App. C.8, p. A-102). This answers both of the committee's questions.<\/p>","why_wrong":{"A":"A: hiding reserves from the governance body has no basis in PM² and defeats the committee's question about confidence.","B":"B: the technique uses \"a stochastic approach rather than a deterministic one (e.g. single point estimates)\" (App. C.8, p. A-102). Going back to one figure throws away the information the committee asked for.","C":"C: the estimates \"are then weighed to provide a weighted average\" (App. C.8); they are not given equal weight."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"These estimates can be used to calculate a standard deviation, to estimate confidence levels of the weighted average per activity, and to build simple statistical models of a task's time and cost. This method can be applied to forecast and mitigate risk and to assign buffers/contingencies to tasks\" (PM² 3.1 App. C.8, p. A-102). This answers both of the committee's questions.<\/p><ul><li>A: hiding reserves from the governance body has no basis in PM² and defeats the committee's question about confidence.<\/li><li>B: the technique uses \"a stochastic approach rather than a deterministic one (e.g. single point estimates)\" (App. C.8, p. A-102). Going back to one figure throws away the information the committee asked for.<\/li><li>C: the estimates \"are then weighed to provide a weighted average\" (App. C.8); they are not given equal weight.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-45","id":45,"topic":45,"type":"long","word_count":161,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>A Directorate-General has approved the Project Charter for a new grants management system, with a high-level budget of EUR 1.2 million. The scope in the Charter covers software development, testing, data migration from the old system, user training and deployment. In the Planning Phase, the Project Manager, Piotr, must now prepare the Effort and Cost Estimates.<\/p><p>The situation is as follows:<\/p><ul><li>the draft Work Breakdown Structure (WBS) has three work packages: development, testing and deployment;<\/li><li>data migration and user training are in scope, but do not appear in the draft WBS;<\/li><li>the Head of Unit suggests dividing the EUR 1.2 million between the three work packages in proportion to their size, to save time;<\/li><li>the contractor that will build the software offers to estimate the whole project alone, since its staff will do most of the work.<\/li><\/ul><p>Piotr wants estimates that are precise and that the people who will do the work accept as their own.<\/p><p>What should Piotr do FIRST?<\/p>","stem_text":"A Directorate-General has approved the Project Charter for a new grants management system, with a high-level budget of EUR 1.2 million. The scope in the Charter covers software development, testing, data migration from the old system, user training and deployment. In the Planning Phase, the Project Manager, Piotr, must now prepare the Effort and Cost Estimates. The situation is as follows: the draft Work Breakdown Structure (WBS) has three work packages: development, testing and deployment; data migration and user training are in scope, but do not appear in the draft WBS; the Head of Unit suggests dividing the EUR 1.2 million between the three work packages in proportion to their size, to save time; the contractor that will build the software offers to estimate the whole project alone, since its staff will do most of the work. Piotr wants estimates that are precise and that the people who will do the work accept as their own. What should Piotr do FIRST?","options":{"A":"Split the EUR 1.2 million from the Project Charter across the three work packages in proportion to their size.","B":"Accept the contractor's offer to estimate the whole project, as its staff will carry out most of the work.","C":"Complete the WBS with the missing in-scope work, then estimate each task together with its task owner.","D":"Make one three-point estimate for the whole project, so that its overall uncertainty is captured at once."},"answer":"C","why_right_html":"<p>The estimates can only be as good as the WBS: \"A high-quality Work Breakdown Structure (WBS) forms the basis for high-quality estimates\" (PM² 3.1 App. C.7, p. A-102), and a well-made WBS \"should be easy to understand, be complete\" (App. C.5, p. A-102). Data migration and training are in scope but missing, so the WBS must be completed first. Each task is then estimated \"in close cooperation with the task owners or other experts within the Project Core Team (PCT), to ensure more precise estimates and buy-in\" (App. C.7).<\/p>","why_wrong":{"A":"A: a top-down split of the Charter budget is not an estimate of the work, and it would hide the missing work packages. PM² estimates derive from the WBS (App. C.7).","B":"B: estimating without the task owners in the Project Core Team loses the precision and buy-in PM² asks for (App. C.7), and the WBS gap would remain.","D":"D: three-point estimates are made per activity, \"in conjunctions with Network Diagrams\" (App. C.8, p. A-102). One figure for the whole project does not fix the incomplete WBS."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The estimates can only be as good as the WBS: \"A high-quality Work Breakdown Structure (WBS) forms the basis for high-quality estimates\" (PM² 3.1 App. C.7, p. A-102), and a well-made WBS \"should be easy to understand, be complete\" (App. C.5, p. A-102). Data migration and training are in scope but missing, so the WBS must be completed first. Each task is then estimated \"in close cooperation with the task owners or other experts within the Project Core Team (PCT), to ensure more precise estimates and buy-in\" (App. C.7).<\/p><ul><li>A: a top-down split of the Charter budget is not an estimate of the work, and it would hide the missing work packages. PM² estimates derive from the WBS (App. C.7).<\/li><li>B: estimating without the task owners in the Project Core Team loses the precision and buy-in PM² asks for (App. C.7), and the WBS gap would remain.<\/li><li>D: three-point estimates are made per activity, \"in conjunctions with Network Diagrams\" (App. C.8, p. A-102). One figure for the whole project does not fix the incomplete WBS.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-46","id":46,"topic":46,"type":"scenario","word_count":102,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>A PM² project in an EU agency has five activities. The Project Manager has drawn the network diagram and calculated the critical path and the float of each activity:<\/p><ul><li>F (4 days) starts the project<\/li><li>G (6 days) follows F<\/li><li>H (3 days) follows F<\/li><li>J (2 days) follows H<\/li><li>K (5 days) follows both G and J<\/li><\/ul><p>The planned duration is 15 days. During execution, activity H is delayed by 3 days because a key expert is ill. All other activities take exactly their planned time, and no resources can be moved between activities.<\/p><p>What is the effect on the project?<\/p>","stem_text":"A PM² project in an EU agency has five activities. The Project Manager has drawn the network diagram and calculated the critical path and the float of each activity: F (4 days) starts the project G (6 days) follows F H (3 days) follows F J (2 days) follows H K (5 days) follows both G and J The planned duration is 15 days. During execution, activity H is delayed by 3 days because a key expert is ill. All other activities take exactly their planned time, and no resources can be moved between activities. What is the effect on the project?","options":{"A":"None: the project still takes 15 days, because H is not on the critical path.","B":"The project now takes 17 days, and F–H–J–K becomes the critical path.","C":"The project now takes 18 days, because the delay adds 3 days to the end date.","D":"The project now takes 16 days, because H had 2 days of float to absorb it."},"answer":"B","why_right_html":"<p>Before the delay there are two paths: F–G–K = 4 + 6 + 5 = 15 days (critical) and F–H–J–K = 4 + 3 + 2 + 5 = 14 days, so H and J have 1 day of float. With H delayed by 3 days, F–H–J–K = 4 + 6 + 2 + 5 = 17 days. This is now the longest path, so the project takes <strong>17 days<\/strong> and F–H–J–K becomes critical. PM² defines the critical path as \"the longest necessary path\" (PM² 3.1 App. C.13, p. A-103). The float calculation is standard (knowledge).<\/p>","why_wrong":{"A":"A: a non-critical activity can still delay the project when the delay is larger than its float (here 3 days against 1).","C":"C: 18 days adds the full delay to the old end date and ignores the 1 day of float.","D":"D: H had 1 day of float, not 2."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Before the delay there are two paths: F–G–K = 4 + 6 + 5 = 15 days (critical) and F–H–J–K = 4 + 3 + 2 + 5 = 14 days, so H and J have 1 day of float. With H delayed by 3 days, F–H–J–K = 4 + 6 + 2 + 5 = 17 days. This is now the longest path, so the project takes <strong>17 days<\/strong> and F–H–J–K becomes critical. PM² defines the critical path as \"the longest necessary path\" (PM² 3.1 App. C.13, p. A-103). The float calculation is standard (knowledge).<\/p><ul><li>A: a non-critical activity can still delay the project when the delay is larger than its float (here 3 days against 1).<\/li><li>C: 18 days adds the full delay to the old end date and ignores the 1 day of float.<\/li><li>D: H had 1 day of float, not 2.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v2","key":"v2-47","id":47,"topic":47,"type":"scenario","word_count":100,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>A PM² project to build a reporting platform for an EU agency is in the Executing Phase. The Project Manager's network diagram shows a planned duration of 120 working days. The critical path runs through the interface build, the data load and the integration tests. The user manual and the training material are not on the critical path, and each of them has 15 days of float. The Project Steering Committee asks whether the end date can be brought forward by 10 days. The team proposes four actions.<\/p><p>According to the PM² Guide, which action can shorten the project's duration?<\/p>","stem_text":"A PM² project to build a reporting platform for an EU agency is in the Executing Phase. The Project Manager's network diagram shows a planned duration of 120 working days. The critical path runs through the interface build, the data load and the integration tests. The user manual and the training material are not on the critical path, and each of them has 15 days of float. The Project Steering Committee asks whether the end date can be brought forward by 10 days. The team proposes four actions. According to the PM² Guide, which action can shorten the project's duration?","options":{"A":"Add a second technical writer to the user manual, so that it is finished well before its planned date.","B":"Start the training material earlier, so that the team has more free time for the remaining tasks.","C":"Add a second developer to the interface build, or run parts of it in parallel with the data load.","D":"Add a project buffer at the end of the schedule, so that the new end date is better protected."},"answer":"C","why_right_html":"<p>\"Activities can be prioritised in order to shorten the duration of the critical path by pruning the critical path activities, performing more activities in parallel or adding more resources\" (PM² 3.1 App. C.13, p. A-103). The interface build is on the critical path, so adding a developer or overlapping it with the data load can shorten the project.<\/p>","why_wrong":{"A":"A: the user manual has 15 days of float. Finishing it earlier does not change the longest path, so the end date stays the same.","B":"B: the training material is also off the critical path. Starting it earlier does not shorten the critical path.","D":"D: a project buffer comes from the Critical Chain Method and protects a date (PM² 3.1 App. C.14, p. A-104). It adds time to the schedule; it does not shorten it."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"Activities can be prioritised in order to shorten the duration of the critical path by pruning the critical path activities, performing more activities in parallel or adding more resources\" (PM² 3.1 App. C.13, p. A-103). The interface build is on the critical path, so adding a developer or overlapping it with the data load can shorten the project.<\/p><ul><li>A: the user manual has 15 days of float. Finishing it earlier does not change the longest path, so the end date stays the same.<\/li><li>B: the training material is also off the critical path. Starting it earlier does not shorten the critical path.<\/li><li>D: a project buffer comes from the Critical Chain Method and protects a date (PM² 3.1 App. C.14, p. A-104). It adds time to the schedule; it does not shorten it.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-48","id":48,"topic":48,"type":"long","word_count":152,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>Unit B.3 of a Directorate-General is planning a new PM² project. The Project Manager, Ines, reviews the last three projects of the unit and finds the same pattern each time:<\/p><ul><li>activity estimates were close to double the time the work actually needed;<\/li><li>when an activity finished early, the next one still started on its planned date;<\/li><li>team members often worked slowly at first and focused on the task only near its deadline;<\/li><li>one database specialist was assigned to two activities planned at the same time, which delayed both.<\/li><\/ul><p>The previous projects were all planned with the Critical Path Method (CPM) only. Ines is now considering the Critical Chain Method (CCM) for the new project. She must explain her choice to the Project Steering Committee in one short statement at its next meeting. Most of the committee members are not planning or scheduling specialists.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"Unit B.3 of a Directorate-General is planning a new PM² project. The Project Manager, Ines, reviews the last three projects of the unit and finds the same pattern each time: activity estimates were close to double the time the work actually needed; when an activity finished early, the next one still started on its planned date; team members often worked slowly at first and focused on the task only near its deadline; one database specialist was assigned to two activities planned at the same time, which delayed both. The previous projects were all planned with the Critical Path Method (CPM) only. Ines is now considering the Critical Chain Method (CCM) for the new project. She must explain her choice to the Project Steering Committee in one short statement at its next meeting. Most of the committee members are not planning or scheduling specialists. Which statement is correct according to the PM² Guide?","options":{"A":"CPM already covers the problem with the specialist, because it calculates the longest path from the resources assigned to each activity.","B":"CCM would add safety time to each activity, so that the delays caused by late starts are absorbed inside each of the tasks.","C":"The pattern matches the observations that CCM is based on, and CCM, unlike CPM, also takes resources and their levelling into account.","D":"The pattern shows that the estimates were too optimistic, so every estimate should be increased before the critical path is calculated."},"answer":"C","why_right_html":"<p>CCM \"is based on the observation that activity time estimates for projects are close to double the time required to complete the activities\". The guide gives as reasons \"not taking advantage of the early finish of an activity, pacing of the team members to fill the time available for the completion of a task, waiting until the last moment to really focus on the task at hand\". CCM \"is similar to the Critical Path Method (CPM), but takes into account resources and their levelling\" (PM² 3.1 App. C.14, p. A-103). Each of Ines's four findings matches.<\/p>","why_wrong":{"A":"A: CPM calculates \"the longest necessary path... of planned activities\" (App. C.13, p. A-103). Taking resources and their levelling into account is what the guide says CCM adds.","B":"B: this reverses the method. CCM \"assumes that a Project Manager's (PM) estimates of duration for activities are padded, and immediately proceeds to reduce them\", then adds project, feeding and resource buffers (App. C.14, p. A-104).","D":"D: the estimates were padded (about double), not optimistic. Increasing them would make the problem worse."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>CCM \"is based on the observation that activity time estimates for projects are close to double the time required to complete the activities\". The guide gives as reasons \"not taking advantage of the early finish of an activity, pacing of the team members to fill the time available for the completion of a task, waiting until the last moment to really focus on the task at hand\". CCM \"is similar to the Critical Path Method (CPM), but takes into account resources and their levelling\" (PM² 3.1 App. C.14, p. A-103). Each of Ines's four findings matches.<\/p><ul><li>A: CPM calculates \"the longest necessary path... of planned activities\" (App. C.13, p. A-103). Taking resources and their levelling into account is what the guide says CCM adds.<\/li><li>B: this reverses the method. CCM \"assumes that a Project Manager's (PM) estimates of duration for activities are padded, and immediately proceeds to reduce them\", then adds project, feeding and resource buffers (App. C.14, p. A-104).<\/li><li>D: the estimates were padded (about double), not optimistic. Increasing them would make the problem worse.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-49","id":49,"topic":49,"type":"scenario","word_count":97,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>In the Planning Phase of a PM² project to build a new HR portal, the Project Manager holds a workshop to prepare the Deliverables Breakdown Structure (DBS). At the end of the workshop, the draft DBS lists the portal's modules, the interfaces, the test reports and the user guide. One team member points out that the Project Handbook, the Project Work Plan and the Project Status Reports are missing. Another team member replies that these are management documents, not deliverables, so they do not belong in the DBS.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"In the Planning Phase of a PM² project to build a new HR portal, the Project Manager holds a workshop to prepare the Deliverables Breakdown Structure (DBS). At the end of the workshop, the draft DBS lists the portal's modules, the interfaces, the test reports and the user guide. One team member points out that the Project Handbook, the Project Work Plan and the Project Status Reports are missing. Another team member replies that these are management documents, not deliverables, so they do not belong in the DBS. Which statement is correct according to the PM² Guide?","options":{"A":"The second team member is right, and the management documents should first appear as tasks in the WBS, from which the DBS is derived.","B":"The second team member is right, because the DBS is limited to the products that the users will receive at the end of the project.","C":"The first team member is right, because the DBS covers both the project deliverables and the project management deliverables.","D":"The first team member is right, and the DBS should also show the effort in person days needed to produce each deliverable."},"answer":"C","why_right_html":"<p>The DBS is used \"to identify and document the deliverables of a project (both project deliverables and project management deliverables) and their interdependencies\" (PM² 3.1 App. C.6, p. A-102). The Project Handbook, Work Plan and Status Reports are project management deliverables, so they belong in the DBS.<\/p>","why_wrong":{"A":"A: this reverses the order. The DBS \"can precede\" the WBS and \"identifies the desired outputs (deliverables) which are then used in the creation of the Work Breakdown Structure (WBS)\" (App. C.6).","B":"B: the DBS covers the whole project, including project management deliverables, not only what users receive (App. C.6).","D":"D: the DBS defines what the project will produce. Effort in person days is estimated per WBS task with the Effort and Cost Estimates technique (App. C.7, p. A-102)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The DBS is used \"to identify and document the deliverables of a project (both project deliverables and project management deliverables) and their interdependencies\" (PM² 3.1 App. C.6, p. A-102). The Project Handbook, Work Plan and Status Reports are project management deliverables, so they belong in the DBS.<\/p><ul><li>A: this reverses the order. The DBS \"can precede\" the WBS and \"identifies the desired outputs (deliverables) which are then used in the creation of the Work Breakdown Structure (WBS)\" (App. C.6).<\/li><li>B: the DBS covers the whole project, including project management deliverables, not only what users receive (App. C.6).<\/li><li>D: the DBS defines what the project will produce. Effort in person days is estimated per WBS task with the Effort and Cost Estimates technique (App. C.7, p. A-102).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-50","id":50,"topic":50,"type":"scenario","word_count":92,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>A PM²-Agile project in an EU agency works in two-week iterations. The Release Plan foresees four more iterations before the next release. The Work Items still planned for this release total 150 points, as estimated by the Agile Team Members. In the last three iterations, the team delivered 26, 30 and 34 points. At this pace, the remaining work would need about five iterations rather than four. The Business Manager asks the Project Manager how the plan should now be handled.<\/p><p>According to the PM²-Agile Guide, what is the MOST appropriate response?<\/p>","stem_text":"A PM²-Agile project in an EU agency works in two-week iterations. The Release Plan foresees four more iterations before the next release. The Work Items still planned for this release total 150 points, as estimated by the Agile Team Members. In the last three iterations, the team delivered 26, 30 and 34 points. At this pace, the remaining work would need about five iterations rather than four. The Business Manager asks the Project Manager how the plan should now be handled. According to the PM²-Agile Guide, what is the MOST appropriate response?","options":{"A":"Extend each remaining iteration from two to three weeks, so that the 150 points fit into the planned release.","B":"Update the Release Plan with the measured velocity, and show optimistic and pessimistic scenarios to the business.","C":"Keep the Release Plan unchanged until the release ends, since velocity serves only to measure team performance.","D":"Ask the Product Owner to re-estimate the remaining Work Items at lower values, so that they fit the velocity."},"answer":"B","why_right_html":"<p>The average velocity is (26 + 30 + 34) / 3 = 30 points, so 150 points need 150 / 30 = 5 iterations, one more than planned. \"The updated data regarding the velocity of the team must be reflected in the Release Plan in order to continuously evaluate its feasibility\". Velocity and the size of the Work Items List \"allow the business stakeholders to make adjustments when required\", and scenarios can use \"an optimistic and pessimistic velocity\" (PM²-Agile 3.0.1 §7.2.2.2, p.78).<\/p>","why_wrong":{"A":"A: \"In PM²-Agile all iterations are timeboxed and with the same duration\" (PM²-Agile 3.0.1 §4.8, p.35).","C":"C: velocity is tracked \"in terms of planning regular iterations and measuring team performance\" (§4.5, p.33), and the guide says \"Revisit the plan after each Iteration\" (§7.2.2.2, p.78).","D":"D: the relative estimates are \"provided by the Agile Team Members (ATeM)\" (§7.2.2.2, p.78). Lowering the points does not reduce the work; it only hides the gap."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>The average velocity is (26 + 30 + 34) / 3 = 30 points, so 150 points need 150 / 30 = 5 iterations, one more than planned. \"The updated data regarding the velocity of the team must be reflected in the Release Plan in order to continuously evaluate its feasibility\". Velocity and the size of the Work Items List \"allow the business stakeholders to make adjustments when required\", and scenarios can use \"an optimistic and pessimistic velocity\" (PM²-Agile 3.0.1 §7.2.2.2, p.78).<\/p><ul><li>A: \"In PM²-Agile all iterations are timeboxed and with the same duration\" (PM²-Agile 3.0.1 §4.8, p.35).<\/li><li>C: velocity is tracked \"in terms of planning regular iterations and measuring team performance\" (§4.5, p.33), and the guide says \"Revisit the plan after each Iteration\" (§7.2.2.2, p.78).<\/li><li>D: the relative estimates are \"provided by the Agile Team Members (ATeM)\" (§7.2.2.2, p.78). Lowering the points does not reduce the work; it only hides the gap.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-51","id":51,"topic":51,"type":"long","word_count":150,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>An EU agency runs a PM²-Agile project to build an online complaints portal. The next release has four iterations of three weeks. The team's velocity has been stable at about 30 points per iteration, so the release can hold about 120 points. During release planning, the Product Owner prioritises the Work Items with MoSCoW:<\/p><ul><li>Must have: 102 points<\/li><li>Should have: 12 points<\/li><li>Could have: 6 points<\/li><\/ul><p>The Product Owner says the plan is efficient, because the release is full and almost everything in it is essential. He adds that if the Must have items are at risk near the end, the team can simply extend the last iteration by one week.<\/p><p>The Team Coordinator is worried about the plan and asks the Project Manager for an opinion on the plan before it goes to the Business Manager for discussion and approval.<\/p><p>Which assessment is MOST consistent with the PM²-Agile Guide?<\/p>","stem_text":"An EU agency runs a PM²-Agile project to build an online complaints portal. The next release has four iterations of three weeks. The team's velocity has been stable at about 30 points per iteration, so the release can hold about 120 points. During release planning, the Product Owner prioritises the Work Items with MoSCoW: Must have: 102 points Should have: 12 points Could have: 6 points The Product Owner says the plan is efficient, because the release is full and almost everything in it is essential. He adds that if the Must have items are at risk near the end, the team can simply extend the last iteration by one week. The Team Coordinator is worried about the plan and asks the Project Manager for an opinion on the plan before it goes to the Business Manager for discussion and approval. Which assessment is MOST consistent with the PM²-Agile Guide?","options":{"A":"The plan is sound, since a high share of Must have items gives the largest minimum viable product, and the last iteration can be extended.","B":"The plan should be redone in Actual Hours, because relative estimates in points cannot be used to plan a release.","C":"The Should have and Could have items should be built first, because they are small and give the users early results.","D":"The plan leaves almost no contingency, as about 85% of the release's points are Must have items, and the iteration length should stay fixed."},"answer":"D","why_right_html":"<p>Must have items take 102 / 120 = 85% of the release's points. Points measure size, not effort (PM²-Agile 3.0.1 §4.5), but at a stable velocity they are the usual proxy, so the comparison with the 60/20/20 guideline holds (my judgement). Only 18 points (15%) of Should and Could have items are left to drop if things go wrong. The guide notes that \"Some methodologies suggest that 60% of the total effort should be assigned to the 'Must have' requirements, 20% to the 'Should have' requirements, and 20% on the 'Could have' requirements\". Contingency is \"applied\" by dropping Should and Could have items while still delivering the Must haves (PM²-Agile 3.0.1 §4.5, p.33). Extending an iteration is not an option: \"In PM²-Agile all iterations are timeboxed and with the same duration\" (§4.8, p.35).<\/p>","why_wrong":{"A":"A: a high Must have share removes the contingency that MoSCoW is meant to give, and extending the iteration breaks the fixed timebox (§4.5, §4.8).","B":"B: PM²-Agile plans releases with relative estimates in points and velocity (§4.5, p.32; §7.2.2.2, p.78).","C":"C: this reverses the priority. The Must haves are the agreed \"'minimum usable subset' or 'minimum viable product'\" (§4.5, p.33)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Must have items take 102 / 120 = 85% of the release's points. Points measure size, not effort (PM²-Agile 3.0.1 §4.5), but at a stable velocity they are the usual proxy, so the comparison with the 60/20/20 guideline holds (my judgement). Only 18 points (15%) of Should and Could have items are left to drop if things go wrong. The guide notes that \"Some methodologies suggest that 60% of the total effort should be assigned to the 'Must have' requirements, 20% to the 'Should have' requirements, and 20% on the 'Could have' requirements\". Contingency is \"applied\" by dropping Should and Could have items while still delivering the Must haves (PM²-Agile 3.0.1 §4.5, p.33). Extending an
