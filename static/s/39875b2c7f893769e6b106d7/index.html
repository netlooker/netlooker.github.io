work**, assesses its **maturity**, takes **risk-management measures** and adopts a **cybersecurity plan**. Its **top management** answers for all of it. A new board of the EU bodies, the **IICB**, checks that they comply and can escalate if they do not. **CERT-EU** is the shared service that advises them, coordinates incident response and receives their incident reports. Serious incidents must be reported in three stages: 24 hours, 72 hours, one month."},{"type":"h2","text":"What problem it solves (recitals 1–5, pp. 1–2)"},{"type":"ul","items":["EU bodies depend on ICT, and their systems are interconnected with each other and with Member States: \"any disruption, even when initially confined to a single Union entity, can have cascading effects more broadly\" (recital 3).","They \"are attractive targets that face highly skilled and well-resourced threat actors as well as other threats\", yet their level of protection \"vary significantly\" (recital 4).","The NIS 2 Directive (EU) 2022/2555 already raises the bar for public and private entities in the Member States; this Regulation makes EU bodies \"follow suit\" (recital 5)."]},{"type":"p","text":"**For drafting (my judgement):** recitals 1–5 give you the \"why\" paragraph for any reader who asks why the rules exist or why they apply to them."},{"type":"h2","text":"Who it applies to (Arts 1–3, pp. 9–10)"},{"type":"ul","items":["All **Union entities**: institutions, bodies, offices and agencies set up under the Treaties (Art 3(1)), plus the IICB and CERT-EU themselves (Art 2(1)).","It respects each body's **institutional autonomy** (Art 2(2)): each sets its own Framework, measures and plan (recital 12).","It does **not** cover systems handling **EU classified information** (EUCI), except that CERT-EU may help on request (Art 2(3), Art 13(8)).","It covers the whole unclassified ICT environment, including cloud services, outsourced and third-party-hosted services, mobile devices and operational technology (Art 6(2))."]},{"type":"h2","text":"What each EU body must do (Chapter II, Arts 5–9)"},{"type":"table","head":["Obligation","In plain words","Deadline / cycle","Where"],"rows":[["Initial review, then the **Framework**","Audit where you stand, then set internal policies, objectives, roles and ways to measure effectiveness; all-hazards approach","8 April 2025; review at least every 4 years","Art 6(1)–(4), pp. 11–12"],["**Maturity assessment**","Assess the whole ICT environment, possibly with a specialised third party or jointly with similar bodies","8 July 2025, then at least every 2 years","Art 7, p. 12"],["**Risk-management measures**","Appropriate and proportionate measures in 16 domains plus 11 specific measures (MFA, encryption, supply chain, training…)","8 September 2025","Art 8, pp. 13–14"],["**Cybersecurity plan**","Approved by top management; includes the measures and the cyber crisis management plan; sent to the IICB","8 January 2026; revised every 2 years or more often","Art 9, p. 14"],["**Local cybersecurity officer**","Single point of contact; reports directly to top management","No date; notify CERT-EU","Art 6(8), p. 12"],["**Budget**","An adequate share of the ICT budget for cybersecurity, set with the Framework in mind","Ongoing; indicative target of at least 10% \"in the longer term\" (recital 14)","Art 6(7), p. 12"],["**Training**","Senior officials and relevant staff train regularly; all staff trained regularly","Ongoing","Art 6(9); Art 8(3)(h)–(i)"],["**Report incidents**","Significant incidents to CERT-EU in stages","24 h / 72 h / 1 month","Art 21, pp. 24–25"],["**Experts list**","List of technical experts available for major incidents","Updated yearly","Art 23(4), p. 27"]]},{"type":"p","text":"The four core pieces build on each other: **review → Framework → maturity assessment → measures → plan**. The plan is approved \"Following the conclusion of the cybersecurity maturity assessment\" and takes account of the Framework and the measures (Art 9(1))."},{"type":"p","text":"**From December 2026, the next dates are** (my arithmetic from the cycles): second maturity assessment by 8 July 2027; plan revision around January 2028; Framework review by 8 April 2029 at the latest. The Commission reports on implementation by 8 January 2027 and evaluates the Regulation by 8 January 2029 (Art 25(2)–(3))."},{"type":"h3","text":"The 11 specific measures (Art 8(3), p. 14)"},{"type":"p","text":"Teleworking rules; steps towards zero trust; \"the use of multifactor authentication as a norm across network and information systems\"; encryption; secure voice, video and text communications; anti-malware and anti-spyware; software supply-chain security; training for top management and responsible staff; regular staff training; interconnectivity risk analyses; and procurement rules that oblige suppliers to report incidents and remove contractual barriers to sharing information with CERT-EU."},{"type":"h3","text":"Proportionality (Art 8(1); recitals 12–14)"},{"type":"p","text":"Measures must be \"appropriate and proportionate\", taking account of the body's exposure, size and the likelihood and severity of incidents. Small bodies are not exempt; they scale their measures and can pool resources (Art 7(3), Art 6(8))."},{"type":"h2","text":"Who is responsible (Art 6(5)–(9))"},{"type":"ul","items":["\"The highest level of management of each Union entity shall be responsible for the implementation of this Regulation and shall oversee the compliance of its organisation with the obligations related to the Framework.\" (Art 6(5), p. 12)","It may delegate specific obligations to senior officials, but \"Regardless of any such delegation, the highest level of management may be held liable for infringements of this Regulation by the Union entity concerned.\" (Art 6(6), p. 12)","The **local cybersecurity officer** is the single point of contact; some of the officer's tasks can be delegated to CERT-EU under a service level agreement or shared among several bodies (Art 6(8)).","Recital 15 adds the culture point: \"the daily practice of cybersecurity\" is part of the Framework."]},{"type":"p","text":"**For drafting (my judgement):** whenever the reader is a Director or a Board, this is the paragraph that makes it personal. Responsibility cannot be handed off."},{"type":"h2","text":"The governance system"},{"type":"table","head":["Actor","What it is","What it does","Where"],"rows":[["**IICB** (Interinstitutional Cybersecurity Board)","Representatives of 15 named EU bodies plus 3 for the agencies via the EU Agencies Network","Monitors and supports implementation; steers CERT-EU; adopts guidelines, recommendations and a multiannual strategy; applies compliance measures; reports yearly","Arts 10–12, pp. 15–18"],["**CERT-EU** (Cybersecurity Service for the Union institutions, bodies, offices and agencies)","An autonomous interinstitutional service provider, placed in a Commission directorate-general for administrative support (Art 16(1))","Advice; baseline and chargeable services; information hub; coordinates incident response and major incidents; issues calls for action","Arts 13–18, pp. 18–23"],["**Each EU body**","Its top management and local cybersecurity officer","Implements Chapter II; reports incidents","Arts 6–9, 21"],["**ENISA**","The EU Agency for Cybersecurity","Consulted on guidelines; member of the IICB; cooperates with CERT-EU","Arts 5(1), 10(3), 13(5)"],["**Commission**","–","Hosts CERT-EU, provides the IICB secretariat, reports on and evaluates the Regulation","Arts 10(11), 16, 25"],["**Member State counterparts**","National CSIRTs and authorities","Exchange information with CERT-EU; informed of significant incidents on their territory","Arts 17, 21(3)"]]},{"type":"p","text":"CERT-EU's mission in one sentence: it advises EU bodies, helps them \"prevent, detect, handle, mitigate, respond to and recover from incidents\" and acts as their \"cybersecurity information exchange and incident response coordination hub\" (Art 13(1), p. 18). It keeps the short name CERT-EU \"because of name recognition\" (recital 19)."},{"type":"p","text":"**CERT-EU's toolbox:** baseline services in its service catalogue (Art 13(3)(b)); chargeable services such as 24/7 monitoring under service level agreements (Art 13(6)); proactive non-intrusive scanning on request (Art 13(3)(h)); calls for action, which are \"urgent security measures that Union entities are urged to take within a set timeframe\" (Art 14(1)(a)); proposals for guidelines and recommendations, which the IICB adopts (Art 14(1)(b)–(c))."},{"type":"h2","text":"If a body does not comply: the IICB ladder (Art 12, pp. 17–18; recital 24)"},{"type":"p","text":"After hearing the body, the IICB can, from the mildest step up:"},{"type":"ol","items":["issue a reasoned opinion on the gaps;","give guidelines to fix them within a set period;","issue a warning, with recommendations and a deadline;","issue a reasoned notification if the warning was not addressed;","recommend an audit, or request a third-party audit;","inform the Court of Auditors, where applicable;","recommend that Member States and EU bodies temporarily suspend data flows to the body."]},{"type":"p","text":"Recital 24 says these measures are applied \"progressively\", and the last step is for \"exceptional cases of long-term, deliberate, repetitive or serious infringements\". Warnings and recommendations go to the body's top management (Art 12(2)). For persistent infringements caused by an official, \"including at the highest level of management\", the IICB asks the body to consider disciplinary action (Art 12(4)). The IICB may extend the deadlines of Art 6(1) and Art 8(1) only, \"in duly substantiated cases\" (Art 12(5))."},{"type":"h2","text":"Incident reporting (Art 21, pp. 24–25)"},{"type":"p","text":"A **significant incident** is one that \"has caused or is capable of causing severe operational disruption to the functioning of, or financial loss to, the Union entity concerned\", or that \"has affected or is capable of affecting other natural or legal persons by causing considerable material or non-material damage\" (Art 21(1))."},{"type":"table","head":["When","What","To whom"],"rows":[["Within 24 hours of becoming aware","Early warning (flag suspected malicious or cross-border impact)","CERT-EU (Art 21(2)(a))"],["Within 24 hours","Information about the incident","Member State counterparts where the body is located (Art 21(3))"],["Within 72 hours","Incident notification: update, initial assessment of severity and impact","CERT-EU (Art 21(2)(b))"],["On request","Intermediate report","CERT-EU (Art 21(2)(c))"],["Within one month of the notification","Final report: root cause, mitigation, impact","CERT-EU (Art 21(2)(d))"],["Without undue delay","Measures users can take","Affected users (Art 21(5))"]]},{"type":"ul","items":["\"Without prejudice to Article 12, the mere act of notification shall not subject the Union entity to increased liability.\" (Art 21(4), p. 25)","Voluntary reporting of other incidents, threats, near misses and vulnerabilities is welcome and creates no extra obligations (Art 20(1)).","Why staged reporting: recital 36 balances \"swift reporting that helps mitigate the potential spread of significant incidents and allows Union entities to seek assistance\" with \"in-depth reporting that draws valuable lessons from individual incidents\".","A **major incident** exceeds the capacity of the body and CERT-EU to respond, or significantly affects at least two bodies (Art 3(8)). CERT-EU coordinates it under the IICB's cyber crisis management plan (Arts 13(3)(f), 23)."]},{"type":"h2","text":"Information sharing, confidentiality and personal data (Arts 4, 17, 19, 20)"},{"type":"ul","items":["Personal data are processed under Regulation (EU) 2018/1725, \"only to the extent necessary and for the sole purpose\" of the tasks in this Regulation (Art 4(1)–(2)).","Professional secrecy applies (Art 19(1)); so do information-security rules (Art 19(3)).","CERT-EU may share information that identifies an affected body with other EU bodies only with that body's consent; a body that refuses must give reasons (Art 20(3)).","With Member State counterparts, CERT-EU exchanges incident-specific information without the body's authorisation, provided personal data are protected; information revealing the body's identity needs its consent, unless disclosure would help avoid or mitigate incidents elsewhere or the body has already gone public (Art 17(3)).","CERT-EU may ask a body for information from its ICT system inventories, which the body sends \"without undue delay\" (Art 20(2)).","EUCI and information marked as not for further distribution are excluded from sharing (Art 20(6)).","CERT-EU supports bodies, in cooperation with the EDPS, on incidents that involve personal data breaches (Art 13(11))."]},{"type":"h2","text":"Words to get right"},{"type":"table","head":["Term","Meaning","Where"],"rows":[["Union entities","All EU institutions, bodies, offices and agencies","Art 3(1)"],["Highest level of management","The most senior administrative level responsible for running the body (for an agency, typically the Executive Director: my example)","Art 3(5)"],["Framework","The body's internal cybersecurity risk-management, governance and control framework","Art 6(1)"],["Significant incident","Defined in Art 21(1), not Art 3","Art 21(1)"],["Major incident","Beyond the capacity of the body and CERT-EU, or significant impact on two or more bodies","Art 3(8)"],["Calls for action","CERT-EU's urgent measures with a deadline","Art 14(1)(a)"],["Baseline / chargeable services","CERT-EU services included in the catalogue / provided under separate agreements","Art 13(3)(b), 13(6)"]]},{"type":"h2","text":"Search terms for the PDF viewer on test day"},{"type":"p","text":"The TAO PDF viewer has a search box (TAO instructions §6.4.1). These terms land on the right passage fast (my selection):"},{"type":"ul","items":["\"highest level of management\": responsibility, delegation, liability, approval of the plan","\"local cybersecurity officer\": the officer's role and the options to share or delegate it","\"adequate percentage\" or \"10 %\": the budget point (note the space in \"10 %\")","\"multifactor\": MFA as a norm","\"early warning\", \"72 hours\", \"final report\": the reporting timeline","\"reasoned opinion\", \"suspend\": the compliance ladder","\"proportionate\": proportionality, size of the body","\"service level agreement\", \"chargeable\": buying services from CERT-EU","\"supply chain\", \"procurement\": supplier and contract rules","\"maturity assessment\", \"every two years\", \"four years\": the cycles"]},{"type":"h2","text":"What the Regulation does not say"},{"type":"ul","items":["**No sanctions on individuals** beyond asking the body to consider disciplinary action (Art 12(4)); no fines.","**No fixed budget percentage** as a legal duty: Art 6(7) says \"adequate\"; the 10% is an indicative target in a recital.","**No exemption for small bodies**, only proportionality and pooling.","**Nothing on specific tools or vendors.** Concrete details in an answer (helpdesk visits, dates, owners) are logical assumptions, which EPSO allows (written-test page, retrieved 2026-11-22)."]}]},"source":"eufte/model-essay.md","title":"Annotated model essay – assignment M","intro":"**Written by your trainer on 2026-11-23 for practice. Assignment M is not a real or past EPSO task, and the answer is not an EPSO model answer.** It shows one way to meet EPSO's five anchors (https://eu-careers.europa.eu/en/help/what-written-test, retrieved 2026-11-22). The notes on why each part is there are my judgement. Assignment M deliberately uses a topic that none of the practice assignments A–H covers, so reading it spoils none of them. About 400 words, which is realistic for 40 minutes in my judgement; no word limit has been published.","assignment":[{"type":"p","text":"You are the local cybersecurity officer of a fictional EU agency with about 250 staff."},{"type":"p","text":"Since last month, all staff must use multifactor authentication (MFA) to log in to the agency's systems. The ICT unit has also blocked a free online file-sharing service that the Grants Unit used to exchange documents with external experts."},{"type":"p","text":"The Head of the Grants Unit, Anna Ferreira, has e-mailed you: \"My unit is evaluating 300 grant applications with a legal deadline at the end of next month. The new login procedure and the blocked file-sharing tool are slowing us down badly. Who decided this, and on what basis? Can my unit be exempted?\""},{"type":"p","text":"Write a reply to Ms Ferreira."}],"plan":"Reader: Head of Grants Unit, non-specialist, annoyed, under deadline pressure\nPurpose: explain + say no to exemption + keep her on side (solve her problem)\nFormat: e-mail reply\nAsked for: 1) who decided  2) on what basis  3) exemption?  [implied: 4) her deadline]\n\n1 Bottom line: rules come from EU regulation; no exemption; we can remove most of the delay this week\n2 Who + basis: Reg 2023/2841; Framework under top mgmt (Art 6(1), 6(5)); MFA as a norm (8(3)(c)); cloud + suppliers (8(2)(c), (m)); contracts (8(3)(k))\n3 Why it matters for grants: rec. 4 attractive targets; rec. 3 cascade; applicants' data\n4 Exemption: no - \"as a norm\" across systems; management accountable (6(5)); fits her risk too\n5 Offer: MFA set-up help; approved sharing tool for experts; priority if deadline at risk\n6 Close: me = single point of contact (6(8)); contact details","planWhy":"The first four lines are the method's \"read the task\" step (eufte/method.md): reader, purpose, format and a checklist of what is asked. \"Implied: her deadline\" matters: she did not ask for help in words, but her real problem is the deadline, and a reply that ignores it fails on audience and purpose. The numbered lines are the skeleton: each became the first sentence of a paragraph. This block was typed into the answer box and deleted in the last five minutes.","segments":[{"label":"Subject line","blocks":[{"type":"p","text":"Subject: MFA and the file-sharing tool – why they apply, and how we can protect your deadline"}],"why":"The subject line names both of her concerns and promises a solution. She knows before opening it that the reply is about her problem, not a policy lecture.","anchors":[3,4],"weaker":"Subject: RE: Complaint"},{"label":"Opening and bottom line","blocks":[{"type":"p","text":"Dear Ms Ferreira,"},{"type":"p","text":"Thank you for raising this before it affects your evaluations. In short: both measures follow from an EU regulation that binds the agency, so I cannot exempt your unit. However, we can remove most of the delay this week, and I set out below how."}],"why":"The answer to her direct question (\"Can my unit be exempted?\") comes in the first paragraph, together with the help on offer. A busy, annoyed reader needs the bottom line first. If she reads only this, she knows where she stands. The first sentence acknowledges her concern without apologising for the rules.","anchors":[1,4],"weaker":"I refer to your e-mail of yesterday concerning the recently introduced security measures. Cybersecurity has become a major challenge for all organisations, and the EU institutions are no exception."},{"label":"Who decided, and on what basis","blocks":[{"type":"p","text":"The measures implement Regulation (EU, Euratom) 2023/2841, which requires every EU institution, body and agency to manage its cybersecurity risks through an internal framework, established under the responsibility of its highest level of management (Article 6(1) and (5)) – in our case, the Executive Director. Among the measures the Regulation lists is \"the use of multifactor authentication as a norm across network and information systems\" (Article 8(3)(c)). It also requires a policy on the use of cloud services and attention to the security of external service providers (Article 8(2)(c) and (m)), including contracts that oblige providers to report incidents (Article 8(3)(k)). As a free service, the blocked tool gives us no such contract."}],"why":"This answers \"who decided\" (the Executive Director, under the Regulation) and \"on what basis\" (the articles) in one paragraph, in her order. Only one phrase is quoted word for word, the one that settles the MFA question; the rest is applied, not copied. The last sentence links the general rule to her specific tool. That link is a logical assumption (we are not told the free tool has no contract), which EPSO allows; it is short and plausible.","anchors":[3,5],"weaker":"Article 8(2) lists sixteen domains: (a) cybersecurity policy; (b) policies on cybersecurity risk analysis; (c) policy objectives regarding the use of cloud computing services; (d) cybersecurity audit … [and so on through (p)]"},{"label":"Why it matters for her unit","blocks":[{"type":"p","text":"This matters for grants in particular. The Regulation notes that EU bodies \"are attractive targets that face highly skilled and well-resourced threat actors\", and that an incident in one body can spread to others (recitals 3 and 4). Your unit holds applicants' personal and commercial data. A stolen password, or a leak through an uncontrolled service, would cost far more time than MFA does."}],"why":"Rules land better when the reader sees her own interest in them. The paragraph uses the source (recitals 3 and 4) and then turns to her unit's data and her own concern, time. It persuades without lecturing, in four sentences.","anchors":[4,5],"weaker":null},{"label":"The exemption","blocks":[{"type":"p","text":"An exemption is not possible. The Regulation makes MFA the norm for all systems, and the agency's management is accountable for applying it consistently."}],"why":"Two sentences, a clear \"no\" and the reason. Repeating the \"no\" here, after the reasons, closes her question for good. Hedging (\"it may be difficult to consider…\") would invite a second e-mail.","anchors":[2,3],"weaker":"Regarding the possibility of an exemption, I would like to point out that, as explained above, the Regulation, which applies to all Union entities, provides that multifactor authentication should be used as a norm, and therefore, taking into account the responsibility of the highest level of management, it would in principle be difficult to envisage an exemption, although the matter could perhaps be discussed further."},{"label":"What we will do","blocks":[{"type":"p","text":"What I can do is make the measures much less costly for your team:"},{"type":"ul","items":["Tomorrow, a colleague from the IT helpdesk will come to your unit to help staff set up MFA on their phones, which should cut login delays to a few seconds.","By Friday, we will open a workspace for your external experts on the agency's approved file-sharing service. Experts will receive an invitation and a short guide.","If your deadline is still at risk after that, please tell me the critical dates and we will give your requests priority."]}],"why":"This is the part she cares about most, so it gets concrete dates and owners. A list suits three parallel actions; the reasoning stays in prose elsewhere. The actions themselves are logical assumptions (the Regulation says nothing about helpdesks), which is fine as long as they are plausible and serve the task. The last point answers the implied question about her deadline.","anchors":[1,4,5],"weaker":null},{"label":"Close","blocks":[{"type":"p","text":"As the agency's local cybersecurity officer, I am its single point of contact for all cybersecurity matters (Article 6(8)), so please contact me directly on extension 4417 if anything blocks your work."},{"type":"p","text":"Kind regards,\n[Name]\nLocal Cybersecurity Officer"}],"why":"The close turns \"who decided\" into \"who helps\": she now has one named person to call. It uses a final detail from the source (Article 6(8)) that fits naturally, and it ends with an action, not a courtesy formula alone.","anchors":[1,4,5],"weaker":null}],"takeaways":["Answer the reader's direct question in the first paragraph, then explain.","Make a checklist of everything asked, plus the reader's implied need, and answer each in its own paragraph, in the reader's order.","Quote the source only where the exact words settle the point; otherwise apply it in your own words, with the article number.","Saying no politely: give the answer clearly, give the reason once, and offer something real.","Use logical assumptions to make advice concrete (dates, owners), and keep them short and plausible.","Delete the plan before the time runs out; it should already have become your structure."],"words":394}</script>
<script>
(function () {
  'use strict';

  /* ======================================================================
   * Constants
   * ==================================================================== */
  // Storage v2: every per-question store is keyed by the question's `key` ("v1-12", "v2-12").
  // Data saved by the v1 app under 'epsoMock.v1.*' (numeric ids) is migrated once on boot (see migrateV1Storage).
  var NS = 'epsoMock.v2.';
  var OLD_NS = 'epsoMock.v1.';
  var KEYS = {
    exam: NS + 'exam',             // running exam
    result: NS + 'lastResult',     // last submitted exam (for the results view)
    history: NS + 'history',       // array of past exam summaries
    stats: NS + 'stats',           // per-question stats, by key
    practice: NS + 'practice',     // current practice session
    migrated: NS + 'migrated',     // marker: the v1 -> v2 migration has run
    eufteSeen: NS + 'eufteSeen'    // EUFTE probable essays whose model answer was opened: { p1: true, … }
  };
  var OLD_KEYS = { exam: OLD_NS + 'exam', result: OLD_NS + 'lastResult', history: OLD_NS + 'history', stats: OLD_NS + 'stats', practice: OLD_NS + 'practice' };
  var BOTH = 'both';
  var TYPE_LABELS = { short: 'Short', scenario: 'Scenario', long: 'Long case' };
  var EXAM_SIZE = 30;
  var EXAM_MINUTES = 40;
  var PASS_RATIO = 0.5;            // 15/30 (notice §4.3.2(c))
  var TARGET_SEC = 80;             // 40 min / 30 questions
  var PLACES = 228;
  var LETTERS = ['A', 'B', 'C', 'D'];
  var HISTORY_MAX = 300;

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var main = document.getElementById('main');
  var announcer = document.getElementById('announcer');

  /* ======================================================================
   * Utilities
   * ==================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function passMark(total) { return Math.ceil(total * PASS_RATIO); }
  function fmtClock(ms, roundUp) {
    var s = Math.max(0, roundUp ? Math.ceil(ms / 1000) : Math.round(ms / 1000));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  var dateFmt = (function () {
    try { return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return null; }
  })();
  function fmtDate(ms) {
    var d = new Date(ms);
    if (isNaN(d.getTime())) return '—';
    return dateFmt ? dateFmt.format(d) : d.toISOString().slice(0, 16).replace('T', ' ');
  }
  function wrapBlock(html) {
    var t = String(html || '').trim();
    return /^<(p|ul|ol|div)\b/i.test(t) ? t : '<p>' + t + '</p>';
  }
  function excerpt(text, n) {
    var t = String(text || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t;
  }

  var ICONS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    flag: '<path d="M5.5 21V4"/><path d="M5.5 4.5h11l-2.2 4.2 2.2 4.3h-11" fill="currentColor"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    alert: '<path d="M12 3.8l9 15.7H3z"/><path d="M12 10v4.2M12 17v.2"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.9v.2"/>',
    left: '<path d="M14.5 6l-6 6 6 6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>',
    dot: '<circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>',
    minus: '<path d="M6.5 12h11"/>',
    grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/>'
  };
  function icon(name, cls) {
    return '<svg class="icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  }

  function announce(msg) {
    announcer.textContent = '';
    window.setTimeout(function () { announcer.textContent = msg; }, 60);
  }

  /* ======================================================================
   * Random
   * ==================================================================== */
  var hasCrypto = !!(window.crypto && window.crypto.getRandomValues);
  function randInt(n) {
    if (n <= 1) return 0;
    if (hasCrypto) {
      var limit = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1), x;
      do { window.crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return x % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ======================================================================
   * Data
   * ==================================================================== */
  function loadData() {
    var el = document.getElementById('question-data');
    var raw;
    try { raw = JSON.parse(el.textContent); } catch (e) { return null; }
    if (!raw || !Array.isArray(raw.questions)) return null;
    // Schema 1 (no `bank`/`key`/`topic`): every question is v1, topic = id.
    var qs = raw.questions.filter(function (q) {
      return q && q.id != null && q.options && LETTERS.every(function (l) { return typeof q.options[l] === 'string'; }) &&
        LETTERS.indexOf(q.answer) !== -1;
    }).map(function (q) {
      q.id = Number(q.id);
      q.bank = q.bank ? String(q.bank) : 'v1';
      q.key = q.key ? String(q.key) : q.bank + '-' + q.id;
      q.topic = q.topic != null ? Number(q.topic) : q.id;
      q.type = TYPE_LABELS[q.type] ? q.type : 'short';
      q.word_count = Number(q.word_count) || String(q.stem_text || '').split(/\s+/).filter(Boolean).length;
      q.duty = Number(q.duty);
      q.batch = Number(q.batch);
      q.duties = Array.isArray(q.duties) && q.duties.length ? q.duties.map(Number) : [q.duty];
      q.why_wrong = q.why_wrong || {};
      q.why_wrong_shared = q.why_wrong_shared || {};
      return q;
    });
    if (!qs.length) return null;
    // Banks, in display order: the declared ones first, then any bank only seen on questions. Empty banks are dropped.
    var declared = Array.isArray(raw.banks) ? raw.banks.filter(function (b) { return b && b.id; }) : [];
    var bankIds = declared.map(function (b) { return String(b.id); });
    qs.forEach(function (q) { if (bankIds.indexOf(q.bank) === -1) bankIds.push(q.bank); });
    var banks = bankIds.map(function (id) {

    ex.index = i;
    saveExam();
    renderExamQuestion();
    var bar = $('.exam-bar', main), area = $('#q-area', main);
    if (bar && area) {
      var top = area.getBoundingClientRect().top - bar.getBoundingClientRect().height - 16;
      if (top < 0 || area.getBoundingClientRect().top > window.innerHeight * 0.6) window.scrollBy(0, top);
    }
    if (focusHeading || hadFocusInQuestion || document.activeElement === document.body) {
      var h = $('[data-view-heading]', main); if (h) h.focus({ preventScroll: true });
    }
    document.title = 'Exam — question ' + (i + 1) + ' of ' + ex.keys.length + ' — Field MCQ mock (unofficial)';
    announce('Question ' + (i + 1) + ' of ' + ex.keys.length + (ex.answers[ex.keys[i]] ? ', answered ' + ex.answers[ex.keys[i]] : '') + (ex.flags[ex.keys[i]] ? ', flagged' : ''));

  /* ======================================================================
   * Ticker (absolute end time)
   * ==================================================================== */
  function updateTimers() {
    var ex = S.exam;
    if (!ex) return;
    var rem = examRemaining();
    if (rem <= 0) { finalizeExam(true); return; }
    var txt = fmtClock(rem, true);
    var t = $('[data-timer]', main);
    if (t) {
      var tt = $('[data-timer-text]', t);
      if (tt.textContent !== txt) tt.textContent = txt;
      var dt = document.querySelector('[data-dialog-timer]');
      if (dt && dt.textContent !== txt) dt.textContent = txt;
      var warn = rem <= 5 * 60000, crit = rem <= 60000;
      if (t.classList.contains('is-warn') !== (warn && !crit)) t.classList.toggle('is-warn', warn && !crit);
      if (t.classList.contains('is-crit') !== crit) t.classList.toggle('is-crit', crit);
      var ic = $('[data-timer-icon]', t), want = warn ? 'alert' : 'clock';
      if (ic.getAttribute('data-icon') !== want) { ic.innerHTML = icon(want); ic.setAttribute('data-icon', want); }
    }
    if (rem <= 5 * 60000 && !ex.warned5) {
      ex.warned5 = true; saveExam();
      if (currentView === 'exam' && ex.durationMs > 5 * 60000) announce('5 minutes remaining');
    }
    if (rem <= 60000 && !ex.warned1) {
      ex.warned1 = true; saveExam();
      if (currentView === 'exam' && ex.durationMs > 60000) announce('1 minute remaining');
    }
    $$('[data-resume-left]', main).forEach(function (el) { if (el.textContent !== txt) el.textContent = txt; });
  }

  /* ======================================================================
   * Explanations (shared by results and practice)
   * ==================================================================== */
  function kbNote(q) {
    return q.knowledge_based ? '<p class="kb-note">' + icon('info') + '<span>Includes general knowledge — not checked against a saved source</span></p>' : '';
  }
  function explanationHtml(q, chosen, hlevel) {
    var h = 'h' + (hlevel || 4), out = '';
    var L = q.answer;
    if (!chosen || chosen === L) {
      out += '<section class="expl expl-right"><' + h + '>' + icon('check') + 'Why ' + L + ' is right</' + h + '><div class="expl-body">' + wrapBlock(q.why_right_html) + '</div>' + kbNote(q) + '</section>';
      if (!chosen) {
        out += '<details class="more"><summary>Show the full explanation (including the other options)</summary><div class="expl-body">' + wrapBlock(q.full_html) + '</div></details>';
      }
      return out;
    }
    var reason = q.why_wrong[chosen];
    if (reason) {
      out += '<section class="expl expl-right"><' + h + '>' + icon('check') + 'Why ' + L + ' is right</' + h + '><div class="expl-body">' + wrapBlock(q.why_right_html) + '</div>' + kbNote(q) + '</section>';
      out += '<section class="expl expl-wrong"><' + h + '>' + icon('cross') + 'Why your answer (' + chosen + ') is wrong</' + h + '><div class="expl-body">' + wrapBlock(reason) + '</div>' +
        (q.why_wrong_shared[chosen] ? '<p class="shared-note">The answer key gives this reason for several options together.</p>' : '') + '</section>';
    } else {
      out += '<section class="expl expl-right"><' + h + '>' + icon('check') + 'Why ' + L + ' is right</' + h + '><div class="expl-body">' + wrapBlock(q.full_html) + '</div>' + kbNote(q) + '</section>';
      out += '<section class="expl expl-wrong"><' + h + '>' + icon('cross') + 'Why your answer (' + chosen + ') is wrong</' + h + '><p>The answer key has no separate bullet for option ' + chosen + '. The explanation above is the whole entry; read it for why ' + chosen + ' does not fit.</p></section>';
    }
    return out;
  }
  function optionStateBody(q, L, chosen) {
    var isAns = L === q.answer, isChosen = L === chosen, status = '';
    if (isChosen && isAns) status = icon('check') + 'Your answer — correct';
    else if (isChosen) status = icon('cross') + 'Your answer — incorrect';
    else if (isAns) status = icon('check') + 'Correct answer';
    return '<span class="opt-body"><span class="opt-letter" aria-hidden="true">' + L + '</span>' +
      '<span class="opt-main"><span class="opt-text"><span class="sr-only">' + L + '. </span>' + q.options[L] + '</span>' +
      '<span class="opt-status">' + status + '</span></span></span>';
  }
  function optionStateClass(q, L, chosen) {
    if (L === q.answer) return 'is-correct';
    if (L === chosen) return 'is-wrong';
    return chosen ? 'is-dim' : '';
  }

  /* ======================================================================
   * Results
   * ==================================================================== */
  var reviewFilter = 'all';
  function resultItems(r) {
    return r.keys.map(function (k, i) {
      var q = D.byKey.get(k);
      if (!q) return null;
      var a = r.answers[k] || null;
      return { n: i + 1, key: k, q: q, a: a, status: !a ? 'unanswered' : (a === q.answer ? 'correct' : 'wrong'), flagged: !!r.flags[k] };
    }).filter(Boolean);
  }
  function renderResults() {
    var r = S.result;
    if (!r) { replaceView('home'); return false; }
    var items = resultItems(r);
    var total = items.length;
    var score = items.filter(function (x) { return x.status === 'correct'; }).length;
    var pm = passMark(total), passed = score >= pm;
    var used = r.usedMs != null ? r.usedMs : Math.min(r.durationMs, r.submittedAt - r.startedAt);
    var answeredN = items.filter(function (x) { return !!x.a; }).length;
    var paceBase = answeredN || total;
    var avg = paceBase ? used / 1000 / paceBase : 0;
    var diff = Math.round(avg - TARGET_SEC);
    var paceText = Math.abs(diff) < 1 ? 'exactly on the ' + TARGET_SEC + ' s target' :
      (diff > 0 ? Math.abs(diff) + ' s over the ' + TARGET_SEC + ' s target' : Math.abs(diff) + ' s under the ' + TARGET_SEC + ' s target');
    var counts = { all: total, wrong: 0, unanswered: 0, flagged: 0 };
    items.forEach(function (x) { if (x.status === 'wrong') counts.wrong++; if (x.status === 'unanswered') counts.unanswered++; if (x.flagged) counts.flagged++; });
    var missed = counts.wrong + counts.unanswered;

    var perDuty = {};
    items.forEach(function (x) { var p = perDuty[x.q.duty] = perDuty[x.q.duty] || { drawn: 0, correct: 0 }; p.drawn++; if (x.status === 'correct') p.correct++; });
    var dutyRows = Object.keys(perDuty).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      var p = perDuty[d];
      return '<tr><th scope="row">' + esc(dutyName(d)) + '</th><td class="num">' + p.drawn + '</td><td class="num">' + p.correct + '</td>' +
        '<td>' + meterCell(pct(p.correct, p.drawn)) + '</td></tr>';
    }).join('');

    var actions = function (where) {
      return '<div class="btn-row">' +
        '<button type="button" class="btn btn-primary" data-action="start-exam" data-bank="' + esc(validBank(r.bank) ? r.bank : defaultBank()) + '">New exam' + (D.multi ? ' (' + esc(bankShort(validBank(r.bank) ? r.bank : defaultBank())) + ')' : '') + '</button>' +
        '<button type="button" class="btn" data-action="practise-missed"' + (missed ? '' : ' aria-disabled="true"') + '>Practise the ones I missed (' + missed + ')</button>' +
        '<a class="btn" href="#home">Home</a>' +
        (where === 'top' ? '' : '<a class="btn" href="#progress">Progress</a>') +
        '</div>';
    };

    main.innerHTML =
      '<div class="wrap page">' +
        '<div class="page-head"><p class="eyebrow">Exam simulation · ' + (D.multi ? esc(bankLabel(r.bank)) + ' · ' : '') + esc(fmtDate(r.submittedAt)) + '</p>' +
        '<h1 tabindex="-1" data-view-heading>Exam results</h1>' + (r.debugMinutes ? debugBadge(r.debugMinutes) : '') + '</div>' +
        (r.timedOut ? '<div class="note note-warn" role="status">' + icon('clock') + '<p><strong>Time expired — the exam was submitted automatically.</strong></p></div>' : '') +
        '<section class="card score-card" aria-labelledby="score-h" style="margin-top:1rem">' +
          '<div><h2 id="score-h" class="sr-only">Score</h2><div class="score-big">' + score + '<span class="den"> / ' + total + '</span></div></div>' +
          '<div>' +
            '<p><span class="verdict ' + (passed ? 'verdict-pass' : 'verdict-fail') + '">' + icon(passed ? 'check' : 'cross') +
              (passed ? 'PASS' : 'FAIL') + '</span> <span class="muted">' + (passed ? 'At or above' : 'Below') + ' the pass mark of ' + pm + '/' + total + '</span></p>' +
            '<ul class="kv">' +
              '<li>Score: <strong>' + pct(score, total) + '%</strong></li>' +
              '<li>Time used: <strong>' + fmtClock(used) + '</strong> of ' + fmtClock(r.durationMs) + '</li>' +
              '<li>Average: <strong>' + Math.round(avg) + ' s</strong> per ' + (answeredN && answeredN < total ? 'answered question (' + answeredN + ' of ' + total + ' answered)' : 'question') + ' — ' + paceText + '</li>' +
            '</ul>' +
            '<p class="small muted" style="margin-top:.7rem">Passing is necessary but not enough. Candidates are then ranked on this test, and only the highest-ranked (in principle up to 1.5 × ' + PLACES + ' ≈ ' + Math.round(1.5 * PLACES) + ') go forward to have their EUFTE marked (notice §4.3.3). Aim for the highest score you can.</p>' +
          '</div>' +
        '</section>' +
        actions('top') +
        '<h2 id="duty-h">Score by duty</h2>' +
        '<div class="table-wrap"><table class="table" aria-labelledby="duty-h"><caption>Drawn per duty: questions are drawn in proportion to each duty’s share of the bank (at least one per duty).</caption>' +
          '<thead><tr><th scope="col">Duty</th><th scope="col" class="num">Drawn</th><th scope="col" class="num">Correct</th><th scope="col">Accuracy</th></tr></thead>' +
          '<tbody>' + dutyRows + '</tbody></table></div>' +
        '<h2 id="review-h">Review</h2>' +
        '<div class="filters" role="group" aria-label="Filter the review">' +
          ['all', 'wrong', 'unanswered', 'flagged'].map(function (f) {
            var label = { all: 'All', wrong: 'Wrong', unanswered: 'Unanswered', flagged: 'Flagged' }[f];
            return '<button type="button" class="btn btn-small" data-action="review-filter" data-filter="' + f + '" aria-pressed="' + (reviewFilter === f) + '">' + label + ' (' + counts[f] + ')</button>';
          }).join('') +
        '</div>' +
        '<p class="sr-only" data-review-status aria-live="polite"></p>' +
        '<ol class="review-list" data-review-list aria-labelledby="review-h"></ol>' +
        actions('bottom') +
      '</div>';
    renderReviewList(items);
    return 'Exam results: ' + score + ' out of ' + total + ', ' + (passed ? 'pass' : 'fail');
  }
  function renderReviewList(items, announceIt) {
    var list = $('[data-review-list]', main);
    if (!list) return;

      return reviewFilter === 'all' || (reviewFilter === 'flagged' ? x.flagged : x.status === reviewFilter);

      list.innerHTML = shown.map(function (x) {
        var q = x.q;
        var badge = x.status === 'correct' ? '<span class="badge badge-ok">' + icon('check') + 'Correct</span>' :
          x.status === 'wrong' ? '<span class="badge badge-bad">' + icon('cross') + 'Incorrect</span>' :
          '<span class="badge">' + icon('minus') + 'Not answered</span>';
        return '<li class="rev-item" data-status="' + x.status + '"><article aria-labelledby="rev-' + x.n + '">' +
          '<div class="rev-head"><h3 id="rev-' + x.n + '">Question ' + x.n + '</h3>' + badge +
            (x.flagged ? '<span class="badge badge-flag">' + icon('flag') + 'Flagged</span>' : '') + '</div>' +
          '<p class="rev-meta">' + esc(dutyName(q.duty)) + ' · ' + esc(qLabel(q)) + ' · Batch ' + esc(q.batch) + (typeTag(q) ? ' ' + typeTag(q) : '') + '</p>' +
          stemHtml(q, 'rev-stem-' + x.n) +
          '<ul class="rev-opts">' + LETTERS.map(function (L) {
            return '<li class="' + optionStateClass(q, L, x.a) + '">' + optionStateBody(q, L, x.a) + '</li>';
          }).join('') + '</ul>' +
          (x.a ? '' : '<p><strong>Not answered.</strong> The correct answer is ' + q.answer + '.</p>') +
          explanationHtml(q, x.a, 4) +
          '</article></li>';
      }).join('');
    }
    if (announceIt) {
      var st = $('[data-review-status]', main);
      if (st) { st.textContent = ''; window.setTimeout(function () { st.textContent = 'Showing ' + plural(shown.length, 'question'); }, 60); }
    }

  function meterCell(p) {
    return '<span class="meter-cell"><span class="meter" aria-hidden="true"><span style="width:' + Math.max(0, Math.min(100, p)) + '%"></span></span><span class="meter-val">' + p + '%</span></span>';
  }

  /* ======================================================================
   * Practice
   * ==================================================================== */
  function practiceSourceKeys(source, dutyNum, bank) {
    var pool = poolFor(bank);
    var keysOf = function (qs) { return qs.map(function (q) { return q.key; }); };
    if (source === 'all') return keysOf(pool);
    if (source === 'weak') return weakKeys(bank);
    if (source === 'duty') return keysOf(pool.filter(function (q) { return q.duties.indexOf(dutyNum) !== -1; }));
    var m = /^batch-(\d+)$/.exec(source);
    if (m) { var b = Number(m[1]); return keysOf(pool.filter(function (q) { return q.batch === b; })); }
    return [];
  }
  function startPractice(keys, label, opts) {
    opts = opts || {};
    if (S.exam) { go('exam-lock'); return; }
    keys = keys.filter(function (k) { return D.byKey.has(k); });
    if (!keys.length) return;
    if (opts.order === 'bank') keys.sort(function (a, b) { return D.order[a] - D.order[b]; });
    else if (opts.order !== 'keep') shuffle(keys);
    if (opts.limit && opts.limit < keys.length) keys = keys.slice(0, opts.limit);
    S.practice = { v: 2, bank: opts.bank || bankOfKeys(keys), keys: keys, idx: 0, answers: {}, label: label, createdAt: Date.now(), done: false };
    savePractice();
    go('practice');
  }
  function practiceCorrectCount(p) {
    return p.keys.filter(function (k) { return p.answers[k] && p.answers[k] === D.byKey.get(k).answer; }).length;
  }
  function practiceAnsweredCount(p) { return p.keys.filter(function (k) { return !!p.answers[k]; }).length; }

  function renderPractice() {
    var p = S.practice;
    if (!p) return renderPracticeSetup();
    if (p.done || p.idx >= p.keys.length) return renderPracticeSummary();
    return renderPracticeQuestion();
  }

  function renderExamLock() {
    main.innerHTML =
      '<div class="wrap page"><div class="prose">' +
        '<div class="page-head"><p class="eyebrow">Practice</p><h1 tabindex="-1" data-view-heading>Practice is locked during an exam</h1></div>' +
        '<p>An exam is running. Practice shows the answers, so it stays closed until you submit the exam or the time runs out.</p>' +
        '<div class="btn-row"><a class="btn btn-primary" href="#exam">Back to the exam</a><a class="btn" href="#home">Home</a></div>' +
      '</div></div>';
    return 'Practice is locked during an exam';
  }

  var WEAK_HELP_NONE = 'None yet. A question becomes weak when you answer it wrongly, or leave it blank in an exam. Answering it correctly later removes it.';
  var WEAK_HELP_SOME = 'Questions you last answered wrongly, or left blank in an exam. Answering one correctly removes it.';

  function sparkline(history) {
    var h = history.slice(-20);
    var W = 640, H = 150, left = 44, right = 8, top = 10, base = H - 14;
    var slot = (W - left - right) / Math.max(h.length, 8);
    var bw = Math.min(28, slot * 0.7);
    var y = function (p) { return base - (base - top) * p; };
    var bars = h.map(function (e, i) {
      var p = e.total ? e.score / e.total : 0, x = left + i * slot + (slot - bw) / 2, pass = e.score >= passMark(e.total);
      var yy = y(p);
      return '<rect class="' + (pass ? 'bar-pass' : 'bar-fail') + '" x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1.5, base - yy).toFixed(1) + '" rx="3"><title>' +
        esc(fmtDate(e.date)) + ': ' + e.score + '/' + e.total + (pass ? ' (pass)' : ' (fail)') + '</title></rect>';
    }).join('');
    var label = 'Scores of the last ' + plural(h.length, 'exam') + ', oldest to newest: ' + h.map(function (e) { return e.score + '/' + e.total; }).join(', ') + '. Pass mark 15/30.';
    return '<figure class="spark-fig"><svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' +
      '<line class="axis" x1="' + (left - 4) + '" y1="' + base + '" x2="' + (W - right) + '" y2="' + base + '"/>' +
      '<text x="0" y="' + (y(1) + 4) + '">100%</text><text x="8" y="' + (y(0.5) + 4) + '">50%</text><text x="16" y="' + (base + 4) + '">0%</text>' +
      bars +
      '<line class="passline" x1="' + (left - 4) + '" y1="' + y(PASS_RATIO) + '" x2="' + (W - right) + '" y2="' + y(PASS_RATIO) + '"/>' +
      '</svg><figcaption class="small muted">Last ' + plural(h.length, 'exam') + ', oldest on the left. Bars: score as a share of the questions (filled = pass, outline = fail). Dashed line: pass mark 15/30.</figcaption></figure>';
  }

  // EPSO's five anchors, verbatim from https://eu-careers.europa.eu/en/help/what-written-test (retrieved 2026-11-22).
  var ANCHORS = [
    'Structures written communication with a logical flow of ideas.',
    'Writes concisely, avoiding unnecessary words and sentences.',
    'Presents subject matter in a clear and understandable way.',
    'Adapts and tailors writing to suit the intended audience and purpose.',
    'Uses the information provided effectively to address the assignment.'

  var ANCHOR_SHORT = ['Structure', 'Concision', 'Clarity', 'Audience and purpose', 'Use of information'];
  var eufteNotesOn = true;
  function loadEufte() {

    catch (e) { return null; }
  }
  // Minimal inline markdown for trusted build data: **bold** and bare https links; everything else escaped.
  function mdInline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/https?:\/\/[^\s,)<]+/g, function (u) { return '<a href="' + u + '" rel="noopener noreferrer" target="_blank">' + u + '</a>'; });
  }
  function eufteBlocks(blocks) {
    return blocks.map(function (b) {
      if (b.type === 'ul' || b.type === 'ol') return '<' + b.type + '>' + b.items.map(function (i) { return '<li>' + mdInline(i) + '</li>'; }).join('') + '</' + b.type + '>';
      return '<p>' + mdInline(b.text) + '</p>';
    }).join('');
  }
  function eufteMissing(title) {

  }

      '<ol class="anchor-list">' + ANCHORS.map(function (a, i) { return '<li><strong>' + esc(ANCHOR_SHORT[i]) + ':</strong> ' + esc(a) + '</li>'; }).join('') + '</ol>' +

  }

  // Plan, annotated answer and takeaways for one essay.

    var segs = E.segments.map(function (sg, i) {

          '<h3 id="ann-h-' + n + '"><span class="ann-num" style="position:static" aria-hidden="true">' + n + '</span>' + esc(sg.label) + '</h3>' +
          '<ul class="ann-chips" aria-label="Anchors served">' + chips + '</ul>' +
          '<p>' + mdInline(sg.why) + '</p>' +
          (sg.weaker ? '<details><summary>Compare a weaker version</summary><p class="weaker">' + mdInline(sg.weaker) + '</p></details>' : '') +

  // #eufte-pN: one probable assignment; the model stays hidden until opened.
  function renderEufteProbable(id) {
    if (!EUFTE || !EUFTE.probable) return eufteMissing('EUFTE assignment');
    var P = EUFTE.probable, i = -1;
    for (var k = 0; k < P.length; k++) if (P[k].id === id) i = k;
    var E = P[i];

    var prev = i > 0 ? '<a href="#eufte-' + P[i - 1].id + '">← ' + esc(P[i - 1].title) + '</a>' : '<span></span>';
    var next = i < P.length - 1 ? '<a href="#eufte-' + P[i + 1].id + '">' + esc(P[i + 1].title) + ' →</a>' : '<span></span>';

      ? 'This covers the same ground as your practice assignment ' + esc(E.overlap) + '. Write ' + esc(E.overlap) + ' first (<code>eufte/practice/</code>), then open this model to compare.'

    main.innerHTML =
      '<div class="wrap page"><div class="stack">' + eufteBackLink() +
        '<div class="prose"><p class="eyebrow">Probable assignment ' + E.rank + ' of ' + P.length + ' · my ranking</p>' +
          '<h1 tabindex="-1" data-view-heading>' + esc(E.title) + '</h1></div>' +
        eufteDisclaimer('Written by your trainer for practice. Not a real or past EPSO task, and not an EPSO model answer.') +

        '<section class="card prose" aria-labelledby="asg-h"><h2 id="asg-h">The assignment</h2>' + eufteBlocks(E.assignment) + '</section>' +

  // #eufte-summary: executive summary of the Regulation.

    'eufte-hide': function (el) {
      var seen = eufteSeen(); delete seen[el.getAttribute('data-id')]; Store.set(KEYS.eufteSeen, seen);
      route();
      announce('Model answer hidden');
    },
    'eufte-jump': function (el) {
      var target = document.getElementById(el.getAttribute('data-target'));
      if (target) { target.setAttribute('tabindex', '-1'); target.scrollIntoView({ block: 'start' }); target.focus({ preventScroll: true }); }
    },
    'eufte-notes': function (el) {
      eufteNotesOn = !eufteNotesOn;
      var box = $('[data-ann-essay]', main);
      if (box) box.classList.toggle('notes-off', !eufteNotesOn);
      el.setAttribute('aria-pressed', String(!eufteNotesOn));
      el.textContent = eufteNotesOn ? 'Hide notes: read as sent' : 'Show notes';
      announce(eufteNotesOn ? 'Notes shown' : 'Notes hidden: the essay as sent');
    }
  };
  main.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || !main.contains(el)) return;
    if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    var fn = ACTIONS[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  main.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.name === 'exam-opt' && t.checked && S.exam) examSetAnswer(t.value);
    if (t && t.name === 'exam-bank' && t.checked) { var n = $('[data-exam-n]', main); if (n) n.textContent = String(examSizeFor(t.value)); }
  });
  document.getElementById('skip-link').addEventListener('click', function () {
    var h = $('[data-view-heading]', main);
    (h || main).focus();
  });

  /* ======================================================================
   * Keyboard
   * ==================================================================== */
  function isTypingTarget(t) {
    if (!t || !t.tagName) return false;
    var tag = t.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return true;
    if (tag === 'INPUT') return ['radio', 'checkbox', 'button', 'submit', 'reset'].indexOf((t.type || '').toLowerCase()) === -1;
    return false;
  }
  function isActivator(t) {
    return !!(t && t.closest && t.closest('button, a[href], summary'));
  }
  function letterFromKey(k) {
    var i = ['1', '2', '3', '4'].indexOf(k);
    if (i !== -1) return LETTERS[i];
    var u = k.length === 1 ? k.toUpperCase() : '';
    return LETTERS.indexOf(u) !== -1 ? u : null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    if (dialogIsOpen()) return;
    var t = e.target;
    if (isTypingTarget(t)) return;
    var k = e.key;
    var inOurForm = t && t.closest && t.closest('form');
    if (inOurForm) return;                                   // practice setup form: leave keys alone

    if (currentView === 'exam' && S.exam) {
      var L = letterFromKey(k);
      if (L) { e.preventDefault(); examSetAnswer(L); announce('Answer ' + L + ' selected'); return; }
      if (k === 'f' || k === 'F') { e.preventDefault(); examToggleFlag(); return; }
      if (k === 'ArrowRight') { e.preventDefault(); examGoto(S.exam.index + 1); return; }
      if (k === 'ArrowLeft') { e.preventDefault(); examGoto(S.exam.index - 1); return; }
      if (k === 'Enter' && !isActivator(t)) { e.preventDefault(); examGoto(S.exam.index + 1); return; }
      return;
    }
    if (currentView === 'practice' && S.practice && !S.practice.done && S.practice.idx < S.practice.keys.length) {
      var p = S.practice, answered = !!p.answers[p.keys[p.idx]];
      var L2 = letterFromKey(k);
      if (L2 && !answered) { e.preventDefault(); practiceAnswer(L2); return; }
      if (answered && (k === 'ArrowRight' || (k === 'Enter' && !isActivator(t)))) { e.preventDefault(); practiceNext(); }
    }
  });

  /* ======================================================================
   * beforeunload
   * ==================================================================== */
  // Armed only after a real user gesture: browsers refuse the prompt otherwise (and log an error).
  // Arm the leave-page warning only after a real user activation (Chrome blocks it otherwise and logs an error).
  var userInteracted = false;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (ev === 'keydown' && (e.key === 'Escape' || e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta')) return;
      userInteracted = true;
    }, { capture: true });
  });
  function hasUserActivation() {
    var ua = navigator.userActivation;
    return ua && typeof ua.hasBeenActive === 'boolean' ? ua.hasBeenActive : userInteracted;
  }
  window.addEventListener('beforeunload', function (e) {
    if (hasUserActivation() && S.exam && !finalizing && examRemaining() > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ======================================================================
   * Boot
   * ==================================================================== */
  VIEWS = { home: renderHome, exam: renderExam, results: renderResults, practice: renderPractice, 'practice-setup': renderPracticeSetup, 'exam-lock': renderExamLock, progress: renderProgress, eufte: renderEufte, 'eufte-m': renderEufteModel, 'eufte-summary': renderEufteSummary };
  if (EUFTE && EUFTE.probable) EUFTE.probable.forEach(function (e) { VIEWS['eufte-' + e.id] = function () { return renderEufteProbable(e.id); }; });

  if (!D) {
    main.innerHTML = '<div class="wrap page"><h1>Question data missing</h1><p>This file has no question data. Build it with <code>python3 app/build/dev-build.py --data questions.json --out …</code>.</p></div>';
    return;
  }
  if (!Store.isOk()) showStorageBanner();
  migrateV1Storage();
  loadState();
  if (S.exam && examRemaining() <= 0) {
    finalizeExam(true);                  // expired while away: submit now, route to results
  } else {
    route();
  }
  window.setInterval(updateTimers, 250);
  document.addEventListener('visibilitychange', updateTimers);

  /* One namespace for debugging only. */
  window.EpsoMock = Object.freeze({
    version: 2,
    keys: KEYS,
    banks: function () { return JSON.parse(JSON.stringify(D.banks)); },
    migration: function () { return Store.get(KEYS.migrated, null); },
    state: function () { return JSON.parse(JSON.stringify(S)); },
    allocate: allocate,
    drawExam: drawExam
  });
})();
</script>
