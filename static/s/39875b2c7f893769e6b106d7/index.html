 contract is awarded to that tenderer, because award criteria prevail once tenders are ranked.","B":"The contract cannot be awarded to that tenderer: award criteria apply only once the authority has verified that the tenderer is not excluded and meets the selection criteria.","C":"The contract is awarded to that tenderer on condition that it lodges a performance guarantee.","D":"The procedure must be cancelled and relaunched."},"answer":"B","why_right_html":"<p>Contracts are awarded on the basis of award criteria \"provided that the contracting authority has verified\" that the tenderer \"is not excluded under Article 138\" and \"meets the selection criteria\" (FR Art. 170(1)(b)–(c)).<\/p>","why_wrong":{"A":"A reverses the logic.","C":"C: a performance guarantee (Art. 176) does not cure exclusion.","D":"D: there is no rule that the procedure must be cancelled. The authority can move to the next tender in the ranking. Annex I point 36.1 says that where a contract cannot be signed with the successful tenderer, it may be awarded \"to the following best tenderer\"."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Contracts are awarded on the basis of award criteria \"provided that the contracting authority has verified\" that the tenderer \"is not excluded under Article 138\" and \"meets the selection criteria\" (FR Art. 170(1)(b)–(c)).<\/p><ul><li>A reverses the logic.<\/li><li>C: a performance guarantee (Art. 176) does not cure exclusion.<\/li><li>D: there is no rule that the procedure must be cancelled. The authority can move to the next tender in the ranking. Annex I point 36.1 says that where a contract cannot be signed with the successful tenderer, it may be awarded \"to the following best tenderer\".<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-35","id":35,"topic":35,"type":"short","word_count":11,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"In PM², who prepares the Outsourcing Plan, and who reviews it?","stem_text":"In PM², who prepares the Outsourcing Plan, and who reviews it?","options":{"A":"The Business Manager prepares it; the Project Owner reviews it.","B":"The Solution Provider prepares it; the Project Steering Committee reviews it.","C":"The Contractor's Project Manager prepares it; the Project Manager reviews it.","D":"The Project Manager prepares it; the Solution Provider reviews it."},"answer":"D","why_right_html":"<p>For the Outsourcing Plan, the \"Project Manager (PM): Prepares the Outsourcing Plan\", and the \"Solution Provider (SP): Reviews the plan\" (PM² 3.1 §6.5, p.48).<\/p>","why_wrong":{"A":"A and B misassign the roles.","B":"A and B misassign the roles.","C":"C: the Contractor's PM delivers the outsourced services (§9.13) and does not plan them."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>For the Outsourcing Plan, the \"Project Manager (PM): Prepares the Outsourcing Plan\", and the \"Solution Provider (SP): Reviews the plan\" (PM² 3.1 §6.5, p.48).<\/p><ul><li>C: the Contractor's PM delivers the outsourced services (§9.13) and does not plan them.<\/li><li>A and B misassign the roles.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-36","id":36,"topic":36,"type":"short","word_count":21,"batch":1,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"In a PM² Make or Buy Analysis, which of the following is given as a potential reason for a <strong>make<\/strong> decision?","stem_text":"In a PM² Make or Buy Analysis, which of the following is given as a potential reason for a make decision?","options":{"A":"Intellectual property concerns","B":"Lack of technical expertise in-house","C":"Insufficient in-house resources","D":"The suppliers' technical experience"},"answer":"A","why_right_html":"<p>\"Potential reasons for a make decision include cost effectiveness, intellectual property concerns, quality control issues or supplier unreliability issues.\" B, C and D come from the list of reasons to <strong>buy<\/strong>: \"lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101).<\/p>","why_wrong":{"B":"B, C and D come from the list of reasons to <strong>buy<\/strong>: \"lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101).","C":"B, C and D come from the list of reasons to <strong>buy<\/strong>: \"lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101).","D":"B, C and D come from the list of reasons to <strong>buy<\/strong>: \"lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101)."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>\"Potential reasons for a make decision include cost effectiveness, intellectual property concerns, quality control issues or supplier unreliability issues.\" B, C and D come from the list of reasons to <strong>buy<\/strong>: \"lack of technical expertise, suppliers' technical experience and/or insufficient in-house resources\" (PM² 3.1 App. C.2, p. A-101).<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-37","id":37,"topic":37,"type":"short","word_count":18,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"In PM², how do the Project Management Plans (e.g. risk, change, quality, communications) relate to the Project Handbook?","stem_text":"In PM², how do the Project Management Plans (e.g. risk, change, quality, communications) relate to the Project Handbook?","options":{"A":"They replace the Project Handbook once the Planning Phase is complete.","B":"They are prepared only for large projects, kept separately and approved by the Appropriate Governance Body.","C":"All Project Management Plans should be considered part of the Project Handbook.","D":"They are annexes to the Project Charter."},"answer":"C","why_right_html":"<p>\"All Project Management Plans should be considered part of the Project Handbook\" (PM² 3.1 §6.2, guidelines, p.42).<\/p>","why_wrong":{"A":"A: the Handbook is kept up to date throughout the project and is not replaced.","B":"B and D are invented.","D":"B and D are invented."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"All Project Management Plans should be considered part of the Project Handbook\" (PM² 3.1 §6.2, guidelines, p.42).<\/p><ul><li>A: the Handbook is kept up to date throughout the project and is not replaced.<\/li><li>B and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-38","id":38,"topic":38,"type":"short","word_count":18,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"According to the PM² Guide, the Project Manager is responsible for all Project Reports with one exception. Which?","stem_text":"According to the PM² Guide, the Project Manager is responsible for all Project Reports with one exception. Which?","options":{"A":"External audit reports","B":"Status reports to the Project Steering Committee","C":"Reports on the status of outsourced work","D":"Reports containing agreed project indicators and metrics"},"answer":"A","why_right_html":"<p>The PM is \"Responsible for all Project Reports (except external audit reports)\" (PM² 3.1 §7.4, p.59). B, C and D are all ordinary project reports: §7.4 lists outsourcing status and agreed indicators and metrics as report content.<\/p>","why_wrong":{"B":"B, C and D are all ordinary project reports: §7.4 lists outsourcing status and agreed indicators and metrics as report content.","C":"B, C and D are all ordinary project reports: §7.4 lists outsourcing status and agreed indicators and metrics as report content.","D":"B, C and D are all ordinary project reports: §7.4 lists outsourcing status and agreed indicators and metrics as report content."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>The PM is \"Responsible for all Project Reports (except external audit reports)\" (PM² 3.1 §7.4, p.59). B, C and D are all ordinary project reports: §7.4 lists outsourcing status and agreed indicators and metrics as report content.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-39","id":39,"topic":39,"type":"short","word_count":7,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"When is a PM² project officially closed?","stem_text":"When is a PM² project officially closed?","options":{"A":"When the Project Manager has archived all project documentation","B":"When the project passes the RfC (Ready for Closing) phase gate","C":"When the Project Owner formally accepts the last deliverable","D":"Once all Closing Phase activities are completed and the Project Owner has approved the project"},"answer":"D","why_right_html":"<p>\"The project is officially closed once all Closing Phase activities are completed and the Project Owner (PO) has approved the project\" (PM² 3.1 §8.4, p.67).<\/p>","why_wrong":{"A":"A: archiving is part of administrative closure, not the end point.","B":"B: RfC comes at the end of Executing, before Closing even starts.","C":"C: final acceptance of deliverables is necessary but is not the closing point."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"The project is officially closed once all Closing Phase activities are completed and the Project Owner (PO) has approved the project\" (PM² 3.1 §8.4, p.67).<\/p><ul><li>A: archiving is part of administrative closure, not the end point.<\/li><li>B: RfC comes at the end of Executing, before Closing even starts.<\/li><li>C: final acceptance of deliverables is necessary but is not the closing point.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-40","id":40,"topic":40,"type":"short","word_count":14,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"According to the PM² Guide, when should improvement opportunities and post-project recommendations be captured?","stem_text":"According to the PM² Guide, when should improvement opportunities and post-project recommendations be captured?","options":{"A":"Only during the Project-End Review Meeting, so that they are discussed by everyone at once","B":"As they come up during the project, so that they are not lost by the time the project reaches the Closing Phase","C":"After administrative closure, by the Project Support Office","D":"Only at each phase gate, as part of the phase-exit review"},"answer":"B","why_right_html":"<p>\"Improvement opportunities and Post-Project Recommendations should be captured in some form as they come up during the project. Otherwise, particularly in longer projects, the ideas might get lost by the time the project reaches the Closing Phase\" (PM² 3.1 §8.2, p.65).<\/p>","why_wrong":{"A":"A is the trap: the formal gathering happens at closing, but capture should not wait for it.","C":"C and D are invented.","D":"C and D are invented."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>\"Improvement opportunities and Post-Project Recommendations should be captured in some form as they come up during the project. Otherwise, particularly in longer projects, the ideas might get lost by the time the project reaches the Closing Phase\" (PM² 3.1 §8.2, p.65).<\/p><ul><li>A is the trap: the formal gathering happens at closing, but capture should not wait for it.<\/li><li>C and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-41","id":41,"topic":41,"type":"short","word_count":10,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"In PRINCE2, what does the principle \"manage by exception\" mean?","stem_text":"In PRINCE2, what does the principle \"manage by exception\" mean?","options":{"A":"The project manager escalates every deviation from the plan to the Project Board as soon as it occurs.","B":"The Project Board meets weekly to review all project decisions.","C":"Tolerances are set for the project's objectives, and a management level escalates to the level above only when a tolerance is forecast to be exceeded.","D":"The Executive handles exceptions to the business case alone, without informing the other Board members."},"answer":"C","why_right_html":"<p>In PRINCE2, tolerances are set for each level of management. A level escalates to the one above only when a tolerance is forecast to be exceeded. This is what lets the Project Board avoid micro-managing (knowledge: PRINCE2 7, principle \"manage by exception\").<\/p>","why_wrong":{"A":"A is the opposite of the principle.","B":"B is not a PRINCE2 rule.","D":"D is invented."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>In PRINCE2, tolerances are set for each level of management. A level escalates to the one above only when a tolerance is forecast to be exceeded. This is what lets the Project Board avoid micro-managing (knowledge: PRINCE2 7, principle \"manage by exception\").<\/p><ul><li>A is the opposite of the principle.<\/li><li>B is not a PRINCE2 rule.<\/li><li>D is invented.<\/li><\/ul>","knowledge_based":true,"frameworks":["PRINCE2","Knowledge"]},{"bank":"v1","key":"v1-42","id":42,"topic":42,"type":"short","word_count":9,"batch":2,"duty":1,"duties":[1],"section":"Duty 1: lifecycle, reporting and closing","stem_html":"Which roles make up the Project Board in PRINCE2?","stem_text":"Which roles make up the Project Board in PRINCE2?","options":{"A":"Executive, Senior User and Senior Supplier","B":"Project Owner, Solution Provider and Business Manager","C":"Sponsor, Project Manager and Team Manager","D":"Executive, Project Assurance and Change Authority"},"answer":"A","why_right_html":"<p>The PRINCE2 Project Board is the Executive (who owns the business case), the Senior User and the Senior Supplier (knowledge: PRINCE2 7).<\/p>","why_wrong":{"B":"B is the PM² trap: PO, SP and BM are PM² roles (PM² 3.1 §4.5–4.7).","C":"C mixes in roles that sit below the Board.","D":"D: Project Assurance and Change Authority are delegated roles, not Board members."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The PRINCE2 Project Board is the Executive (who owns the business case), the Senior User and the Senior Supplier (knowledge: PRINCE2 7).<\/p><ul><li>B is the PM² trap: PO, SP and BM are PM² roles (PM² 3.1 §4.5–4.7).<\/li><li>C mixes in roles that sit below the Board.<\/li><li>D: Project Assurance and Change Authority are delegated roles, not Board members.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","PRINCE2","Knowledge"]},{"bank":"v1","key":"v1-43","id":43,"topic":43,"type":"short","word_count":30,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"For an activity, the optimistic estimate is 4 days, the most likely 6 days and the pessimistic 14 days. Using the weighted (Beta-PERT) three-point formula, what is the expected duration?","stem_text":"For an activity, the optimistic estimate is 4 days, the most likely 6 days and the pessimistic 14 days. Using the weighted (Beta-PERT) three-point formula, what is the expected duration?","options":{"A":"6 days","B":"8 days","C":"6.5 days","D":"7 days"},"answer":"D","why_right_html":"<p>The weighted (Beta-PERT) mean is (O + 4M + P) / 6 = (4 + 24 + 14) / 6 = 42 / 6 = <strong>7 days<\/strong>. PM² describes the weighting and mentions Beta-PERT (PM² 3.1 App. C.8, p. A-102). The formula itself is standard (knowledge).<\/p>","why_wrong":{"A":"A is the most likely value alone.","B":"B is the trap: 8 is the simple average (4 + 6 + 14) / 3.","C":"C is invented."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The weighted (Beta-PERT) mean is (O + 4M + P) / 6 = (4 + 24 + 14) / 6 = 42 / 6 = <strong>7 days<\/strong>. PM² describes the weighting and mentions Beta-PERT (PM² 3.1 App. C.8, p. A-102). The formula itself is standard (knowledge).<\/p><ul><li>B is the trap: 8 is the simple average (4 + 6 + 14) / 3.<\/li><li>A is the most likely value alone.<\/li><li>C is invented.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v1","key":"v1-44","id":44,"topic":44,"type":"short","word_count":10,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"How does the PM² Guide characterise the Three-Point Estimate technique?","stem_text":"How does the PM² Guide characterise the Three-Point Estimate technique?","options":{"A":"As a deterministic, single-point estimating technique","B":"Primarily as a quantitative risk assessment technique that uses a stochastic rather than a deterministic approach","C":"As a qualitative technique for classifying stakeholders","D":"As a top-down analogous estimating technique based on similar past projects"},"answer":"B","why_right_html":"<p>\"It is primarily a quantitative risk assessment technique that makes use of a stochastic approach rather than a deterministic one (e.g. single point estimates)\" (PM² 3.1 App. C.8, p. A-102).<\/p>","why_wrong":{"A":"A is the opposite.","C":"C and D describe other techniques.","D":"C and D describe other techniques."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>\"It is primarily a quantitative risk assessment technique that makes use of a stochastic approach rather than a deterministic one (e.g. single point estimates)\" (PM² 3.1 App. C.8, p. A-102).<\/p><ul><li>A is the opposite.<\/li><li>C and D describe other techniques.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-45","id":45,"topic":45,"type":"short","word_count":13,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"According to the PM² Guide, how should Effort and Cost Estimates be prepared?","stem_text":"According to the PM² Guide, how should Effort and Cost Estimates be prepared?","options":{"A":"Derived from the Work Breakdown Structure, estimating each task in close cooperation with the task owners or other experts in the Project Core Team","B":"Top-down by the Project Owner, from the budget set in the Business Case","C":"By the Project Support Office, using historical averages without involving the team","D":"By the contractor alone, since it will carry out the work"},"answer":"A","why_right_html":"<p>Effort and Cost Estimates derive from the WBS: \"each work item (task) is estimated... in close cooperation with the task owners or other experts within the Project Core Team (PCT), to ensure more precise estimates and buy-in\" (PM² 3.1 App. C.7, p. A-102). B, C and D leave out the team, which is the point of the guidance.<\/p>","why_wrong":{"B":"B, C and D leave out the team, which is the point of the guidance.","C":"B, C and D leave out the team, which is the point of the guidance.","D":"B, C and D leave out the team, which is the point of the guidance."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>Effort and Cost Estimates derive from the WBS: \"each work item (task) is estimated... in close cooperation with the task owners or other experts within the Project Core Team (PCT), to ensure more precise estimates and buy-in\" (PM² 3.1 App. C.7, p. A-102). B, C and D leave out the team, which is the point of the guidance.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-46","id":46,"topic":46,"type":"short","word_count":44,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"A project has five activities: P (3 days) starts the project; Q (5 days) follows P; R (2 days) follows P; S (4 days) follows R; T (2 days) follows both Q and S. What is the project's minimum duration and its critical path?","stem_text":"A project has five activities: P (3 days) starts the project; Q (5 days) follows P; R (2 days) follows P; S (4 days) follows R; T (2 days) follows both Q and S. What is the project's minimum duration and its critical path?","options":{"A":"10 days; P–Q–T","B":"11 days; P–Q–T","C":"11 days; P–R–S–T","D":"16 days; all activities"},"answer":"C","why_right_html":"<p>There are two paths:<\/p><ul><li>P–Q–T = 3 + 5 + 2 = 10 days.<\/li><li>P–R–S–T = 3 + 2 + 4 + 2 = 11 days.<\/li><\/ul><p>The longest path is critical, so the minimum duration is 11 days and Q has 1 day of float. PM² defines the critical path as \"the longest necessary path\" (PM² 3.1 App. C.13, p. A-103); the calculation is standard (knowledge).<\/p>","why_wrong":{"A":"A picks the shorter path.","B":"B pairs the right duration with the wrong path.","D":"D adds up all the durations as if every activity ran in sequence."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>There are two paths:<\/p><ul><li>P–Q–T = 3 + 5 + 2 = 10 days.<\/li><li>P–R–S–T = 3 + 2 + 4 + 2 = 11 days.<\/li><\/ul><p>The longest path is critical, so the minimum duration is 11 days and Q has 1 day of float. PM² defines the critical path as \"the longest necessary path\" (PM² 3.1 App. C.13, p. A-103); the calculation is standard (knowledge).<\/p><ul><li>A picks the shorter path.<\/li><li>B pairs the right duration with the wrong path.<\/li><li>D adds up all the durations as if every activity ran in sequence.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v1","key":"v1-47","id":47,"topic":47,"type":"short","word_count":13,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"According to the PM² Guide, what else does a project's critical path represent?","stem_text":"According to the PM² Guide, what else does a project's critical path represent?","options":{"A":"The path of activities with the most float","B":"The shortest possible duration of the project to completion","C":"The cheapest sequence of activities","D":"The path of the activities with the highest risk level"},"answer":"B","why_right_html":"<p>\"Since the critical path represents the longest necessary path of activities, it also represents the shortest possible duration of the project to completion\" (PM² 3.1 App. C.13, p. A-103).<\/p>","why_wrong":{"A":"A: critical activities have zero float, so the path is not the one with most float.","C":"C and D are unrelated.","D":"C and D are unrelated."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>\"Since the critical path represents the longest necessary path of activities, it also represents the shortest possible duration of the project to completion\" (PM² 3.1 App. C.13, p. A-103).<\/p><ul><li>A: critical activities have zero float, so the path is not the one with most float.<\/li><li>C and D are unrelated.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-48","id":48,"topic":48,"type":"short","word_count":19,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"How does the Critical Chain Method (CCM) differ from the Critical Path Method, as described in the PM² Guide?","stem_text":"How does the Critical Chain Method (CCM) differ from the Critical Path Method, as described in the PM² Guide?","options":{"A":"It ignores resource constraints.","B":"It assumes activity estimates are too optimistic and adds safety time to each activity.","C":"It applies only to agile projects.","D":"It takes resources and their levelling into account, assumes activity estimates are padded, reduces them, and adds project, feeding and resource buffers."},"answer":"D","why_right_html":"<p>CCM \"takes into account resources and their levelling\". It \"assumes that a Project Manager's (PM) estimates of duration for activities are padded, and immediately proceeds to reduce them\". Then \"additional buffers (project buffer, feeding buffer, resource buffer) are then added\" (PM² 3.1 App. C.14, p. A-103 to A-104).<\/p>","why_wrong":{"A":"A is the opposite.","B":"B reverses the assumption.","C":"C is invented."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>CCM \"takes into account resources and their levelling\". It \"assumes that a Project Manager's (PM) estimates of duration for activities are padded, and immediately proceeds to reduce them\". Then \"additional buffers (project buffer, feeding buffer, resource buffer) are then added\" (PM² 3.1 App. C.14, p. A-103 to A-104).<\/p><ul><li>A is the opposite.<\/li><li>B reverses the assumption.<\/li><li>C is invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-49","id":49,"topic":49,"type":"short","word_count":18,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"In PM², what is the relationship between the Deliverables Breakdown Structure (DBS) and the Work Breakdown Structure (WBS)?","stem_text":"In PM², what is the relationship between the Deliverables Breakdown Structure (DBS) and the Work Breakdown Structure (WBS)?","options":{"A":"The DBS defines what the project will produce and can precede the WBS, which defines the work needed to produce it.","B":"The WBS defines what the project will produce; the DBS then defines the work needed to produce it.","C":"They are two names for the same technique.","D":"The DBS is used only for project management deliverables, the WBS only for project deliverables."},"answer":"A","why_right_html":"<p>\"The Deliverables Breakdown Structure (DBS) defines what the project will produce... and the Work Breakdown Structure (WBS) defines the work needed to produce them\". The DBS \"can precede\" the WBS (PM² 3.1 App. C.6, p. A-102).<\/p>","why_wrong":{"B":"B reverses them.","C":"C: the guide says they are similar but used at different steps.","D":"D: the DBS covers both kinds of deliverable."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"The Deliverables Breakdown Structure (DBS) defines what the project will produce... and the Work Breakdown Structure (WBS) defines the work needed to produce them\". The DBS \"can precede\" the WBS (PM² 3.1 App. C.6, p. A-102).<\/p><ul><li>B reverses them.<\/li><li>C: the guide says they are similar but used at different steps.<\/li><li>D: the DBS covers both kinds of deliverable.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-50","id":50,"topic":50,"type":"short","word_count":6,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"In PM²-Agile, what does \"velocity\" measure?","stem_text":"In PM²-Agile, what does \"velocity\" measure?","options":{"A":"The number of hours the team works in an iteration","B":"The number of Work Items in the Work Items List","C":"The number of points the Agile Project Core Team can deliver within an iteration","D":"The rate at which change requests arrive"},"answer":"C","why_right_html":"<p>\"Velocity measures the number of points the Agile Project Core Team (A-PCT) can deliver within an iteration\" (Agile 3.0.1 §4.5, p.32).<\/p>","why_wrong":{"A":"A confuses velocity with effort.","B":"B and D are unrelated.","D":"B and D are unrelated."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"Velocity measures the number of points the Agile Project Core Team (A-PCT) can deliver within an iteration\" (Agile 3.0.1 §4.5, p.32).<\/p><ul><li>A confuses velocity with effort.<\/li><li>B and D are unrelated.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-51","id":51,"topic":51,"type":"short","word_count":33,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"A PM²-Agile team has prioritised its Work Items with MoSCoW. Late in the time frame it becomes clear that not everything can be delivered. According to the PM²-Agile Guide, how is contingency applied?","stem_text":"A PM²-Agile team has prioritised its Work Items with MoSCoW. Late in the time frame it becomes clear that not everything can be delivered. According to the PM²-Agile Guide, how is contingency applied?","options":{"A":"The time frame is extended until all Work Items are done.","B":"The \"Must have\" items are still delivered, while \"Should have\" and \"Could have\" items that cannot be tackled are dropped.","C":"The \"Should have\" items are delivered first, because they are usually quicker.","D":"Team members are added so that all items can be completed."},"answer":"B","why_right_html":"<p>With MoSCoW, when \"Should have\" and \"Could have\" Work Items cannot be tackled in time, \"contingency is 'applied' by still delivering what were agreed to be the most relevant features... the 'Must have' requirements\" (Agile 3.0.1 §4.5, p.32–33).<\/p>","why_wrong":{"A":"A and D break the fixed time frame or team.","C":"C reverses the priority.","D":"A and D break the fixed time frame or team."},"why_wrong_shared":{"A":true,"C":false,"D":true},"full_html":"<p>With MoSCoW, when \"Should have\" and \"Could have\" Work Items cannot be tackled in time, \"contingency is 'applied' by still delivering what were agreed to be the most relevant features... the 'Must have' requirements\" (Agile 3.0.1 §4.5, p.32–33).<\/p><ul><li>A and D break the fixed time frame or team.<\/li><li>C reverses the priority.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-52","id":52,"topic":52,"type":"short","word_count":44,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"A unit of an EU institution needs IT services whose total estimated value is just above the threshold of Article 178(1) of the Financial Regulation. To use a lighter procedure, a colleague suggests signing two separate contracts, each below the threshold. Is this allowed?","stem_text":"A unit of an EU institution needs IT services whose total estimated value is just above the threshold of Article 178(1) of the Financial Regulation. To use a lighter procedure, a colleague suggests signing two separate contracts, each below the threshold. Is this allowed?","options":{"A":"Yes, if each contract is signed by a different authorising officer.","B":"Yes, if the two contracts are signed in different financial years.","C":"Yes, provided each contract goes to a different contractor.","D":"No: a contract shall not be split with a view to circumventing the applicable rules."},"answer":"D","why_right_html":"<p>\"The estimated value of a contract shall not be determined with a view to circumventing the applicable rules, nor shall a contract be split for that purpose\" (FR Art. 163(2), second subparagraph). Who signs the contracts (A), when (B) or with whom (C) does not change the prohibition.<\/p>","why_wrong":{"A":null,"B":null,"C":null},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"The estimated value of a contract shall not be determined with a view to circumventing the applicable rules, nor shall a contract be split for that purpose\" (FR Art. 163(2), second subparagraph). Who signs the contracts (A), when (B) or with whom (C) does not change the prohibition.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-53","id":53,"topic":53,"type":"short","word_count":26,"batch":2,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"In a PM² project that uses PM²-Agile, who facilitates the agile ceremonies (Iteration Planning, Review, Retrospective), and in what capacity does the Project Manager take part?","stem_text":"In a PM² project that uses PM²-Agile, who facilitates the agile ceremonies (Iteration Planning, Review, Retrospective), and in what capacity does the Project Manager take part?","options":{"A":"The Team Coordinator facilitates; the Project Manager participates as a regular Agile Team Member.","B":"The Project Manager facilitates; the Team Coordinator observes.","C":"The Product Owner facilitates; the Project Manager chairs.","D":"The Architecture Owner facilitates; the Project Manager only receives the minutes."},"answer":"A","why_right_html":"<p>The Team Coordinator facilitates the ceremonies: \"The Project Manager (PM) participates in these ceremonies as a regular Agile Team Member (ATeM), while the Team Coordinator (TeCo) should be facilitating\" (Agile 3.0.1 §6.5.1, p.64–65).<\/p>","why_wrong":{"B":"B reverses the roles.","C":"C and D give the facilitation to the wrong roles.","D":"C and D give the facilitation to the wrong roles."},"why_wrong_shared":{"B":false,"C":true,"D":true},"full_html":"<p>The Team Coordinator facilitates the ceremonies: \"The Project Manager (PM) participates in these ceremonies as a regular Agile Team Member (ATeM), while the Team Coordinator (TeCo) should be facilitating\" (Agile 3.0.1 §6.5.1, p.64–65).<\/p><ul><li>B reverses the roles.<\/li><li>C and D give the facilitation to the wrong roles.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-54","id":54,"topic":54,"type":"short","word_count":20,"batch":2,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and communication","stem_html":"In PM² Information Distribution, which role manages internal communication and assists with document change control and the baselining of plans?","stem_text":"In PM² Information Distribution, which role manages internal communication and assists with document change control and the baselining of plans?","options":{"A":"The Project Manager","B":"The Business Manager","C":"The Project Support Office","D":"The Project Steering Committee"},"answer":"C","why_right_html":"<p>\"Project Support Office (PSO): Manages internal communication and assists in activities such as document change control, baselining of plans, etc.\" (PM² 3.1 §7.5, p.61).<\/p>","why_wrong":{"A":"A: the PM ensures the PCT has the information it needs.","B":"B and D are not given this role.","D":"B and D are not given this role."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"Project Support Office (PSO): Manages internal communication and assists in activities such as document change control, baselining of plans, etc.\" (PM² 3.1 §7.5, p.61).<\/p><ul><li>A: the PM ensures the PCT has the information it needs.<\/li><li>B and D are not given this role.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-55","id":55,"topic":55,"type":"short","word_count":9,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"In PM²-Agile, which description fits the Product Owner (PrOw)?","stem_text":"In PM²-Agile, which description fits the Product Owner (PrOw)?","options":{"A":"A facilitator and team coach who creates the conditions for the team to succeed","B":"The solution architect responsible for the team's architecture decisions","C":"The role that reports development status to the Project Manager","D":"The role that mainly represents client and end-user concerns, acts as the single voice of the stakeholders and continuously prioritises the Work Items List"},"answer":"D","why_right_html":"<p>The PrOw \"represents mainly client and end-user concerns\" and is \"the 'single voice of the stakeholders'\"; it \"continuously prioritises the Work Items List (WIL)\" (Agile 3.0.1 §6.3.2, p.62–63).<\/p>","why_wrong":{"A":"A and C describe the Team Coordinator (§6.3.1).","B":"B describes the Architecture Owner (§6.3.3).","C":"A and C describe the Team Coordinator (§6.3.1)."},"why_wrong_shared":{"A":true,"B":false,"C":true},"full_html":"<p>The PrOw \"represents mainly client and end-user concerns\" and is \"the 'single voice of the stakeholders'\"; it \"continuously prioritises the Work Items List (WIL)\" (Agile 3.0.1 §6.3.2, p.62–63).<\/p><ul><li>A and C describe the Team Coordinator (§6.3.1).<\/li><li>B describes the Architecture Owner (§6.3.3).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-56","id":56,"topic":56,"type":"short","word_count":9,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"What is the purpose of the PM² Transition Plan?","stem_text":"What is the purpose of the PM² Transition Plan?","options":{"A":"To assess the project's impact on the organisation's processes, culture and people, and plan the change-management activities","B":"To define the goals, prerequisites, activities and responsibilities for moving from the old (pre-project) to the new (post-project) state, while minimising disruption to the business","C":"To plan the acceptance tests for each deliverable","D":"To plan the procurement of transition services from a contractor"},"answer":"B","why_right_html":"<p>The Transition Plan \"defines the goals, prerequisites, activities and responsibilities associated with transitioning from the old (pre-project) to the new (post-project) state\" and \"seeks to minimise the impact of any disruptions on the business\" (PM² 3.1 §6.7, p.51).<\/p><ul><li>Exam tip: transition is about moving the outputs into operation; business implementation is about the people and processes that use them.<\/li><\/ul>","why_wrong":{"A":"A is the Business Implementation Plan (§6.8).","C":"C is the Deliverables Acceptance Plan (§6.6).","D":"D is invented."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>The Transition Plan \"defines the goals, prerequisites, activities and responsibilities associated with transitioning from the old (pre-project) to the new (post-project) state\" and \"seeks to minimise the impact of any disruptions on the business\" (PM² 3.1 §6.7, p.51).<\/p><ul><li>A is the Business Implementation Plan (§6.8).<\/li><li>C is the Deliverables Acceptance Plan (§6.6).<\/li><li>D is invented.<\/li><li>Exam tip: transition is about moving the outputs into operation; business implementation is about the people and processes that use them.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-57","id":57,"topic":57,"type":"short","word_count":14,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"In PM², who prepares the Business Implementation Plan, and who reviews and approves it?","stem_text":"In PM², who prepares the Business Implementation Plan, and who reviews and approves it?","options":{"A":"The Project Manager prepares it; the Project Steering Committee approves it.","B":"The Business Implementation Group prepares it; the Business Manager approves it.","C":"The Business Manager prepares it; the Project Owner reviews and approves it.","D":"The Project Owner prepares it; the Appropriate Governance Body approves it."},"answer":"C","why_right_html":"<p>The \"Business Manager (BM): Prepares the Business Implementation Plan\" and the \"Project Owner (PO): Reviews and approves\" it (PM² 3.1 §6.8, p.52). The PM assists and updates the Work Plan, and the BIG is consulted. The other options misassign these roles.<\/p>","why_wrong":{"A":"The other options misassign these roles.","B":"The other options misassign these roles.","D":"The other options misassign these roles."},"why_wrong_shared":{"A":true,"B":true,"D":true},"full_html":"<p>The \"Business Manager (BM): Prepares the Business Implementation Plan\" and the \"Project Owner (PO): Reviews and approves\" it (PM² 3.1 §6.8, p.52). The PM assists and updates the Work Plan, and the BIG is consulted. The other options misassign these roles.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-58","id":58,"topic":58,"type":"short","word_count":21,"batch":2,"duty":7,"duties":[7],"section":"Duty 7: horizontal initiatives and portfolios","stem_html":"In PM²-PfM, which body is the highest authority in the organisation regarding portfolio management and approves the composition of each portfolio?","stem_text":"In PM²-PfM, which body is the highest authority in the organisation regarding portfolio management and approves the composition of each portfolio?","options":{"A":"The Portfolio Steering Committee (PfSC)","B":"The Portfolio Support Office (PfSO)","C":"The Programme Steering Committee (PgSC)","D":"The Portfolio Directing Group (PfDG)"},"answer":"D","why_right_html":"<p>The PfDG \"is the highest authority in the organisation regarding portfolio management\". Its responsibilities include \"Approve the composition of each portfolio\" (PfM 1.5 §4.1, p.13–14).<\/p>","why_wrong":{"A":"A: the PfSC manages a single portfolio and reports to the PfDG (§4.2).","B":"B gives support only.","C":"C is a programme-level body."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The PfDG \"is the highest authority in the organisation regarding portfolio management\". Its responsibilities include \"Approve the composition of each portfolio\" (PfM 1.5 §4.1, p.13–14).<\/p><ul><li>A: the PfSC manages a single portfolio and reports to the PfDG (§4.2).<\/li><li>B gives support only.<\/li><li>C is a programme-level body.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-59","id":59,"topic":59,"type":"short","word_count":25,"batch":2,"duty":7,"duties":[7],"section":"Duty 7: horizontal initiatives and portfolios","stem_html":"In PM²-PfM, the Portfolio Manager has produced a prioritised list of candidate components. What happens before the Portfolio Directing Group is asked to approve it?","stem_text":"In PM²-PfM, the Portfolio Manager has produced a prioritised list of candidate components. What happens before the Portfolio Directing Group is asked to approve it?","options":{"A":"Nothing; the Portfolio Manager submits it directly to the Portfolio Directing Group.","B":"It is published to all stakeholders for a vote.","C":"The Portfolio Manager discusses the proposal with the Portfolio Steering Committee.","D":"Each Project Owner ranks their own project within the list."},"answer":"C","why_right_html":"<p>\"The Portfolio Manager (PfM) discusses the proposal with the Portfolio Steering Committee (PfSC) before the Portfolio Directing Group (PfDG) is requested to approve it\" (PfM 1.5 §6.4, p.26). The other options are invented.<\/p>","why_wrong":{"A":"The other options are invented.","B":"The other options are invented.","D":"The other options are invented."},"why_wrong_shared":{"A":true,"B":true,"D":true},"full_html":"<p>\"The Portfolio Manager (PfM) discusses the proposal with the Portfolio Steering Committee (PfSC) before the Portfolio Directing Group (PfDG) is requested to approve it\" (PfM 1.5 §6.4, p.26). The other options are invented.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-60","id":60,"topic":60,"type":"short","word_count":15,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"According to the PM² Programme Management Guide, how does programme management differ from multi-project management?","stem_text":"According to the PM² Programme Management Guide, how does programme management differ from multi-project management?","options":{"A":"They are the same thing under different names.","B":"Multi-project management manages parallel projects drawing on the same resource pool that are not necessarily interdependent or aimed at the same goals; a programme coordinates related projects to achieve benefits that could not be obtained if they were managed individually.","C":"Multi-project management is the portfolio layer; programme management is the project layer.","D":"Programmes are shorter than projects, so they need lighter management."},"answer":"B","why_right_html":"<p>A programme is \"a set of related projects and activities managed in a coordinated way to achieve strategic objectives and benefits that could not be obtained if they were managed individually\". Multi-project management \"is the management of parallel projects, drawing on the same resource pool. These projects are not necessarily interdependent, nor do they relate to the same overall goals\" (PgM 1.0 §2.1–2.2, p.3).<\/p>","why_wrong":{"A":"A contradicts the guide.","C":"C confuses this with the portfolio layer.","D":"D: programmes \"tend to have a significant longer duration\"."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>A programme is \"a set of related projects and activities managed in a coordinated way to achieve strategic objectives and benefits that could not be obtained if they were managed individually\". Multi-project management \"is the management of parallel projects, drawing on the same resource pool. These projects are not necessarily interdependent, nor do they relate to the same overall goals\" (PgM 1.0 §2.1–2.2, p.3).<\/p><ul><li>A contradicts the guide.<\/li><li>C confuses this with the portfolio layer.<\/li><li>D: programmes \"tend to have a significant longer duration\".<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-61","id":61,"topic":61,"type":"short","word_count":13,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"In PM²-PgM, whose primary responsibility is the accumulation and delivery of programme benefits?","stem_text":"In PM²-PgM, whose primary responsibility is the accumulation and delivery of programme benefits?","options":{"A":"The Programme Business Manager (PgBM)","B":"The Programme Manager (PgM)","C":"The Programme Owner (PgO)","D":"The Programme Support Office (PgSO)"},"answer":"A","why_right_html":"<p>\"The accumulation and delivery of benefits... is the primary responsibility of the Programme Business Manager (PgBM)\" (PgM 1.0 §9.8).<\/p>","why_wrong":{"B":"B and D are wrong.","C":"C is the trap: the PgO is accountable for the programme's overall success (§4.3), but the PgBM carries the benefits.","D":"B and D are wrong."},"why_wrong_shared":{"B":true,"C":false,"D":true},"full_html":"<p>\"The accumulation and delivery of benefits... is the primary responsibility of the Programme Business Manager (PgBM)\" (PgM 1.0 §9.8).<\/p><ul><li>C is the trap: the PgO is accountable for the programme's overall success (§4.3), but the PgBM carries the benefits.<\/li><li>B and D are wrong.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-62","id":62,"topic":62,"type":"short","word_count":21,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"A programme has formally closed, but its benefits are expected to keep growing. What does the PM² Programme Management Guide recommend?","stem_text":"A programme has formally closed, but its benefits are expected to keep growing. What does the PM² Programme Management Guide recommend?","options":{"A":"Stop tracking the benefits, since the programme no longer exists.","B":"Keep the Programme Manager in place until the Portfolio Manager closes the portfolio.","C":"Transfer knowledge and responsibilities to an operational entity or benefit owners so that benefit delivery continues after closure.","D":"Launch a new programme, which is mandatory whenever benefits continue after closure."},"answer":"C","why_right_html":"<p>\"Transition the knowledge, resources and lessons learned to an operational entity in order to continue the benefits delivery after the programme closure\" (PgM 1.0 §8.2). §9.8 adds that \"benefit owners\" may be assigned to keep monitoring benefits after closure.<\/p>","why_wrong":{"A":"A contradicts this.","B":"B is invented.","D":"D: the guide says a new <em>project<\/em> is optional, not a mandatory new programme."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"Transition the knowledge, resources and lessons learned to an operational entity in order to continue the benefits delivery after the programme closure\" (PgM 1.0 §8.2). §9.8 adds that \"benefit owners\" may be assigned to keep monitoring benefits after closure.<\/p><ul><li>A contradicts this.<\/li><li>B is invented.<\/li><li>D: the guide says a new <em>project<\/em> is optional, not a mandatory new programme.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-63","id":63,"topic":63,"type":"short","word_count":16,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"Which of the following is NOT one of the four pillars of the House of PM²?","stem_text":"Which of the following is NOT one of the four pillars of the House of PM²?","options":{"A":"A project governance model (roles and responsibilities)","B":"A project lifecycle (project phases)","C":"A set of processes (project management activities)","D":"A set of mindsets (attitudes and behaviours)"},"answer":"D","why_right_html":"<p>The four pillars are the governance model, the lifecycle, the processes and the artefacts (PM² 3.1 §3.1, p.13). The mindsets are not a pillar: they are \"the glue that holds together the PM² practices\". This makes a likely trap.<\/p>","why_wrong":{"A":null,"B":null,"C":null},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The four pillars are the governance model, the lifecycle, the processes and the artefacts (PM² 3.1 §3.1, p.13). The mindsets are not a pillar: they are \"the glue that holds together the PM² practices\". This makes a likely trap.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-64","id":64,"topic":64,"type":"short","word_count":11,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"Which guideline does the PM² Guide give for tailoring the methodology?","stem_text":"Which guideline does the PM² Guide give for tailoring the methodology?","options":{"A":"Remove whole phases that add little value for small projects.","B":"Avoid eliminating whole chunks (e.g. a phase, a role, an activity or an artefact); instead scale the element's scope down or up.","C":"Tailor only at project level, never at organisational level.","D":"Only the Centre of Excellence in PM² may tailor the methodology."},"answer":"B","why_right_html":"<p>\"Avoid simplifying the methodology by eliminating whole chunks (e.g. a phase, a role, an activity or an artefact), but rather scale down (or up) the scope of that element\" (PM² 3.1 §3.6, p.20).<\/p>","why_wrong":{"A":"A contradicts this.","C":"C: the guide says tailoring \"makes more sense at the organisation/departmental level\".","D":"D is invented."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Avoid simplifying the methodology by eliminating whole chunks (e.g. a phase, a role, an activity or an artefact), but rather scale down (or up) the scope of that element\" (PM² 3.1 §3.6, p.20).<\/p><ul><li>A contradicts this.<\/li><li>C: the guide says tailoring \"makes more sense at the organisation/departmental level\".<\/li><li>D is invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-65","id":65,"topic":65,"type":"short","word_count":13,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"Where should all tailoring and customisation of PM² for a project be documented?","stem_text":"Where should all tailoring and customisation of PM² for a project be documented?","options":{"A":"In the Project Handbook","B":"In the Project Charter","C":"In the Business Case","D":"In the Change Log"},"answer":"A","why_right_html":"<p>\"All tailoring and customisations should be documented in the Project Handbook\" (PM² 3.1 §3.6, p.20). The other documents serve other purposes.<\/p>","why_wrong":{"B":"The other documents serve other purposes.","C":"The other documents serve other purposes.","D":"The other documents serve other purposes."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>\"All tailoring and customisations should be documented in the Project Handbook\" (PM² 3.1 §3.6, p.20). The other documents serve other purposes.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-66","id":66,"topic":66,"type":"short","word_count":10,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"Which of the following is one of the PM² Mindsets?","stem_text":"Which of the following is one of the PM² Mindsets?","options":{"A":"Follow the approved plan, whatever happens.","B":"Let the Project Manager decide alone, for speed.","C":"Remain mindful that project management methodologies are there to serve projects and not the other way around.","D":"Limit stakeholder involvement to reduce noise in the project."},"answer":"C","why_right_html":"<p>This is mindset 2: \"Remain mindful that project management methodologies are there to serve projects and not the other way around\" (PM² 3.1 §3.5, p.19).<\/p>","why_wrong":{"A":"A contradicts mindset 4: \"delivering project results with maximum value rather than just following plans\".","B":"B and D contradict mindsets 5 and 9.","D":"B and D contradict mindsets 5 and 9."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>This is mindset 2: \"Remain mindful that project management methodologies are there to serve projects and not the other way around\" (PM² 3.1 §3.5, p.19).<\/p><ul><li>A contradicts mindset 4: \"delivering project results with maximum value rather than just following plans\".<\/li><li>B and D contradict mindsets 5 and 9.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-67","id":67,"topic":67,"type":"short","word_count":35,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"After a fix to the payment module of a grants system, the team re-runs existing test cases across the whole system to check that nothing else has broken. What is this type of testing called?","stem_text":"After a fix to the payment module of a grants system, the team re-runs existing test cases across the whole system to check that nothing else has broken. What is this type of testing called?","options":{"A":"Smoke testing","B":"User acceptance testing","C":"Exploratory testing","D":"Regression testing"},"answer":"D","why_right_html":"<p>Re-running existing tests to make sure a change has not broken anything else is regression testing (knowledge: general software testing).<\/p>","why_wrong":{"A":"A: smoke testing is a quick check that the main functions work at all.","B":"B: UAT is user acceptance.","C":"C: exploratory testing has no predefined test cases."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Re-running existing tests to make sure a change has not broken anything else is regression testing (knowledge: general software testing).<\/p><ul><li>A: smoke testing is a quick check that the main functions work at all.<\/li><li>B: UAT is user acceptance.<\/li><li>C: exploratory testing has no predefined test cases.<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v1","key":"v1-68","id":68,"topic":68,"type":"short","word_count":28,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"A team pushes a public portal well beyond its maximum expected number of users to find out where and how it fails. What type of testing is this?","stem_text":"A team pushes a public portal well beyond its maximum expected number of users to find out where and how it fails. What type of testing is this?","options":{"A":"Load testing","B":"Stress testing","C":"Endurance (soak) testing","D":"Usability testing"},"answer":"B","why_right_html":"<p>Going beyond expected capacity to find the breaking point is stress testing (knowledge).<\/p><ul><li>Duty 10 names \"performance\" test validation explicitly, so expect at least one question like this.<\/li><\/ul>","why_wrong":{"A":"A: load testing checks behaviour under the expected peak.","C":"C: endurance testing checks behaviour over a long period.","D":"D: usability testing checks ease of use."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Going beyond expected capacity to find the breaking point is stress testing (knowledge).<\/p><ul><li>A: load testing checks behaviour under the expected peak.<\/li><li>C: endurance testing checks behaviour over a long period.<\/li><li>D: usability testing checks ease of use.<\/li><li>Duty 10 names \"performance\" test validation explicitly, so expect at least one question like this.<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v1","key":"v1-69","id":69,"topic":69,"type":"short","word_count":10,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"What is the main purpose of user acceptance testing (UAT)?","stem_text":"What is the main purpose of user acceptance testing (UAT)?","options":{"A":"To confirm, with users or their representatives, that the solution meets the business needs and is acceptable before it is accepted","B":"To check individual units of code in isolation","C":"To allow the contractor to show that the code compiles without errors","D":"To measure response times under peak load"},"answer":"A","why_right_html":"<p>UAT confirms, with users or their representatives, that the solution meets business needs before acceptance (knowledge). In PM² this feeds the deliverables acceptance process (PM² 3.1 §9.10, step 4: the BM provides resources to support users' acceptance).<\/p>","why_wrong":{"B":"B is unit testing.","C":"C is not a test level.","D":"D is performance testing."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>UAT confirms, with users or their representatives, that the solution meets business needs before acceptance (knowledge). In PM² this feeds the deliverables acceptance process (PM² 3.1 §9.10, step 4: the BM provides resources to support users' acceptance).<\/p><ul><li>B is unit testing.<\/li><li>C is not a test level.<\/li><li>D is performance testing.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v1","key":"v1-70","id":70,"topic":70,"type":"short","word_count":7,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"Which pair correctly distinguishes verification from validation?","stem_text":"Which pair correctly distinguishes verification from validation?","options":{"A":"Verification is done by users; validation is done by developers.","B":"Verification happens after go-live; validation happens before.","C":"Verification checks that the product conforms to its specifications (\"built right\"); validation checks that it meets the users' actual needs (\"the right product\").","D":"They are synonyms in quality management."},"answer":"C","why_right_html":"<p>Verification asks \"did we build it right?\" against the specifications. Validation asks \"did we build the right thing?\" for the users' needs (knowledge: standard quality and testing distinction).<\/p>","why_wrong":{"A":"A, B and D are wrong.","B":"A, B and D are wrong.","D":"A, B and D are wrong."},"why_wrong_shared":{"A":true,"B":true,"D":true},"full_html":"<p>Verification asks \"did we build it right?\" against the specifications. Validation asks \"did we build the right thing?\" for the users' needs (knowledge: standard quality and testing distinction).<\/p><ul><li>A, B and D are wrong.<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v1","key":"v1-71","id":71,"topic":71,"type":"short","word_count":12,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"Which of the following is a cost of non-conformance (a failure cost)?","stem_text":"Which of the following is a cost of non-conformance (a failure cost)?","options":{"A":"Training developers in secure coding","B":"Peer code reviews","C":"Writing the test plan","D":"Fixing defects reported by users after go-live"},"answer":"D","why_right_html":"<p>Fixing defects that users find after go-live is an external failure cost, which is a cost of non-conformance (knowledge: cost of quality).<\/p><ul><li>PM² asks teams to weigh \"the cost of quality, following a cost/benefit analysis\" (PM² 3.1 §9.9, step 1).<\/li><\/ul>","why_wrong":{"A":"A and B are prevention costs. All three are costs of conformance.","B":"A and B are prevention costs. All three are costs of conformance.","C":"C is a prevention or appraisal cost. All three are costs of conformance."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>Fixing defects that users find after go-live is an external failure cost, which is a cost of non-conformance (knowledge: cost of quality).<\/p><ul><li>A and B are prevention costs.<\/li><li>C is a prevention or appraisal cost.<\/li><li>All three are costs of conformance.<\/li><li>PM² asks teams to weigh \"the cost of quality, following a cost/benefit analysis\" (PM² 3.1 §9.9, step 1).<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","Knowledge"]},{"bank":"v1","key":"v1-72","id":72,"topic":72,"type":"short","word_count":49,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 175(3)(a) of the Financial Regulation, a contract may be modified without a new procedure for necessary additional services by the original contractor, where a change of contractor is impossible for technical reasons and would cause substantial duplication of costs. What is the cap on the price increase?","stem_text":"Under Article 175(3)(a) of the Financial Regulation, a contract may be modified without a new procedure for necessary additional services by the original contractor, where a change of contractor is impossible for technical reasons and would cause substantial duplication of costs. What is the cap on the price increase?","options":{"A":"10% of the initial contract value","B":"50% of the initial contract value","C":"100% of the initial contract value","D":"25% of the initial contract value"},"answer":"B","why_right_html":"<p>\"Any increase in price, including the net cumulative value of successive modifications, does not exceed 50 % of the initial contract value\" (FR Art. 175(3)(a)(iii)).<\/p>","why_wrong":{"A":"A: 10% is the value cap for small service and supply modifications under point (c).","C":"C: 100% applies only in crisis situations (Art. 175(5)).","D":"D is invented."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Any increase in price, including the net cumulative value of successive modifications, does not exceed 50 % of the initial contract value\" (FR Art. 175(3)(a)(iii)).<\/p><ul><li>A: 10% is the value cap for small service and supply modifications under point (c).<\/li><li>C: 100% applies only in crisis situations (Art. 175(5)).<\/li><li>D is invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-73","id":73,"topic":73,"type":"short","word_count":33,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 175(4) of the Financial Regulation, which modification is in any event considered to alter the subject matter of a contract, so that it cannot be made without a new procurement procedure?","stem_text":"Under Article 175(4) of the Financial Regulation, which modification is in any event considered to alter the subject matter of a contract, so that it cannot be made without a new procurement procedure?","options":{"A":"One that significantly extends the scope of the contract","B":"A change of the contractor's contact person","C":"A price revision under the contract's indexation clause","D":"A modification whose value is below the Article 178(1) thresholds and below 10% of the initial value of a service contract"},"answer":"A","why_right_html":"<p>A modification \"shall be considered to be altering the subject matter... where... the modification significantly extends the scope of the contract or framework contract\" (FR Art. 175(4)(c)).<\/p>","why_wrong":{"B":"B is trivial.","C":"C: price revisions under the contract are not counted in the initial value. Changes resulting from the strict application of contractual provisions are covered in Art. 175(3)(d).","D":"D is a permitted case under Art. 175(3)(c)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>A modification \"shall be considered to be altering the subject matter... where... the modification significantly extends the scope of the contract or framework contract\" (FR Art. 175(4)(c)).<\/p><ul><li>B is trivial.<\/li><li>C: price revisions under the contract are not counted in the initial value. Changes resulting from the strict application of contractual provisions are covered in Art. 175(3)(d).<\/li><li>D is a permitted case under Art. 175(3)(c).<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-74","id":74,"topic":74,"type":"short","word_count":19,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 176 of the Financial Regulation, what is the maximum performance guarantee, and when is it fully released?","stem_text":"Under Article 176 of the Financial Regulation, what is the maximum performance guarantee, and when is it fully released?","options":{"A":"Up to 2% of the contract value; released on signature","B":"Up to 50% of the contract value; released at the end of the liability period","C":"Up to 10% of the total contract value; fully released after final acceptance","D":"There is no maximum; it is released at the contracting authority's discretion"},"answer":"C","why_right_html":"<p>\"A performance guarantee shall amount to a maximum of 10 % of the total value of the contract. It shall be fully released after final acceptance\". It may be partially released at provisional acceptance (FR Art. 176(1)).<\/p>","why_wrong":{"A":"A: 1–2% is the tender guarantee under Art. 171(2), which is a different guarantee.","B":"B and D are invented.","D":"B and D are invented."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"A performance guarantee shall amount to a maximum of 10 % of the total value of the contract. It shall be fully released after final acceptance\". It may be partially released at provisional acceptance (FR Art. 176(1)).<\/p><ul><li>A: 1–2% is the tender guarantee under Art. 171(2), which is a different guarantee.<\/li><li>B and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-75","id":75,"topic":75,"type":"short","word_count":21,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"Under Article 178(3) of the Financial Regulation, how long is the standstill period before signature of a contract above the thresholds?","stem_text":"Under Article 178(3) of the Financial Regulation, how long is the standstill period before signature of a contract above the thresholds?","options":{"A":"5 days by electronic means; 10 days by other means","B":"14 days by electronic means; 21 days by other means","C":"30 days by electronic means; 45 days by other means","D":"10 days by electronic means; 15 days by other means"},"answer":"D","why_right_html":"<p>\"The standstill period shall have a duration of 10 days when using electronic means of communication and 15 days when using other means\" (FR Art. 178(3)). The other options are invented.<\/p>","why_wrong":{"A":"The other options are invented.","B":"The other options are invented.","C":"The other options are invented."},"why_wrong_shared":{"A":true,"B":true,"C":true},"full_html":"<p>\"The standstill period shall have a duration of 10 days when using electronic means of communication and 15 days when using other means\" (FR Art. 178(3)). The other options are invented.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-76","id":76,"topic":76,"type":"short","word_count":23,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"In a procurement procedure, one tender's price appears abnormally low. What must the contracting authority do under Annex I to the Financial Regulation?","stem_text":"In a procurement procedure, one tender's price appears abnormally low. What must the contracting authority do under Annex I to the Financial Regulation?","options":{"A":"Reject the tender automatically.","B":"Request in writing details of the constituent elements of the price or costs and give the tenderer the opportunity to present its observations.","C":"Accept it, since the lowest price always wins.","D":"Ask the other tenderers to match the price."},"answer":"B","why_right_html":"<p>\"The contracting authority shall request in writing details of the constituent elements of the price or costs which it considers relevant and shall give the tenderer the opportunity to present its observations\" (FR Annex I point 23.1).<\/p>","why_wrong":{"A":"A: automatic rejection is exactly what the rule prevents.","C":"C and D are invented.","D":"C and D are invented."},"why_wrong_shared":{"A":false,"C":true,"D":true},"full_html":"<p>\"The contracting authority shall request in writing details of the constituent elements of the price or costs which it considers relevant and shall give the tenderer the opportunity to present its observations\" (FR Annex I point 23.1).<\/p><ul><li>A: automatic rejection is exactly what the rule prevents.<\/li><li>C and D are invented.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-77","id":77,"topic":77,"type":"short","word_count":15,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"What does Article 163(2) of the Financial Regulation say about dividing a contract into lots?","stem_text":"What does Article 163(2) of the Financial Regulation say about dividing a contract into lots?","options":{"A":"The contracting authority shall divide a contract into lots whenever appropriate, with due regard to broad competition.","B":"Lots are not allowed for ICT services.","C":"Lots may be used only for works contracts.","D":"Lots may be used only for contracts below the thresholds."},"answer":"A","why_right_html":"<p>\"The contracting authority shall divide a contract into lots, whenever appropriate, with due regard to broad competition\" (FR Art. 163(2), third subparagraph). The other options are invented.<\/p>","why_wrong":{"B":"The other options are invented.","C":"The other options are invented.","D":"The other options are invented."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>\"The contracting authority shall divide a contract into lots, whenever appropriate, with due regard to broad competition\" (FR Art. 163(2), third subparagraph). The other options are invented.<\/p>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v1","key":"v1-78","id":78,"topic":78,"type":"short","word_count":17,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"At the PM² Project-End Review Meeting, besides capturing Lessons Learned and best practices, what else takes place?","stem_text":"At the PM² Project-End Review Meeting, besides capturing Lessons Learned and best practices, what else takes place?","options":{"A":"The Project Owner gives formal acceptance of each deliverable for the first time.","B":"The contracts with all suppliers are signed off and terminated.","C":"The Project Work Plan is re-baselined for operations.","D":"Team and contractor performance are evaluated, and ideas and recommendations for post-project work are discussed."},"answer":"D","why_right_html":"<p>At the Project-End Review Meeting \"team and contractor performance are evaluated, and ideas and recommendations for post-project work are discussed\" (PM² 3.1 §8.1, p.64).<\/p>","why_wrong":{"A":"A: deliverables are accepted during Executing (§9.10).","B":"B and C are not part of the meeting.","C":"B and C are not part of the meeting."},"why_wrong_shared":{"A":false,"B":true,"C":true},"full_html":"<p>At the Project-End Review Meeting \"team and contractor performance are evaluated, and ideas and recommendations for post-project work are discussed\" (PM² 3.1 §8.1, p.64).<\/p><ul><li>A: deliverables are accepted during Executing (§9.10).<\/li><li>B and C are not part of the meeting.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v1","key":"v1-79","id":79,"topic":79,"type":"short","word_count":24,"batch":3,"duty":11,"duties":[11],"section":"Duty 11: contract types","stem_html":"An institution signs a firm fixed-price contract for the development of a clearly specified ICT system. Who mainly bears the risk of cost overruns?","stem_text":"An institution signs a firm fixed-price contract for the development of a clearly specified ICT system. Who mainly bears the risk of cost overruns?","options":{"A":"The buyer, because it must pay for all actual costs incurred","B":"The contractor, because the price is fixed regardless of its actual costs","C":"The risk is shared equally by law","D":"Neither party, because the scope is fixed"},"answer":"B","why_right_html":"<p>Under a firm fixed price, the contractor is paid the agreed price whatever its actual costs, so it carries the overrun risk (knowledge: standard contract types, as in PMBOK).<\/p>","why_wrong":{"A":"A describes cost-reimbursable contracts.","C":"C is invented.","D":"D: a fixed scope does not remove cost risk."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Under a firm fixed price, the contractor is paid the agreed price whatever its actual costs, so it carries the overrun risk (knowledge: standard contract types, as in PMBOK).<\/p><ul><li>A describes cost-reimbursable contracts.<\/li><li>C is invented.<\/li><li>D: a fixed scope does not remove cost risk.<\/li><\/ul>","knowledge_based":true,"frameworks":["PMBOK","Knowledge"]},{"bank":"v1","key":"v1-80","id":80,"topic":80,"type":"short","word_count":29,"batch":3,"duty":11,"duties":[11],"section":"Duty 11: contract types","stem_html":"A short discovery phase has loosely defined requirements that are expected to change. Which contract type is typically the most suitable, and who carries most of the cost risk?","stem_text":"A short discovery phase has loosely defined requirements that are expected to change. Which contract type is typically the most suitable, and who carries most of the cost risk?","options":{"A":"Firm fixed price; the contractor carries most of the risk","B":"Fixed price with economic price adjustment; the risk is shared equally","C":"Cost plus incentive fee; the contractor carries all the risk","D":"Time and materials; the buyer carries most of the risk"},"answer":"D","why_right_html":"<p>Time and materials suits short, loosely defined work. The buyer pays for the time actually spent, so it carries most of the cost risk (knowledge).<\/p>","why_wrong":{"A":"A: fixed price needs a well-defined scope.","B":"B and C misstate how those contract types allocate risk: in incentive contracts the risk is shared.","C":"B and C misstate how those contract types allocate risk: in incentive contracts the risk is shared."},"why_wrong_shared":{"A":false,"B":true,"C":true},"full_html":"<p>Time and materials suits short, loosely defined work. The buyer pays for the time actually spent, so it carries most of the cost risk (knowledge).<\/p><ul><li>A: fixed price needs a well-defined scope.<\/li><li>B and C misstate how those contract types allocate risk: in incentive contracts the risk is shared.<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v1","key":"v1-81","id":81,"topic":81,"type":"short","word_count":40,"batch":3,"duty":3,"duties":[3,11],"section":"Duties 3 and 11: service management (ITIL)","stem_html":"Users of a case-management system report the same outage several times a month. Each time, the service desk restores service with a workaround. The team now investigates the underlying cause to prevent recurrence. In ITIL terms, which practice is this?","stem_text":"Users of a case-management system report the same outage several times a month. Each time, the service desk restores service with a workaround. The team now investigates the underlying cause to prevent recurrence. In ITIL terms, which practice is this?","options":{"A":"Problem management","B":"Incident management","C":"Change enablement","D":"Service request management"},"answer":"A","why_right_html":"<p>An incident is an unplanned interruption or loss of quality of a service. A problem is the cause, or potential cause, of one or more incidents (knowledge: ITIL concepts stable since ITIL v3; my knowledge of ITIL Version 5 is limited). Investigating the cause of repeated incidents is problem management.<\/p>","why_wrong":{"B":"B: incident management is restoring service, which the workaround already did.","C":"C: change enablement controls changes.","D":"D handles standard user requests."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>An incident is an unplanned interruption or loss of quality of a service. A problem is the cause, or potential cause, of one or more incidents (knowledge: ITIL concepts stable since ITIL v3; my knowledge of ITIL Version 5 is limited). Investigating the cause of repeated incidents is problem management.<\/p><ul><li>B: incident management is restoring service, which the workaround already did.<\/li><li>C: change enablement controls changes.<\/li><li>D handles standard user requests.<\/li><\/ul>","knowledge_based":true,"frameworks":["ITIL","Knowledge"]},{"bank":"v1","key":"v1-82","id":82,"topic":82,"type":"short","word_count":9,"batch":3,"duty":3,"duties":[3,11],"section":"Duties 3 and 11: service management (ITIL)","stem_html":"In ITIL, what is a service level agreement (SLA)?","stem_text":"In ITIL, what is a service level agreement (SLA)?","options":{"A":"An internal technical runbook for the operations team","B":"The contract under which the service provider buys components from a supplier","C":"A documented agreement between a service provider and a customer that identifies the services required and the expected level of service","D":"The list of all known errors and their workarounds"},"answer":"C","why_right_html":"<p>An SLA is a documented agreement between a service provider and a customer that identifies the services required and the expected level of service (knowledge: ITIL).<\/p>","why_wrong":{"A":"A is operational documentation.","B":"B is a supplier or underpinning contract.","D":"D is a known error database."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>An SLA is a documented agreement between a service provider and a customer that identifies the services required and the expected level of service (knowledge: ITIL).<\/p><ul><li>A is operational documentation.<\/li><li>B is a supplier or underpinning contract.<\/li><li>D is a known error database.<\/li><\/ul>","knowledge_based":true,"frameworks":["ITIL","Knowledge"]},{"bank":"v1","key":"v1-83","id":83,"topic":83,"type":"short","word_count":20,"batch":3,"duty":7,"duties":[7],"section":"Duty 7: interinstitutional and joint procurement","stem_html":"Under Article 168(1) of the Financial Regulation, when may contracting authorities carry out a procurement procedure on an interinstitutional basis?","stem_text":"Under Article 168(1) of the Financial Regulation, when may contracting authorities carry out a procurement procedure on an interinstitutional basis?","options":{"A":"Only when the Commission leads the procedure","B":"Only for contracts above the thresholds of Article 178(1)","C":"Only in a situation of extreme urgency resulting from a crisis","D":"Where the contract or framework contract is of interest to two or more Union institutions or bodies, and whenever there is a possibility for realising efficiency gains"},"answer":"D","why_right_html":"<p>\"Where
