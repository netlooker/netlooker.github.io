matches its specifications and coding standards. It failed validation: it does not meet the users' real need, because the specification missed the part-time case. Validation activities with users, such as requirement reviews and prototypes, find gaps like this early (knowledge: verification vs validation).<\/p>","why_wrong":{"B":"B: unit tests and code coverage verify the code against the design. They cannot reveal a requirement that was never written (knowledge).","C":"C: static analysis finds coding faults. It cannot find a missing business rule (knowledge).","D":"D: the same test cases come from the same incomplete specification, so re-running them elsewhere would pass again (knowledge)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The system passed verification: it matches its specifications and coding standards. It failed validation: it does not meet the users' real need, because the specification missed the part-time case. Validation activities with users, such as requirement reviews and prototypes, find gaps like this early (knowledge: verification vs validation).<\/p><ul><li>B: unit tests and code coverage verify the code against the design. They cannot reveal a requirement that was never written (knowledge).<\/li><li>C: static analysis finds coding faults. It cannot find a missing business rule (knowledge).<\/li><li>D: the same test cases come from the same incomplete specification, so re-running them elsewhere would pass again (knowledge).<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v2","key":"v2-71","id":71,"topic":71,"type":"scenario","word_count":101,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"<p>The Project Manager of an IT project in a Directorate-General is analysing the project's cost of quality for last year. The finance team has extracted the following costs from the project accounts:<\/p><ul><li>Secure-coding training for the developers: EUR 20 000<\/li><li>Test execution and code inspections: EUR 50 000<\/li><li>Rework of defects found by the testers before release: EUR 30 000<\/li><li>Fixing defects reported by users after go-live: EUR 80 000<\/li><\/ul><p>The Project Steering Committee wants to know the total cost of conformance, so that it can compare it with the total cost of non-conformance.<\/p><p>What is the total cost of conformance?<\/p>","stem_text":"The Project Manager of an IT project in a Directorate-General is analysing the project's cost of quality for last year. The finance team has extracted the following costs from the project accounts: Secure-coding training for the developers: EUR 20 000 Test execution and code inspections: EUR 50 000 Rework of defects found by the testers before release: EUR 30 000 Fixing defects reported by users after go-live: EUR 80 000 The Project Steering Committee wants to know the total cost of conformance, so that it can compare it with the total cost of non-conformance. What is the total cost of conformance?","options":{"A":"EUR 50 000","B":"EUR 70 000","C":"EUR 100 000","D":"EUR 110 000"},"answer":"B","why_right_html":"<p>Cost of conformance = prevention + appraisal = EUR 20 000 (training) + EUR 50 000 (test execution and inspections) = EUR 70 000. Cost of non-conformance = internal failure + external failure = EUR 30 000 + EUR 80 000 = EUR 110 000 (knowledge: cost of quality, as in PMBOK). PM² asks teams to consider \"the cost of quality, following a cost/benefit analysis\" (PM² 3.1 §9.9, step 1).<\/p>","why_wrong":{"A":"A: EUR 50 000 is the appraisal cost only. It leaves out prevention.","C":"C: EUR 100 000 wrongly adds the EUR 30 000 of rework before release. Rework is an internal failure cost, part of non-conformance.","D":"D: EUR 110 000 is the total cost of non-conformance."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Cost of conformance = prevention + appraisal = EUR 20 000 (training) + EUR 50 000 (test execution and inspections) = EUR 70 000. Cost of non-conformance = internal failure + external failure = EUR 30 000 + EUR 80 000 = EUR 110 000 (knowledge: cost of quality, as in PMBOK). PM² asks teams to consider \"the cost of quality, following a cost/benefit analysis\" (PM² 3.1 §9.9, step 1).<\/p><ul><li>A: EUR 50 000 is the appraisal cost only. It leaves out prevention.<\/li><li>C: EUR 100 000 wrongly adds the EUR 30 000 of rework before release. Rework is an internal failure cost, part of non-conformance.<\/li><li>D: EUR 110 000 is the total cost of non-conformance.<\/li><\/ul>","knowledge_based":true,"frameworks":["PM²","PMBOK","Knowledge"]},{"bank":"v2","key":"v2-72","id":72,"topic":72,"type":"long","word_count":165,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>An EU agency signed a service contract with an initial value of EUR 800 000 for the development and maintenance of its case-management system. Since signature, two things have happened:<\/p><ul><li>The contract was modified once under Article 175(3)(a) of the Financial Regulation, for additional interface services worth EUR 150 000.<\/li><li>A price revision under the contract's indexation clause increased the contract price by EUR 40 000.<\/li><\/ul><p>The agency now needs further services from the same contractor to connect the system to a new EU-wide data exchange platform. These services were not part of the initial procurement. For technical reasons linked to interoperability with the existing system, a change of contractor is not possible, and it would also cause substantial duplication of costs. Before the contract manager drafts the modification, the Head of Unit asks the Project Manager to check how large it may be under point (a), taking account of the earlier modification.<\/p><p>What is the maximum value of the new modification under Article 175(3)(a)?<\/p>","stem_text":"An EU agency signed a service contract with an initial value of EUR 800 000 for the development and maintenance of its case-management system. Since signature, two things have happened: The contract was modified once under Article 175(3)(a) of the Financial Regulation, for additional interface services worth EUR 150 000. A price revision under the contract's indexation clause increased the contract price by EUR 40 000. The agency now needs further services from the same contractor to connect the system to a new EU-wide data exchange platform. These services were not part of the initial procurement. For technical reasons linked to interoperability with the existing system, a change of contractor is not possible, and it would also cause substantial duplication of costs. Before the contract manager drafts the modification, the Head of Unit asks the Project Manager to check how large it may be under point (a), taking account of the earlier modification. What is the maximum value of the new modification under Article 175(3)(a)?","options":{"A":"EUR 400 000","B":"EUR 250 000","C":"EUR 325 000","D":"EUR 270 000"},"answer":"B","why_right_html":"<p>Under Art. 175(3)(a)(iii), \"any increase in price, including the net cumulative value of successive modifications, does not exceed 50 % of the initial contract value\". \"The initial contract value shall not take into account price revisions\" (FR Art. 175(3), second subparagraph). Calculation: 50% × EUR 800 000 = EUR 400 000. The earlier point (a) modification used EUR 150 000, so EUR 400 000 − EUR 150 000 = EUR 250 000 remains. The EUR 40 000 indexation is neither added to the base nor deducted from the headroom: it comes from applying the contract's own price-revision clause, so it is not a modification, and price revisions are left out of the initial contract value (Art. 175(3), second subparagraph). Only the earlier point (a) modification counts in the cumulative value.<\/p><ul><li>Tip: the conditions of point (a) are cumulative (interoperability reasons, substantial duplication of costs, and the 50% cap). The stem confirms the first two, so only the cap is tested.<\/li><\/ul>","why_wrong":{"A":"A: EUR 400 000 ignores the earlier modification, which counts in the cumulative value.","C":"C: EUR 325 000 = 50% × EUR 950 000 − EUR 150 000. It wrongly uses the already modified value as the base, not the initial value.","D":"D: EUR 270 000 = 50% × EUR 840 000 − EUR 150 000. It wrongly adds the indexation increase to the initial value."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>Under Art. 175(3)(a)(iii), \"any increase in price, including the net cumulative value of successive modifications, does not exceed 50 % of the initial contract value\". \"The initial contract value shall not take into account price revisions\" (FR Art. 175(3), second subparagraph). Calculation: 50% × EUR 800 000 = EUR 400 000. The earlier point (a) modification used EUR 150 000, so EUR 400 000 − EUR 150 000 = EUR 250 000 remains. The EUR 40 000 indexation is neither added to the base nor deducted from the headroom: it comes from applying the contract's own price-revision clause, so it is not a modification, and price revisions are left out of the initial contract value (Art. 175(3), second subparagraph). Only the earlier point (a) modification counts in the cumulative value.<\/p><ul><li>A: EUR 400 000 ignores the earlier modification, which counts in the cumulative value.<\/li><li>C: EUR 325 000 = 50% × EUR 950 000 − EUR 150 000. It wrongly uses the already modified value as the base, not the initial value.<\/li><li>D: EUR 270 000 = 50% × EUR 840 000 − EUR 150 000. It wrongly adds the indexation increase to the initial value.<\/li><li>Tip: the conditions of point (a) are cumulative (interoperability reasons, substantial duplication of costs, and the 50% cap). The stem confirms the first two, so only the cap is tested.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-73","id":73,"topic":73,"type":"scenario","word_count":102,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A Directorate-General signed a service contract worth EUR 2 000 000 for IT helpdesk services after an open procedure. The unit prices were fixed for the whole duration, apart from yearly indexation. One year later, the contractor asks to raise all unit prices by 20%, without any change to the services, because its staff costs have risen faster than it expected. The contract contains no clause that provides for such an increase. The contractor argues that the change is acceptable because the increase stays below 50% of the initial contract value.<\/p><p>Which statement is correct under Article 175 of the Financial Regulation?<\/p>","stem_text":"A Directorate-General signed a service contract worth EUR 2 000 000 for IT helpdesk services after an open procedure. The unit prices were fixed for the whole duration, apart from yearly indexation. One year later, the contractor asks to raise all unit prices by 20%, without any change to the services, because its staff costs have risen faster than it expected. The contract contains no clause that provides for such an increase. The contractor argues that the change is acceptable because the increase stays below 50% of the initial contract value. Which statement is correct under Article 175 of the Financial Regulation?","options":{"A":"The change is allowed under point (b), because the rise in staff costs was not foreseeable and the increase is below 50%.","B":"The change is allowed, because price changes are not taken into account in the initial value of the contract.","C":"The change alters the subject matter, because it significantly shifts the economic balance in favour of the contractor.","D":"The change is allowed if both parties sign it, because a contract can always be changed by mutual written agreement."},"answer":"C","why_right_html":"<p>A contract may be modified without a procurement procedure \"only in the cases provided for in paragraph 3 and provided the modification does not alter the subject matter\" (FR Art. 175(2)). A modification alters the subject matter where it \"significantly changes the economic balance of the contract or the framework contract in favour of the contractor in a manner which was not provided for in the initial contract\" (Art. 175(4)(b)). A 20% price rise for the same services, with no clause providing for it, falls under this.<\/p>","why_wrong":{"A":"A: even if point (b) seemed to fit, Art. 175(2) still applies. The 50% cap does not save a modification that alters the subject matter.","B":"B: price revisions are left out of the initial value used for the caps (Art. 175(3), second subparagraph). That is a calculation rule and does not authorise new price increases. Point (c) does not help either: 20% of EUR 2 000 000 is above the 10% limit for service contracts (Art. 175(3)(c)(ii)).","D":"D: the FR allows modifications \"only\" in the listed cases (Art. 175(2)). The parties' agreement does not replace these conditions."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>A contract may be modified without a procurement procedure \"only in the cases provided for in paragraph 3 and provided the modification does not alter the subject matter\" (FR Art. 175(2)). A modification alters the subject matter where it \"significantly changes the economic balance of the contract or the framework contract in favour of the contractor in a manner which was not provided for in the initial contract\" (Art. 175(4)(b)). A 20% price rise for the same services, with no clause providing for it, falls under this.<\/p><ul><li>A: even if point (b) seemed to fit, Art. 175(2) still applies. The 50% cap does not save a modification that alters the subject matter.<\/li><li>B: price revisions are left out of the initial value used for the caps (Art. 175(3), second subparagraph). That is a calculation rule and does not authorise new price increases. Point (c) does not help either: 20% of EUR 2 000 000 is above the 10% limit for service contracts (Art. 175(3)(c)(ii)).<\/li><li>D: the FR allows modifications \"only\" in the listed cases (Art. 175(2)). The parties' agreement does not replace these conditions.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-74","id":74,"topic":74,"type":"scenario","word_count":104,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>An EU agency is drafting a contract worth EUR 1 200 000 for complex IT services. To protect itself against poor performance, the agency will require a performance guarantee of EUR 120 000 from the contractor, which would stay in place until final acceptance of the services. The financial officer also proposes to keep back 5% of each interim payment as a retention money guarantee. This would cover defects that may appear during the contractual liability period after final acceptance. The Head of Unit asks the Project Manager whether this set-up is lawful.<\/p><p>Which statement is correct under Article 176 of the Financial Regulation?<\/p>","stem_text":"An EU agency is drafting a contract worth EUR 1 200 000 for complex IT services. To protect itself against poor performance, the agency will require a performance guarantee of EUR 120 000 from the contractor, which would stay in place until final acceptance of the services. The financial officer also proposes to keep back 5% of each interim payment as a retention money guarantee. This would cover defects that may appear during the contractual liability period after final acceptance. The Head of Unit asks the Project Manager whether this set-up is lawful. Which statement is correct under Article 176 of the Financial Regulation?","options":{"A":"The retention money guarantee cannot be used while the performance guarantee has been requested and is not yet released.","B":"The two guarantees can be combined, provided that together they do not exceed 20% of the total value of the whole contract.","C":"The retention money guarantee is allowed, but it must be released at the provisional acceptance of the services.","D":"The performance guarantee is too high, because it may not exceed 5% of the total value of the contract."},"answer":"A","why_right_html":"<p>\"A retention money guarantee shall not be used in a contract where a performance guarantee has been requested and not released\" (FR Art. 176(2), third subparagraph). Here the performance guarantee stays in place until final acceptance, while the deductions would start with the interim payments.<\/p>","why_wrong":{"B":"B: the FR sets no combined 20% limit. Each guarantee has its own maximum of 10% (Art. 176(1) and (2)), and the two may not run at the same time.","C":"C: a retention money guarantee is released \"after the expiry of the contractual liability period\" (Art. 176(4)), not at provisional acceptance. Partial release at provisional acceptance is a feature of the performance guarantee (Art. 176(1)).","D":"D: the maximum is 10% (Art. 176(1)). EUR 120 000 / EUR 1 200 000 = 10%, which is allowed."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"A retention money guarantee shall not be used in a contract where a performance guarantee has been requested and not released\" (FR Art. 176(2), third subparagraph). Here the performance guarantee stays in place until final acceptance, while the deductions would start with the interim payments.<\/p><ul><li>B: the FR sets no combined 20% limit. Each guarantee has its own maximum of 10% (Art. 176(1) and (2)), and the two may not run at the same time.<\/li><li>C: a retention money guarantee is released \"after the expiry of the contractual liability period\" (Art. 176(4)), not at provisional acceptance. Partial release at provisional acceptance is a feature of the performance guarantee (Art. 176(1)).<\/li><li>D: the maximum is 10% (Art. 176(1)). EUR 120 000 / EUR 1 200 000 = 10%, which is allowed.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-75","id":75,"topic":75,"type":"long","word_count":157,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>Unit A.4 of a Directorate-General is completing two awards. Both are above the thresholds of Article 178(1) of the Financial Regulation:<\/p><ul><li>Award 1: a new framework contract for cloud services, after an open procedure with five tenders. The framework contract is needed for a data-centre migration that must start in April. The award notifications were sent to all tenderers simultaneously by electronic means on 2 March.<\/li><li>Award 2: a specific contract worth EUR 600 000 under an existing framework contract for software development.<\/li><\/ul><p>On 6 March, an unsuccessful tenderer in Award 1 sends a detailed letter. It claims that the evaluation committee applied one award criterion in a way that the tender specifications did not describe. The Head of Unit wants to sign both contracts on 9 March to keep the project on schedule, and asks the Project Manager to confirm that this is possible under the procurement rules.<\/p><p>Which statement is correct under the Financial Regulation?<\/p>","stem_text":"Unit A.4 of a Directorate-General is completing two awards. Both are above the thresholds of Article 178(1) of the Financial Regulation: Award 1: a new framework contract for cloud services, after an open procedure with five tenders. The framework contract is needed for a data-centre migration that must start in April. The award notifications were sent to all tenderers simultaneously by electronic means on 2 March. Award 2: a specific contract worth EUR 600 000 under an existing framework contract for software development. On 6 March, an unsuccessful tenderer in Award 1 sends a detailed letter. It claims that the evaluation committee applied one award criterion in a way that the tender specifications did not describe. The Head of Unit wants to sign both contracts on 9 March to keep the project on schedule, and asks the Project Manager to confirm that this is possible under the procurement rules. Which statement is correct under the Financial Regulation?","options":{"A":"Neither contract may be signed before a standstill period of 15 days has elapsed, because both awards exceed the thresholds.","B":"Both contracts may be signed on 9 March, provided that the unsuccessful tenderer receives a written reply before signature.","C":"The specific contract may be signed on 9 March but the framework contract may not, and its signature may be suspended.","D":"Both contracts must wait for a standstill period of 10 days, because both exceed the thresholds and notices went by e-mail."},"answer":"C","why_right_html":"<p>Specific contracts are exempt: the standstill \"shall not apply\" to \"specific contracts based on a framework contract\" (FR Annex I point 36.2(b)). The framework contract needs the standstill: the authority \"shall not sign\" until it has elapsed (Art. 178(2)), and it lasts \"10 days when using electronic means\" (Art. 178(3)). It runs from \"the day after the simultaneous dispatch of the notifications\" (Annex I point 36.1(a)), so from 3 March, and 9 March falls inside it. The authority \"may suspend the signature of the contract for additional examination\" if comments from unsuccessful tenderers justify it, informing all tenderers \"within three working days following the suspension decision\" (point 36.1).<\/p>","why_wrong":{"A":"A: 15 days applies only to \"other means\" (Art. 178(3)), and the specific contract has no standstill at all.","B":"B: a written reply does not shorten the standstill. The framework contract cannot be signed before it has elapsed (Art. 178(2)).","D":"D: the 10 days are right for the framework contract, but the specific contract is exempt (Annex I point 36.2(b))."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Specific contracts are exempt: the standstill \"shall not apply\" to \"specific contracts based on a framework contract\" (FR Annex I point 36.2(b)). The framework contract needs the standstill: the authority \"shall not sign\" until it has elapsed (Art. 178(2)), and it lasts \"10 days when using electronic means\" (Art. 178(3)). It runs from \"the day after the simultaneous dispatch of the notifications\" (Annex I point 36.1(a)), so from 3 March, and 9 March falls inside it. The authority \"may suspend the signature of the contract for additional examination\" if comments from unsuccessful tenderers justify it, informing all tenderers \"within three working days following the suspension decision\" (point 36.1).<\/p><ul><li>A: 15 days applies only to \"other means\" (Art. 178(3)), and the specific contract has no standstill at all.<\/li><li>B: a written reply does not shorten the standstill. The framework contract cannot be signed before it has elapsed (Art. 178(2)).<\/li><li>D: the 10 days are right for the framework contract, but the specific contract is exempt (Annex I point 36.2(b)).<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-76","id":76,"topic":76,"type":"scenario","word_count":104,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>In an open procedure for on-site IT support services at an EU agency, one tender's price is 45% below the average of the other tenders. The contracting authority asked the tenderer in writing for details of the constituent elements of its price and gave it time to present its observations. The reply includes a full cost breakdown. It shows that the hourly rates paid to the on-site technicians are below the statutory minimum wage of the Member State where the services will be performed. This tender has the best quality score.<\/p><p>What must the contracting authority do under Annex I to the Financial Regulation?<\/p>","stem_text":"In an open procedure for on-site IT support services at an EU agency, one tender's price is 45% below the average of the other tenders. The contracting authority asked the tenderer in writing for details of the constituent elements of its price and gave it time to present its observations. The reply includes a full cost breakdown. It shows that the hourly rates paid to the on-site technicians are below the statutory minimum wage of the Member State where the services will be performed. This tender has the best quality score. What must the contracting authority do under Annex I to the Financial Regulation?","options":{"A":"Reject the tender, because it has established that the low price results from non-compliance with applicable labour law.","B":"Accept the tender, because the tenderer explained the constituent elements of its price, as it was asked to do.","C":"Keep the tender unless the tenderer fails to prove, within a time limit, that the low price does not come from State aid.","D":"Ask the tenderer to raise its hourly rates to the minimum wage and then evaluate the revised tender in the normal way."},"answer":"A","why_right_html":"<p>\"The contracting authority shall reject the tender where it has established that the tender is abnormally low because it does not comply with applicable obligations in the fields of environmental, social and labour law\" (FR Annex I point 23.2, second subparagraph). The tenderer's own breakdown shows wages below the statutory minimum, so the authority has established this, and rejection is mandatory.<\/p>","why_wrong":{"B":"B: giving an explanation is not enough. Rejection follows \"where the evidence supplied does not satisfactorily account for the low price\" (point 23.2, first subparagraph), and here the evidence shows a breach of labour law.","C":"C: the State aid test applies only where the tender is abnormally low \"because the tenderer has obtained State aid\" (point 23.3). That is not the case here.","D":"D: letting one tenderer change its price after submission would breach equal treatment (Art. 163(1)), and the FR offers no such route (knowledge)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>\"The contracting authority shall reject the tender where it has established that the tender is abnormally low because it does not comply with applicable obligations in the fields of environmental, social and labour law\" (FR Annex I point 23.2, second subparagraph). The tenderer's own breakdown shows wages below the statutory minimum, so the authority has established this, and rejection is mandatory.<\/p><ul><li>B: giving an explanation is not enough. Rejection follows \"where the evidence supplied does not satisfactorily account for the low price\" (point 23.2, first subparagraph), and here the evidence shows a breach of labour law.<\/li><li>C: the State aid test applies only where the tender is abnormally low \"because the tenderer has obtained State aid\" (point 23.3). That is not the case here.<\/li><li>D: letting one tenderer change its price after submission would breach equal treatment (Art. 163(1)), and the FR offers no such route (knowledge).<\/li><\/ul>","knowledge_based":true,"frameworks":["FR","Knowledge"]},{"bank":"v2","key":"v2-77","id":77,"topic":77,"type":"scenario","word_count":106,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A Directorate-General plans to buy three related services for its new data platform in one procedure, divided into lots:<\/p><ul><li>Lot 1, hosting: estimated at EUR 90 000<\/li><li>Lot 2, user helpdesk: estimated at EUR 70 000<\/li><li>Lot 3, user training: estimated at EUR 40 000<\/li><\/ul><p>For this case, assume that the threshold of Article 178(1) of the Financial Regulation for service contracts is higher than the value of each lot but lower than the total of all three lots. A colleague suggests using a below-threshold procedure for each lot, since no lot reaches the threshold on its own.<\/p><p>Which statement is correct under the Financial Regulation?<\/p>","stem_text":"A Directorate-General plans to buy three related services for its new data platform in one procedure, divided into lots: Lot 1, hosting: estimated at EUR 90 000 Lot 2, user helpdesk: estimated at EUR 70 000 Lot 3, user training: estimated at EUR 40 000 For this case, assume that the threshold of Article 178(1) of the Financial Regulation for service contracts is higher than the value of each lot but lower than the total of all three lots. A colleague suggests using a below-threshold procedure for each lot, since no lot reaches the threshold on its own. Which statement is correct under the Financial Regulation?","options":{"A":"The colleague is right, because each lot leads to an individual contract and is compared with the threshold on its own.","B":"The procedure cannot be divided into lots at all, because the total value of the three lots is above the threshold.","C":"Lots are allowed, but the three lots must then be awarded to three different tenderers to keep competition broad.","D":"The total value of all lots counts for the threshold, so the above-threshold publicity and procedure rules apply to each lot."},"answer":"D","why_right_html":"<p>\"The total value of all the lots shall be taken into account for the overall evaluation pursuant to the applicable threshold\". Where that total reaches the Art. 178(1) thresholds, \"Article 166(1) and Articles 167 and 168 shall apply to each of the lots\" (FR Annex I point 33.2). Art. 166(1) covers publication in the Official Journal, and Art. 167 the procedures.<\/p>","why_wrong":{"A":"A: this is the trap. Each lot does become an individual contract, but the threshold is checked against the total. Art. 163(2) also bars splitting a contract to circumvent the rules.","B":"B: lots are encouraged, not banned, above the thresholds. Contracts are awarded in lots \"Whenever appropriate, technically feasible and cost efficient\" (Annex I point 33.1; Art. 163(2)).","C":"C: \"If several lots are awarded to the same tenderer, a single contract covering those lots may be signed\" (Annex I point 33.3)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"The total value of all the lots shall be taken into account for the overall evaluation pursuant to the applicable threshold\". Where that total reaches the Art. 178(1) thresholds, \"Article 166(1) and Articles 167 and 168 shall apply to each of the lots\" (FR Annex I point 33.2). Art. 166(1) covers publication in the Official Journal, and Art. 167 the procedures.<\/p><ul><li>A: this is the trap. Each lot does become an individual contract, but the threshold is checked against the total. Art. 163(2) also bars splitting a contract to circumvent the rules.<\/li><li>B: lots are encouraged, not banned, above the thresholds. Contracts are awarded in lots \"Whenever appropriate, technically feasible and cost efficient\" (Annex I point 33.1; Art. 163(2)).<\/li><li>C: \"If several lots are awarded to the same tenderer, a single contract covering those lots may be signed\" (Annex I point 33.3).<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-78","id":78,"topic":78,"type":"long","word_count":157,"batch":2,"duty":11,"duties":[11],"section":"Duty 11: contracts and procurement","stem_html":"<p>A PM² project in an EU agency has replaced the agency's document-management system. The Executing Phase is complete and the Ready for Closing gate has been passed. The Project-End Review Meeting took place last week: project performance was discussed, team and contractor performance were evaluated, and Lessons Learned were captured. The Project Manager is now writing the Project-End Report with input from the Project Core Team.<\/p><p>Under the specific contract, the contractor still has to:<\/p><ul><li>hand over the final version of the technical documentation, and<\/li><li>transfer the source code and build scripts to the agency's code repository.<\/li><\/ul><p>The Head of Unit wants the project closed by Friday, so that the project team can be released and operations can start. He suggests: \"The Project Steering Committee can sign off the closure on Friday. The open contract items can be followed up later by the operations team.\"<\/p><p>What should the Project Manager do before the project is officially closed?<\/p>","stem_text":"A PM² project in an EU agency has replaced the agency's document-management system. The Executing Phase is complete and the Ready for Closing gate has been passed. The Project-End Review Meeting took place last week: project performance was discussed, team and contractor performance were evaluated, and Lessons Learned were captured. The Project Manager is now writing the Project-End Report with input from the Project Core Team. Under the specific contract, the contractor still has to: hand over the final version of the technical documentation, and transfer the source code and build scripts to the agency's code repository. The Head of Unit wants the project closed by Friday, so that the project team can be released and operations can start. He suggests: \"The Project Steering Committee can sign off the closure on Friday. The open contract items can be followed up later by the operations team.\" What should the Project Manager do before the project is officially closed?","options":{"A":"Ask the Project Steering Committee to give the final approval on Friday, since it is accountable for the Closing Phase.","B":"Verify that all contractual obligations are fulfilled, and ensure that the Project Owner gives final approval of the project.","C":"Close the project on Friday and record the open contract items as Post-Project Recommendations for the operations team.","D":"Ask the contractor to write the Project-End Report, since the contractor's performance was a main topic of the review meeting."},"answer":"B","why_right_html":"<p>In Administrative Closure, the PM must \"Ensure that the Project Owner (PO) gives final project approval and closes the project\" and \"Verify that all contractual obligations have been fulfilled\" (PM² 3.1 §8.4, steps 4–5, p.67). The PO \"Has final approval of the project\" (§8.4, p.67). The documentation and source-code transfer are still open contractual obligations.<\/p>","why_wrong":{"A":"A: the PSC is accountable for the Project-End Review Meeting and the Project-End Report (RASCI, §8.1 and §8.3). In Administrative Closure it is only consulted, and the PO is accountable (§8.4, p.67).","C":"C: Post-Project Recommendations cover post-project work \"such as extensions, maintenance and ideas for follow-up projects\" (§8.2, p.65). They are not a place to park unfulfilled contractual obligations.","D":"D: for the Project-End Report, the \"Project Manager (PM) Writes the report\", with input from the PQA and the PCT (§8.3, p.66)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>In Administrative Closure, the PM must \"Ensure that the Project Owner (PO) gives final project approval and closes the project\" and \"Verify that all contractual obligations have been fulfilled\" (PM² 3.1 §8.4, steps 4–5, p.67). The PO \"Has final approval of the project\" (§8.4, p.67). The documentation and source-code transfer are still open contractual obligations.<\/p><ul><li>A: the PSC is accountable for the Project-End Review Meeting and the Project-End Report (RASCI, §8.1 and §8.3). In Administrative Closure it is only consulted, and the PO is accountable (§8.4, p.67).<\/li><li>C: Post-Project Recommendations cover post-project work \"such as extensions, maintenance and ideas for follow-up projects\" (§8.2, p.65). They are not a place to park unfulfilled contractual obligations.<\/li><li>D: for the Project-End Report, the \"Project Manager (PM) Writes the report\", with input from the PQA and the PCT (§8.3, p.66).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-79","id":79,"topic":79,"type":"scenario","word_count":97,"batch":3,"duty":11,"duties":[11],"section":"Duty 11: contract types","stem_html":"<p>Unit B.3 of an EU agency has contracted the development of a document-analysis tool. The solution uses a technology that is new to the agency, so the effort was hard to estimate, and the agency chose a cost-plus-incentive-fee contract. The contract terms are:<\/p><ul><li>Target cost: EUR 800 000<\/li><li>Target fee: EUR 60 000<\/li><li>Share ratio for cost overruns and underruns: 80/20 (buyer/contractor)<\/li><li>No minimum or maximum fee<\/li><\/ul><p>At completion, the contractor's audited actual costs are EUR 900 000. All of these costs are allowable under the contract.<\/p><p>How much does the agency pay the contractor in total?<\/p>","stem_text":"Unit B.3 of an EU agency has contracted the development of a document-analysis tool. The solution uses a technology that is new to the agency, so the effort was hard to estimate, and the agency chose a cost-plus-incentive-fee contract. The contract terms are: Target cost: EUR 800 000 Target fee: EUR 60 000 Share ratio for cost overruns and underruns: 80/20 (buyer/contractor) No minimum or maximum fee At completion, the contractor's audited actual costs are EUR 900 000. All of these costs are allowable under the contract. How much does the agency pay the contractor in total?","options":{"A":"EUR 940 000: the actual costs plus the target fee minus 20% of the overrun","B":"EUR 960 000: the actual costs plus the full target fee, which is fixed in advance","C":"EUR 900 000: the actual costs only, because an overrun cancels the incentive fee","D":"EUR 860 000: the target cost plus the target fee, as the target price caps the payment"},"answer":"A","why_right_html":"<p>In a cost-plus-incentive-fee contract the buyer reimburses all allowable actual costs, and the fee moves with the share ratio: the contractor's share of an overrun is deducted from the target fee (knowledge: standard contract types, as in PMBOK). Overrun = 900 000 − 800 000 = EUR 100 000. Contractor's share = 20% × 100 000 = EUR 20 000. Fee = 60 000 − 20 000 = EUR 40 000. Total = 900 000 + 40 000 = EUR 940 000.<\/p>","why_wrong":{"B":"B: ignores the share ratio. In an incentive contract the fee is not fixed; only a cost-plus-fixed-fee contract keeps the fee unchanged (knowledge).","C":"C: the fee is reduced by the contractor's share, not cancelled. With no minimum or maximum fee stated, the fee falls only to EUR 40 000 (knowledge).","D":"D: treats the contract as fixed price. A cost-reimbursable contract has no price cap unless one is agreed, and here none is (knowledge)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>In a cost-plus-incentive-fee contract the buyer reimburses all allowable actual costs, and the fee moves with the share ratio: the contractor's share of an overrun is deducted from the target fee (knowledge: standard contract types, as in PMBOK). Overrun = 900 000 − 800 000 = EUR 100 000. Contractor's share = 20% × 100 000 = EUR 20 000. Fee = 60 000 − 20 000 = EUR 40 000. Total = 900 000 + 40 000 = EUR 940 000.<\/p><ul><li>B: ignores the share ratio. In an incentive contract the fee is not fixed; only a cost-plus-fixed-fee contract keeps the fee unchanged (knowledge).<\/li><li>C: the fee is reduced by the contractor's share, not cancelled. With no minimum or maximum fee stated, the fee falls only to EUR 40 000 (knowledge).<\/li><li>D: treats the contract as fixed price. A cost-reimbursable contract has no price cap unless one is agreed, and here none is (knowledge).<\/li><\/ul>","knowledge_based":true,"frameworks":["PMBOK","Knowledge"]},{"bank":"v2","key":"v2-80","id":80,"topic":80,"type":"scenario","word_count":109,"batch":3,"duty":11,"duties":[11],"section":"Duty 11: contract types","stem_html":"<p>A Directorate-General needs a three-month discovery phase to explore how artificial intelligence could support the handling of citizens' complaints. The requirements are vague and will change as the team learns. The unit therefore orders the work from a contractor on a time-and-materials basis, at agreed daily rates. After four weeks, the contractor has already used 45% of the days that the unit had informally expected for the whole phase, and the Head of Unit is worried about the total cost. She still wants to keep the freedom to change the content of the work each week.<\/p><p>Which measure would BEST limit the Directorate-General's cost risk while keeping that flexibility?<\/p>","stem_text":"A Directorate-General needs a three-month discovery phase to explore how artificial intelligence could support the handling of citizens' complaints. The requirements are vague and will change as the team learns. The unit therefore orders the work from a contractor on a time-and-materials basis, at agreed daily rates. After four weeks, the contractor has already used 45% of the days that the unit had informally expected for the whole phase, and the Head of Unit is worried about the total cost. She still wants to keep the freedom to change the content of the work each week. Which measure would BEST limit the Directorate-General's cost risk while keeping that flexibility?","options":{"A":"Convert the order into a firm fixed-price contract for the remaining eight weeks of the phase","B":"Switch to a cost-plus-fixed-fee contract, so that the contractor's fee no longer depends on effort","C":"Set a not-to-exceed ceiling on the order and review the days consumed against it every week","D":"Add an economic price adjustment clause that links the daily rates to an official price index"},"answer":"C","why_right_html":"<p>Under time and materials the buyer carries most of the cost risk, because it pays for the time actually spent. A not-to-exceed ceiling, monitored against the days consumed, limits that risk while leaving the content of the work open (knowledge: contract types, as in PMBOK).<\/p>","why_wrong":{"A":"A: a firm fixed price needs a well-defined scope. With vague and changing requirements, the contractor would add a risk premium and every weekly change would need a contract change, so the flexibility is lost (knowledge).","B":"B: in a cost-plus-fixed-fee contract the buyer still reimburses all costs, so the total is no more limited than under time and materials (knowledge).","D":"D: an economic price adjustment protects against inflation over long contracts. The problem here is the number of days, not the daily rate (knowledge)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Under time and materials the buyer carries most of the cost risk, because it pays for the time actually spent. A not-to-exceed ceiling, monitored against the days consumed, limits that risk while leaving the content of the work open (knowledge: contract types, as in PMBOK).<\/p><ul><li>A: a firm fixed price needs a well-defined scope. With vague and changing requirements, the contractor would add a risk premium and every weekly change would need a contract change, so the flexibility is lost (knowledge).<\/li><li>B: in a cost-plus-fixed-fee contract the buyer still reimburses all costs, so the total is no more limited than under time and materials (knowledge).<\/li><li>D: an economic price adjustment protects against inflation over long contracts. The problem here is the number of days, not the daily rate (knowledge).<\/li><\/ul>","knowledge_based":true,"frameworks":["PMBOK","Knowledge"]},{"bank":"v2","key":"v2-81","id":81,"topic":81,"type":"long","word_count":167,"batch":3,"duty":3,"duties":[3,11],"section":"Duties 3 and 11: service management (ITIL)","stem_html":"<p>Unit C.2 of an EU agency provides a case-management system to the agency's legal department. The service level agreement (SLA) with that department sets a monthly availability target of 99.5%. Second-level support is outsourced to a contractor whose specific contract requires priority-1 incidents to be resolved within four hours.<\/p><p>Over the last two months the following has happened:<\/p><ul><li>Five priority-1 outages occurred. Each time, the service desk restored service within two hours by restarting the application server.<\/li><li>An investigation found the root cause: a memory leak in a third-party software library. The cause and the restart workaround are now recorded as a known error.<\/li><li>The contractor has a patched version of the library and offers to install it in production tonight. There is no outage at the moment.<\/li><\/ul><p>The service owner wants the outages to stop before the SLA target is breached. However, the production environment is shared with two other systems that use the same library.<\/p><p>In ITIL terms, what is the MOST appropriate next step?<\/p>","stem_text":"Unit C.2 of an EU agency provides a case-management system to the agency's legal department. The service level agreement (SLA) with that department sets a monthly availability target of 99.5%. Second-level support is outsourced to a contractor whose specific contract requires priority-1 incidents to be resolved within four hours. Over the last two months the following has happened: Five priority-1 outages occurred. Each time, the service desk restored service within two hours by restarting the application server. An investigation found the root cause: a memory leak in a third-party software library. The cause and the restart workaround are now recorded as a known error. The contractor has a patched version of the library and offers to install it in production tonight. There is no outage at the moment. The service owner wants the outages to stop before the SLA target is breached. However, the production environment is shared with two other systems that use the same library. In ITIL terms, what is the MOST appropriate next step?","options":{"A":"Close the problem record, since the root cause is known and a workaround has been documented","B":"Let the service desk install the patch during the next outage, as part of restoring the service","C":"Let the contractor install the patch tonight, because its contract covers priority-1 resolution","D":"Raise a change so that the patch is assessed and authorised before it is deployed"},"answer":"D","why_right_html":"<p>The workaround restored service (incident management) and the root cause is known (a known error, handled in problem management). The permanent fix is a change to production, so it must go through change enablement: it is assessed, for example for its effect on the two other systems that share the library, and authorised before deployment (knowledge: ITIL 4 terms; my knowledge of ITIL Version 5 is limited, see <code>source/frameworks/status-checks/facts.md<\/code>).<\/p><ul><li>Tip: incident = restore service; problem = find and remove the cause; change = control what goes into production. Many ITIL items test which practice owns which step.<\/li><\/ul>","why_wrong":{"A":"A: a problem is not resolved by documenting a workaround. The known error stays open until the fix is in place and confirmed (knowledge: ITIL).","B":"B: incident management restores service with the quickest safe action. Installing a permanent fix during an outage, outside change control, bypasses the risk assessment (knowledge: ITIL).","C":"C: the contract's four-hour target is about resolving incidents, and no incident is open. A contractual service target does not replace the provider's own change control (knowledge: ITIL)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The workaround restored service (incident management) and the root cause is known (a known error, handled in problem management). The permanent fix is a change to production, so it must go through change enablement: it is assessed, for example for its effect on the two other systems that share the library, and authorised before deployment (knowledge: ITIL 4 terms; my knowledge of ITIL Version 5 is limited, see <code>source/frameworks/status-checks/facts.md<\/code>).<\/p><ul><li>A: a problem is not resolved by documenting a workaround. The known error stays open until the fix is in place and confirmed (knowledge: ITIL).<\/li><li>B: incident management restores service with the quickest safe action. Installing a permanent fix during an outage, outside change control, bypasses the risk assessment (knowledge: ITIL).<\/li><li>C: the contract's four-hour target is about resolving incidents, and no incident is open. A contractual service target does not replace the provider's own change control (knowledge: ITIL).<\/li><li>Tip: incident = restore service; problem = find and remove the cause; change = control what goes into production. Many ITIL items test which practice owns which step.<\/li><\/ul>","knowledge_based":true,"frameworks":["ITIL","Knowledge"]},{"bank":"v2","key":"v2-82","id":82,"topic":82,"type":"scenario","word_count":107,"batch":3,"duty":3,"duties":[3,11],"section":"Duties 3 and 11: service management (ITIL)","stem_html":"<p>The IT unit of a Directorate-General provides a document-management service to three business units. It has just signed a service level agreement (SLA) with them: priority-2 incidents must be resolved within eight hours, and the service must be available 99% of working hours. To deliver the service, the IT unit depends on two other parties: the database team of another internal unit, and an external company that hosts the servers. Neither party has any target linked to the new SLA. The service level manager is asked how to make sure that the SLA targets can actually be met.<\/p><p>Which arrangement is the MOST appropriate in ITIL terms?<\/p>","stem_text":"The IT unit of a Directorate-General provides a document-management service to three business units. It has just signed a service level agreement (SLA) with them: priority-2 incidents must be resolved within eight hours, and the service must be available 99% of working hours. To deliver the service, the IT unit depends on two other parties: the database team of another internal unit, and an external company that hosts the servers. Neither party has any target linked to the new SLA. The service level manager is asked how to make sure that the SLA targets can actually be met. Which arrangement is the MOST appropriate in ITIL terms?","options":{"A":"Support the SLA with an OLA for the database team and an underpinning contract for the hosting company","B":"Add the database team and the hosting company as co-signatories of the SLA with the business units","C":"Ask the business units to conclude their own SLAs directly with the database team and the hosting company","D":"Record both dependencies in the known error database, so that the service desk sees them during incidents"},"answer":"A","why_right_html":"<p>An SLA is only reliable if the parties the provider depends on are bound to matching targets: internal teams through an operational level agreement (OLA), external suppliers through an underpinning contract (knowledge: ITIL v3 terms, still common; ITIL 4 covers the same idea under service level and supplier management).<\/p>","why_wrong":{"B":"B: an SLA is between the service provider and its customers. Internal teams and suppliers are not parties to it; they support it through OLAs and contracts (knowledge: ITIL).","C":"C: the IT unit is the service provider and stays accountable to its customers. Splitting the service into several customer SLAs moves the problem to the customers (knowledge: ITIL).","D":"D: the known error database records known errors and workarounds, not supplier commitments. It sets no target for anyone (knowledge: ITIL)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>An SLA is only reliable if the parties the provider depends on are bound to matching targets: internal teams through an operational level agreement (OLA), external suppliers through an underpinning contract (knowledge: ITIL v3 terms, still common; ITIL 4 covers the same idea under service level and supplier management).<\/p><ul><li>B: an SLA is between the service provider and its customers. Internal teams and suppliers are not parties to it; they support it through OLAs and contracts (knowledge: ITIL).<\/li><li>C: the IT unit is the service provider and stays accountable to its customers. Splitting the service into several customer SLAs moves the problem to the customers (knowledge: ITIL).<\/li><li>D: the known error database records known errors and workarounds, not supplier commitments. It sets no target for anyone (knowledge: ITIL).<\/li><\/ul>","knowledge_based":true,"frameworks":["ITIL","Knowledge"]},{"bank":"v2","key":"v2-83","id":83,"topic":83,"type":"scenario","word_count":104,"batch":3,"duty":7,"duties":[7],"section":"Duty 7: interinstitutional and joint procurement","stem_html":"<p>Three years ago, a Directorate-General led an interinstitutional open procedure for cloud-hosting services and signed a framework contract with the winning tenderer. The procurement documents identified eleven Union institutions and agencies as the participating contracting authorities. A newly created EU agency, which is not among the eleven, now needs cloud hosting quickly. Its Head of IT points out that the framework contract is clearly of interest to the agency and would bring efficiency gains. She asks the lead Directorate-General to let the agency sign specific contracts under it. There is no crisis situation.<\/p><p>Under Article 168(1) of the Financial Regulation, which statement is correct?<\/p>","stem_text":"Three years ago, a Directorate-General led an interinstitutional open procedure for cloud-hosting services and signed a framework contract with the winning tenderer. The procurement documents identified eleven Union institutions and agencies as the participating contracting authorities. A newly created EU agency, which is not among the eleven, now needs cloud hosting quickly. Its Head of IT points out that the framework contract is clearly of interest to the agency and would bring efficiency gains. She asks the lead Directorate-General to let the agency sign specific contracts under it. There is no crisis situation. Under Article 168(1) of the Financial Regulation, which statement is correct?","options":{"A":"The agency may join, because the contract is of interest to it and would bring efficiency gains","B":"The agency may join, provided that adding it does not alter the subject matter of the framework contract","C":"The agency may join if the lead Directorate-General and the contractor both agree in writing","D":"The agency cannot use it, as its terms apply only to authorities identified in the procurement documents"},"answer":"D","why_right_html":"<p>\"The terms of a framework contract shall only apply between those contracting authorities that are identified for that purpose in the procurement documents and those economic operators that are party to the framework contract\" (FR Art. 168(1), third subparagraph). The new agency was not identified, so it cannot order under this framework contract. It must use another procedure.<\/p>","why_wrong":{"A":"A: interest to two or more institutions and possible efficiency gains are the conditions for launching an interinstitutional procedure (Art. 168(1), first subparagraph). They do not let an authority join an existing framework contract.","B":"B: \"does not alter the subject matter\" belongs to the derogation for \"extreme urgency resulting from a crisis\", and even that applies only \"after the launch of the procurement procedure and before contract signature\" (Art. 168(1), fourth subparagraph). There is no crisis, and the contract was signed three years ago.","C":"C: Article 168 gives no such route. Agreement between the lead authority and the contractor cannot widen the circle set in the procurement documents."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"The terms of a framework contract shall only apply between those contracting authorities that are identified for that purpose in the procurement documents and those economic operators that are party to the framework contract\" (FR Art. 168(1), third subparagraph). The new agency was not identified, so it cannot order under this framework contract. It must use another procedure.<\/p><ul><li>A: interest to two or more institutions and possible efficiency gains are the conditions for launching an interinstitutional procedure (Art. 168(1), first subparagraph). They do not let an authority join an existing framework contract.<\/li><li>B: \"does not alter the subject matter\" belongs to the derogation for \"extreme urgency resulting from a crisis\", and even that applies only \"after the launch of the procurement procedure and before contract signature\" (Art. 168(1), fourth subparagraph). There is no crisis, and the contract was signed three years ago.<\/li><li>C: Article 168 gives no such route. Agreement between the lead authority and the contractor cannot widen the circle set in the procurement documents.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-84","id":84,"topic":84,"type":"long","word_count":155,"batch":3,"duty":7,"duties":[7],"section":"Duty 7: interinstitutional and joint procurement","stem_html":"<p>A Directorate-General and the ministry of interior of one Member State need a secure video-conferencing platform for a joint action on border management. They agree to procure it jointly under Article 168(2) of the Financial Regulation. The estimated total value of the contract is EUR 12 million, of which the ministry's share is EUR 7.2 million (60%).<\/p><p>At the first planning meeting:<\/p><ul><li>The ministry proposes that its national procurement rules should apply, as its staff know them well.<\/li><li>The Directorate-General's legal adviser confirms that the national rules can be considered equivalent to those of the Union institution.<\/li><li>The parties have agreed how the tenders will be evaluated and how the contract will be awarded, but they propose to decide the law applicable to the contract and the competent court only if a dispute arises.<\/li><\/ul><p>The project manager, who will coordinate the technical specifications, must brief the Director before the next meeting.<\/p><p>Which statement is correct?<\/p>","stem_text":"A Directorate-General and the ministry of interior of one Member State need a secure video-conferencing platform for a joint action on border management. They agree to procure it jointly under Article 168(2) of the Financial Regulation. The estimated total value of the contract is EUR 12 million, of which the ministry's share is EUR 7.2 million (60%). At the first planning meeting: The ministry proposes that its national procurement rules should apply, as its staff know them well. The Directorate-General's legal adviser confirms that the national rules can be considered equivalent to those of the Union institution. The parties have agreed how the tenders will be evaluated and how the contract will be awarded, but they propose to decide the law applicable to the contract and the competent court only if a dispute arises. The project manager, who will coordinate the technical specifications, must brief the Director before the next meeting. Which statement is correct?","options":{"A":"The Union institution's procedural rules must apply, because a Union institution takes part in the procurement","B":"The national rules apply automatically, because the ministry's share of the estimated value is above 50%","C":"The Commission, through the Directorate-General, may decide that the national rules apply, given the 60% share and their equivalence","D":"The plan is complete, since Article 168(2) allows the applicable law and the competent court to be settled later"},"answer":"C","why_right_html":"<p>The default is that \"the procedural provisions applicable to Union institutions shall apply to the joint procurement\". However, where the Member State authority's share \"is equal to or above 50 %, or in other duly justified cases, the Union institution may decide that the procedural rules applicable to the contracting authority of a Member State shall apply\", provided those rules \"may be considered as equivalent\" (FR Art. 168(2), third and fourth subparagraphs). Here the share is 60% and equivalence is confirmed, so the Commission, acting through the Directorate-General, may decide this.<\/p><ul><li>Tip: Art. 168(1) is interinstitutional procurement (Union bodies together); Art. 168(2) is joint procurement with Member States; Art. 168(3) is procurement on behalf of Member States.<\/li><\/ul>","why_wrong":{"A":"A: the Union rules are the default, not an absolute rule. The fourth subparagraph allows an exception.","B":"B: nothing is automatic. The Union institution \"may decide\", and only if the national rules are equivalent.","D":"D: the parties \"shall agree in particular upon\" the arrangements for evaluation, the award, \"the law applicable to the contract and the competent court for hearing disputes\" (Art. 168(2), fifth subparagraph). Leaving law and court until a dispute arises does not meet this."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The default is that \"the procedural provisions applicable to Union institutions shall apply to the joint procurement\". However, where the Member State authority's share \"is equal to or above 50 %, or in other duly justified cases, the Union institution may decide that the procedural rules applicable to the contracting authority of a Member State shall apply\", provided those rules \"may be considered as equivalent\" (FR Art. 168(2), third and fourth subparagraphs). Here the share is 60% and equivalence is confirmed, so the Commission, acting through the Directorate-General, may decide this.<\/p><ul><li>A: the Union rules are the default, not an absolute rule. The fourth subparagraph allows an exception.<\/li><li>B: nothing is automatic. The Union institution \"may decide\", and only if the national rules are equivalent.<\/li><li>D: the parties \"shall agree in particular upon\" the arrangements for evaluation, the award, \"the law applicable to the contract and the competent court for hearing disputes\" (Art. 168(2), fifth subparagraph). Leaving law and court until a dispute arises does not meet this.<\/li><li>Tip: Art. 168(1) is interinstitutional procurement (Union bodies together); Art. 168(2) is joint procurement with Member States; Art. 168(3) is procurement on behalf of Member States.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-85","id":85,"topic":85,"type":"scenario","word_count":97,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: security in projects","stem_html":"<p>A Directorate-General starts a project to build an online portal where citizens upload supporting documents. In the Initiating Phase, the Project Manager drafts the Project Charter. To save time, she proposes to leave IT security out of the early project documents and to deal with it in the Executing Phase, by commissioning a penetration test shortly before go-live. Once the portal is handed over to operations, she says, security will be the concern of the operations unit only. The Local Information Security Officer (LISO) disagrees.<\/p><p>According to the PM² Guide's IT security considerations, which statement is correct?<\/p>","stem_text":"A Directorate-General starts a project to build an online portal where citizens upload supporting documents. In the Initiating Phase, the Project Manager drafts the Project Charter. To save time, she proposes to leave IT security out of the early project documents and to deal with it in the Executing Phase, by commissioning a penetration test shortly before go-live. Once the portal is handed over to operations, she says, security will be the concern of the operations unit only. The Local Information Security Officer (LISO) disagrees. According to the PM² Guide's IT security considerations, which statement is correct?","options":{"A":"Security should be addressed from the Planning Phase, when the Project Handbook and management plans are drafted","B":"The approach is acceptable, provided that the penetration test is completed and passed before go-live","C":"Security risk management should start at the outset, in conceptualisation and initiation, and stop once the project is formally closed","D":"Security risk management should start at the outset, in conceptualisation and initiation, and continue throughout the solution's lifecycle"},"answer":"D","why_right_html":"<p>\"A security-oriented risk management approach starts in the conceptualisation of digital solutions, and subsequently in the Initiating Phase\", continues until the project closes, \"but also continues throughout the entire lifecycle of the produced digital solutions\". So \"IT security considerations should be integrated from the outset into the project priorities and workplan\" (PM² 3.1 App. D.2.3, p. A-111).<\/p><ul><li>Tip: the LISO \"consults and advises on security issues\" and can sit on the Project Steering Committee (PM² 3.1 §4.4, p. 25). Raising the objection is within that role.<\/li><\/ul>","why_wrong":{"A":"A: the Planning Phase is too late. PM² places the start at conceptualisation and the Initiating Phase.","B":"B: a single test before go-live is not a risk management approach that starts at the outset. This is exactly what the PM proposes and what PM² rules out.","C":"C: PM² says security risk management continues after the project, for the whole lifecycle of the solution."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"A security-oriented risk management approach starts in the conceptualisation of digital solutions, and subsequently in the Initiating Phase\", continues until the project closes, \"but also continues throughout the entire lifecycle of the produced digital solutions\". So \"IT security considerations should be integrated from the outset into the project priorities and workplan\" (PM² 3.1 App. D.2.3, p. A-111).<\/p><ul><li>A: the Planning Phase is too late. PM² places the start at conceptualisation and the Initiating Phase.<\/li><li>B: a single test before go-live is not a risk management approach that starts at the outset. This is exactly what the PM proposes and what PM² rules out.<\/li><li>C: PM² says security risk management continues after the project, for the whole lifecycle of the solution.<\/li><li>Tip: the LISO \"consults and advises on security issues\" and can sit on the Project Steering Committee (PM² 3.1 §4.4, p. 25). Raising the objection is within that role.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-86","id":86,"topic":86,"type":"scenario","word_count":92,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: security in projects","stem_html":"<p>An EU agency is developing a small internal tool for booking meeting rooms. The total project budget is EUR 150 000. The tool holds no sensitive data, and a security risk assessment rates all identified risks as low. An external security consultant now proposes additional measures costing EUR 200 000, arguing that they would remove every remaining security risk before go-live. The Project Owner asks the Project Manager whether the PM² approach to IT security supports this proposal.<\/p><p>Based on the PM² Guide's IT security considerations, what is the MOST appropriate answer?<\/p>","stem_text":"An EU agency is developing a small internal tool for booking meeting rooms. The total project budget is EUR 150 000. The tool holds no sensitive data, and a security risk assessment rates all identified risks as low. An external security consultant now proposes additional measures costing EUR 200 000, arguing that they would remove every remaining security risk before go-live. The Project Owner asks the Project Manager whether the PM² approach to IT security supports this proposal. Based on the PM² Guide's IT security considerations, what is the MOST appropriate answer?","options":{"A":"No: the aim is an acceptable risk level, at a management cost that does not outweigh the benefits","B":"Yes: PM² requires every identified security risk to be removed before a digital solution goes live","C":"Yes: low risks can only be accepted after an internal security audit has confirmed the tool is safe","D":"No: the security risks of internal tools are owned by the LISO, so the Project Owner cannot decide"},"answer":"A","why_right_html":"<p>PM² says the primary objective of IT security management is to reduce the likelihood and impact of risks, \"maintaining them at an acceptable level while ensuring that the cost of their management do not outweigh benefits\" (PM² 3.1 App. D.2.3, p. A-111; the guide's own grammar). Spending EUR 200 000 to remove low risks from a EUR 150 000 tool with no sensitive data does not meet that test.<\/p>","why_wrong":{"B":"B: PM² does not require all risks to be removed. It aims at an acceptable level.","C":"C: internal security audits are one tier of the \"three-tiered model, comprising risk management, compliance reviews, and internal security audits\" (App. D.2.3, p. A-111). PM² does not make an audit a precondition for accepting low risks.","D":"D: the LISO \"consults and advises on security issues\" (PM² 3.1 §4.4, p. 25). It does not own the project's risks."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>PM² says the primary objective of IT security management is to reduce the likelihood and impact of risks, \"maintaining them at an acceptable level while ensuring that the cost of their management do not outweigh benefits\" (PM² 3.1 App. D.2.3, p. A-111; the guide's own grammar). Spending EUR 200 000 to remove low risks from a EUR 150 000 tool with no sensitive data does not meet that test.<\/p><ul><li>B: PM² does not require all risks to be removed. It aims at an acceptable level.<\/li><li>C: internal security audits are one tier of the \"three-tiered model, comprising risk management, compliance reviews, and internal security audits\" (App. D.2.3, p. A-111). PM² does not make an audit a precondition for accepting low risks.<\/li><li>D: the LISO \"consults and advises on security issues\" (PM² 3.1 §4.4, p. 25). It does not own the project's risks.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-87","id":87,"topic":87,"type":"long","word_count":162,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"<p>An EU agency runs a grant-management platform for external applicants. On 3 March 2026 at 09:00, its security team becomes aware of ransomware on the platform's servers. The platform is unavailable for two days. The local cybersecurity officer classifies the incident as significant, because it has caused severe operational disruption to the agency's work. The incident is fully handled by 12 March.<\/p><p>The agency's submissions so far:<\/p><ul><li>3 March, 17:00: early warning sent to CERT-EU<\/li><li>5 March, 10:00: incident notification sent to CERT-EU, with an initial assessment of severity and impact and the indicators of compromise<\/li><li>CERT-EU has not requested any intermediate report<\/li><\/ul><p>The Head of IT asks the project manager responsible for the platform to prepare the next document for CERT-EU. The project manager wants to know the deadline and what the document must contain, so that the contractor who maintains the platform can provide the technical input in time.<\/p><p>Under Regulation (EU, Euratom) 2023/2841, what must the agency submit next?<\/p>","stem_text":"An EU agency runs a grant-management platform for external applicants. On 3 March 2026 at 09:00, its security team becomes aware of ransomware on the platform's servers. The platform is unavailable for two days. The local cybersecurity officer classifies the incident as significant, because it has caused severe operational disruption to the agency's work. The incident is fully handled by 12 March. The agency's submissions so far: 3 March, 17:00: early warning sent to CERT-EU 5 March, 10:00: incident notification sent to CERT-EU, with an initial assessment of severity and impact and the indicators of compromise CERT-EU has not requested any intermediate report The Head of IT asks the project manager responsible for the platform to prepare the next document for CERT-EU. The project manager wants to know the deadline and what the document must contain, so that the contractor who maintains the platform can provide the technical input in time. Under Regulation (EU, Euratom) 2023/2841, what must the agency submit next?","options":{"A":"A final report by 3 April 2026, one month after the agency became aware of the significant incident","B":"An intermediate report by 19 March 2026, because status updates are due every two weeks","C":"A final report by 8 March 2026, within 72 hours of the submission of the incident notification","D":"A final report by 5 April 2026, with the likely root cause and the mitigation measures applied"},"answer":"D","why_right_html":"<p>The final report is due \"not later than one month after the submission of the incident notification under point (b)\" (Reg 2023/2841 Art. 21(2)(d)). The notification was sent on 5 March, so the deadline is 5 April 2026. The report must include, among other things, \"the type of threat or root cause that is likely to have triggered the incident\" and \"applied and ongoing mitigation measures\" (Art. 21(2)(d)(ii) and (iii)). The incident counts as significant because it caused \"severe operational disruption\" (Art. 21(1)(a)), and the first two deadlines were met: 8 hours for the early warning (limit 24 hours, Art. 21(2)(a)) and 49 hours for the notification (limit 72 hours, Art. 21(2)(b)).<\/p><ul><li>Tip: this is your EUFTE source document. Learn the chain in Art. 21(2): 24 h early warning, 72 h notification, intermediate report on request, final report one month after the notification.<\/li><\/ul>","why_wrong":{"A":"A: the one month runs from the incident notification, not from the moment of awareness. Only the 24-hour and 72-hour deadlines run from awareness.","B":"B: an intermediate report is due only \"upon the request of CERT-EU\" (Art. 21(2)(c)). There is no two-week rule, and CERT-EU has not asked.","C":"C: 72 hours is the limit for the incident notification, counted from awareness (Art. 21(2)(b)). It is not the deadline for the final report."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>The final report is due \"not later than one month after the submission of the incident notification under point (b)\" (Reg 2023/2841 Art. 21(2)(d)). The notification was sent on 5 March, so the deadline is 5 April 2026. The report must include, among other things, \"the type of threat or root cause that is likely to have triggered the incident\" and \"applied and ongoing mitigation measures\" (Art. 21(2)(d)(ii) and (iii)). The incident counts as significant because it caused \"severe operational disruption\" (Art. 21(1)(a)), and the first two deadlines were met: 8 hours for the early warning (limit 24 hours, Art. 21(2)(a)) and 49 hours for the notification (limit 72 hours, Art. 21(2)(b)).<\/p><ul><li>A: the one month runs from the incident notification, not from the moment of awareness. Only the 24-hour and 72-hour deadlines run from awareness.<\/li><li>B: an intermediate report is due only \"upon the request of CERT-EU\" (Art. 21(2)(c)). There is no two-week rule, and CERT-EU has not asked.<\/li><li>C: 72 hours is the limit for the incident notification, counted from awareness (Art. 21(2)(b)). It is not the deadline for the final report.<\/li><li>Tip: this is your EUFTE source document. Learn the chain in Art. 21(2): 24 h early warning, 72 h notification, intermediate report on request, final report one month after the notification.<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"bank":"v2","key":"v2-88","id":88,"topic":88,"type":"scenario","word_count":88,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"<p>Unit B.3 of an EU agency is preparing the tender specifications for a managed service: an external provider will run and monitor the agency's document-management servers in the provider's own data centre. The draft contract, copied from an older template, contains a confidentiality clause that forbids the provider to share any information about incidents or vulnerabilities with third parties, including EU bodies. The agency's local cybersecurity officer asks the project manager to bring the draft in line with Regulation (EU, Euratom) 2023/2841.<\/p><p>Which change BEST reflects the Regulation?<\/p>","stem_text":"Unit B.3 of an EU agency is preparing the tender specifications for a managed service: an external provider will run and monitor the agency's document-management servers in the provider's own data centre. The draft contract, copied from an older template, contains a confidentiality clause that forbids the provider to share any information about incidents or vulnerabilities with third parties, including EU bodies. The agency's local cybersecurity officer asks the project manager to bring the draft in line with Regulation (EU, Euratom) 2023/2841. Which change BEST reflects the Regulation?","options":{"A":"Transfer to the provider the agency's duty to send early warnings on significant incidents to CERT-EU","B":"Appoint the provider as the agency's local cybersecurity officer for the servers that it operates","C":"Keep the clause, because the Regulation does not cover assets and services that are outsourced to third parties","D":"Remove the barrier to sharing with CERT-EU and oblige the provider to report incidents and vulnerabilities"},"answer":"D","why_right_html":"<p>Under Art. 8(3)(k), Union entities must enhance their procurement rules through \"the removal of contractual barriers that limit information sharing from ICT service providers about incidents, vulnerabilities and cyber threats with CERT-EU\" and \"contractual obligations to report incidents, vulnerabilities and cyber threats\" (Reg 2023/2841 Art. 8(3)(k)(i) and (ii)). The old clause is exactly such a barrier.<\/p>","why_wrong":{"A":"A: the reporting duty in Art. 21(2) lies with the entity: \"Union entities shall submit to CERT-EU\". A contract cannot transfer that legal duty to a provider.","B":"B: each Union entity appoints its own local cybersecurity officer as its \"single point of contact regarding all aspects of cybersecurity\". Some of the officer's tasks may be delegated only to CERT-EU or shared by several Union entities, not given to a private provider (Art. 6(8)).","C":"C: the Framework covers the whole ICT environment, including \"outsourced assets and services in cloud computing environments or hosted by third parties\" (Art. 6(2))."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Under Art. 8(3)(k), Union entities must enhance their procurement rules through \"the removal of contractual barriers that limit information sharing from ICT service providers about incidents, vulnerabilities and cyber threats with CERT-EU\" and \"contractual obligations to report incidents, vulnerabilities and cyber threats\" (Reg 2023/2841 Art. 8(3)(k)(i) and (ii)). The old clause is exactly such a barrier.<\/p><ul><li>A: the reporting duty in Art. 21(2) lies with the entity: \"Union entities shall submit to CERT-EU\". A contract cannot transfer that legal duty to a provider.<\/li><li>B: each Union entity appoints its own local cybersecurity officer as its \"single point of contact regarding all aspects of cybersecurity\". Some of the officer's tasks may be delegated only to CERT-EU or shared by several Union entities, not given to a private provider (Art. 6(8)).<\/li><li>C: the Framework covers the whole ICT environment, including \"outsourced assets and s
