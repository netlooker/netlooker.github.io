 iteration is not an option: \"In PM²-Agile all iterations are timeboxed and with the same duration\" (§4.8, p.35).<\/p><ul><li>A: a high Must have share removes the contingency that MoSCoW is meant to give, and extending the iteration breaks the fixed timebox (§4.5, §4.8).<\/li><li>B: PM²-Agile plans releases with relative estimates in points and velocity (§4.5, p.32; §7.2.2.2, p.78).<\/li><li>C: this reverses the priority. The Must haves are the agreed \"'minimum usable subset' or 'minimum viable product'\" (§4.5, p.33).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-52","id":52,"topic":52,"type":"scenario","word_count":113,"batch":2,"duty":2,"duties":[2],"section":"Duty 2: estimation, scheduling and acquisition","stem_html":"<p>Unit A.4 of an EU institution plans to buy IT helpdesk services. The draft contract has the following terms:<\/p><ul><li>an initial duration of two years, at an estimated EUR 120 000 per year<\/li><li>a possible renewal twice, for one year each time, at the same yearly price<\/li><li>an option to add a chatbot module later, estimated at EUR 40 000<\/li><\/ul><p>The procurement officer must now estimate the value of the contract, in order to decide on the publicity measures and the procurement procedure. A colleague suggests using only the first two years, because the renewals and the option may never be used.<\/p><p>According to the Financial Regulation, which estimated value must be used?<\/p>","stem_text":"Unit A.4 of an EU institution plans to buy IT helpdesk services. The draft contract has the following terms: an initial duration of two years, at an estimated EUR 120 000 per year a possible renewal twice, for one year each time, at the same yearly price an option to add a chatbot module later, estimated at EUR 40 000 The procurement officer must now estimate the value of the contract, in order to decide on the publicity measures and the procurement procedure. A colleague suggests using only the first two years, because the renewals and the option may never be used. According to the Financial Regulation, which estimated value must be used?","options":{"A":"EUR 520 000, covering the initial period, both renewals and the option","B":"EUR 240 000, covering only the initial two years, which are certain to be used","C":"EUR 480 000, covering the initial period and both renewals, but not the option","D":"EUR 120 000, covering one year, as contracts are budgeted per financial year"},"answer":"A","why_right_html":"<p>The value is estimated \"based on the total amount payable, including any form of options and any renewal\" (FR Annex I point 35.1). Initial period 2 × 120 000 = 240 000; renewals 2 × 120 000 = 240 000; option 40 000. Total = 240 000 + 240 000 + 40 000 = <strong>EUR 520 000<\/strong>. Leaving out the renewals or the option to stay under a threshold would also breach FR Art. 163(2): the estimated value \"shall not be determined with a view to circumventing the applicable rules\".<\/p>","why_wrong":{"B":"B: this leaves out both renewals and the option, which point 35.1 requires to be included.","C":"C: this includes the renewals but leaves out the option, which is also part of the total amount payable (point 35.1).","D":"D: point 35.5, which mentions the financial year, applies to successive contracts of the same type awarded regularly, not to the renewals and options of a single contract. For one contract, point 35.1 uses the total amount payable, renewals and options included."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>The value is estimated \"based on the total amount payable, including any form of options and any renewal\" (FR Annex I point 35.1). Initial period 2 × 120 000 = 240 000; renewals 2 × 120 000 = 240 000; option 40 000. Total = 240 000 + 240 000 + 40 000 = <strong>EUR 520 000<\/strong>. Leaving out the renewals or the option to stay under a threshold would also breach FR Art. 163(2): the estimated value \"shall not be determined with a view to circumventing the applicable rules\".<\/p><ul><li>B: this leaves out both renewals and the option, which point 35.1 requires to be included.<\/li><li>C: this includes the renewals but leaves out the option, which is also part of the total amount payable (point 35.1).<\/li><li>D: point 35.5, which mentions the financial year, applies to successive contracts of the same type awarded regularly, not to the renewals and options of a single contract. For one contract, point 35.1 uses the total amount payable, renewals and options included.<\/li><\/ul>","knowledge_based":false,"frameworks":["FR"]},{"bank":"v2","key":"v2-53","id":53,"topic":53,"type":"scenario","word_count":95,"batch":2,"duty":4,"duties":[4],"section":"Duty 4: leading the team","stem_html":"<p>Unit D.1 of a Directorate-General has started to use PM²-Agile in a PM² project. The Project Manager, Karl, has many years of experience with classic PM² projects. Every morning he still assigns tasks to each developer, and every evening he checks that each task is done. The Team Coordinator tells him that the developers feel they are not trusted, and that the team's own planning from Iteration Planning is being overruled. Karl replies that PM² makes the Project Manager responsible for the efficient use of resources.<\/p><p>According to the PM²-Agile Guide, what should Karl do?<\/p>","stem_text":"Unit D.1 of a Directorate-General has started to use PM²-Agile in a PM² project. The Project Manager, Karl, has many years of experience with classic PM² projects. Every morning he still assigns tasks to each developer, and every evening he checks that each task is done. The Team Coordinator tells him that the developers feel they are not trusted, and that the team's own planning from Iteration Planning is being overruled. Karl replies that PM² makes the Project Manager responsible for the efficient use of resources. According to the PM²-Agile Guide, what should Karl do?","options":{"A":"Continue assigning and checking tasks, because PM² keeps the Project Manager responsible for the efficient use of resources.","B":"Ask the Product Owner to assign the daily tasks instead, since the Product Owner prioritises the Work Items List.","C":"Let the team manage its own work, and focus on the problems and impediments it raises through the Team Coordinator.","D":"Take over the facilitation of Iteration Planning, so that his task assignments are agreed with the team in advance."},"answer":"C","why_right_html":"<p>\"The Agile principles of self-organising team and decentralised decision-making hold the Agile Project Core Team (A-PCT) responsible for managing its work... This approach allows the Project Manager (PM) to focus on the problems and impediments identified by the Agile Project Core Team (A-PCT) via the Team Coordinator (TeCo)\" (PM²-Agile 3.0.1 §6.5.1, p.65).<\/p>","why_wrong":{"A":"A: this is the classic PM² rule that the same section says changes when PM²-Agile is introduced. Karl's argument quotes the old rule (§6.5.1, p.65).","B":"B: the Product Owner \"Continuously prioritises the Work Items List (WIL)\" (§6.3.2, p.63) but does not assign tasks. The Agile Team Member \"Decides the best way to do the work in each iteration\" (§6.3.4, p.64).","D":"D: the TeCo facilitates the ceremonies, and the PM \"participates in these ceremonies as a regular Agile Team Member (ATeM)\" (§6.5.1, p.65)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"The Agile principles of self-organising team and decentralised decision-making hold the Agile Project Core Team (A-PCT) responsible for managing its work... This approach allows the Project Manager (PM) to focus on the problems and impediments identified by the Agile Project Core Team (A-PCT) via the Team Coordinator (TeCo)\" (PM²-Agile 3.0.1 §6.5.1, p.65).<\/p><ul><li>A: this is the classic PM² rule that the same section says changes when PM²-Agile is introduced. Karl's argument quotes the old rule (§6.5.1, p.65).<\/li><li>B: the Product Owner \"Continuously prioritises the Work Items List (WIL)\" (§6.3.2, p.63) but does not assign tasks. The Agile Team Member \"Decides the best way to do the work in each iteration\" (§6.3.4, p.64).<\/li><li>D: the TeCo facilitates the ceremonies, and the PM \"participates in these ceremonies as a regular Agile Team Member (ATeM)\" (§6.5.1, p.65).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-54","id":54,"topic":54,"type":"long","word_count":154,"batch":2,"duty":5,"duties":[5],"section":"Duty 5: stakeholders and communication","stem_html":"<p>A Directorate-General runs a PM² project to replace its contract management system. At the last Project Steering Committee (PSC) meeting, a change to the schedule was approved, and the Project Work Plan was updated. Three weeks later, the Project Manager, Sofia, receives several complaints:<\/p><ul><li>two developers in the Project Core Team kept working to the old dates, because nobody told them about the approved change;<\/li><li>a unit in another Directorate-General knew about an upcoming legal change that affects the system, but did not tell the project team;<\/li><li>PSC members say the Project Status Report arrives at irregular intervals, although the Communications Management Plan sets a monthly cycle.<\/li><\/ul><p>Sofia's Head of Unit suggests that, to avoid such problems in future, project information should be kept within the Project Core Team, and that the team should simply wait for the next Status Report to learn about changes.<\/p><p>Which response is MOST consistent with PM² Information Distribution?<\/p>","stem_text":"A Directorate-General runs a PM² project to replace its contract management system. At the last Project Steering Committee (PSC) meeting, a change to the schedule was approved, and the Project Work Plan was updated. Three weeks later, the Project Manager, Sofia, receives several complaints: two developers in the Project Core Team kept working to the old dates, because nobody told them about the approved change; a unit in another Directorate-General knew about an upcoming legal change that affects the system, but did not tell the project team; PSC members say the Project Status Report arrives at irregular intervals, although the Communications Management Plan sets a monthly cycle. Sofia's Head of Unit suggests that, to avoid such problems in future, project information should be kept within the Project Core Team, and that the team should simply wait for the next Status Report to learn about changes. Which response is MOST consistent with PM² Information Distribution?","options":{"A":"Tell the team and stakeholders about approved changes and Work Plan updates, keep stakeholders reporting external factors, and send reports monthly.","B":"Inform the team about changes only through the next Project Status Report, since reports are the formal channel for project information.","C":"Ask the PSC to take over information distribution, since it approved the change and is accountable for project communication.","D":"Limit information to the Project Core Team, since PM² restricts distribution to the people who carry out the project tasks."},"answer":"A","why_right_html":"<p>Information Distribution steps include \"Inform stakeholders about updates to the Project Work Plan\", \"Communicate any changes/updates to any key project documents and logs\" and \"Send out the Project Reports as per the Communications Management Plan\". The PM \"Ensures that the Project Core Team (PCT) has all the necessary information to carry out its tasks\". Other stakeholders are \"Kept informed about the project, and in turn keep the project team informed about external factors that might influence the project\" (PM² 3.1 §7.5, p.61). The Status Report is \"regularly submitted to the Project Steering Committee (PSC)... as per the Communications Management Plan\" (§7.4, p.60), here monthly.<\/p>","why_wrong":{"B":"B: information should be communicated \"to appropriate parties at the right time\" (§7.5, p.61). Waiting for the next report is how the two developers ended up working to old dates.","C":"C: in the RAM for Information Distribution, the PM is Responsible, the PO Accountable and the PSC only Informed (PM² 3.1 Fig 7.7, p.61).","D":"D: PM² keeps other stakeholders informed and expects them to inform the team (§7.5). Cutting them off would repeat the problem with the legal change."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>Information Distribution steps include \"Inform stakeholders about updates to the Project Work Plan\", \"Communicate any changes/updates to any key project documents and logs\" and \"Send out the Project Reports as per the Communications Management Plan\". The PM \"Ensures that the Project Core Team (PCT) has all the necessary information to carry out its tasks\". Other stakeholders are \"Kept informed about the project, and in turn keep the project team informed about external factors that might influence the project\" (PM² 3.1 §7.5, p.61). The Status Report is \"regularly submitted to the Project Steering Committee (PSC)... as per the Communications Management Plan\" (§7.4, p.60), here monthly.<\/p><ul><li>B: information should be communicated \"to appropriate parties at the right time\" (§7.5, p.61). Waiting for the next report is how the two developers ended up working to old dates.<\/li><li>C: in the RAM for Information Distribution, the PM is Responsible, the PO Accountable and the PSC only Informed (PM² 3.1 Fig 7.7, p.61).<\/li><li>D: PM² keeps other stakeholders informed and expects them to inform the team (§7.5). Cutting them off would repeat the problem with the legal change.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-55","id":55,"topic":55,"type":"scenario","word_count":98,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"<p>In a PM²-Agile project at an EU agency, the Product Owner must ask the Business Manager to approve every change to the order of the Work Items List. The Business Manager says this control is needed to keep the project in line with the business strategy. However, the Business Manager is often away at meetings, so decisions can take several days. During this time the Agile Team Members wait, and the last two iterations missed their goals. The Team Coordinator raises the problem at the Iteration Retrospective.<\/p><p>According to the PM²-Agile Guide, what is the MOST appropriate solution?<\/p>","stem_text":"In a PM²-Agile project at an EU agency, the Product Owner must ask the Business Manager to approve every change to the order of the Work Items List. The Business Manager says this control is needed to keep the project in line with the business strategy. However, the Business Manager is often away at meetings, so decisions can take several days. During this time the Agile Team Members wait, and the last two iterations missed their goals. The Team Coordinator raises the problem at the Iteration Retrospective. According to the PM²-Agile Guide, what is the MOST appropriate solution?","options":{"A":"The Team Coordinator should prioritise the Work Items List whenever the Business Manager is not available.","B":"The Project Manager should take over the prioritisation of the Work Items List, so that decisions are faster.","C":"The Business Manager should empower the Product Owner to take day-to-day decisions, while they stay aligned.","D":"The Business Manager should attend every Daily Stand-up, so that each priority change can be approved at once."},"answer":"C","why_right_html":"<p>The Product Owner must be \"empowered by the Business Manager (BM) to take the necessary day-to-day decisions that allow the development team to progress towards the final product without having to wait for specific decisions\". It must also be \"aligned with the Business Manager (BM) and the Business Implementation Group (BIG)\", which answers the BM's concern about strategy (PM²-Agile 3.0.1 §6.5.2, p.65).<\/p>","why_wrong":{"A":"A: the Team Coordinator \"acts as a facilitator and team coach\" (§6.3.1, p.62). Prioritising the Work Items List is the Product Owner's job (§6.3.2, p.63).","B":"B: the PM, together with the BM, \"may need to intervene when the expectations are not aligned\" or no consensus is reached (§6.5.1, p.65). The PM does not take over prioritisation.","D":"D: this keeps the BM as a bottleneck. The Daily Stand-up exists to keep the A-PCT \"aligned towards its iteration goal\" (§5.2, p.45), not to approve priorities."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The Product Owner must be \"empowered by the Business Manager (BM) to take the necessary day-to-day decisions that allow the development team to progress towards the final product without having to wait for specific decisions\". It must also be \"aligned with the Business Manager (BM) and the Business Implementation Group (BIG)\", which answers the BM's concern about strategy (PM²-Agile 3.0.1 §6.5.2, p.65).<\/p><ul><li>A: the Team Coordinator \"acts as a facilitator and team coach\" (§6.3.1, p.62). Prioritising the Work Items List is the Product Owner's job (§6.3.2, p.63).<\/li><li>B: the PM, together with the BM, \"may need to intervene when the expectations are not aligned\" or no consensus is reached (§6.5.1, p.65). The PM does not take over prioritisation.<\/li><li>D: this keeps the BM as a bottleneck. The Daily Stand-up exists to keep the A-PCT \"aligned towards its iteration goal\" (§5.2, p.45), not to approve priorities.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-56","id":56,"topic":56,"type":"scenario","word_count":101,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"<p>A small PM² project in an EU agency will replace an old leave-request application with a new one. The Project Handbook states that no separate Transition Plan is needed. The switchover is planned for Saturday. All acceptance tests have passed, and the Project Owner (PO) has said informally that she is satisfied, but she has not yet signed anything. The operations team asks what will happen if the new system fails on Monday morning, because no way back to the old system has been prepared.<\/p><p>According to the PM² Guide, what should the Project Manager ensure before the transition is complete?<\/p>","stem_text":"A small PM² project in an EU agency will replace an old leave-request application with a new one. The Project Handbook states that no separate Transition Plan is needed. The switchover is planned for Saturday. All acceptance tests have passed, and the Project Owner (PO) has said informally that she is satisfied, but she has not yet signed anything. The operations team asks what will happen if the new system fails on Monday morning, because no way back to the old system has been prepared. According to the PM² Guide, what should the Project Manager ensure before the transition is complete?","options":{"A":"That the operations team takes over the system on Saturday, and the PO formally accepts it at the Project-End Review Meeting.","B":"That the Business Manager first completes all post-project change activities, so that the users are fully ready.","C":"That the Project Steering Committee formally accepts the deliverables, as the PO's informal approval is not enough.","D":"That the PO provisionally accepts the deliverables, and that data backups and a rollback scenario are prepared."},"answer":"D","why_right_html":"<p>With no separate Transition Plan, the PM must, among other things, \"If applicable, ensure that data backups and rollback scenarios are prepared\". The PM must also \"Ensure that the Project Owner (PO) has provisionally accepted the deliverables before the transition is complete\" (PM² 3.1 §9.11, p.83). Informal satisfaction is not acceptance: the PM must also ensure \"the relevant acceptance document(s) are completed\" (step 5).<\/p>","why_wrong":{"A":"A: the PO's provisional acceptance must come before the transition is complete, not after it at the Project-End Review Meeting (§9.11, p.83).","B":"B: post-project change activities are \"the responsibility of the permanent organisation\" and are usually carried out after the project (§9.12, p.84). They are not a precondition for transition.","C":"C: in Manage Transition it is the PO who \"Provisionally accepts the product before the transition is complete\" (§9.11, p.83), not the Project Steering Committee."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>With no separate Transition Plan, the PM must, among other things, \"If applicable, ensure that data backups and rollback scenarios are prepared\". The PM must also \"Ensure that the Project Owner (PO) has provisionally accepted the deliverables before the transition is complete\" (PM² 3.1 §9.11, p.83). Informal satisfaction is not acceptance: the PM must also ensure \"the relevant acceptance document(s) are completed\" (step 5).<\/p><ul><li>A: the PO's provisional acceptance must come before the transition is complete, not after it at the Project-End Review Meeting (§9.11, p.83).<\/li><li>B: post-project change activities are \"the responsibility of the permanent organisation\" and are usually carried out after the project (§9.12, p.84). They are not a precondition for transition.<\/li><li>C: in Manage Transition it is the PO who \"Provisionally accepts the product before the transition is complete\" (§9.11, p.83), not the Project Steering Committee.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-57","id":57,"topic":57,"type":"long","word_count":156,"batch":2,"duty":6,"duties":[6],"section":"Duty 6: bridging business and IT","stem_html":"<p>An EU institution runs a PM² project to introduce a new electronic signature tool in five Directorates-General. The Business Manager (BM) has drafted the Business Implementation Plan. It includes:<\/p><ul><li>training for about 400 staff, planned within the project's timeframe and budget;<\/li><li>a redesign of the approval workflows in three units, also within the project;<\/li><li>further changes to working practices in the other units, expected to continue for about 18 months after the project ends.<\/li><\/ul><p>At a planning meeting, several views are expressed. The Project Manager (PM) is unsure who should manage the business implementation activities, and how the activities planned after the project ends should be handled. The Head of one unit suggests that the project should stay open until all the changes are complete. A member of the Business Implementation Group (BIG) says that the BIG should approve the plan, since it knows the users best.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"An EU institution runs a PM² project to introduce a new electronic signature tool in five Directorates-General. The Business Manager (BM) has drafted the Business Implementation Plan. It includes: training for about 400 staff, planned within the project's timeframe and budget; a redesign of the approval workflows in three units, also within the project; further changes to working practices in the other units, expected to continue for about 18 months after the project ends. At a planning meeting, several views are expressed. The Project Manager (PM) is unsure who should manage the business implementation activities, and how the activities planned after the project ends should be handled. The Head of one unit suggests that the project should stay open until all the changes are complete. A member of the Business Implementation Group (BIG) says that the BIG should approve the plan, since it knows the users best. Which statement is correct according to the PM² Guide?","options":{"A":"The PM manages the business implementation activities, because they are part of the Project Work Plan that the PM maintains.","B":"The project should stay open until the 18 months of changes are finished, so that all of the expected benefits are delivered.","C":"The BM manages the activities within the project, the PM adds them to the Work Plan, and later changes fall to the permanent organisation.","D":"The BIG approves the Business Implementation Plan, because it is consulted during the impact analysis and knows the users best."},"answer":"C","why_right_html":"<p>In Manage Business Implementation the BM \"Manages the business implementation activities\", and the PM \"Assists the Business Manager (BM)... Updates the Project Work Plan\". For the later changes: \"The implementation of these activities is the responsibility of the permanent organisation and they are usually carried out as part of ongoing operations or future projects\" (PM² 3.1 §9.12, p.84). The Business Implementation Plan also asks to identify such activities \"to be carried out by the organisation after the project ends, possibly as future/follow-up projects\" (§6.8, step 7, p.52).<\/p>","why_wrong":{"A":"A: the PM only supports (S in the RAM); the BM is Responsible for Manage Business Implementation (§9.12, p.84).","B":"B: activities after the project ends belong to the permanent organisation (§9.12). They do not keep the project open.","D":"D: the BIG is \"Consulted during the impact analysis\" and the PO \"Reviews and approves the Business Implementation Plan\" (§6.8, p.52)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>In Manage Business Implementation the BM \"Manages the business implementation activities\", and the PM \"Assists the Business Manager (BM)... Updates the Project Work Plan\". For the later changes: \"The implementation of these activities is the responsibility of the permanent organisation and they are usually carried out as part of ongoing operations or future projects\" (PM² 3.1 §9.12, p.84). The Business Implementation Plan also asks to identify such activities \"to be carried out by the organisation after the project ends, possibly as future/follow-up projects\" (§6.8, step 7, p.52).<\/p><ul><li>A: the PM only supports (S in the RAM); the BM is Responsible for Manage Business Implementation (§9.12, p.84).<\/li><li>B: activities after the project ends belong to the permanent organisation (§9.12). They do not keep the project open.<\/li><li>D: the BIG is \"Consulted during the impact analysis\" and the PO \"Reviews and approves the Business Implementation Plan\" (§6.8, p.52).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-58","id":58,"topic":58,"type":"scenario","word_count":97,"batch":2,"duty":7,"duties":[7],"section":"Duty 7: horizontal initiatives and portfolios","stem_html":"<p>An EU agency applies PM²-PfM and has three portfolios. In its ICT portfolio, a project to build a document-tracking tool has missed its last three milestones. In addition, a new corporate tool now covers most of the project's scope, so the conditions under which the project was initiated no longer apply. The Portfolio Manager has analysed the component data and wants to stop the project. The Portfolio Manager also chairs the Portfolio Steering Committee (PfSC) and has the final decision power within its remit.<\/p><p>According to PM²-PfM, how should the early termination of this project be handled?<\/p>","stem_text":"An EU agency applies PM²-PfM and has three portfolios. In its ICT portfolio, a project to build a document-tracking tool has missed its last three milestones. In addition, a new corporate tool now covers most of the project's scope, so the conditions under which the project was initiated no longer apply. The Portfolio Manager has analysed the component data and wants to stop the project. The Portfolio Manager also chairs the Portfolio Steering Committee (PfSC) and has the final decision power within its remit. According to PM²-PfM, how should the early termination of this project be handled?","options":{"A":"The Portfolio Manager stops the project at once, using the final decision power that the chair of the PfSC holds within its remit.","B":"The project's own Project Steering Committee decides on termination, and the PfSC is informed afterwards.","C":"The PfSC recommends the termination to the Portfolio Directing Group, which decides via the portfolio composition process.","D":"The Portfolio Support Office deactivates the project in the Portfolio Repository, since it maintains that repository."},"answer":"C","why_right_html":"<p>Early termination changes the composition of the portfolio, and only the Portfolio Directing Group decides on that. One PfSC duty is to \"Recommend components for early termination to the Portfolio Directing Group (PfDG)\" (PfM 1.5 §4.2, p.15). Changes such as \"eliminating projects due to early termination\" \"should be addressed via the portfolio composition process\" (§7.3, p.31), in which the PfDG \"decides about each candidate component\", up to deactivation (§6.5, p.27). The Portfolio Manager's part is to propose termination when components \"consistently perform poorly\" or their initial conditions \"no longer apply\" (§7.1, p.30).<\/p>","why_wrong":{"A":"A: the chair's final decision power applies only \"within the remit of the\" PfSC (§4.2, p.15), and approving portfolio composition is a PfDG decision (§4.1, p.14).","B":"B: a Project Steering Committee governs one project. Removing a component from the portfolio is decided at portfolio level, not by the project's own committee.","D":"D: the PfSO maintains the Portfolio Repository (§4.4, p.16), but it removes \"the deactivated/terminated ones\" only after the PfDG has decided (§6.5, p.27). The PfSO supports; it does not decide."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Early termination changes the composition of the portfolio, and only the Portfolio Directing Group decides on that. One PfSC duty is to \"Recommend components for early termination to the Portfolio Directing Group (PfDG)\" (PfM 1.5 §4.2, p.15). Changes such as \"eliminating projects due to early termination\" \"should be addressed via the portfolio composition process\" (§7.3, p.31), in which the PfDG \"decides about each candidate component\", up to deactivation (§6.5, p.27). The Portfolio Manager's part is to propose termination when components \"consistently perform poorly\" or their initial conditions \"no longer apply\" (§7.1, p.30).<\/p><ul><li>A: the chair's final decision power applies only \"within the remit of the\" PfSC (§4.2, p.15), and approving portfolio composition is a PfDG decision (§4.1, p.14).<\/li><li>B: a Project Steering Committee governs one project. Removing a component from the portfolio is decided at portfolio level, not by the project's own committee.<\/li><li>D: the PfSO maintains the Portfolio Repository (§4.4, p.16), but it removes \"the deactivated/terminated ones\" only after the PfDG has decided (§6.5, p.27). The PfSO supports; it does not decide.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-59","id":59,"topic":59,"type":"scenario","word_count":93,"batch":2,"duty":7,"duties":[7],"section":"Duty 7: horizontal initiatives and portfolios","stem_html":"<p>The Portfolio Manager of a Directorate-General's ICT portfolio is preparing the prioritised list of candidate components for next year. The evaluation has produced these weighted total scores:<\/p><ul><li>Candidate 1, a new e-recruitment module: 82<\/li><li>Candidate 2, a data warehouse upgrade: 76<\/li><li>Candidate 3, the adaptation of a payment system to a new legal requirement that applies from 1 July: 64<\/li><\/ul><p>Candidate 1 cannot go live before Candidate 3 is delivered, because it reuses the adapted payment interface. The available funds cover only two candidates.<\/p><p>What should the Portfolio Manager do according to PM²-PfM?<\/p>","stem_text":"The Portfolio Manager of a Directorate-General's ICT portfolio is preparing the prioritised list of candidate components for next year. The evaluation has produced these weighted total scores: Candidate 1, a new e-recruitment module: 82 Candidate 2, a data warehouse upgrade: 76 Candidate 3, the adaptation of a payment system to a new legal requirement that applies from 1 July: 64 Candidate 1 cannot go live before Candidate 3 is delivered, because it reuses the adapted payment interface. The available funds cover only two candidates. What should the Portfolio Manager do according to PM²-PfM?","options":{"A":"Keep the preliminary ranking and propose Candidates 1 and 2, since the weighted scores already reflect all relevant criteria.","B":"Use the scores as a preliminary ranking, then refine it to take account of the legal deadline and the dependency.","C":"Ask the Portfolio Directing Group to change the criterion weights so that Candidate 3 obtains the highest score.","D":"Send Candidates 1 and 3 straight to the Portfolio Directing Group, without first discussing them with the PfSC."},"answer":"B","why_right_html":"<p>PM²-PfM ranks candidates in two steps. First, apply \"a preliminary ranking based on this weighted total\". Then \"Adjust the preliminary ranking by considering other elements in the evaluation summary, like hard deadlines, dependencies, opportunities, synergies\" (PfM 1.5 §6.4, p.26). Candidate 3 has a legal deadline, and Candidate 1 depends on it, so refining the ranking is required.<\/p><ul><li>Tip: a high score is only the starting point. Look in the stem for deadlines and dependencies that change the order.<\/li><\/ul>","why_wrong":{"A":"A: stopping at the preliminary ranking skips the \"Refine prioritisation\" step. It would also fund Candidate 1, which cannot go live without Candidate 3.","C":"C: the scores use \"pre-defined weights\" (§6.4, p.26). Changing the weights to get a wanted result is not what the guide describes; the ranking is adjusted instead.","D":"D: \"The Portfolio Manager (PfM) discusses the proposal with the Portfolio Steering Committee (PfSC) before the Portfolio Directing Group (PfDG) is requested to approve it\" (§6.4, p.26)."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>PM²-PfM ranks candidates in two steps. First, apply \"a preliminary ranking based on this weighted total\". Then \"Adjust the preliminary ranking by considering other elements in the evaluation summary, like hard deadlines, dependencies, opportunities, synergies\" (PfM 1.5 §6.4, p.26). Candidate 3 has a legal deadline, and Candidate 1 depends on it, so refining the ranking is required.<\/p><ul><li>A: stopping at the preliminary ranking skips the \"Refine prioritisation\" step. It would also fund Candidate 1, which cannot go live without Candidate 3.<\/li><li>C: the scores use \"pre-defined weights\" (§6.4, p.26). Changing the weights to get a wanted result is not what the guide describes; the ranking is adjusted instead.<\/li><li>D: \"The Portfolio Manager (PfM) discusses the proposal with the Portfolio Steering Committee (PfSC) before the Portfolio Directing Group (PfDG) is requested to approve it\" (§6.4, p.26).<\/li><li>Tip: a high score is only the starting point. Look in the stem for deadlines and dependencies that change the order.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-60","id":60,"topic":60,"type":"long","word_count":173,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"<p>A Directorate-General runs four ICT projects. Each was started separately during the last 18 months:<\/p><ul><li>P1 builds a new online application form for a funding programme.<\/li><li>P2 builds the back-office case-management system that will process those applications.<\/li><li>P3 moves the staff intranet to a new content platform.<\/li><li>P4 replaces the video-conferencing equipment in the meeting rooms.<\/li><\/ul><p>All four projects draw on the same pool of developers and testers and use the same cloud platform. The Director-General has set a strategic benefit: halving the time needed to award a grant. Only P1 and P2 together can deliver this benefit; neither can deliver it alone, and P2 depends on the data model of P1. P3 and P4 have their own goals, which are not related to this benefit or to each other.<\/p><p>The Director-General asks the Head of Unit to set up a programme. The Head of Unit notes that P1 is already in its Executing Phase and P2 is in its Planning Phase.<\/p><p>Which approach is MOST consistent with the PM² Programme Management Guide?<\/p>","stem_text":"A Directorate-General runs four ICT projects. Each was started separately during the last 18 months: P1 builds a new online application form for a funding programme. P2 builds the back-office case-management system that will process those applications. P3 moves the staff intranet to a new content platform. P4 replaces the video-conferencing equipment in the meeting rooms. All four projects draw on the same pool of developers and testers and use the same cloud platform. The Director-General has set a strategic benefit: halving the time needed to award a grant. Only P1 and P2 together can deliver this benefit; neither can deliver it alone, and P2 depends on the data model of P1. P3 and P4 have their own goals, which are not related to this benefit or to each other. The Director-General asks the Head of Unit to set up a programme. The Head of Unit notes that P1 is already in its Executing Phase and P2 is in its Planning Phase. Which approach is MOST consistent with the PM² Programme Management Guide?","options":{"A":"Group all four projects in one programme, because they share the same resource pool and technology and need coordination.","B":"Group P1 and P2 in a programme and skip its Initiating and Planning Phases, because both projects have already started.","C":"Keep all four projects separate, because projects that are already running cannot be brought into a programme afterwards.","D":"Group P1 and P2 in an emergent programme with the full programme lifecycle, and manage P3 and P4 individually or in a portfolio."},"answer":"D","why_right_html":"<p>Two points decide this. (1) Only projects that share common goals and benefits belong in a programme. Projects that merely share a resource pool or technology \"should be either managed individually\" or put in a sector- or unit-level portfolio (PgM 1.0 §2.1, p.3); that is multi-project management (§2.2, p.3). (2) Grouping running projects creates an emergent programme, and \"the lifecycle of an emergent programme is identical to a top-down programme\" (§10.1, p.43).<\/p>","why_wrong":{"A":"A: sharing \"the same resource pool, using the same technology\" is not enough if projects \"do not share the same goals nor contribute to the delivery of common benefits\" (§2.1, p.3).","B":"B: the phases are not skipped: \"all programmes need a certain degree of initiation and planning\". They \"might be accelerated\", using existing project documents (§10.1, p.43).","C":"C: in an emergent programme, \"current and ongoing projects are assembled within a new programme structure retroactively\" (§10, p.43). The projects keep their current phase (§10.2, p.44)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Two points decide this. (1) Only projects that share common goals and benefits belong in a programme. Projects that merely share a resource pool or technology \"should be either managed individually\" or put in a sector- or unit-level portfolio (PgM 1.0 §2.1, p.3); that is multi-project management (§2.2, p.3). (2) Grouping running projects creates an emergent programme, and \"the lifecycle of an emergent programme is identical to a top-down programme\" (§10.1, p.43).<\/p><ul><li>A: sharing \"the same resource pool, using the same technology\" is not enough if projects \"do not share the same goals nor contribute to the delivery of common benefits\" (§2.1, p.3).<\/li><li>B: the phases are not skipped: \"all programmes need a certain degree of initiation and planning\". They \"might be accelerated\", using existing project documents (§10.1, p.43).<\/li><li>C: in an emergent programme, \"current and ongoing projects are assembled within a new programme structure retroactively\" (§10, p.43). The projects keep their current phase (§10.2, p.44).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-61","id":61,"topic":61,"type":"scenario","word_count":100,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"<p>A programme in an EU agency aims to cut the cost of processing each customs declaration by 30% by the end of next year. The Programme Business Manager (PgBM) collects the metrics agreed with the benefit owners and records the actual values in the Benefit Log. The latest figures show a reduction of only 8%, against 15% planned at this point. The main reason is that one project output, an automated risk-scoring module, is three months late. As a result, the outcome that the benefit depends on is not yet in place.<\/p><p>According to PM²-PgM, what should the PgBM do?<\/p>","stem_text":"A programme in an EU agency aims to cut the cost of processing each customs declaration by 30% by the end of next year. The Programme Business Manager (PgBM) collects the metrics agreed with the benefit owners and records the actual values in the Benefit Log. The latest figures show a reduction of only 8%, against 15% planned at this point. The main reason is that one project output, an automated risk-scoring module, is three months late. As a result, the outcome that the benefit depends on is not yet in place. According to PM²-PgM, what should the PgBM do?","options":{"A":"Hand the benefit over to the Programme Manager, who is responsible for the day-to-day management of the programme.","B":"Escalate the deviation straight to the Appropriate Governance Body, so that the AGB itself can decide on the corrective measures.","C":"Record the deviation and analyse it only in the Programme-End Report, when the benefits are formally reviewed.","D":"Take corrective measures, update the Programme Business Implementation Plan if needed and align it with the Programme Work Plan."},"answer":"D","why_right_html":"<p>Benefits delivery \"is the primary responsibility of the Programme Business Manager (PgBM)\" (PgM 1.0 §9.8, p.42). The steps are to \"Take corrective/preventive measures to maintain the benefit delivery schedule on track. Update the Programme Business Implementation Plan if necessary\", then to \"Collaborate with the Programme Manager (PgM) to keep the Programme Work Plan and the Programme Business Implementation Plan aligned\" (§9.8, steps 3–4, p.42). In the RASCI for this activity the PgBM is R and the PgM is S.<\/p>","why_wrong":{"A":"A: the PgM runs the programme day to day (§4.5, p.11) but only supports benefits delivery. The PgBM cannot hand the benefit over.","B":"B: the AGB \"Resolves issues that cannot be resolved on programme level\" (§4.1, p.10). Nothing shows that this deviation cannot be handled inside the programme.","C":"C: benefits \"must be tracked, reviewed and evaluated on a regular basis\" (§9.8, p.42). Waiting until the Programme-End Report is too late to act."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>Benefits delivery \"is the primary responsibility of the Programme Business Manager (PgBM)\" (PgM 1.0 §9.8, p.42). The steps are to \"Take corrective/preventive measures to maintain the benefit delivery schedule on track. Update the Programme Business Implementation Plan if necessary\", then to \"Collaborate with the Programme Manager (PgM) to keep the Programme Work Plan and the Programme Business Implementation Plan aligned\" (§9.8, steps 3–4, p.42). In the RASCI for this activity the PgBM is R and the PgM is S.<\/p><ul><li>A: the PgM runs the programme day to day (§4.5, p.11) but only supports benefits delivery. The PgBM cannot hand the benefit over.<\/li><li>B: the AGB \"Resolves issues that cannot be resolved on programme level\" (§4.1, p.10). Nothing shows that this deviation cannot be handled inside the programme.<\/li><li>C: benefits \"must be tracked, reviewed and evaluated on a regular basis\" (§9.8, p.42). Waiting until the Programme-End Report is too late to act.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-62","id":62,"topic":62,"type":"scenario","word_count":84,"batch":2,"duty":8,"duties":[8],"section":"Duty 8: benefits","stem_html":"<p>A three-year programme in a Directorate-General aims to raise the share of grant applications submitted fully online from 40% to 90%. All five projects of the programme have delivered their outputs and have been closed. Online submission has now reached 62%, and the Programme Charter gives the programme ten more months to reach the target. The Programme Manager proposes to close the programme now, because \"all the project work is finished\", and to release the programme team.<\/p><p>According to PM²-PgM, which statement is correct?<\/p>","stem_text":"A three-year programme in a Directorate-General aims to raise the share of grant applications submitted fully online from 40% to 90%. All five projects of the programme have delivered their outputs and have been closed. Online submission has now reached 62%, and the Programme Charter gives the programme ten more months to reach the target. The Programme Manager proposes to close the programme now, because \"all the project work is finished\", and to release the programme team. According to PM²-PgM, which statement is correct?","options":{"A":"The programme can close now, because a programme ends as soon as all its projects have delivered and closed.","B":"The Programme Manager can decide on closure alone, because day-to-day management of the programme is in their remit.","C":"Closing starts when benefits are reached or maximised within the Charter's timeframe, and the PgSC must approve it.","D":"The programme must close now and move the remaining benefit work to a new programme, which is required in this case."},"answer":"C","why_right_html":"<p>The Closing Phase \"starts when the benefits have been reached or have been maximised within the agreed timeframe, according to the Programme Charter\", and \"The decision to close the programme must be approved by the Program Steering Committee (PgSC)\" (PgM 1.0 §8, p.27). At 62% against 90%, with ten months left, the benefits are neither reached nor maximised.<\/p>","why_wrong":{"A":"A: this confuses outputs with benefits. A project delivers outputs, while a programme \"is more focused on operational outcomes and benefits\" (§2.1, p.3).","B":"B: the PgM handles the day-to-day management (§4.5, p.11), but the PgSC approves closure (§8, p.27).","D":"D: a follow-up is optional: the guide says to put residual activities into operations \"or optionally structure them in a new project\" (§8.2, p.29). Nothing makes a new programme mandatory."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>The Closing Phase \"starts when the benefits have been reached or have been maximised within the agreed timeframe, according to the Programme Charter\", and \"The decision to close the programme must be approved by the Program Steering Committee (PgSC)\" (PgM 1.0 §8, p.27). At 62% against 90%, with ten months left, the benefits are neither reached nor maximised.<\/p><ul><li>A: this confuses outputs with benefits. A project delivers outputs, while a programme \"is more focused on operational outcomes and benefits\" (§2.1, p.3).<\/li><li>B: the PgM handles the day-to-day management (§4.5, p.11), but the PgSC approves closure (§8, p.27).<\/li><li>D: a follow-up is optional: the guide says to put residual activities into operations \"or optionally structure them in a new project\" (§8.2, p.29). Nothing makes a new programme mandatory.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-63","id":63,"topic":63,"type":"long","word_count":165,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"<p>The Head of Unit C.2 in an EU agency wants to \"introduce PM²\" in her unit. At a unit meeting she presents three pieces of work planned for next year:<\/p><ul><li>Work A: the monthly installation of security patches on the agency's servers, done by the same operations team every month, with no end date.<\/li><li>Work B: a three-week clean-up of a contact database by two staff members.<\/li><li>Work C: a ten-month project to replace the agency's document-management system, with a budget that needs approval, external contractors, several user groups, a transition to the new system and internal audit requirements.<\/li><\/ul><p>Her plan is to download the PM² artefact templates and make them compulsory for all three pieces of work. She says: \"The templates are the methodology. Once every team fills them in, we are applying PM².\" A team leader replies that PM² also has a governance model, a lifecycle, a set of processes and the PM² Mindsets.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"The Head of Unit C.2 in an EU agency wants to \"introduce PM²\" in her unit. At a unit meeting she presents three pieces of work planned for next year: Work A: the monthly installation of security patches on the agency's servers, done by the same operations team every month, with no end date. Work B: a three-week clean-up of a contact database by two staff members. Work C: a ten-month project to replace the agency's document-management system, with a budget that needs approval, external contractors, several user groups, a transition to the new system and internal audit requirements. Her plan is to download the PM² artefact templates and make them compulsory for all three pieces of work. She says: \"The templates are the methodology. Once every team fills them in, we are applying PM².\" A team leader replies that PM² also has a governance model, a lifecycle, a set of processes and the PM² Mindsets. Which statement is correct according to the PM² Guide?","options":{"A":"All three should apply the full methodology, because PM² is designed for any work activity that runs within an organisation.","B":"Filling in the templates for all three is a full use of PM², because the artefacts are the core pillar of the methodology.","C":"Only Work C has the profile of a PM² project; the others can still use PM² practices, and templates are one pillar of four.","D":"Work A qualifies as a PM² project, because it recurs, needs documentation and can be subject to internal or external audits."},"answer":"C","why_right_html":"<p>\"Many PM² best practices can be applied to any type of project or work activity. However, to be able to apply the whole PM² Methodology, a project must have certain characteristics\" (PM² 3.1 §3.4, p.18). A PM² project \"is (above all) a project (i.e. not operations, not a work activity, not a programme, etc.)\" and \"has a duration of more than 4–5 weeks and involves more than 2–3 people\" (§3.4, p.18). Work A is operations, and Work B is too short and too small. Work C fits the profile. The artefacts are only the fourth of four pillars, next to governance, lifecycle and processes, and the Mindsets \"provide the glue\" (§3.1, p.13).<\/p>","why_wrong":{"A":"A: §3.4 limits the whole methodology to projects with these characteristics. Only the best practices apply to any work.","B":"B: the templates are \"a set of project Artefacts (i.e. documentation templates and guidelines)\", one pillar out of four (§3.1, p.13). Using them alone is not applying PM².","D":"D: recurring work with no end date is operations, which §3.4 excludes. Being open to audit is only one characteristic in the list."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>\"Many PM² best practices can be applied to any type of project or work activity. However, to be able to apply the whole PM² Methodology, a project must have certain characteristics\" (PM² 3.1 §3.4, p.18). A PM² project \"is (above all) a project (i.e. not operations, not a work activity, not a programme, etc.)\" and \"has a duration of more than 4–5 weeks and involves more than 2–3 people\" (§3.4, p.18). Work A is operations, and Work B is too short and too small. Work C fits the profile. The artefacts are only the fourth of four pillars, next to governance, lifecycle and processes, and the Mindsets \"provide the glue\" (§3.1, p.13).<\/p><ul><li>A: §3.4 limits the whole methodology to projects with these characteristics. Only the best practices apply to any work.<\/li><li>B: the templates are \"a set of project Artefacts (i.e. documentation templates and guidelines)\", one pillar out of four (§3.1, p.13). Using them alone is not applying PM².<\/li><li>D: recurring work with no end date is operations, which §3.4 excludes. Being open to audit is only one characteristic in the list.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-64","id":64,"topic":64,"type":"scenario","word_count":108,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"<p>A Directorate-General has tailored PM² at departmental level: it has merged two templates into one and adjusted some process steps to fit its own financial workflow. In one of its projects, the Project Manager now proposes two further changes, for this project only:<\/p><ul><li>Any change request above EUR 20 000 or two weeks of delay is escalated to the Project Steering Committee.<\/li><li>Risk tolerances are set according to the risk appetite of the key stakeholders.<\/li><\/ul><p>A colleague says this goes against PM², because the Directorate-General has already tailored the methodology and tailoring \"makes more sense at the organisation/departmental level\".<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"A Directorate-General has tailored PM² at departmental level: it has merged two templates into one and adjusted some process steps to fit its own financial workflow. In one of its projects, the Project Manager now proposes two further changes, for this project only: Any change request above EUR 20 000 or two weeks of delay is escalated to the Project Steering Committee. Risk tolerances are set according to the risk appetite of the key stakeholders. A colleague says this goes against PM², because the Directorate-General has already tailored the methodology and tailoring \"makes more sense at the organisation/departmental level\". Which statement is correct according to the PM² Guide?","options":{"A":"The colleague is right: once a department has tailored PM², no further changes to the methodology are possible in a project.","B":"The two changes are project-level customisations, which PM² expects in addition to any tailoring done by the department.","C":"The two changes are tailoring, so the Directorate-General must approve them before they can apply to this project.","D":"The two changes are not allowed, because the PM² Guide fixes decision thresholds and risk tolerances for all projects."},"answer":"B","why_right_html":"<p>\"Tailoring makes more sense at the organisation/departmental level, but some tailoring can also take place at the project level\". In addition, \"further customisation may also be required at the project level to reflect the project's specific management needs. Examples of such customisations are the definition of decision thresholds for escalation, risk tolerances based on the risk appetite of the stakeholders\" (PM² 3.1 §3.6, p.20). The two proposals match these examples word for word.<\/p>","why_wrong":{"A":"A: the guide allows some project-level tailoring and expects customisation \"In addition to any tailoring\" (§3.6, p.20).","C":"C: escalation thresholds and risk tolerances are the guide's own examples of customisation, not tailoring. The guide sets no rule that the DG must approve them; it says changes \"should be documented in the Project Handbook\" (§3.6, p.20).","D":"D: the guide leaves these values to each project to define. It does not fix them."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"Tailoring makes more sense at the organisation/departmental level, but some tailoring can also take place at the project level\". In addition, \"further customisation may also be required at the project level to reflect the project's specific management needs. Examples of such customisations are the definition of decision thresholds for escalation, risk tolerances based on the risk appetite of the stakeholders\" (PM² 3.1 §3.6, p.20). The two proposals match these examples word for word.<\/p><ul><li>A: the guide allows some project-level tailoring and expects customisation \"In addition to any tailoring\" (§3.6, p.20).<\/li><li>C: escalation thresholds and risk tolerances are the guide's own examples of customisation, not tailoring. The guide sets no rule that the DG must approve them; it says changes \"should be documented in the Project Handbook\" (§3.6, p.20).<\/li><li>D: the guide leaves these values to each project to define. It does not fix them.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-65","id":65,"topic":65,"type":"scenario","word_count":97,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"<p>Kasia is the new Project Manager of a six-month PM² project that will move a small reporting tool to a new platform. She comes from a start-up and wants a \"lean\" project. In her first week, she proposes to drop the Issue Log and the Quality Review Checklist, because she believes they only create paperwork. She has not yet looked at what these elements are meant to achieve in the project or which risks they help to control. The Project Owner asks her to follow the tailoring guidelines of the PM² Guide.<\/p><p>What should Kasia do FIRST?<\/p>","stem_text":"Kasia is the new Project Manager of a six-month PM² project that will move a small reporting tool to a new platform. She comes from a start-up and wants a \"lean\" project. In her first week, she proposes to drop the Issue Log and the Quality Review Checklist, because she believes they only create paperwork. She has not yet looked at what these elements are meant to achieve in the project or which risks they help to control. The Project Owner asks her to follow the tailoring guidelines of the PM² Guide. What should Kasia do FIRST?","options":{"A":"Remove both elements at once, because PM² asks project teams to eliminate waste and follow a lean approach.","B":"Understand the purpose and value of each element she wants to tailor, and only then decide how to tailor it.","C":"Ask the Centre of Excellence in PM² to approve both changes before she applies them in her project.","D":"Keep every element in full, because the methodology was designed as an integrated whole and cannot be changed."},"answer":"B","why_right_html":"<p>The first tailoring guideline is: \"First, understand the purpose and value of the methodology element to be tailored, and then proceed with its tailoring\" (PM² 3.1 §3.6, p.20). Kasia has not done this yet.<\/p>","why_wrong":{"A":"A: the lean guideline says \"Eliminate waste (lean approach) but remain aligned with the spirit of the PM² Methodology\". The guide also warns against \"eliminating whole chunks (e.g. a phase, a role, an activity or an artefact)\" (§3.6, p.20).","C":"C: the guide sets no approval by the Centre of Excellence. Tailoring and customisations are documented in the Project Handbook (§3.6, p.20).","D":"D: the guide says to \"avoid unnecessary deviations\" (§3.6, p.20), not to avoid all tailoring. It says tailoring \"may be required\"."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>The first tailoring guideline is: \"First, understand the purpose and value of the methodology element to be tailored, and then proceed with its tailoring\" (PM² 3.1 §3.6, p.20). Kasia has not done this yet.<\/p><ul><li>A: the lean guideline says \"Eliminate waste (lean approach) but remain aligned with the spirit of the PM² Methodology\". The guide also warns against \"eliminating whole chunks (e.g. a phase, a role, an activity or an artefact)\" (§3.6, p.20).<\/li><li>C: the guide sets no approval by the Centre of Excellence. Tailoring and customisations are documented in the Project Handbook (§3.6, p.20).<\/li><li>D: the guide says to \"avoid unnecessary deviations\" (§3.6, p.20), not to avoid all tailoring. It says tailoring \"may be required\".<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-66","id":66,"topic":66,"type":"long","word_count":163,"batch":2,"duty":9,"duties":[9],"section":"Duty 9: project management frameworks","stem_html":"<p>An EU agency is building a new case-handling system for its legal service. In the Planning Phase, the Project Owner wants to appoint as Business Manager a senior head of sector who sits in the office next to his and with whom he works well. The head of sector knows little about the legal service's processes and has little time for the project. A junior legal officer, who knows the processes in detail, has offered to take the role.<\/p><p>The Project Work Plan foresees a single release with all 45 requested features after 14 months. The business side has since explained that ten of these features cover 80% of daily work, and that the legal service needs them urgently because a new regulation applies in eight months. The Project Owner tells the Project Manager: \"Stick to the approved plan, and appoint the head of sector. It is simpler.\"<\/p><p>Which course of action by the Project Manager is MOST consistent with the PM² Mindsets?<\/p>","stem_text":"An EU agency is building a new case-handling system for its legal service. In the Planning Phase, the Project Owner wants to appoint as Business Manager a senior head of sector who sits in the office next to his and with whom he works well. The head of sector knows little about the legal service's processes and has little time for the project. A junior legal officer, who knows the processes in detail, has offered to take the role. The Project Work Plan foresees a single release with all 45 requested features after 14 months. The business side has since explained that ten of these features cover 80% of daily work, and that the legal service needs them urgently because a new regulation applies in eight months. The Project Owner tells the Project Manager: \"Stick to the approved plan, and appoint the head of sector. It is simpler.\" Which course of action by the Project Manager is MOST consistent with the PM² Mindsets?","options":{"A":"Follow the Project Owner's instructions, because the approved plan is the baseline and PM² Mindsets ask teams to follow plans.","B":"Appoint the head of sector but let the junior officer do the work informally, so that both hierarchy and convenience are respected.","C":"Advise the Project Owner to give the role to the person who best serves the project, and to agree a Minimum Viable Product first.","D":"Decide alone to give the role to the junior officer and to re-plan the releases, since the Project Manager is responsible for delivery."},"answer":"C","why_right_html":"<p>This combines two mindsets with their Infrequently Asked Questions. Mindset 6 is \"Assign project roles to the most appropriate people for the benefit of the project\", and the IAQ \"Are the right people involved?\" says roles should serve the project \"and not politics, friendship, functional hierarchy, proximity or convenience\". Mindset 4 is \"delivering project results with maximum value rather than just following plans\", and the IAQ \"Is this important?\" asks the team to agree the \"Minimum Viable Product (MVP)\" (PM² 3.1 §3.5, p.19). The PM advises; the PO decides, since the PO \"Approves key project artefacts\", including the Work Plan (§4.5, p.25).<\/p>","why_wrong":{"A":"A: this inverts mindset 4: PM² values maximum value \"rather than just following plans\" (§3.5, p.19).","B":"B: the IAQ \"Do we know who is doing what?\" asks teams to \"Clearly define and understand roles, responsibilities and accountabilities\" (§3.5, p.19). An informal stand-in hides who is accountable.","D":"D: deciding alone ignores mindset 5, \"a project culture of collaboration, clear communication and accountability\" (§3.5, p.19). The PO approves the Work Plan and leads the BM and PM (§4.5, p.25)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>This combines two mindsets with their Infrequently Asked Questions. Mindset 6 is \"Assign project roles to the most appropriate people for the benefit of the project\", and the IAQ \"Are the right people involved?\" says roles should serve the project \"and not politics, friendship, functional hierarchy, proximity or convenience\". Mindset 4 is \"delivering project results with maximum value rather than just following plans\", and the IAQ \"Is this important?\" asks the team to agree the \"Minimum Viable Product (MVP)\" (PM² 3.1 §3.5, p.19). The PM advises; the PO decides, since the PO \"Approves key project artefacts\", including the Work Plan (§4.5, p.25).<\/p><ul><li>A: this inverts mindset 4: PM² values maximum value \"rather than just following plans\" (§3.5, p.19).<\/li><li>B: the IAQ \"Do we know who is doing what?\" asks teams to \"Clearly define and understand roles, responsibilities and accountabilities\" (§3.5, p.19). An informal stand-in hides who is accountable.<\/li><li>D: deciding alone ignores mindset 5, \"a project culture of collaboration, clear communication and accountability\" (§3.5, p.19). The PO approves the Work Plan and leads the BM and PM (§4.5, p.25).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-67","id":67,"topic":67,"type":"scenario","word_count":82,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"<p>The contractor of a Directorate-General delivers an urgent hotfix build for the grants management system on Thursday afternoon. The fix changes how payment instalments are calculated. The test team has two working days before the planned release. Running the full regression test suite takes five working days. In the past, some new builds did not start correctly in the test environment, and the team lost a full day of testing before noticing it.<\/p><p>Which test approach is MOST appropriate in this situation?<\/p>","stem_text":"The contractor of a Directorate-General delivers an urgent hotfix build for the grants management system on Thursday afternoon. The fix changes how payment instalments are calculated. The test team has two working days before the planned release. Running the full regression test suite takes five working days. In the past, some new builds did not start correctly in the test environment, and the team lost a full day of testing before noticing it. Which test approach is MOST appropriate in this situation?","options":{"A":"Run a quick smoke test to check the build is stable, then regression tests chosen by risk around the payment functions.","B":"Release the build without further testing, because the contractor's unit tests passed and the fix is urgent.","C":"Ask business users to carry out user acceptance testing on the whole system, instead of any testing by the test team itself.","D":"Run the first two days of the full regression suite in its usual order, with no check of the build, and then release."},"answer":"A","why_right_html":"<p>A smoke test (build verification test) quickly checks that a new build installs, starts and runs its main functions, before more time is invested in it. When the full regression suite does not fit the time available, the regression tests are chosen by risk: the changed function and the areas linked to it come first (knowledge: standard software testing practice, e.g. ISTQB).<\/p>","why_wrong":{"B":"B: unit tests check single components in isolation. They do not show whether the change has broken other parts of the system, which is what regression testing is for (knowledge).","C":"C: UAT validates business needs with users. It does not replace system and regression testing, and a whole-system UAT cannot be done properly in two days (knowledge).","D":"D: skipping the build check repeats the past failure. Running the suite \"in its usual order\" may leave the payment functions untested when time runs out (knowledge)."},"why_wrong_shared":{"B":false,"C":false,"D":false},"full_html":"<p>A smoke test (build verification test) quickly checks that a new build installs, starts and runs its main functions, before more time is invested in it. When the full regression suite does not fit the time available, the regression tests are chosen by risk: the changed function and the areas linked to it come first (knowledge: standard software testing practice, e.g. ISTQB).<\/p><ul><li>B: unit tests check single components in isolation. They do not show whether the change has broken other parts of the system, which is what regression testing is for (knowledge).<\/li><li>C: UAT validates business needs with users. It does not replace system and regression testing, and a whole-system UAT cannot be done properly in two days (knowledge).<\/li><li>D: skipping the build check repeats the past failure. Running the suite \"in its usual order\" may leave the payment functions untested when time runs out (knowledge).<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v2","key":"v2-68","id":68,"topic":68,"type":"scenario","word_count":92,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"<p>A new public portal of an EU agency passed its load test before go-live. For two hours, it handled 5 000 concurrent users, its expected peak, with response times under two seconds. Three weeks after go-live, the operations team reports a pattern. After about four days of continuous running at normal traffic levels, response times rise steadily and memory use keeps growing until the servers are restarted. After each restart, the portal works well again for a few days.<\/p><p>Which type of testing would MOST likely have found this problem before go-live?<\/p>","stem_text":"A new public portal of an EU agency passed its load test before go-live. For two hours, it handled 5 000 concurrent users, its expected peak, with response times under two seconds. Three weeks after go-live, the operations team reports a pattern. After about four days of continuous running at normal traffic levels, response times rise steadily and memory use keeps growing until the servers are restarted. After each restart, the portal works well again for a few days. Which type of testing would MOST likely have found this problem before go-live?","options":{"A":"Stress testing, which pushes the portal well beyond 5 000 users to find its breaking point","B":"Spike testing, which sends sudden short bursts of traffic far above the normal level","C":"Endurance (soak) testing, which runs a typical load without a break for several days","D":"Usability testing, which observes real users as they complete common tasks on the portal"},"answer":"C","why_right_html":"<p>Gradual degradation and growing memory use after days at normal load point to a memory or resource leak. Endurance (soak) testing finds these problems by running a typical load for a long time (knowledge: performance testing types).<\/p><ul><li>Tip: if the stem mentions time (\"after four days\"), think endurance. If it mentions volume beyond the peak, think stress.<\/li><\/ul>","why_wrong":{"A":"A: stress testing goes beyond the expected peak to find the breaking point. The problem here appears at normal traffic, over time (knowledge).","B":"B: spike testing checks how the system reacts to sudden bursts of load, not slow decline over days (knowledge).","D":"D: usability testing checks ease of use. It says nothing about memory use or response times over time (knowledge)."},"why_wrong_shared":{"A":false,"B":false,"D":false},"full_html":"<p>Gradual degradation and growing memory use after days at normal load point to a memory or resource leak. Endurance (soak) testing finds these problems by running a typical load for a long time (knowledge: performance testing types).<\/p><ul><li>A: stress testing goes beyond the expected peak to find the breaking point. The problem here appears at normal traffic, over time (knowledge).<\/li><li>B: spike testing checks how the system reacts to sudden bursts of load, not slow decline over days (knowledge).<\/li><li>D: usability testing checks ease of use. It says nothing about memory use or response times over time (knowledge).<\/li><li>Tip: if the stem mentions time (\"after four days\"), think endurance. If it mentions volume beyond the peak, think stress.<\/li><\/ul>","knowledge_based":true,"frameworks":["Knowledge"]},{"bank":"v2","key":"v2-69","id":69,"topic":69,"type":"long","word_count":170,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"<p>Unit B.3 of an EU agency has outsourced the development of a new grant-reporting tool under a specific contract. The Deliverables Acceptance Plan, approved by the Project Steering Committee, sets the acceptance criteria. It states that a release may be accepted if no critical or major defect remains open.<\/p><p>The contractor has delivered release 1 and wants it accepted quickly so that it can send its invoice. Its own test report shows that all system tests passed. User acceptance testing was then carried out by eight finance officers, whom the Business Manager made available, using business scenarios taken from the requirements. The results are:<\/p><ul><li>46 of 48 business scenarios passed.<\/li><li>Two minor defects remain: a misaligned column in one report and a spelling error in a help screen.<\/li><li>No critical or major defect is open.<\/li><li>The contractor has agreed in writing to fix both minor defects in release 2, due in six weeks.<\/li><\/ul><p>The Project Manager is preparing the acceptance decision.<\/p><p>Which statement is correct according to the PM² Guide?<\/p>","stem_text":"Unit B.3 of an EU agency has outsourced the development of a new grant-reporting tool under a specific contract. The Deliverables Acceptance Plan, approved by the Project Steering Committee, sets the acceptance criteria. It states that a release may be accepted if no critical or major defect remains open. The contractor has delivered release 1 and wants it accepted quickly so that it can send its invoice. Its own test report shows that all system tests passed. User acceptance testing was then carried out by eight finance officers, whom the Business Manager made available, using business scenarios taken from the requirements. The results are: 46 of 48 business scenarios passed. Two minor defects remain: a misaligned column in one report and a spelling error in a help screen. No critical or major defect is open. The contractor has agreed in writing to fix both minor defects in release 2, due in six weeks. The Project Manager is preparing the acceptance decision. Which statement is correct according to the PM² Guide?","options":{"A":"The Project Manager can formally accept release 1, because the Project Manager undertakes deliverables acceptance management.","B":"Release 1 cannot be accepted until every defect is fixed, because acceptance requires every criterion to be fully met.","C":"The contractor's system test report is enough for acceptance, so the user acceptance testing was not necessary.","D":"Release 1 can be accepted with the two known defects, provided they and the plan to fix them are documented; the Project Owner gives the formal acceptance."},"answer":"D","why_right_html":"<p>\"Project deliverables can be conditionally accepted, even with a set of known defects or issues, if these are documented and if there is a plan in place for addressing them\" (PM² 3.1 §9.10, step 3, p.81). The remaining defects are minor and within the plan's criterion. Then \"The Project Owner (PO) formally accepts the project's deliverables\" (§9.10, step 6, p.81).<\/p>","why_wrong":{"A":"A: the PM \"Undertakes deliverables acceptance management\", but formal acceptance belongs to the PO (§9.10, p.81). In the RASCI, the PM is R and the PO is A.","B":"B: deliverables are accepted if the acceptance activities stay \"within a pre-specified tolerance range\" (§9.10, step 3, p.81). The plan here tolerates open minor defects.","C":"C: the contractor's own system tests are quality control on the provider side. Acceptance follows the criteria in the Deliverables Acceptance Plan, and the BM \"provides (qualified) resources to support the users' acceptance\" (§9.10, step 4, p.81)."},"why_wrong_shared":{"A":false,"B":false,"C":false},"full_html":"<p>\"Project deliverables can be conditionally accepted, even with a set of known defects or issues, if these are documented and if there is a plan in place for addressing them\" (PM² 3.1 §9.10, step 3, p.81). The remaining defects are minor and within the plan's criterion. Then \"The Project Owner (PO) formally accepts the project's deliverables\" (§9.10, step 6, p.81).<\/p><ul><li>A: the PM \"Undertakes deliverables acceptance management\", but formal acceptance belongs to the PO (§9.10, p.81). In the RASCI, the PM is R and the PO is A.<\/li><li>B: deliverables are accepted if the acceptance activities stay \"within a pre-specified tolerance range\" (§9.10, step 3, p.81). The plan here tolerates open minor defects.<\/li><li>C: the contractor's own system tests are quality control on the provider side. Acceptance follows the criteria in the Deliverables Acceptance Plan, and the BM \"provides (qualified) resources to support the users' acceptance\" (§9.10, step 4, p.81).<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"bank":"v2","key":"v2-70","id":70,"topic":70,"type":"scenario","word_count":92,"batch":2,"duty":10,"duties":[10],"section":"Duty 10: quality assurance and testing","stem_html":"<p>An EU agency has introduced a new leave-request system. The contractor's test report shows that all 320 test cases, written from the approved functional specifications, passed. A quality review also confirmed that the code meets the agency's coding standards. Two weeks after go-live, heads of unit complain that the system does not support the way leave is actually approved in the agency. For staff who work part-time, a request often needs a second approver, and the specifications never described this case.<\/p><p>Which activity would MOST likely have revealed this problem before go-live?<\/p>","stem_text":"An EU agency has introduced a new leave-request system. The contractor's test report shows that all 320 test cases, written from the approved functional specifications, passed. A quality review also confirmed that the code meets the agency's coding standards. Two weeks after go-live, heads of unit complain that the system does not support the way leave is actually approved in the agency. For staff who work part-time, a request often needs a second approver, and the specifications never described this case. Which activity would MOST likely have revealed this problem before go-live?","options":{"A":"Reviewing the requirements and early prototypes with real users and their managers during analysis and design","B":"Running more unit tests on the approval module to raise its code coverage from 70 percent to above 90 percent","C":"Running a static code analysis tool on every new build to detect coding errors at an earlier stage","D":"Asking the contractor to run the same 320 functional test cases again in a second test environment"},"answer":"A","why_right_html":"<p>The system passed verification: it
