st framework\" (PM² 3.1 App. D.2.3, p. A-110). A, C and D are real frameworks, but PM² does not name them here.<\/p>","knowledge_based":false,"frameworks":["PM²"]},{"id":87,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"Under Regulation (EU, Euratom) 2023/2841, a Union entity becomes aware of a significant incident. What must it submit to CERT-EU, and by when?","stem_text":"Under Regulation (EU, Euratom) 2023/2841, a Union entity becomes aware of a significant incident. What must it submit to CERT-EU, and by when?","options":{"A":"An early warning within 24 hours, an incident notification within 72 hours, and a final report no later than one month after the incident notification","B":"A single report within 30 days","C":"An incident notification within 24 hours and a final report within 72 hours","D":"An early warning within 72 hours and a final report within six months"},"answer":"A","why_right_html":"<p>Union entities submit to CERT-EU an early warning \"within 24 hours of becoming aware of the significant incident\" and an incident notification \"within 72 hours\". They then submit a final report \"not later than one month after the submission of the incident notification\" (Reg 2023/2841 Art. 21(2)(a), (b) and (d)). There is also an intermediate report on request, under point (c). The other options get the timings wrong.<\/p><ul><li>Since this is your EUFTE document, knowing Art. 21 well serves both tests.<\/li><\/ul>","why_wrong":{"B":"The other options get the timings wrong.","C":"The other options get the timings wrong.","D":"The other options get the timings wrong."},"why_wrong_shared":{"B":true,"C":true,"D":true},"full_html":"<p>Union entities submit to CERT-EU an early warning \"within 24 hours of becoming aware of the significant incident\" and an incident notification \"within 72 hours\". They then submit a final report \"not later than one month after the submission of the incident notification\" (Reg 2023/2841 Art. 21(2)(a), (b) and (d)). There is also an intermediate report on request, under point (c). The other options get the timings wrong.<\/p><ul><li>Since this is your EUFTE document, knowing Art. 21 well serves both tests.<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"id":88,"batch":3,"duty":3,"duties":[3],"section":"Duty 3: EU cybersecurity rules for Union entities","stem_html":"Under Regulation (EU, Euratom) 2023/2841, who is responsible for implementing the Regulation within each Union entity and for overseeing its compliance with the obligations related to the cybersecurity framework?","stem_text":"Under Regulation (EU, Euratom) 2023/2841, who is responsible for implementing the Regulation within each Union entity and for overseeing its compliance with the obligations related to the cybersecurity framework?","options":{"A":"CERT-EU","B":"The Interinstitutional Cybersecurity Board (IICB)","C":"The local cybersecurity officer","D":"The entity's highest level of management"},"answer":"D","why_right_html":"<p>\"The highest level of management of each Union entity shall be responsible for the implementation of this Regulation and shall oversee the compliance of its organisation with the obligations related to the Framework\" (Reg 2023/2841 Art. 6(5)).<\/p>","why_wrong":{"A":"A and B are interinstitutional bodies (Art. 10 and Art. 13).","B":"A and B are interinstitutional bodies (Art. 10 and Art. 13).","C":"C is the trap: the local cybersecurity officer is the entity's \"single point of contact regarding all aspects of cybersecurity\" (Art. 6(8)), but is not responsible for implementation."},"why_wrong_shared":{"A":true,"B":true,"C":false},"full_html":"<p>\"The highest level of management of each Union entity shall be responsible for the implementation of this Regulation and shall oversee the compliance of its organisation with the obligations related to the Framework\" (Reg 2023/2841 Art. 6(5)).<\/p><ul><li>C is the trap: the local cybersecurity officer is the entity's \"single point of contact regarding all aspects of cybersecurity\" (Art. 6(8)), but is not responsible for implementation.<\/li><li>A and B are interinstitutional bodies (Art. 10 and Art. 13).<\/li><\/ul>","knowledge_based":false,"frameworks":["Reg 2023/2841"]},{"id":89,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"According to the PM² Code of Professional Conduct, the key principles of independence, impartiality, objectivity and loyalty can be summarised as which single principle?","stem_text":"According to the PM² Code of Professional Conduct, the key principles of independence, impartiality, objectivity and loyalty can be summarised as which single principle?","options":{"A":"Accountability","B":"Transparency","C":"Integrity","D":"Excellence"},"answer":"C","why_right_html":"<p>\"The key principles can be summarised as INTEGRITY, which means consistently adhering to ethical principles and making sound decisions based on them\" (PM² 3.1 App. F.1, p. A-118).<\/p>","why_wrong":{"A":"A: accountability appears among the values (\"lawfulness and accountability\"), not as the summary.","B":"B and D are not named.","D":"B and D are not named."},"why_wrong_shared":{"A":false,"B":true,"D":true},"full_html":"<p>\"The key principles can be summarised as INTEGRITY, which means consistently adhering to ethical principles and making sound decisions based on them\" (PM² 3.1 App. F.1, p. A-118).<\/p><ul><li>A: accountability appears among the values (\"lawfulness and accountability\"), not as the summary.<\/li><li>B and D are not named.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]},{"id":90,"batch":3,"duty":9,"duties":[9],"section":"Duty 9: ethics and conduct","stem_html":"A member of a tender evaluation committee realises that they know the director of one tenderer personally. Which principle of the PM² Code of Professional Conduct is most directly at stake?","stem_text":"A member of a tender evaluation committee realises that they know the director of one tenderer personally. Which principle of the PM² Code of Professional Conduct is most directly at stake?","options":{"A":"Loyalty","B":"Impartiality","C":"Circumspection","D":"Proportionality and consistency"},"answer":"B","why_right_html":"<p>\"IMPARTIALITY: staff members should be unbiased in any decisions they are called upon to make\" (PM² 3.1 App. F.1, p. A-118). A personal link to a tenderer threatens impartiality.<\/p><ul><li>In practice the member should declare the possible conflict of interest. That is my judgement of standard EU practice; the procedural rules are outside this guide.<\/li><\/ul>","why_wrong":{"A":"A: loyalty is towards the organisation.","C":"C: circumspection is about reflecting on consequences.","D":"D concerns proportional measures."},"why_wrong_shared":{"A":false,"C":false,"D":false},"full_html":"<p>\"IMPARTIALITY: staff members should be unbiased in any decisions they are called upon to make\" (PM² 3.1 App. F.1, p. A-118). A personal link to a tenderer threatens impartiality.<\/p><ul><li>A: loyalty is towards the organisation.<\/li><li>C: circumspection is about reflecting on consequences.<\/li><li>D concerns proportional measures.<\/li><li>In practice the member should declare the possible conflict of interest. That is my judgement of standard EU practice; the procedural rules are outside this guide.<\/li><\/ul>","knowledge_based":false,"frameworks":["PM²"]}]}</script>
<script>
(function () {
  'use strict';

  /* ======================================================================
   * Constants
   * ==================================================================== */
  var NS = 'epsoMock.v1.';
  var KEYS = {
    exam: NS + 'exam',             // running exam
    result: NS + 'lastResult',     // last submitted exam (for the results view)
    history: NS + 'history',       // array of past exam summaries
    stats: NS + 'stats',           // per-question stats
    practice: NS + 'practice'      // current practice session
  };
  var EXAM_SIZE = 30;
  var EXAM_MINUTES = 40;
  var PASS_RATIO = 0.5;            // 15/30 (notice §4.3.2(c))
  var TARGET_SEC = 80;             // 40 min / 30 questions
  var PLACES = 228;
  var LETTERS = ['A', 'B', 'C', 'D'];
  var HISTORY_MAX = 300;

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var main = document.getElementById('main');
  var announcer = document.getElementById('announcer');

  /* ======================================================================
   * Utilities
   * ==================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function passMark(total) { return Math.ceil(total * PASS_RATIO); }
  function fmtClock(ms, roundUp) {
    var s = Math.max(0, roundUp ? Math.ceil(ms / 1000) : Math.round(ms / 1000));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  var dateFmt = (function () {
    try { return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return null; }
  })();
  function fmtDate(ms) {
    var d = new Date(ms);
    if (isNaN(d.getTime())) return '—';
    return dateFmt ? dateFmt.format(d) : d.toISOString().slice(0, 16).replace('T', ' ');
  }
  function wrapBlock(html) {
    var t = String(html || '').trim();
    return /^<(p|ul|ol|div)\b/i.test(t) ? t : '<p>' + t + '</p>';
  }
  function excerpt(text, n) {
    var t = String(text || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t;
  }

  var ICONS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    flag: '<path d="M5.5 21V4"/><path d="M5.5 4.5h11l-2.2 4.2 2.2 4.3h-11" fill="currentColor"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    alert: '<path d="M12 3.8l9 15.7H3z"/><path d="M12 10v4.2M12 17v.2"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.9v.2"/>',
    left: '<path d="M14.5 6l-6 6 6 6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>',
    dot: '<circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>',
    minus: '<path d="M6.5 12h11"/>'
  };
  function icon(name, cls) {
    return '<svg class="icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  }

  function announce(msg) {
    announcer.textContent = '';
    window.setTimeout(function () { announcer.textContent = msg; }, 60);
  }

  /* ======================================================================
   * Random
   * ==================================================================== */
  var hasCrypto = !!(window.crypto && window.crypto.getRandomValues);
  function randInt(n) {
    if (n <= 1) return 0;
    if (hasCrypto) {
      var limit = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1), x;
      do { window.crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return x % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ======================================================================
   * Data
   * ==================================================================== */
  function loadData() {
    var el = document.getElementById('question-data');
    var raw;
    try { raw = JSON.parse(el.textContent); } catch (e) { return null; }
    if (!raw || !Array.isArray(raw.questions)) return null;
    var qs = raw.questions.filter(function (q) {
      return q && q.id != null && q.options && LETTERS.every(function (l) { return typeof q.options[l] === 'string'; }) &&
        LETTERS.indexOf(q.answer) !== -1;
    }).map(function (q) {
      q.duty = Number(q.duty);
      q.batch = Number(q.batch);
      q.duties = Array.isArray(q.duties) && q.duties.length ? q.duties.map(Number) : [q.duty];
      q.why_wrong = q.why_wrong || {};
      q.why_wrong_shared = q.why_wrong_shared || {};
      return q;
    });
    if (!qs.length) return null;
    qs.sort(function (a, b) { return a.id - b.id; });
    var byId = new Map();
    qs.forEach(function (q) { byId.set(q.id, q); });
    var dutyNums = Array.from(new Set(qs.map(function (q) { return q.duty; }))).sort(function (a, b) { return a - b; });
    var batchNums = Array.from(new Set(qs.map(function (q) { return q.batch; }))).sort(function (a, b) { return a - b; });
    return { meta: raw, questions: qs, byId: byId, dutyLabels: raw.duties || {}, batchLabels: raw.batches || {}, dutyNums: dutyNums, batchNums: batchNums };
  }
  var D = loadData();

  function dutyLabel(n) { return (D.dutyLabels[String(n)] || ('Duty ' + n)); }
  function dutyName(n) { return 'Duty ' + n + ': ' + dutyLabel(n); }
  function batchName(n) { return 'Batch ' + n + (D.batchLabels[String(n)] ? ' — ' + D.batchLabels[String(n)] : ''); }

  /* ======================================================================
   * Storage (localStorage with in-memory fallback)
   * ==================================================================== */
  var Store = (function () {
    var mem = {};
    var ok = true;
    try {
      var k = NS + '__probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
    } catch (e) { ok = false; }
    function failed() { ok = false; showStorageBanner(); }
    return {
      get: function (key, fallback) {
        if (ok) {
          var v;
          try { v = window.localStorage.getItem(key); } catch (e) { failed(); }
          if (ok) {
            if (v === null) return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : fallback;
            try { return JSON.parse(v); } catch (e2) { return fallback; }
          }
        }
        return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : fallback;
      },
      set: function (key, val) {
        mem[key] = val;
        if (!ok) return;
        try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) { failed(); }
      },
      remove: function (key) {
        delete mem[key];
        if (!ok) return;
        try { window.localStorage.removeItem(key); } catch (e) { failed(); }

  /* App state (mirrors storage) */
  var S = { exam: null, result: null, history: [], stats: {}, practice: null };

  }
  function saveExam() { if (S.exam) Store.set(KEYS.exam, S.exam); else Store.remove(KEYS.exam); }
  function saveStats() { Store.set(KEYS.stats, S.stats); }
  function savePractice() { if (S.practice) Store.set(KEYS.practice, S.practice); else Store.remove(KEYS.practice); }

  function statFor(id) {
    var s = S.stats[id];
    if (!s) { s = { attempts: 0, correct: 0, lastCorrect: null, lastSeen: null }; S.stats[id] = s; }
    return s;
  }
  function recordAnswer(id, isCorrect, when) {
    var s = statFor(id);
    s.attempts += 1;
    if (isCorrect) s.correct += 1;
    s.lastCorrect = !!isCorrect;
    s.lastSeen = when || Date.now();
  }
  function recordSkipped(id, when) {
    var s = statFor(id);
    s.lastCorrect = false;           // unanswered: not an attempt, but weak
    s.skipped = (s.skipped || 0) + 1;
    s.lastSeen = when || Date.now();
  }
  function weakIds() {
    return D.questions.filter(function (q) { var s = S.stats[q.id]; return s && s.lastCorrect === false; })
      .map(function (q) { return q.id; });
  }

  /* ======================================================================
   * Draw (stratified by primary duty)
   * ==================================================================== */
  function allocate(groups, n) {
    // groups: { dutyKey: [ids] }. Largest-remainder proportional allocation, min 1 per non-empty group.
    var keys = Object.keys(groups).filter(function (k) { return groups[k].length > 0; });
    var total = keys.reduce(function (s, k) { return s + groups[k].length; }, 0);
    n = Math.min(n, total);
    var alloc = {}, rems = [], used = 0;
    keys.forEach(function (k) {
      var quota = n * groups[k].length / total;
      alloc[k] = Math.floor(quota);
      used += alloc[k];
      rems.push({ k: k, r: Math.round((quota - alloc[k]) * 1e9) / 1e9 });
    });
    shuffle(rems);                                      // random tie-break...
    rems.sort(function (a, b) { return b.r - a.r; });   // ...kept by the stable sort
    for (var i = 0; used < n && i < rems.length * 2; i++) {
      var k = rems[i % rems.length].k;
      if (alloc[k] < groups[k].length) { alloc[k] += 1; used += 1; }
    }
    if (n >= keys.length) {
      keys.forEach(function (k) {
        if (alloc[k] > 0) return;
        var donors = shuffle(keys.filter(function (d) { return alloc[d] > 1; }));
        donors.sort(function (a, b) { return alloc[b] - alloc[a]; });
        if (donors.length) { alloc[donors[0]] -= 1; alloc[k] = 1; }
      });
    }
    return alloc;
  }
  function drawExam() {
    var groups = {};
    D.questions.forEach(function (q) { (groups[q.duty] = groups[q.duty] || []).push(q.id); });
    var alloc = allocate(groups, EXAM_SIZE);
    var ids = [];
    Object.keys(alloc).forEach(function (k) {
      ids = ids.concat(shuffle(groups[k].slice()).slice(0, alloc[k]));
    });
    return { ids: shuffle(ids), alloc: alloc };
  }

  /* ======================================================================
   * Debug duration (?minutes=N)

  var debugMinutes = (function () {

      var n = parseFloat(v);
      return isFinite(n) && n > 0 ? n : null;
    } catch (e) { return null; }
  })();
  function debugBadge(mins) {
    return mins ? '<span class="badge badge-debug">Debug duration: ' + esc(String(mins)) + ' min</span>' : '';
  }

  /* ======================================================================
   * Dialog
   * ==================================================================== */
  var dialogEl = document.getElementById('confirm-dialog');
  var closeOpenDialog = null;
  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      if (typeof dialogEl.showModal !== 'function') {
        resolve(window.confirm(opts.title + '\n\n' + (opts.text || '')));
        return;
      }
      var okBtn = document.getElementById('cd-ok'), cancelBtn = document.getElementById('cd-cancel');
      document.getElementById('cd-title').textContent = opts.title;
      document.getElementById('cd-body').innerHTML = opts.bodyHtml || ('<p>' + esc(opts.text || '') + '</p>');
      okBtn.textContent = opts.okLabel || 'OK';
      cancelBtn.textContent = opts.cancelLabel || 'Cancel';
      okBtn.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
      var prev = document.activeElement;
      var settled = false;
      function done(v) {
        if (settled) return;
        settled = true;
        okBtn.onclick = cancelBtn.onclick = dialogEl.oncancel = null;
        closeOpenDialog = null;
        if (dialogEl.open) dialogEl.close();
        if (!v && prev && document.contains(prev) && typeof prev.focus === 'function') prev.focus();
        resolve(v);
      }
      okBtn.onclick = function () { done(true); };
      cancelBtn.onclick = function () { done(false); };
      dialogEl.oncancel = function (e) { e.preventDefault(); done(false); };   // Esc
      closeOpenDialog = function () { done(false); };
      dialogEl.showModal();
      cancelBtn.focus();
    });
  }
  function dialogIsOpen() { return !!(dialogEl && dialogEl.open); }

  /* ======================================================================
   * Router
   * ==================================================================== */
  var currentView = null;
  var firstRender = true;
  var VIEWS = {};
  // A data: snapshot (e.g. some embedded previewers) cannot navigate its own fragment: render views directly.
  var hashBlocked = window.location.protocol === 'data:';
  var announcePrefix = '';
  function viewFromHash() { return (window.location.hash || '').replace(/^#\/?/, '') || 'home'; }
  function go(name) {
    if (hashBlocked) { route(name); return; }
    if (window.location.hash === '#' + name) { route(); return; }
    try { window.location.hash = name; } catch (e) { /* ignore */ }
    // Some embedded or sandboxed contexts block fragment navigation: from then on, render views directly.
    if (window.location.hash !== '#' + name) { hashBlocked = true; route(name); }
  }
  function replaceView(name) {
    try { window.history.replaceState(null, '', '#' + name); } catch (e) { /* ignore */ }
    route(name);
  }
  function route(forced) {
    var name = typeof forced === 'string' ? forced : (hashBlocked && currentView ? currentView : viewFromHash());
    if (!VIEWS[name]) { replaceView('home'); return; }
    if (S.exam && (name === 'practice' || name === 'practice-setup')) name = 'exam-lock';
    var title = VIEWS[name]();
    if (title === false) return;                       // view redirected
    currentView = name;
    $$('.site-nav a').forEach(function (a) {
      if (a.getAttribute('data-nav') === (name === 'exam-lock' ? 'practice' : name.replace(/-setup$/, ''))) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = title + ' — Field MCQ mock (unofficial)';
    if (firstRender) { firstRender = false; return; }
    var h = $('[data-view-heading]', main);
    if (h) h.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    announce(announcePrefix + title);
    announcePrefix = '';
  }
  window.addEventListener('hashchange', function () { route(); });
  // Route in-app links through go(), so navigation also works where fragment navigation is blocked.
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var name = a.getAttribute('href').slice(1);
    if (!VIEWS[name]) return;
    e.preventDefault();
    go(name);
  });

  /* ======================================================================
   * Exam
   * ==================================================================== */
  var finalizing = false;
  var paletteOpen = false;

  function startExam() {
    var d = drawExam();
    var mins = debugMinutes || EXAM_MINUTES;
    var durationMs = Math.max(1000, Math.round(mins * 60000));
    var now = Date.now();
    S.exam = {
      v: 1, ids: d.ids, answers: {}, flags: {}, index: 0,
      startedAt: now, endsAt: now + durationMs, durationMs: durationMs,
      debugMinutes: debugMinutes || null, alloc: d.alloc, warned5: false, warned1: false
    };
    paletteOpen = false;
    saveExam();
    go('exam');
  }
  function examRemaining() { return S.exam ? S.exam.endsAt - Date.now() : 0; }
  function examCounts(ex) {
    var answered = 0, flagged = 0;
    ex.ids.forEach(function (id) { if (ex.answers[id]) answered++; if (ex.flags[id]) flagged++; });
    return { answered: answered, flagged: flagged, unanswered: ex.ids.length - answered };
  }

  function finalizeExam(timedOut) {
    var ex = S.exam;
    if (!ex || finalizing) return;
    finalizing = true;
    if (closeOpenDialog) closeOpenDialog();
    var now = Date.now();
    var submittedAt = Math.min(now, ex.endsAt);
    var perDuty = {}, score = 0;
    ex.ids.forEach(function (id) {
      var q = D.byId.get(id);
      var a = ex.answers[id];
      var pd = perDuty[q.duty] = perDuty[q.duty] || { drawn: 0, correct: 0 };
      pd.drawn += 1;
      if (a) {
        var ok = a === q.answer;
        if (ok) { score += 1; pd.correct += 1; }
        recordAnswer(id, ok, submittedAt);
      } else {
        recordSkipped(id, submittedAt);
      }
    });
    var used = Math.min(ex.durationMs, Math.max(0, submittedAt - ex.startedAt));
    S.result = {
      v: 1, ids: ex.ids, answers: ex.answers, flags: ex.flags, alloc: ex.alloc,
      startedAt: ex.startedAt, submittedAt: submittedAt, durationMs: ex.durationMs, usedMs: used,
      debugMinutes: ex.debugMinutes || null, timedOut: !!timedOut, score: score, total: ex.ids.length
    };
    S.history.push({
      date: submittedAt, score: score, total: ex.ids.length, usedMs: used, durationMs: ex.durationMs,
      timedOut: !!timedOut, debugMinutes: ex.debugMinutes || null, perDuty: perDuty
    });
    if (S.history.length > HISTORY_MAX) S.history = S.history.slice(-HISTORY_MAX);
    S.exam = null;
    saveExam();
    Store.set(KEYS.result, S.result);
    Store.set(KEYS.history, S.history);
    saveStats();
    reviewFilter = 'all';
    finalizing = false;
    if (timedOut) announcePrefix = 'Time expired, the exam was submitted automatically. ';
    go('results');
  }

  function examSetAnswer(letter) {

  function examToggleFlag() {

  function examGoto(i, focusHeading) {

    announce('Question ' + (i + 1) + ' of ' + ex.ids.length + (ex.answers[ex.ids[i]] ? ', answered ' + ex.answers[ex.ids[i]] : '') + (ex.flags[ex.ids[i]] ? ', flagged' : ''));

  async function examSubmitClicked() {

    lines.push('<p>Time left: <strong data-dialog-timer>' + fmtClock(examRemaining(), true) + '</strong>. You cannot change answers after submitting.</p>');
    var ok = await confirmDialog({ title: 'Submit the exam?', bodyHtml: lines.join(''), okLabel: 'Submit exam', cancelLabel: 'Keep working' });

  /* ======================================================================
   * Ticker (absolute end time)
   * ==================================================================== */
  function updateTimers() {
    var ex = S.exam;

    var rem = examRemaining();

    var txt = fmtClock(rem, true);
    var t = $('[data-timer]', main);
    if (t) {
      var tt = $('[data-timer-text]', t);
      if (tt.textContent !== txt) tt.textContent = txt;
      var dt = document.querySelector('[data-dialog-timer]');
      if (dt && dt.textContent !== txt) dt.textContent = txt;
      var warn = rem <= 5 * 60000, crit = rem <= 60000;
      if (t.classList.contains('is-warn') !== (warn && !crit)) t.classList.toggle('is-warn', warn && !crit);
      if (t.classList.contains('is-crit') !== crit) t.classList.toggle('is-crit', crit);
      var ic = $('[data-timer-icon]', t), want = warn ? 'alert' : 'clock';
      if (ic.getAttribute('data-icon') !== want) { ic.innerHTML = icon(want); ic.setAttribute('data-icon', want); }
    }
    if (rem <= 5 * 60000 && !ex.warned5) {

  }

  /* ======================================================================

  function explanationHtml(q, chosen, hlevel) {

      out += '<section class="expl expl-right"><' + h + '>' + icon('check') + 'Why ' + L + ' is right</' + h + '><div class="expl-body">' + wrapBlock(q.why_right_html) + '</div>' + kbNote(q) + '</section>';
      out += '<section class="expl expl-wrong"><' + h + '>' + icon('cross') + 'Why your answer (' + chosen + ') is wrong</' + h + '><div class="expl-body">' + wrapBlock(reason) + '</div>' +
        (q.why_wrong_shared[chosen] ? '<p class="shared-note">The answer key gives this reason for several options together.</p>' : '') + '</section>';
    } else {
      out += '<section class="expl expl-right"><' + h + '>' + icon('check') + 'Why ' + L + ' is right</' + h + '><div class="expl-body">' + wrapBlock(q.full_html) + '</div>' + kbNote(q) + '</section>';
      out += '<section class="expl expl-wrong"><' + h + '>' + icon('cross') + 'Why your answer (' + chosen + ') is wrong</' + h + '><p>The answer key has no separate bullet for option ' + chosen + '. The explanation above is the whole entry; read it for why ' + chosen + ' does not fit.</p></section>';
    }
    return out;
  }
  function optionStateBody(q, L, chosen) {
    var isAns = L === q.answer, isChosen = L === chosen, status = '';
    if (isChosen && isAns) status = icon('check') + 'Your answer — correct';
    else if (isChosen) status = icon('cross') + 'Your answer — incorrect';
    else if (isAns) status = icon('check') + 'Correct answer';
    return '<span class="opt-body"><span class="opt-letter" aria-hidden="true">' + L + '</span>' +
      '<span class="opt-main"><span class="opt-text"><span class="sr-only">' + L + '. </span>' + q.options[L] + '</span>' +
      '<span class="opt-status">' + status + '</span></span></span>';
  }
  function optionStateClass(q, L, chosen) {
    if (L === q.answer) return 'is-correct';
    if (L === chosen) return 'is-wrong';
    return chosen ? 'is-dim' : '';
  }

  /* ======================================================================
   * Results
   * ==================================================================== */
  var reviewFilter = 'all';
  function resultItems(r) {
    return r.ids.map(function (id, i) {
      var q = D.byId.get(id);
      if (!q) return null;
      var a = r.answers[id] || null;
      return { n: i + 1, id: id, q: q, a: a, status: !a ? 'unanswered' : (a === q.answer ? 'correct' : 'wrong'), flagged: !!r.flags[id] };
    }).filter(Boolean);
  }
  function renderResults() {
    var r = S.result;
    if (!r) { replaceView('home'); return false; }
    var items = resultItems(r);
    var total = items.length;
    var score = items.filter(function (x) { return x.status === 'correct'; }).length;
    var pm = passMark(total), passed = score >= pm;
    var used = r.usedMs != null ? r.usedMs : Math.min(r.durationMs, r.submittedAt - r.startedAt);
    var answeredN = r.ids.filter(function (id) { return !!r.answers[id]; }).length;
    var paceBase = answeredN || total;
    var avg = paceBase ? used / 1000 / paceBase : 0;
    var diff = Math.round(avg - TARGET_SEC);
    var paceText = Math.abs(diff) < 1 ? 'exactly on the ' + TARGET_SEC + ' s target' :
      (diff > 0 ? Math.abs(diff) + ' s over the ' + TARGET_SEC + ' s target' : Math.abs(diff) + ' s under the ' + TARGET_SEC + ' s target');
    var counts = { all: total, wrong: 0, unanswered: 0, flagged: 0 };
    items.forEach(function (x) { if (x.status === 'wrong') counts.wrong++; if (x.status === 'unanswered') counts.unanswered++; if (x.flagged) counts.flagged++; });
    var missed = counts.wrong + counts.unanswered;

    var perDuty = {};
    items.forEach(function (x) { var p = perDuty[x.q.duty] = perDuty[x.q.duty] || { drawn: 0, correct: 0 }; p.drawn++; if (x.status === 'correct') p.correct++; });
    var dutyRows = Object.keys(perDuty).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      var p = perDuty[d];
      return '<tr><th scope="row">' + esc(dutyName(d)) + '</th><td class="num">' + p.drawn + '</td><td class="num">' + p.correct + '</td>' +
        '<td>' + meterCell(pct(p.correct, p.drawn)) + '</td></tr>';
    }).join('');

    var actions = function (where) {
      return '<div class="btn-row">' +
        '<button type="button" class="btn btn-primary" data-action="start-exam">New exam</button>' +
        '<button type="button" class="btn" data-action="practise-missed"' + (missed ? '' : ' aria-disabled="true"') + '>Practise the ones I missed (' + missed + ')</button>' +
        '<a class="btn" href="#home">Home</a>' +
        (where === 'top' ? '' : '<a class="btn" href="#progress">Progress</a>') +
        '</div>';
    };

    main.innerHTML =
      '<div class="wrap page">' +
        '<div class="page-head"><p class="eyebrow">Exam simulation · ' + esc(fmtDate(r.submittedAt)) + '</p>' +
        '<h1 tabindex="-1" data-view-heading>Exam results</h1>' + (r.debugMinutes ? debugBadge(r.debugMinutes) : '') + '</div>' +
        (r.timedOut ? '<div class="note note-warn" role="status">' + icon('clock') + '<p><strong>Time expired — the exam was submitted automatically.</strong></p></div>' : '') +
        '<section class="card score-card" aria-labelledby="score-h" style="margin-top:1rem">' +
          '<div><h2 id="score-h" class="sr-only">Score</h2><div class="score-big">' + score + '<span class="den"> / ' + total + '</span></div></div>' +
          '<div>' +
            '<p><span class="verdict ' + (passed ? 'verdict-pass' : 'verdict-fail') + '">' + icon(passed ? 'check' : 'cross') +
              (passed ? 'PASS' : 'FAIL') + '</span> <span class="muted">' + (passed ? 'At or above' : 'Below') + ' the pass mark of ' + pm + '/' + total + '</span></p>' +
            '<ul class="kv">' +
              '<li>Score: <strong>' + pct(score, total) + '%</strong></li>' +
              '<li>Time used: <strong>' + fmtClock(used) + '</strong> of ' + fmtClock(r.durationMs) + '</li>' +
              '<li>Average: <strong>' + Math.round(avg) + ' s</strong> per ' + (answeredN && answeredN < total ? 'answered question (' + answeredN + ' of ' + total + ' answered)' : 'question') + ' — ' + paceText + '</li>' +
            '</ul>' +
            '<p class="small muted" style="margin-top:.7rem">Passing is necessary but not enough. Candidates are then ranked on this test, and only the highest-ranked (in principle up to 1.5 × ' + PLACES + ' ≈ ' + Math.round(1.5 * PLACES) + ') go forward to have their EUFTE marked (notice §4.3.3). Aim for the highest score you can.</p>' +
          '</div>' +
        '</section>' +
        actions('top') +
        '<h2 id="duty-h">Score by duty</h2>' +
        '<div class="table-wrap"><table class="table" aria-labelledby="duty-h"><caption>Drawn per duty: questions are drawn in proportion to each duty’s share of the bank (at least one per duty).</caption>' +
          '<thead><tr><th scope="col">Duty</th><th scope="col" class="num">Drawn</th><th scope="col" class="num">Correct</th><th scope="col">Accuracy</th></tr></thead>' +
          '<tbody>' + dutyRows + '</tbody></table></div>' +
        '<h2 id="review-h">Review</h2>' +
        '<div class="filters" role="group" aria-label="Filter the review">' +
          ['all', 'wrong', 'unanswered', 'flagged'].map(function (f) {
            var label = { all: 'All', wrong: 'Wrong', unanswered: 'Unanswered', flagged: 'Flagged' }[f];
            return '<button type="button" class="btn btn-small" data-action="review-filter" data-filter="' + f + '" aria-pressed="' + (reviewFilter === f) + '">' + label + ' (' + counts[f] + ')</button>';
          }).join('') +
        '</div>' +
        '<p class="sr-only" data-review-status aria-live="polite"></p>' +
        '<ol class="review-list" data-review-list aria-labelledby="review-h"></ol>' +
        actions('bottom') +
      '</div>';
    renderReviewList(items);
    return 'Exam results: ' + score + ' out of ' + total + ', ' + (passed ? 'pass' : 'fail');
  }
  function renderReviewList(items, announceIt) {
    var list = $('[data-review-list]', main);
    if (!list) return;
    var shown = items.filter(function (x) {
      return reviewFilter === 'all' || (reviewFilter === 'flagged' ? x.flagged : x.status === reviewFilter);
    });
    if (!shown.length) {
      list.innerHTML = '<li class="muted">No questions match this filter.</li>';
    } else {
      list.innerHTML = shown.map(function (x) {
        var q = x.q;
        var badge = x.status === 'correct' ? '<span class="badge badge-ok">' + icon('check') + 'Correct</span>' :
          x.status === 'wrong' ? '<span class="badge badge-bad">' + icon('cross') + 'Incorrect</span>' :
          '<span class="badge">' + icon('minus') + 'Not answered</span>';
        return '<li class="rev-item" data-status="' + x.status + '"><article aria-labelledby="rev-' + x.n + '">' +
          '<div class="rev-head"><h3 id="rev-' + x.n + '">Question ' + x.n + '</h3>' + badge +
            (x.flagged ? '<span class="badge badge-flag">' + icon('flag') + 'Flagged</span>' : '') + '</div>' +
          '<p class="rev-meta">' + esc(dutyName(q.duty)) + ' · Bank question ' + esc(q.id) + ' · Batch ' + esc(q.batch) + '</p>' +
          '<div class="stem">' + wrapBlock(q.stem_html) + '</div>' +
          '<ul class="rev-opts">' + LETTERS.map(function (L) {
            return '<li class="' + optionStateClass(q, L, x.a) + '">' + optionStateBody(q, L, x.a) + '</li>';
          }).join('') + '</ul>' +
          (x.a ? '' : '<p><strong>Not answered.</strong> The correct answer is ' + q.answer + '.</p>') +
          explanationHtml(q, x.a, 4) +
          '</article></li>';
      }).join('');
    }
    if (announceIt) {
      var st = $('[data-review-status]', main);
      if (st) { st.textContent = ''; window.setTimeout(function () { st.textContent = 'Showing ' + plural(shown.length, 'question'); }, 60); }
    }
  }
  function meterCell(p) {
    return '<span class="meter-cell"><span class="meter" aria-hidden="true"><span style="width:' + Math.max(0, Math.min(100, p)) + '%"></span></span><span class="meter-val">' + p + '%</span></span>';
  }

  /* ======================================================================
   * Practice
   * ==================================================================== */
  function practiceSourceIds(source, dutyNum) {
    if (source === 'all') return D.questions.map(function (q) { return q.id; });
    if (source === 'weak') return weakIds();
    if (source === 'duty') return D.questions.filter(function (q) { return q.duties.indexOf(dutyNum) !== -1; }).map(function (q) { return q.id; });
    var m = /^batch-(\d+)$/.exec(source);
    if (m) { var b = Number(m[1]); return D.questions.filter(function (q) { return q.batch === b; }).map(function (q) { return q.id; }); }
    return [];
  }
  function startPractice(ids, label, opts) {
    opts = opts || {};
    if (S.exam) { go('exam-lock'); return; }
    ids = ids.filter(function (id) { return D.byId.has(id); });
    if (!ids.length) return;
    if (opts.order === 'bank') ids.sort(function (a, b) { return a - b; });
    else if (opts.order !== 'keep') shuffle(ids);
    if (opts.limit && opts.limit < ids.length) ids = ids.slice(0, opts.limit);
    S.practice = { v: 1, ids: ids, idx: 0, answers: {}, label: label, createdAt: Date.now(), done: false };
    savePractice();
    go('practice');
  }
  function practiceCorrectCount(p) {
    return p.ids.filter(function (id) { return p.answers[id] && p.answers[id] === D.byId.get(id).answer; }).length;
  }
  function practiceAnsweredCount(p) { return p.ids.filter(function (id) { return !!p.answers[id]; }).length; }

  function renderPractice() {
    var p = S.practice;
    if (!p) return renderPracticeSetup();
    if (p.done || p.idx >= p.ids.length) return renderPracticeSummary();
    return renderPracticeQuestion();
  }

  function renderExamLock() {
    main.innerHTML =
      '<div class="wrap page"><div class="prose">' +
        '<div class="page-head"><p class="eyebrow">Practice</p><h1 tabindex="-1" data-view-heading>Practice is locked during an exam</h1></div>' +
        '<p>An exam is running. Practice shows the answers, so it stays closed until you submit the exam or the time runs out.</p>' +
        '<div class="btn-row"><a class="btn btn-primary" href="#exam">Back to the exam</a><a class="btn" href="#home">Home</a></div>' +
      '</div></div>';
    return 'Practice is locked during an exam';
  }

  function renderPracticeSetup() {
    var batchOpts = D.batchNums.map(function (b) {
      var n = practiceSourceIds('batch-' + b).length;
      return choice('src', 'batch-' + b, esc(batchName(b)) + ' (' + n + ')', b === D.batchNums[0]);
    }).join('');
    var weak = weakIds().length;
    var dutyOpts = D.dutyNums.concat([]).sort(function (a, b) { return a - b; });
    var allDutyNums = Array.from(new Set(D.questions.reduce(function (acc, q) { return acc.concat(q.duties); }, []))).sort(function (a, b) { return a - b; });
    dutyOpts = allDutyNums.length ? allDutyNums : dutyOpts;
    main.innerHTML =
      '<div class="wrap page"><div class="prose">' +
        '<div class="page-head"><p class="eyebrow">Practice</p><h1 tabindex="-1" data-view-heading>Set up a practice set</h1>' +
        '<p>Practice gives immediate feedback after each answer, with the reason your answer is right or wrong. It is untimed. Picking an option submits it.</p></div>' +
        '<form class="setup" data-form="practice-setup" novalidate>' +
          '<fieldset><legend>Questions</legend>' +
            batchOpts +
            choice('src', 'all', 'All questions (' + D.questions.length + ')') +
            choice('src', 'duty', 'One duty:') +
            '<label class="sr-only" for="duty-select">Duty</label>' +
            '<select id="duty-select" class="duty-select" name="duty">' + dutyOpts.map(function (d) {
              return '<option value="' + d + '">' + esc(dutyName(d)) + ' (' + practiceSourceIds('duty', d).length + ')</option>';
            }).join('') + '</select>' +
            choice('src', 'weak', 'My weak questions (' + weak + ')', false, weak === 0, 'weak-help') +
            '<p class="choice-help" id="weak-help">' + (weak === 0 ?
              'None yet. A question becomes weak when you answer it wrongly, or leave it blank in an exam. Answering it correctly later removes it.' :
              'Questions you last answered wrongly, or left blank in an exam. Answering one correctly removes it.') + '</p>' +
            '<p class="choice-help" style="margin-left:0">A duty set includes questions that list the duty as a secondary duty too.</p>' +
          '</fieldset>' +
          '<fieldset><legend>Order</legend>' +
            choice('order', 'shuffled', 'Shuffled', true) +
            choice('order', 'bank', 'Bank order') +
          '</fieldset>' +
          '<fieldset><legend>How many</legend>' +
            '<label for="count-select">Number of questions (at most)</label><br>' +
            '<select id="count-select" name="count"><option value="0">All</option><option value="10">10</option><option value="20">20</option><option value="30">30</option></select>' +
          '</fieldset>' +
          '<div class="btn-row"><button type="submit" class="btn btn-primary">Start practice</button><a class="btn" href="#home">Cancel</a></div>' +
        '</form>' +
      '</div></div>';
    var form = $('form[data-form="practice-setup"]', main);
    var sel = $('#duty-select', form);
    sel.addEventListener('change', function () { var r = $('input[name="src"][value="duty"]', form); if (r) r.checked = true; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var src = (form.querySelector('input[name="src"]:checked') || {}).value || 'all';
      var order = (form.querySelector('input[name="order"]:checked') || {}).value || 'shuffled';
      var limit = Number(form.querySelector('#count-select').value) || 0;
      var dutyNum = Number(sel.value);
      var ids = practiceSourceIds(src, dutyNum);
      if (!ids.length) { announce('No questions in this selection.'); return; }
      var label = src === 'all' ? 'All questions' : src === 'weak' ? 'My weak questions' : src === 'duty' ? dutyName(dutyNum) : batchName(Number(src.split('-')[1]));
      startPractice(ids, label, { order: order, limit: limit });
    });
    return 'Practice setup';
  }
  function choice(name, value, labelHtml, checked, disabled, describedBy) {
    var id = 'c-' + name + '-' + value;
    return '<div class="choice' + (disabled ? ' is-disabled' : '') + '"><input type="radio" id="' + id + '" name="' + name + '" value="' + value + '"' +
      (checked ? ' checked' : '') + (disabled ? ' disabled' : '') + (describedBy ? ' aria-describedby="' + describedBy + '"' : '') + '>' +
      '<label for="' + id + '">' + labelHtml + '</label></div>';
  }

  function renderPracticeQuestion() {
    var p = S.practice;
    var id = p.ids[p.idx], q = D.byId.get(id), chosen = p.answers[id] || null;
    var answered = practiceAnsweredCount(p), correct = practiceCorrectCount(p);
    var isLast = p.idx === p.ids.length - 1;
    main.innerHTML =
      '<div class="wrap page"><div class="prose" style="max-width:none">' +
        '<div class="practice-top"><p class="eyebrow">Practice · ' + esc(p.label) + '</p>' +
          '<p class="tally" data-tally>' + correct + ' / ' + answered + ' correct</p></div>' +
        '<h1 tabindex="-1" data-view-heading id="prac-h">Question ' + (p.idx + 1) + ' of ' + p.ids.length + '</h1>' +
        '<p class="rev-meta">' + esc(dutyName(q.duty)) + ' · Bank question ' + esc(q.id) + ' · Batch ' + esc(q.batch) + '</p>' +
        '<div class="stem" id="prac-stem">' + wrapBlock(q.stem_html) + '</div>' +
        '<div class="options" role="group" aria-labelledby="prac-h prac-stem" data-prac-options></div>' +
        '<div class="feedback" aria-live="polite" data-feedback></div>' +
        '<div class="exam-actions">' +
          '<button type="button" class="btn btn-primary" data-action="practice-next"' + (chosen ? '' : ' hidden') + '>' + (isLast ? 'See summary' : 'Next question') + icon('right') + '</button>' +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn" data-action="practice-end">End set</button>' +
        '</div>' +
        '<p class="kbd-hint">Keys: <kbd>1</kbd>–<kbd>4</kbd> / <kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>Enter</kbd> or <kbd>→</kbd> next</p>' +
      '</div></div>';
    renderPracticeOptions(q, chosen);
    if (chosen) $('[data-feedback]', main).innerHTML = practiceFeedbackHtml(q, chosen);
    return 'Practice — question ' + (p.idx + 1) + ' of ' + p.ids.length;
  }
  function renderPracticeOptions(q, chosen) {
    var box = $('[data-prac-options]', main);
    box.innerHTML = LETTERS.map(function (L) {
      if (!chosen) {
        return '<button type="button" class="opt-btn" data-action="practice-answer" data-letter="' + L + '">' +
          '<span class="opt-body"><span class="opt-letter" aria-hidden="true">' + L + '</span><span class="opt-main"><span class="opt-text"><span class="sr-only">' + L + '. </span>' + q.options[L] + '</span></span></span></button>';
      }
      return '<button type="button" class="opt-btn ' + optionStateClass(q, L, chosen) + '" aria-disabled="true" data-letter="' + L + '">' + optionStateBody(q, L, chosen) + '</button>';
    }).join('');
  }
  function practiceFeedbackHtml(q, chosen) {
    if (chosen === q.answer) {
      return '<div class="fb-panel"><p class="fb-head fb-ok">' + icon('check') + 'Correct — ' + q.answer + '</p>' +
        '<details class="more"><summary>Show explanation</summary>' + explanationHtml(q, chosen, 3) + '</details></div>';
    }
    return '<div class="fb-panel"><p class="fb-head fb-bad">' + icon('cross') + 'Incorrect — you chose ' + chosen + '; the correct answer is ' + q.answer + '</p>' +
      explanationHtml(q, chosen, 3) + '</div>';
  }
  function practiceAnswer(letter) {
    var p = S.practice; if (!p) return;
    var id = p.ids[p.idx], q = D.byId.get(id);
    if (p.answers[id]) return;
    p.answers[id] = letter;
    savePractice();
    recordAnswer(id, letter === q.answer);
    saveStats();
    renderPracticeOptions(q, letter);
    $('[data-feedback]', main).innerHTML = practiceFeedbackHtml(q, letter);
    $('[data-tally]', main).textContent = practiceCorrectCount(p) + ' / ' + practiceAnsweredCount(p) + ' correct';
    var next = $('[data-action="practice-next"]', main);
    next.hidden = false;
    next.focus({ preventScroll: true });
    var fb = $('[data-feedback]', main);
    if (fb && fb.getBoundingClientRect().top > window.innerHeight - 80) fb.scrollIntoView({ block: 'nearest' });
  }
  function practiceNext() {
    var p = S.practice; if (!p) return;
    if (!p.answers[p.ids[p.idx]]) return;
    p.idx += 1;
    if (p.idx >= p.ids.length) p.done = true;
    savePractice();
    route();
  }
  function practiceMissedIds(p) {
    return p.ids.filter(function (id) { return p.answers[id] && p.answers[id] !== D.byId.get(id).answer; });
  }
  function renderPracticeSummary() {
    var p = S.practice;
    var answered = practiceAnsweredCount(p), correct = practiceCorrectCount(p);
    var missed = practiceMissedIds(p);
    var early = answered < p.ids.length;
    main.innerHTML =
      '<div class="wrap page"><div class="prose">' +
        '<div class="page-head"><p class="eyebrow">Practice · ' + esc(p.label) + '</p><h1 tabindex="-1" data-view-heading>Practice summary</h1></div>' +
        '<section class="card"><p class="score-big" style="font-size:2.6rem">' + correct + '<span class="den"> / ' + answered + '</span></p>' +
          '<p>' + (answered ? pct(correct, answered) + '% correct' : 'No questions answered') + (early ? ' · You answered ' + answered + ' of ' + p.ids.length + ' questions in this set.' : '') + '</p></section>' +
        '<h2>Missed (' + missed.length + ')</h2>' +
        (missed.length ? '<ul class="missed-list">' + missed.map(function (id) {
          var q = D.byId.get(id);
          return '<li><span class="stem-excerpt"><strong>Q' + esc(id) + '.</strong> ' + esc(excerpt(q.stem_text || '', 110)) +
            ' <span class="muted small">(you chose ' + esc(p.answers[id]) + ', correct ' + q.answer + ')</span></span>' +
            '<button type="button" class="btn btn-small" data-action="practice-retry-one" data-id="' + esc(id) + '" aria-label="Retry question ' + esc(id) + '">Retry</button></li>';
        }).join('') + '</ul>' : '<p>Nothing missed in this set.</p>') +
        '<div class="btn-row">' +
          (missed.length ? '<button type="button" class="btn btn-primary" data-action="practice-retry-missed">Retry missed (' + missed.length + ')</button>' : '') +
          '<button type="button" class="btn' + (missed.length ? '' : ' btn-primary') + '" data-action="practice-new">New practice set</button>' +
          '<a class="btn" href="#home">Home</a>' +
        '</div>' +
      '</div></div>';
    return 'Practice summary: ' + correct + ' of ' + answered + ' correct';
  }

  /* ======================================================================
   * Progress
   * ==================================================================== */
  function renderProgress() {
    var hist = S.history.slice().reverse();
    var weak = weakIds().length;
    var histRows = hist.map(function (h) {
      var pm = passMark(h.total), passed = h.score >= pm;
      var notes = [];
      if (h.timedOut) notes.push('Timed out');
      if (h.debugMinutes) notes.push('Debug ' + h.debugMinutes + ' min');
      return '<tr><td>' + esc(fmtDate(h.date)) + '</td><td class="num">' + h.score + '/' + h.total + '</td>' +
        '<td>' + (passed ? '<span class="badge badge-ok">' + icon('check') + 'Pass</span>' : '<span class="badge badge-bad">' + icon('cross') + 'Fail</span>') + '</td>' +
        '<td class="num">' + fmtClock(h.usedMs) + '</td><td>' + esc(notes.join(', ')) + '</td></tr>';
    }).join('');

    // Per duty, by primary duty
    var dutyAgg = {};
    D.questions.forEach(function (q) {
      var a = dutyAgg[q.duty] = dutyAgg[q.duty] || { total: 0, seen: 0, attempts: 0, correct: 0 };
      a.total++;
      var s = S.stats[q.id];
      if (s && s.attempts) { a.seen++; a.attempts += s.attempts; a.correct += s.correct; }
    });
    var dutyRows = Object.keys(dutyAgg).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      var a = dutyAgg[d];
      return '<tr><th scope="row">' + esc(dutyName(d)) + '</th><td class="num">' + a.seen + '/' + a.total + '</td><td class="num">' + a.attempts + '</td>' +
        '<td>' + (a.attempts ? meterCell(pct(a.correct, a.attempts)) : '<span class="muted">—</span>') + '</td></tr>';
    }).join('');
    var batchRows = D.batchNums.map(function (b) {
      var qs = D.questions.filter(function (q) { return q.batch === b; });
      var seen = qs.filter(function (q) { var s = S.stats[q.id]; return s && s.attempts; }).length;
      return '<tr><th scope="row">' + esc(batchName(b)) + '</th><td class="num">' + seen + '/' + qs.length + '</td><td>' + meterCell(pct(seen, qs.length)) + '</td></tr>';
    }).join('');

    main.innerHTML =
      '<div class="wrap page">' +
        '<div class="page-head"><p class="eyebrow">Saved in this browser only</p><h1 tabindex="-1" data-view-heading>Your progress</h1></div>' +
        (Store.isOk() ? '' : '<div class="note note-warn" role="note">' + icon('alert') + '<p>Storage is unavailable: progress shown here lasts only until you close the page.</p></div>') +
        '<section class="card" aria-labelledby="weak-h"><h2 id="weak-h">Weak questions: ' + weak + '</h2>' +
          '<p>Questions you last answered wrongly, or left blank in an exam. Answering one correctly removes it.</p>' +
          '<button type="button" class="btn btn-primary" data-action="practise-weak"' + (weak ? '' : ' aria-disabled="true"') + '>Practise weak questions (' + weak + ')</button>' +
        '</section>' +
        '<h2 id="hist-h">Exam history</h2>' +
        (hist.length ? sparkline(S.history) +
          '<div class="table-wrap"><table class="table" aria-labelledby="hist-h"><thead><tr><th scope="col">Date</th><th scope="col" class="num">Score</th><th scope="col">Result</th><th scope="col" class="num">Time used</th><th scope="col">Notes</th></tr></thead><tbody>' + histRows + '</tbody></table></div>'
          : '<p class="muted">No exams yet. <a href="#home">Start an exam simulation</a> from the home page.</p>') +
        '<h2 id="duty-acc-h">Accuracy by duty</h2>' +
        '<p class="small muted">All answers from exams and practice, grouped by each question’s primary duty. “Seen” counts questions answered at least once.</p>' +
        '<div class="table-wrap"><table class="table" aria-labelledby="duty-acc-h"><thead><tr><th scope="col">Duty</th><th scope="col" class="num">Seen</th><th scope="col" class="num">Attempts</th><th scope="col">Accuracy</th></tr></thead><tbody>' + dutyRows + '</tbody></table></div>' +
        '<h2 id="batch-h">Coverage by batch</h2>' +
        '<div class="table-wrap"><table class="table" aria-labelledby="batch-h"><thead><tr><th scope="col">Batch</th><th scope="col" class="num">Seen</th><th scope="col">Coverage</th></tr></thead><tbody>' + batchRows + '</tbody></table></div>' +
        '<h2 id="reset-h">Reset</h2>' +
        '<p class="small muted">Deletes exam history, per-question statistics, the last result and any practice set' + (S.exam ? ', and the exam in progress' : '') + '.</p>' +
        '<button type="button" class="btn btn-danger" data-action="reset-progress">Reset all progress</button>' +
      '</div>';
    return 'Your progress';
  }
  function sparkline(history) {
    var h = history.slice(-20);
    var W = 640, H = 150, left = 44, right = 8, top = 10, base = H - 14;
    var slot = (W - left - right) / Math.max(h.length, 8);
    var bw = Math.min(28, slot * 0.7);
    var y = function (p) { return base - (base - top) * p; };
    var bars = h.map(function (e, i) {
      var p = e.total ? e.score / e.total : 0, x = left + i * slot + (slot - bw) / 2, pass = e.score >= passMark(e.total);
      var yy = y(p);
      return '<rect class="' + (pass ? 'bar-pass' : 'bar-fail') + '" x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1.5, base - yy).toFixed(1) + '" rx="3"><title>' +
        esc(fmtDate(e.date)) + ': ' + e.score + '/' + e.total + (pass ? ' (pass)' : ' (fail)') + '</title></rect>';
    }).join('');
    var label = 'Scores of the last ' + plural(h.length, 'exam') + ', oldest to newest: ' + h.map(function (e) { return e.score + '/' + e.total; }).join(', ') + '. Pass mark 15/30.';
    return '<figure class="spark-fig"><svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' +
      '<line class="axis" x1="' + (left - 4) + '" y1="' + base + '" x2="' + (W - right) + '" y2="' + base + '"/>' +
      '<text x="0" y="' + (y(1) + 4) + '">100%</text><text x="8" y="' + (y(0.5) + 4) + '">50%</text><text x="16" y="' + (base + 4) + '">0%</text>' +
      bars +
      '<line class="passline" x1="' + (left - 4) + '" y1="' + y(PASS_RATIO) + '" x2="' + (W - right) + '" y2="' + y(PASS_RATIO) + '"/>' +
      '</svg><figcaption class="small muted">Last ' + plural(h.length, 'exam') + ', oldest on the left. Bars: score as a share of the questions (filled = pass, outline = fail). Dashed line: pass mark 15/30.</figcaption></figure>';
  }
  async function resetProgress() {
    var body = '<p>This deletes your exam history, per-question statistics, weak-question list, last result and practice set. It cannot be undone.</p>';
    if (S.exam) body += '<p><strong>An exam is in progress (' + fmtClock(examRemaining(), true) + ' left). It will be discarded too.</strong></p>';
    var ok = await confirmDialog({ title: 'Reset all progress?', bodyHtml: body, okLabel: S.exam ? 'Reset, and discard the exam' : 'Reset all progress', cancelLabel: 'Cancel', danger: true });
    if (!ok) return;
    S.history = []; S.stats = {}; S.result = null; S.practice = null; S.exam = null;
    [KEYS.history, KEYS.stats, KEYS.result, KEYS.practice, KEYS.exam].forEach(function (k) { Store.remove(k); });
    route();
    announce('All progress reset');
  }

  /* ======================================================================
   * Home
   * ==================================================================== */
  function renderHome() {
    var byDuty = {};
    D.questions.forEach(function (q) { byDuty[q.duty] = (byDuty[q.duty] || 0) + 1; });
    var byBatch = D.batchNums.map(function (b) { return esc(batchName(b)) + ': ' + D.questions.filter(function (q) { return q.batch === b; }).length; });
    var dutyRows = Object.keys(byDuty).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      return '<tr><th scope="row">' + esc(dutyName(d)) + '</th><td class="num">' + byDuty[d] + '</td></tr>';
    }).join('');
    var ex = S.exam, p = S.practice;
    var resume = '';
    if (ex) {
      var c = examCounts(ex);
      resume = '<section class="card card-accent resume-card" aria-labelledby="resume-h">' +
        '<div><h2 id="resume-h">Resume exam (<span data-resume-left>' + fmtClock(examRemaining(), true) + '</span> left)</h2>' +
        '<p class="small muted">The timer keeps running while you are away. ' + c.answered + ' of ' + ex.ids.length + ' answered' + (c.flagged ? ', ' + c.flagged + ' flagged' : '') + '.</p></div>' +
        '<div class="btn-row" style="margin:0"><button type="button" class="btn btn-primary" data-action="resume-exam">Resume exam</button>' +
        '<button type="button" class="btn btn-danger" data-action="discard-exam">Discard</button></div></section>';
    }
    if (!ex && p && !p.done && p.idx < p.ids.length) {
      resume += '<section class="card resume-card" aria-labelledby="resume-p-h">' +
        '<div><h2 id="resume-p-h">Continue practice</h2><p class="small muted">' + esc(p.label) + ' · question ' + (p.idx + 1) + ' of ' + p.ids.length + '</p></div>' +
        '<div class="btn-row" style="margin:0"><a class="btn" href="#practice">Continue</a><button type="button" class="btn" data-action="practice-discard">Discard</button></div></section>';
    }
    main.innerHTML =
      '<div class="wrap page"><div class="stack">' +
        '<div class="prose"><p class="eyebrow">Unofficial practice tool</p>' +
          '<h1 tabindex="-1" data-view-heading>Field-related MCQ mock — EPSO/AD/429/26, field 2 (ICT project management)</h1></div>' +
        '<div class="note note-warn disclaimer prose" role="note">' + icon('alert') + '<p>These are practice questions written for preparation. They are not real or past EPSO questions.</p></div>' +
        '<p class="small muted prose">Answers on PRINCE2, PMBOK, ITIL and testing come from general knowledge and are labelled as such in each explanation.</p>' +
        resume +
        '<section class="prose" aria-labelledby="real-h"><h2 id="real-h">The real test</h2>' +
          '<ul class="facts">' +
            '<li><strong>30 multiple-choice questions in 40 minutes</strong>, taken in English. That is about <strong>80 seconds per question</strong>.</li>' +
            '<li>Pass mark: <strong>15/30</strong>.</li>' +
            '<li>Then candidates are <strong>ranked</strong>. Only the highest-ranked, in principle up to 1.5 × ' + PLACES + ' ≈ ' + Math.round(1.5 * PLACES) + ', go forward, so passing is not enough: maximise your score.</li>' +
          '</ul><p class="small muted">Source: notice of competition §4.3.2(c), Table 4, and §4.3.3.</p></section>' +
        '<div class="grid-2">' +
          '<section class="card" aria-labelledby="m1-h"><h2 id="m1-h">Exam simulation</h2>' +
            '<p>' + Math.min(EXAM_SIZE, D.questions.length) + ' questions drawn at random, spread across the duties in proportion to the bank. ' + (debugMinutes ? debugMinutes : EXAM_MINUTES) + '-minute countdown. No feedback until you submit; flag questions and come back to them. Then a score, a pass/fail check against 15/30 and a full review.</p>' +
            (debugMinutes ? '<p>' + debugBadge(debugMinutes) + '</p>' : '') +
            '<button type="button" class="btn btn-primary" data-action="start-exam">' + (ex ? 'Start a new exam' : 'Start exam') + '</button>' +
          '</section>' +
          '<section class="card" aria-labelledby="m2-h"><h2 id="m2-h">Practice</h2>' +
            '<p>Choose a batch, a duty or your weak questions. Untimed, with immediate feedback: why your answer is wrong and why the right one is right, with the source.</p>' +
            '<a class="btn btn-primary" href="#practice-setup">Set up practice</a>' +
          '</section>' +
        '</div>' +
        '<p class="prose"><a href="#progress">View your progress</a>: exam history, accuracy by duty, weak questions and coverage. Progress is stored in this browser only.</p>' +
        '<section aria-labelledby="bank-h"><h2 id="bank-h">Question bank</h2>' +
          '<p>' + plural(D.questions.length, 'question') + ' in ' + plural(D.batchNums.length, 'batch', 'batches') + ' (' + byBatch.join(' · ') + ').</p>' +
          '<div class="table-wrap prose" style="max-width:44rem"><table class="table"><caption>Questions by primary duty (Annex II duties for field 2)</caption>' +
            '<thead><tr><th scope="col">Duty</th><th scope="col" class="num">Questions</th></tr></thead><tbody>' + dutyRows + '</tbody></table></div>' +
        '</section>' +
      '</div></div>';
    return 'Home';
  }

  /* ======================================================================
   * Actions (event delegation)
   * ==================================================================== */
  var ACTIONS = {
    'start-exam': async function () {
      if (S.exam) {
        var ok = await confirmDialog({ title: 'Discard the exam in progress?', text: 'An exam is already running (' + fmtClock(examRemaining(), true) + ' left). Starting a new one discards it; it will not be recorded.', okLabel: 'Discard and start new', cancelLabel: 'Keep it', danger: true });
        if (!ok) return;
        S.exam = null; saveExam();
      }
      startExam();
    },
    'resume-exam': function () { go('exam'); },
    'discard-exam': async function () {
      var ok = await confirmDialog({ title: 'Discard the exam in progress?', text: 'Your answers will be lost and the exam will not be recorded.', okLabel: 'Discard exam', cancelLabel: 'Keep it', danger: true });
      if (!ok) return;
      S.exam = null; saveExam(); route(); announce('Exam discarded');
    },
    'exam-prev': function () { if (S.exam) examGoto(S.exam.index - 1); },
    'exam-next': function () { if (S.exam) examGoto(S.exam.index + 1); },
    'exam-goto': function (el) { examGoto(Number(el.getAttribute('data-index')), false); },
    'exam-flag': function () { examToggleFlag(); },
    'exam-submit': function () { examSubmitClicked(); },
    'palette-toggle': function (el) {
      paletteOpen = !paletteOpen;
      el.setAttribute('aria-expanded', String(paletteOpen));
      el.textContent = (paletteOpen ? 'Hide' : 'Show') + ' overview';
      $('#pal-body', main).setAttribute('data-collapsed', String(!paletteOpen));
    },
    'review-filter': function (el) {
      reviewFilter = el.getAttribute('data-filter');
      $$('[data-action="review-filter"]', main).forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
      renderReviewList(resultItems(S.result), true);
    },
    'practise-missed': function () {
      var r = S.result; if (!r) return;
      var ids = resultItems(r).filter(function (x) { return x.status !== 'correct'; }).map(function (x) { return x.id; });
      startPractice(ids, 'Missed in exam of ' + fmtDate(r.submittedAt), { order: 'keep' });
    },
    'practise-weak': function () { startPractice(weakIds(), 'My weak questions', { order: 'shuffled' }); },
    'practice-answer': function (el) { practiceAnswer(el.getAttribute('data-letter')); },
    'practice-next': function () { practiceNext(); },
    'practice-end': function () { var p = S.practice; if (!p) return; p.done = true; savePractice(); route(); },
    'practice-retry-missed': function () { var p = S.practice; if (!p) return; startPractice(practiceMissedIds(p), 'Retry missed: ' + p.label.replace(/^Retry missed: /, ''), { order: 'shuffled' }); },
    'practice-retry-one': function (el) { var id = Number(el.getAttribute('data-id')); startPractice([id], 'Retry question ' + id, { order: 'keep' }); },
    'practice-new': function () { S.practice = null; savePractice(); go('practice-setup'); },
    'practice-discard': function () { S.practice = null; savePractice(); route(); announce('Practice set discarded'); },
    'reset-progress': function () { resetProgress(); }
  };
  main.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || !main.contains(el)) return;
    if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    var fn = ACTIONS[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  main.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.name === 'exam-opt' && t.checked && S.exam) examSetAnswer(t.value);
  });
  document.getElementById('skip-link').addEventListener('click', function () {
    var h = $('[data-view-heading]', main);
    (h || main).focus();
  });

  /* ======================================================================
   * Keyboard
   * ==================================================================== */
  function isTypingTarget(t) {
    if (!t || !t.tagName) return false;
    var tag = t.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return true;
    if (tag === 'INPUT') return ['radio', 'checkbox', 'button', 'submit', 'reset'].indexOf((t.type || '').toLowerCase()) === -1;
    return false;
  }
  function isActivator(t) {
    return !!(t && t.closest && t.closest('button, a[href], summary'));
  }
  function letterFromKey(k) {
    var i = ['1', '2', '3', '4'].indexOf(k);
    if (i !== -1) return LETTERS[i];
    var u = k.length === 1 ? k.toUpperCase() : '';
    return LETTERS.indexOf(u) !== -1 ? u : null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    if (dialogIsOpen()) return;
    var t = e.target;
    if (isTypingTarget(t)) return;
    var k = e.key;
    var inOurForm = t && t.closest && t.closest('form');
    if (inOurForm) return;                                   // practice setup form: leave keys alone

    if (currentView === 'exam' && S.exam) {
      var L = letterFromKey(k);
      if (L) { e.preventDefault(); examSetAnswer(L); announce('Answer ' + L + ' selected'); return; }
      if (k === 'f' || k === 'F') { e.preventDefault(); examToggleFlag(); return; }
      if (k === 'ArrowRight') { e.preventDefault(); examGoto(S.exam.index + 1); return; }
      if (k === 'ArrowLeft') { e.preventDefault(); examGoto(S.exam.index - 1); return; }
      if (k === 'Enter' && !isActivator(t)) { e.preventDefault(); examGoto(S.exam.index + 1); return; }
      return;
    }
    if (currentView === 'practice' && S.practice && !S.practice.done && S.practice.idx < S.practice.ids.length) {
      var p = S.practice, answered = !!p.answers[p.ids[p.idx]];
      var L2 = letterFromKey(k);
      if (L2 && !answered) { e.preventDefault(); practiceAnswer(L2); return; }
      if (answered && (k === 'ArrowRight' || (k === 'Enter' && !isActivator(t)))) { e.preventDefault(); practiceNext(); }
    }
  });

  /* ======================================================================
   * beforeunload
   * ==================================================================== */
  // Armed only after a real user gesture: browsers refuse the prompt otherwise (and log an error).
  // Arm the leave-page warning only after a real user activation (Chrome blocks it otherwise and logs an error).
  var userInteracted = false;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (ev === 'keydown' && (e.key === 'Escape' || e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta')) return;
      userInteracted = true;
    }, { capture: true });
  });
  function hasUserActivation() {
    var ua = navigator.userActivation;
    return ua && typeof ua.hasBeenActive === 'boolean' ? ua.hasBeenActive : userInteracted;
  }
  window.addEventListener('beforeunload', function (e) {
    if (hasUserActivation() && S.exam && !finalizing && examRemaining() > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ======================================================================
   * Boot
   * ==================================================================== */
  VIEWS = { home: renderHome, exam: renderExam, results: renderResults, practice: renderPractice, 'practice-setup': renderPracticeSetup, 'exam-lock': renderExamLock, progress: renderProgress };

  if (!D) {
    main.innerHTML = '<div class="wrap page"><h1>Question data missing</h1><p>This file has no question data. Build it with <code>python3 app/build/dev-build.py --data questions.json --out …</code>.</p></div>';
    return;
  }
  if (!Store.isOk()) showStorageBanner();
  loadState();
  if (S.exam && examRemaining() <= 0) {
    finalizeExam(true);                  // expired while away: submit now, route to results
  } else {
    route();
  }
  window.setInterval(updateTimers, 250);
  document.addEventListener('visibilitychange', updateTimers);

  /* One namespace for debugging only. */
  window.EpsoMock = Object.freeze({
    version: 1,
    keys: KEYS,
    state: function () { return JSON.parse(JSON.stringify(S)); },
    allocate: allocate,
    drawExam: drawExam
  });
})();
</script>
</body>
